<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورقة اليوميات - ماركت الشهم</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<!-- Printable A4 daily sheet. The AI worker's prompt (worker/src/index.js) describes this exact layout, so keep the two in sync. -->
<style>
/* Plain black-and-white form: 5 mm edges, two tables of 30 rows, three columns (ت / الاسم / المبلغ). */
@page{size:A4;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#000}
body{font-family:"IBM Plex Sans Arabic",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;padding:5mm;display:flex;flex-direction:column;gap:2mm;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:4mm;padding:0 1mm 1.5mm;border-bottom:.6mm solid #000}
header h1{margin:0;white-space:nowrap;font-family:"Lalezar",sans-serif;font-size:19pt;font-weight:400;line-height:1.1}
header h1 small{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:10pt;font-weight:600;margin-inline-start:2mm}
.fields{display:flex;gap:6mm;font-size:11.5pt;font-weight:700}
.field{display:flex;align-items:flex-end;gap:1.5mm;white-space:nowrap}
.line{display:inline-block;border-bottom:.35mm solid #000;height:6.5mm}
.field i{font-style:normal;font-size:13pt}
.hint{flex:1;font-size:8.5pt;font-weight:600;line-height:1.4;text-align:center}
.cols{flex:1;display:flex;gap:4mm;min-height:0}
table{flex:1;width:50%;height:100%;border-collapse:collapse;table-layout:fixed;border:.5mm solid #000}
th,td{border:.25mm solid #000}
thead th{font-size:11pt;font-weight:700;height:8mm;border-bottom:.5mm solid #000}
tbody td{padding:0}
tbody tr:nth-child(5n) td{border-bottom:.45mm solid #000}
td.n{text-align:center;font-size:8.5pt;font-weight:600}
col.c-n{width:7mm}
col.c-amt{width:32mm}
.tag{position:absolute;inset:auto 6mm 1.2mm auto;font:500 6pt/1 "IBM Plex Sans Arabic",sans-serif;letter-spacing:.3mm}
.page{position:relative}
.print{position:fixed;inset:auto 16px 16px auto;padding:10px 18px;font:600 15px "IBM Plex Sans Arabic",sans-serif;background:#0e5a3a;color:#fff7e8;border:0;border-radius:10px;cursor:pointer}
@media screen{body{background:#ddd}.page{margin:10px auto;background:#fff;box-shadow:0 2px 12px #0003}}
@media screen and (max-width:820px){.page{zoom:.45}}
@media print{.print{display:none}}
</style>
</head>
<body>
<button class="print" type="button" onclick="print()">طباعة</button>
<div class="page">
  <header>
    <h1>ماركت الشهم<small>ورقة اليوميات</small></h1>
    <div class="hint">التسديد: اكتب «واصل» جنب المبلغ<br>الغلط: اشطب السطر بخط</div>
    <div class="fields">
      <div class="field">التاريخ: <span class="line" style="width:9mm"></span><i>/</i><span class="line" style="width:9mm"></span><i>/</i><span class="line" style="width:14mm"></span></div>
      <div class="field">ورقة: <span class="line" style="width:10mm"></span></div>
    </div>
  </header>
  <div class="cols">
    <table id="t1"></table>
    <table id="t2"></table>
  </div>
  <div class="tag">SHAHM DAILY SHEET v4</div>
</div>
<script>
// Two tables side by side: the right table holds rows 1-30, the left 31-60 (read right first).
const ROWS = 30;
const head = `<colgroup><col class="c-n"><col><col class="c-amt"></colgroup>
  <thead><tr><th>ت</th><th>اسم الزبون</th><th>المبلغ</th></tr></thead>`;
const body = start => "<tbody>" + Array.from({ length: ROWS }, (_, i) =>
  `<tr><td class="n">${start + i}</td><td></td><td></td></tr>`).join("") + "</tbody>";
document.getElementById("t1").innerHTML = head + body(1);
document.getElementById("t2").innerHTML = head + body(ROWS + 1);
</script>
</body>
</html>
