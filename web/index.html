<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<!-- Where the page may load from and talk to: itself, Firebase (Google) and the photo-reading worker. Anything else, such as a
     script planted in a customer name sending the data elsewhere, is blocked by the browser. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google.com; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' data: blob: https://*.googleapis.com https://*.google.com https://shahm-ai.hydrzyd83.workers.dev; frame-src https://*.firebaseapp.com https://*.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر ديون ماركت الشهم</title>
<meta name="description" content="دفتر ديون ماركت الشهم: ديون الزبائن والموردين، كشوف حساب PDF، وتذكير واتساب.">
<meta name="theme-color" content="#0e5a3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ديون الشهم">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
/* Layout: shop debt app. Gate (login) -> app with Home / Customers / Settings. Wide: top tabs, list + account side by side. Narrow: bottom nav, one pane. Colors and fonts follow BRAND.md: brand green chrome, red = owed, green = paid. */
:root{
  /* Al-Shahm Market brand tokens (brand spec §2). paper = surface, line = border, ink = text, accent = primary, debt = danger, paid = success. */
  --bg:#f4f2ec; --paper:#ffffff; --paper-2:#f8f6f1; --line:#e3ded3; --ink:#1c2421; --muted:#5e6660;
  --accent:#0e5a3a; --accent-ink:#fff7e8; --accent-soft:#dceee3; --debt:#c2301e; --debt-soft:#fce9e5; --paid:#4a7f12; --paid-soft:#edf5e0; --warn:#a55f00; --warn-soft:#fdf0dc;
  --shadow:0 1px 2px rgba(28,36,33,.06),0 8px 24px rgba(28,36,33,.07); --shadow-fab:0 6px 18px rgba(14,90,58,.35);
  --brand-orange:#f39a1e; --brand-tomato:#e2412b; --brand-leaf:#7bc043; --brand-cream:#fff7e8; --brand-deep:#083b26;
  --f-brand:"Lalezar","Tajawal",sans-serif;
  --f-display:"Tajawal","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Tajawal",Tahoma,"Segoe UI",sans-serif;
  --r:14px; --r-ctl:10px; --r-modal:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --paper:#172019; --paper-2:#1e2921; --line:#2c3830; --ink:#ecf1ec; --muted:#9aa59d;
  --accent:#5fc48c; --accent-ink:#06200f; --accent-soft:#1b3527; --debt:#ff8a78; --debt-soft:#3a1f1b; --paid:#a6d86a; --paid-soft:#243319; --warn:#f5b654; --warn-soft:#3a2c14;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); --shadow-fab:0 6px 18px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --paper:#172019; --paper-2:#1e2921; --line:#2c3830; --ink:#ecf1ec; --muted:#9aa59d;
  --accent:#5fc48c; --accent-ink:#06200f; --accent-soft:#1b3527; --debt:#ff8a78; --debt-soft:#3a1f1b; --paid:#a6d86a; --paid-soft:#243319; --warn:#f5b654; --warn-soft:#3a2c14;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); --shadow-fab:0 6px 18px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl}
button,input,textarea,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance}

/* ---------- gate ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding-inline:16px;padding-block:24px}
.gate-card{width:100%;max-width:420px;background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.gate-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.logo{width:64px;height:64px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.logo svg{width:74%;height:74%;display:block}
.gate-head h1{margin:6px 0 0;font-family:var(--f-brand);font-weight:400;font-size:26px;color:var(--accent)}
.gate-head p{margin:0;color:var(--muted)}
.banner{border-radius:12px;padding:10px 14px;font-size:14px}
.banner.bad{background:var(--debt-soft);color:var(--debt)}
.lk{font-style:normal}.lk svg{width:18px;height:18px;vertical-align:-3px}
.banner.ok{background:var(--paid-soft);color:var(--paid)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.pw{position:relative}
.pw input{padding-left:70px!important}
.pw button{position:absolute;left:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;padding:6px 8px;font-size:13px}
.linkish{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:4px}
.gate-foot{text-align:center;color:var(--muted);font-size:14px}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);margin:8px auto}
@media (prefers-reduced-motion:no-preference){.spinner{animation:spin 0.9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}

/* ---------- app shell ---------- */
.app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:12px 100px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .logo{width:42px;height:42px;border-radius:12px}
.brand h1{margin:0;font-family:var(--f-brand);font-weight:400;font-size:21px;line-height:1.3;color:var(--accent)}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.me{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;border:1px solid var(--line);border-radius:99px;background:var(--paper);font-size:13.5px}
.me .avatar{width:30px;height:30px;font-size:13px}
.role{font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.tabs button svg{width:18px;height:18px}
.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.bottom-nav{display:none}

.pane{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 0}
.section-title h2{margin:0;font-family:var(--f-display);font-size:17px}

/* stats */
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .k svg{width:16px;height:16px}
.stat .v{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.stat .v small{font-size:12px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.stat.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.main .k,.stat.main .v small{color:inherit;opacity:.85}
.v.debt{color:var(--debt)} .v.paid{color:var(--paid)}
@media (max-width:760px){.stat .v{font-size:19px}}
/* home summary: total debt first and largest, month figures, then the quick actions in the same card */
.summary{overflow:hidden}
.sum-hero{background:var(--accent);color:var(--accent-ink);border-bottom:4px solid var(--brand-orange);padding:18px 18px 16px;display:flex;flex-direction:column;gap:2px}
.sum-hero .k{font-size:14px;display:flex;align-items:center;gap:6px;opacity:.9}
.sum-hero .k svg{width:18px;height:18px}
.sum-hero .v{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1.15;overflow-wrap:anywhere}
.sum-hero .v small{font-size:16px;font-weight:500;opacity:.85;margin-inline-start:6px}
.sum-hero .s{font-size:13.5px;opacity:.85}
.sum-hero .k .eye{margin-inline-start:auto;background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:3px 8px;display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:12.5px;cursor:pointer;opacity:.9}
.sum-hero .k .eye svg{width:16px;height:16px}
.masked{letter-spacing:.12em;opacity:.85}
.sum-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.sum-mini>div{padding:12px 14px;min-width:0}
.sum-mini>div+div{border-inline-start:1px solid var(--line)}
.sum-mini .k{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sum-mini .k svg{width:15px;height:15px;flex:none}
.sum-mini .v{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.sum-actions{display:flex;gap:8px;flex-wrap:wrap;padding:14px}
.home-alerts{display:flex;flex-direction:column;gap:8px}
.home-alerts:not(:has(.banner)){display:none}
@media (max-width:760px){.sum-hero{padding:16px 16px 14px}.sum-hero .v{font-size:38px}
  .sum-mini>div{padding:10px 8px}.sum-mini .k{font-size:11.5px;white-space:nowrap}.sum-mini .k svg{display:none}.sum-mini .v{font-size:16px}
  .sum-actions{display:grid;grid-template-columns:1fr 1fr;padding:12px}.sum-actions .btn{justify-content:center;white-space:nowrap;padding-inline:8px;font-size:14px}
  .sum-actions .btn svg{width:16px;height:16px}.sum-actions .btn.debt,.sum-actions .btn.paid{font-size:16px}}

.home-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.home-grid{grid-template-columns:minmax(0,1fr)}}
.card-pad{padding:16px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--paper-2);border-radius:99px;padding:5px 13px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:600}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.act-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.act-list.long{max-height:75vh;overflow-y:auto;overscroll-behavior:contain;padding-inline-end:4px}
.act{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--paper-2)}
.act .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.act .ic svg{width:18px;height:18px}
.ic.add{background:var(--paid-soft);color:var(--paid)} .ic.edit{background:var(--warn-soft);color:var(--warn)} .ic.delete{background:var(--debt-soft);color:var(--debt)}
.act .body{flex:1;min-width:0}
.act .t{font-weight:600;overflow-wrap:anywhere}
.act .s{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.top-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.top-list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.top-list li:last-child{border-bottom:0}
.top-list button{border:0;background:none;cursor:pointer;flex:1;text-align:right;font-weight:600;padding:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* customers */
.layout{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:14px;align-items:start}
.list-pane{display:flex;flex-direction:column;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 40px)}
.list-tools{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:100%;padding:10px 38px 10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2)}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.row-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--paper-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.row-tools .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.row-tools .seg::-webkit-scrollbar{display:none}.row-tools .seg button{white-space:nowrap;flex:none}
select.sort{border:1px solid var(--line);background:var(--paper-2);border-radius:9px;padding:5px 8px;font-size:13px;margin-inline-start:auto}
.cust-list{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
.cust{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent;width:100%;background:none;text-align:right}
.cust:hover{background:var(--paper-2)}
.cust[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent-soft)}
.avatar{width:38px;height:38px;flex:none;border-radius:50%;background:var(--paper-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);color:var(--accent)}
.cust .meta{flex:1;min-width:0}
.cust .name,.cust .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cust .name{font-weight:600}
.cust .sub{font-size:12.5px;color:var(--muted)}
.chip{font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip.debt{background:var(--debt-soft);color:var(--debt)}
.chip.paid{background:var(--paid-soft);color:var(--paid)}
.chip.zero{background:var(--paper-2);color:var(--muted)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.cust-row{display:flex;align-items:center;gap:4px}
.cust-row .cust{flex:1;min-width:0}
.row-q{display:flex;gap:4px;flex:none}
.row-q button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;display:grid;place-items:center}
.row-q button svg{width:18px;height:18px}
.row-q .q-debt{color:var(--debt)} .row-q .q-pay{color:var(--paid)}
.row-q .q-debt:hover{background:var(--debt-soft)} .row-q .q-pay:hover{background:var(--paid-soft)}
.kind-seg{width:100%}.kind-seg button{flex:1;padding:7px 10px;font-size:14px}
.btn.zero{background:var(--warn);border-color:var(--warn);color:var(--paper)}
.limit-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.period{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-bottom:8px}
.period h3{margin:0}
.period select{border:1px solid var(--line);background:var(--paper-2);border-radius:9px;padding:6px 10px;font-size:13px}
tr.edge td{background:var(--paper-2);color:var(--muted);font-size:13px}
.rem-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.rem-row .meta{flex:1;min-width:140px}.rem-row .meta b{display:block}.rem-row .meta span{display:block;font-size:12.5px;color:var(--muted)}.rem-row .meta span.late{color:var(--debt);font-weight:600}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.btn{border:1px solid var(--line);background:var(--paper);padding:9px 14px;border-radius:var(--r-ctl);cursor:pointer;font-family:var(--f-display);font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--paper-2)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.debt{background:var(--debt);border-color:var(--debt);color:var(--paper)}
.btn.paid{background:var(--paid);border-color:var(--paid);color:var(--paper)}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger-text{color:var(--debt)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:var(--r-ctl)}
.btn.block{width:100%;padding:12px}
.btn svg{width:18px;height:18px}

.detail{padding:18px;display:flex;flex-direction:column;gap:16px}
.detail-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.detail-head .who{flex:1;min-width:0}
.detail-head h2{margin:0;font-family:var(--f-display);font-size:22px;line-height:1.3;overflow-wrap:anywhere}
.detail-head .phone{color:var(--muted);font-size:13.5px}
.head-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media (max-width:760px){.head-tools{flex-basis:100%}}
.back{display:none}
.balance-card{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--paper-2)}
.balance-card .lbl{font-size:13px;color:var(--muted)}
.balance-card .amt{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1.2}
.balance-card .amt small{font-size:15px;font-weight:500;color:var(--muted);margin-inline-start:6px}
.balance-card.owes .amt{color:var(--debt)} .balance-card.credit .amt{color:var(--paid)}
.balance-card .actions{display:flex;gap:8px;margin-inline-start:auto;flex-wrap:wrap}
.balance-card .actions .btn{padding:11px 18px;font-size:15px}
.mini-sums{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.mini-sums b{color:var(--ink);font-weight:600}
.ledger h3{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:600}
.ledger-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:360px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--paper-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.amt-d{color:var(--debt);font-weight:600;white-space:nowrap}
td.amt-p{color:var(--paid);font-weight:600;white-space:nowrap}
td.run{white-space:nowrap}
td.desc{min-width:110px;overflow-wrap:anywhere}
td.desc .d{display:block;color:var(--muted);font-size:12px}
td.x{width:64px;white-space:nowrap}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;display:inline-grid;place-items:center}
.icon-btn:hover{color:var(--accent);background:var(--accent-soft)}
.icon-btn.del:hover{color:var(--debt);background:var(--debt-soft)}
.icon-btn svg{width:16px;height:16px}
@media (max-width:480px){th,td{padding:8px 6px}table{font-size:13.5px;min-width:0}td.x{width:30px}td.x .icon-btn{display:grid}td.desc{min-width:90px}}
.placeholder{padding:48px 20px;text-align:center;color:var(--muted)}
.placeholder svg{width:56px;height:56px;color:var(--line);margin-bottom:8px}
.placeholder b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px;font-family:var(--f-display)}

/* settings */
.settings{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.set-menu{padding:8px;display:flex;flex-direction:column;gap:2px}
.set-menu button{border:0;background:none;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:right;font-weight:600;width:100%}
.set-menu button:hover{background:var(--paper-2)}
.set-menu button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}

/* Customers who owe and have not paid for LATE_DAYS days (counted from their last payment, or their first debt if they never paid). */
const LATE_DAYS=30;
function lateInfo(){
  const out=new Map();const firstDebt=new Map(),lastPay=new Map();
  for(const t of S.txns.values()){const id=t.customerId;if(!t.date)continue;
    if(t.type==="pay"){if(!lastPay.has(id)||t.date>lastPay.get(id))lastPay.set(id,t.date)}
    else if(!firstDebt.has(id)||t.date<firstDebt.get(id))firstDebt.set(id,t.date)}
  const per=stats(),today=new Date(todayISO()+"T12:00:00");
  for(const c of S.customers.values()){if(isSup(c)||!(per.get(c.id).bal>0))continue;
    const from=lastPay.get(c.id)||firstDebt.get(c.id);if(!from)continue;
    const days=Math.round((today-new Date(from+"T12:00:00"))/864e5);
    out.set(c.id,{days,paid:lastPay.has(c.id),late:days>=LATE_DAYS})}
  return out;
}
/* Account lock (Settings > قفل الحسابات, or per customer from their page). A customer who still owes their lock days after the debt that opened the current balance
   (the first debt since the account was last at zero) can't take new debts, here or at the cashier, until it is paid off or
   the owner (or someone with the unlock code) opens it, which starts the period again from that day. Payments always go through.
   The code stops a mistake or a quick favour at the counter; it is not a security barrier against a writer of the book. */
const lockDays=()=>{const n=Number(S.settings.lockDays);return n>0?n:0};
// A customer's own period (c.lockDays: 0 = never, 30/60) wins over the general one (def). The old c.noLock means never.
const ownLock=c=>c&&!isSup(c)&&(c.noLock||c.lockDays!=null);
function lockDaysOf(c,def){if(!c||isSup(c)||c.noLock)return 0;const n=Number(c.lockDays!=null?c.lockDays:def===undefined?lockDays():def);return n>0?n:0}
const anyLock=()=>lockDays()>0||[...S.customers.values()].some(c=>!isSup(c)&&(c.lockNow||ownLock(c)&&lockDaysOf(c)>0));
const lockWhy=L=>L.manual?`قفله المدير من ${esc(shortDate(L.since))}`:`عليه دين من ${esc(shortDate(L.since))} وما تسدد الحساب كامل خلال <b class="num">${L.n}</b> يوم`;
const lockName=n=>n===30?"شهر":n===60?"شهرين":n?n+" يوم":"بدون قفل";
// c.lockNow (a date): the owner locked the account by hand; it stays locked, paid or not, until opened.
function lockOf(c,rows,n){
  if(!c||isSup(c))return null;
  if(c.lockNow)return {locked:true,left:0,since:c.lockNow,start:c.lockNow,n,manual:true};
  if(!n)return null;
  let bal=0,since=null;
  for(const t of rows){bal+=t.type==="debt"?Number(t.amount)||0:-(Number(t.amount)||0);if(bal<=0)since=null;else if(!since)since=t.date}
  if(!since)return null;
  const start=c.lockReset&&c.lockReset>since?c.lockReset:since;
  const left=n-daysBetween(start,todayISO());
  return {locked:left<=0,left,since,start,n};
}
async function lockHash(code,salt){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+normDigits(code).trim()));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}

// Every customer's lock in one pass over the records (lists and counts); def overrides the general setting (the settings preview).
function lockMap(def){
  def=def===undefined?lockDays():def;const out=new Map();if(!def&&!anyLock())return out;
  const by=new Map();for(const t of S.txns.values()){if(!by.has(t.customerId))by.set(t.customerId,[]);by.get(t.customerId).push(t)}
  for(const c of S.customers.values()){const rows=by.get(c.id)||[];if(!rows.length&&!c.lockNow)continue;
    rows.sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0)));
    const L=lockOf(c,rows,lockDaysOf(c,def));if(L)out.set(c.id,L)}
  return out;
}

/* Suppliers: payments settle the oldest purchase invoices first, so each invoice shows what is still owed on it. */
function openInvoices(c){
  const rows=txnsOf(c.id);let paid=rows.filter(t=>t.type==="pay").reduce((a,t)=>a+t.amount,0);const out=[];
  for(const t of rows){if(t.type!=="debt")continue;const used=Math.min(paid,t.amount);paid-=used;if(t.amount-used>0)out.push({t,rem:t.amount-used})}
  return out;
}
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
function supplierAlerts(){

    for(const x of openInvoices(c))if(x.t.due&&daysBetween(today,x.t.due)<=2)due.push({c,...x,left:daysBetween(today,x.t.due)})}

}

/* Flexible customer search: ignores hamza forms, ة/ه, ى/ي, diacritics, "ال" and spaces; every typed word may match anywhere in the name; digits match the phone. */
const foldAr=x=>normDigits(x).toLowerCase().replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[\u064B-\u0652\u0640]/g,"").replace(/\s+/g," ").trim();
function custScore(c,q){
  const fq=foldAr(q);if(!fq)return 1;
  const digits=fq.replace(/\D/g,"");
  if(digits.length>=3&&digits.length===fq.replace(/\s/g,"").length){const ph=normDigits(c.phone).replace(/\D/g,"");return ph.includes(digits)||ph.includes(digits.replace(/^0/,""))?3:0}
  const fn=foldAr(c.name+" "+(c.note||"")+" "+(c.aliases||[]).join(" ")),name=foldAr(c.name),nn=name.replace(/ /g,""),strip=w=>w.replace(/^ال/,"");
  if(name===fq)return 10;if(name.startsWith(fq))return 8;if(nn.includes(fq.replace(/ /g,"")))return 6;

  return fq.split(" ").map(strip).filter(Boolean).every(t=>words.some(w=>w.includes(t)))?4:0;
}

async function loadPhoneBook(ask){

  if(st!=="granted"&&st!=="limited"){if(!ask)return null;st=(await C.requestPermissions()).contacts;if(st!=="granted"&&st!=="limited")return null}

function stats(){
  const per=new Map();
  for(const c of S.customers.values())per.set(c.id,{bal:0,debt:0,paid:0,last:c.createdAt||0,count:0});
  for(const t of S.txns.values()){
    const p=per.get(t.customerId);if(!p)continue;
    if(t.type==="debt"){p.bal+=t.amount;p.debt+=t.amount}else{p.bal-=t.amount;p.paid+=t.amount}
    p.count++;p.last=Math.max(p.last,t.updatedAt||t.createdAt||0);
  }
  return per;
}

const DBN=coll=>coll==="accounts"?"users":coll;

const WRITES=new Map(); // id -> promise of the write reaching the server (sendAutoWa waits for it)
async function put(coll,obj){

  try{const w=db.collection(P(DBN(coll))).doc(obj.id).set(obj);WRITES.set(obj.id,w);const done=()=>{if(WRITES.get(obj.id)===w)WRITES.delete(obj.id)};w.then(done,e=>{done();writeFail(e)});return true}catch(e){writeFail(e);return false}

function validateAccount(name,username,pw,selfId){
  name=String(name||"").trim();username=normDigits(username).trim().toLowerCase();
  if(!name)return {error:"اكتب الاسم."};
  if(!/^[a-z0-9_.]{3,30}$/.test(username))return {error:"اسم المستخدم من 3 إلى 30 حرفاً إنجليزياً أو رقماً."};
  if([...S.accounts.values()].some(a=>a.username===username&&a.id!==selfId))return {error:"اسم المستخدم مأخوذ، اختر اسماً آخر."};
  if(pw!==null&&String(pw).length<6)return {error:"كلمة المرور 6 أحرف على الأقل."};
  return {name,username,pw};
}

// Signing out also wipes this device's offline copy of the data, so a shared laptop keeps nothing for the next person; but only
// once every change made here has reached the server: offline, the copy stays so nothing is lost. True when it was wiped (the
// database connection is closed then, so the page has to start afresh).
async function wipeLocal(){
  try{
    const sent=await Promise.race([db.waitForPendingWrites().then(()=>true),new Promise(ok=>setTimeout(()=>ok(false),5000))]);
    if(!sent)return false;
    await db.terminate();
  }catch(e){console.warn("offline copy kept",e&&e.code);return false}
  try{await db.clearPersistence()}catch(e){console.warn("offline copy kept",e&&e.code)}
  return true;
}
const FLASH_KEY="shahm-flash";
function signOut(msg,kind){

  wipeLocal().then(async wiped=>{
    if(wiped)try{if(msg)sessionStorage.setItem(FLASH_KEY,JSON.stringify(flash))}catch(e){}
    try{await auth.signOut()}catch(e){}
    if(wiped)location.reload();
  });
}

function stopData(){
  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];dataOn=false;
  S.customers=new Map();S.txns=new Map();S.accounts=new Map();S.shops=new Map();S.activity=[];S.settings={};S.ready={c:false,t:false,a:false,s:false};S.selected=null;
}
function startData(){
  if(dataOn)return;dataOn=true;
  const fail=e=>{console.warn(e);if(e&&e.code==="permission-denied")toast("ما عندك صلاحية لقراءة البيانات. راجع المدير.");else if(e&&e.code==="resource-exhausted")toast(readErrMsg(e))};
  unsubs.push(db.collection(P("customers")).onSnapshot(s=>{S.customers=new Map(s.docs.map(d=>[d.id,d.data()]));S.ready.c=true;render()},fail));
  unsubs.push(db.collection(P("txns")).onSnapshot(s=>{S.txns=new Map(s.docs.map(d=>[d.id,d.data()]));S.ready.t=true;render()},fail));
  // Activity: the whole business day live (the home log shows every one of today's entries), plus the last 100 before it, read once.
  const day0=shopDayRange(shopDay()).start;let actDay=[],actOld=[];const actSet=()=>{S.activity=[...actDay,...actOld];render()};
  unsubs.push(db.collection(P("activity")).where("at",">=",day0).orderBy("at","desc").onSnapshot(s=>{actDay=s.docs.map(d=>d.data());actSet()},fail));
  db.collection(P("activity")).where("at","<",day0).orderBy("at","desc").limit(100).get().then(s=>{actOld=s.docs.map(d=>d.data());actSet()},fail);
  unsubs.push(db.doc(P("settings/main")).onSnapshot(s=>{S.settings=s.exists?{...s.data()}:{};
    if(SHOP&&S.isOwner&&S.shop&&!s.exists&&!s.metadata.fromCache)saveSettings({shopName:S.shop.name,ownerName:S.shop.ownerName,phone:S.shop.phone||""});try{if(shopName())localStorage.setItem(GATE_NAME_KEY,shopName());localStorage.setItem(GATE_TENANT_KEY,SHOP?"1":"0")}catch(e){}if(S.me&&S.me.role==="owner")S.me.name=S.settings.ownerName||"المدير";S.ready.s=true;render()},fail));
  if(S.isOwner){
    unsubs.push(db.collection(P("users")).onSnapshot(s=>{S.accounts=new Map(s.docs.map(d=>[d.id,{...d.data(),id:d.id}]));S.ready.a=true;render()},fail));
    if(S.superOwner)unsubs.push(db.collection("shops").onSnapshot(s=>{S.shops=new Map(s.docs.map(d=>[d.id,{...d.data(),id:d.id}]));render()},fail));
    setTimeout(async()=>{try{const old=await db.collection(P("activity")).where("at","<",Date.now()-120*864e5).limit(100).get();for(const d of old.docs)d.ref.delete().catch(()=>{})}catch(e){}},8000);
  }
}

function periodStart(c){
  const rows=txnsOf(c.id);
  if(S.period==="month")return monthISO()+"-01";
  if(S.period==="30"){const d=new Date(Date.now()-30*864e5);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  if(S.period==="sincepay"){const pays=rows.filter(t=>t.type==="pay");return pays.length?pays[pays.length-1].date:""}
  return "";
}
function ledgerFor(c){
  const rows=txnsOf(c.id);const from=periodStart(c);let open=0,run=0;const list=[];
  for(const t of rows){const d=t.type==="debt"?t.amount:-t.amount;if(from&&t.date<from){open+=d;run+=d;continue}run+=d;list.push({t,run})}
  let dSum=0,pSum=0;for(const x of list){x.t.type==="debt"?dSum+=x.t.amount:pSum+=x.t.amount}
  return {from,open,close:run,list,dSum,pSum};
}

const PDFC={green:"#0e5a3a",orange:"#f39a1e",ink:"#1c2421",muted:"#5e6660",line:"#e3ded3",head:"#f4f2ec",shade:"#f8f6f1",rule:"#ece8df",debt:"#c2301e",paid:"#4a7f12"};

async function pdfFonts(){try{await Promise.all(["400 40px Lalezar","700 28px Tajawal","400 22px 'IBM Plex Sans Arabic'","700 22px 'IBM Plex Sans Arabic'"].map(f=>document.fonts.load(f)));await document.fonts.ready}catch(e){}}

  pages.forEach((cv,i)=>{const cx=cv.getContext("2d");cx.direction="ltr";cx.textAlign="center";cx.fillStyle=PDFC.green;cx.font=`400 18px ${F}`;cx.fillText(`${i+1} / ${pages.length}`,W/2,H-40)});

function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)})}
/* Saves a file: the Android app writes it and opens the share sheet (WhatsApp, Drive, Files); phones' browsers share it; laptops download it. Returns false if the person cancelled. */
async function saveFile(filename,data,mime,text){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||"application/octet-stream"});
  if(NATIVE){
    const r=await plugin("Filesystem").writeFile({path:filename,data:await blobToB64(blob),directory:"CACHE"});
    try{await plugin("Share").share({title:filename,files:[r.uri],...(text?{text}:{})})}catch(e){if(/cancel/i.test(String(e&&e.message)))return false;throw e}
    return true;
  }
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(mobile&&navigator.canShare){
    const file=new File([blob],filename,{type:blob.type});
    if(navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:filename,...(text?{text}:{})});return true}catch(e){if(e&&e.name==="AbortError")return false}}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);return true;
}

const AR_MONTHS=["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];

function monthStats(ym){
  const r={add:0,pay:0,nAdd:0,nPay:0,newCust:0,by:new Map(),debtors:new Map(),payers:new Map()};
  for(const t of S.txns.values()){if(!(t.date||"").startsWith(ym))continue;const c=S.customers.get(t.customerId);if(!c||isSup(c))continue;
    const who=t.by||"غير معروف";r.by.set(who,(r.by.get(who)||0)+1);
    if(t.type==="debt"){r.add+=t.amount;r.nAdd++;r.debtors.set(c.id,(r.debtors.get(c.id)||0)+t.amount)}else{r.pay+=t.amount;r.nPay++;r.payers.set(c.id,(r.payers.get(c.id)||0)+t.amount)}}
  for(const c of S.customers.values()){if(isSup(c)||!c.createdAt)continue;const d=new Date(c.createdAt);if(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")===ym)r.newCust++}

// Full report of one day for the daily backup: the day's numbers, every movement with its time, and every balance still open.
function dayPdf(day,opt){
  const per=stats(),nm=id=>{const c=S.customers.get(id);return c?c.name:"؟"};
  // Movements recorded from 2 AM that day to 2 AM the next; old entries without a record time go by their date.
  const {start,end}=shopDayRange(day),inDay=ms=>ms>=start&&ms<end;
  const all=[...S.txns.values()].filter(t=>(t.createdAt?inDay(t.createdAt):t.date===day)&&S.customers.get(t.customerId)).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const cust=all.filter(t=>!isSup(S.customers.get(t.customerId))),sup=all.filter(t=>isSup(S.customers.get(t.customerId)));
  const sum=(arr,type)=>arr.filter(t=>t.type===type).reduce((a,t)=>a+t.amount,0);

  const after=new Map();for(const id of new Set(all.map(t=>t.customerId))){let run=0;for(const t of txnsOf(id)){run+=t.type==="debt"?t.amount:-t.amount;after.set(t.id,run)}}

      ["صافي اليوم",{text:(dAdd-dPay>0?"+":"")+fmt(dAdd-dPay)+" "+CUR}],...(newCust?[["زبائن جدد",{text:String(newCust)}]]:[]),
      ...(sup.length?[["الموردين اليوم",{text:`فواتير ${fmt(sum(sup,"debt"))} · دفعات ${fmt(sum(sup,"pay"))} ${CUR}`}]]:[]),

      ...(sup.length?[{title:"حركات الموردين اليوم",columns:opCols,rows:sup.map((t,i)=>opRow(t,i,true))}]:[]),

function openModal(html,onMount){
  const root=$("#modalRoot");root.innerHTML=`<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim=$("#scrim");scrim.addEventListener("click",e=>{if(e.target===scrim)closeModal()});
  root.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeModal));
  wirePw(root);onMount&&onMount(root.querySelector(".modal"));
  const f=root.querySelector("input:not([type=hidden]),textarea");if(f)f.focus();
}
function closeModal(){$("#modalRoot").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function confirmBox(title,text,label,fn,focusOk){

}

/* After a payment: build the PDF statement up front, so the share sheet opens straight from the button tap (phones require a fresh tap). */
function sendStatementPdf(c,textLink){
  const canShareFiles=NATIVE||(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)&&!!navigator.canShare);
  openModal(`<h3>كشف حساب ${esc(c.name)}</h3>
    <p class="hint">تم تسجيل التسديد. الرصيد المتبقي: <b class="num">${fmt(balanceOf(c.id))}</b> ${CUR}</p>
    <p class="hint" id="spState">جاري تجهيز الكشف…</p>
    <div class="foot"><button class="btn wa" type="button" id="spSend" disabled>${I.wa}${canShareFiles?"إرسال الكشف PDF":"تنزيل الكشف وفتح واتساب"}</button>${textLink?`<button class="btn" type="button" id="spText">رسالة نصية فقط</button>`:""}<button class="btn" type="button" data-close>إغلاق</button></div>`,m=>{
    let ready=null;const st=m.querySelector("#spState"),send=m.querySelector("#spSend");
    const caption=fillTpl("pay",c,{amount:0}).split("\n")[0]+"\nمرفق كشف حسابك. الرصيد المتبقي: "+fmt(balanceOf(c.id))+" "+CUR+"\n"+shopName();
    custPdf(c,{blob:true}).then(r=>{if(!r)throw 0;ready=r;send.disabled=false;
      st.textContent=canShareFiles?"اضغط إرسال، اختار واتساب، وبعدين اختار الزبون.":"ينزل الملف وينفتح واتساب على رقم الزبون، اسحب الملف للمحادثة."}).catch(()=>{st.textContent="تعذّر تجهيز الكشف."});
    send.addEventListener("click",async()=>{if(!ready)return;
      try{const ok=await saveFile(ready.fname,ready.blob,"application/pdf",caption);
        if(ok&&!canShareFiles&&c.phone)openExternal(waLink(c.phone,caption));
        if(ok)closeModal()}catch(e){console.warn(e);toast("تعذّر إرسال الملف.")}});
    const tx=m.querySelector("#spText");if(tx)tx.addEventListener("click",()=>{openExternal(textLink);closeModal()});
  });
}
/* ---------- ledger photo: read the paper notebook with AI, review, save ---------- */
async function shrinkImage(file,max=1568,q=.85,cap=900000){
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}
  catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("bad image"));i.src=URL.createObjectURL(file)})}
  const w=src.width,h=src.height,k=Math.min(1,max/Math.max(w,h));
  const cv=document.createElement("canvas");cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  cv.getContext("2d").drawImage(src,0,0,cv.width,cv.height);
  let url=cv.toDataURL("image/jpeg",q);
  // Invoice photos live in Firestore documents (1 MB cap), so step the quality down until it fits comfortably. The sheet reader passes a bigger cap: handwriting needs the detail.
  for(let qq=q-.1;url.length>cap&&qq>.3;qq-=.1)url=cv.toDataURL("image/jpeg",qq);
  return {url,data:url.slice(url.indexOf(",")+1),media_type:"image/jpeg"};
}

function dropPhotos(ids){for(const id of ids||[]){photoCache.delete(id);try{db.collection(P("photos")).doc(id).delete().catch(()=>{})}catch(e){}}}

const backupDone=detail=>{saveSettings({lastBackupAt:Date.now()});log("add","import",{detail})};
// Small key/value store in this browser's IndexedDB: keeps the chosen backup folder (a folder handle can't go in localStorage).
const kv=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open("shahm-local",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const run=(mode,fn)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction("kv",mode),q=fn(t.objectStore("kv"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
  return {get:k=>run("readonly",s=>s.get(k)).catch(()=>null),set:(k,v)=>run("readwrite",s=>s.put(v,k)).catch(()=>{})}})();
const FOLDER_OK=!NATIVE&&typeof window.showDirectoryPicker==="function";
/* Daily backup in one tap: the backup file and the customers' debt PDF together. On a laptop (Chrome/Edge) the files go to the
   flash drive; elsewhere both files are saved/shared together. The folder is asked for first, while the tap still counts as a
   user action. The app never makes folders: the shop keeps its own ready folders on the flash drive.
   - Year/month/day tree (Shahm-Backups/2026/10/21, from the ready-folders zip): the owner picks the tree's top folder (or a year
     folder) once; after that each tap writes straight into the day's folder with no dialog. If that day's folder is missing,
     it asks as below, opening at the top folder.
   - Any other folder: it asks which folder each time (opening where it saved last time) and writes the two files into it. */
// The day's folder under the tree, or null if the tree doesn't have it (nothing is created).
async function dayDir(root,day){
  const [y,m,d]=day.split("-");
  try{let dir=root.name===y?root:await root.getDirectoryHandle(y);dir=await dir.getDirectoryHandle(m);return await dir.getDirectoryHandle(d)}catch(e){return null}
}
// A picked folder is a tree if it is a year folder or holds year folders (four digits).
async function isTree(dir){
  if(/^\d{4}$/.test(dir.name))return true;
  try{for await(const [n,h] of dir.entries())if(h.kind==="directory"&&/^\d{4}$/.test(n))return true}catch(e){}
  return false;
}
// The business day before the current one (for a backup missed before 2am).
const prevShopDay=()=>{const [y,m,d]=shopDay().split("-").map(Number);return msISO(new Date(y,m-1,d-1,12).getTime())};
async function dailyBackup(day=shopDay()){
  let dir=null,where="";
  if(FOLDER_OK){
    try{
      const root=await kv.get("backupRoot");
      if(root&&(await root.queryPermission({mode:"readwrite"})==="granted"||await root.requestPermission({mode:"readwrite"})==="granted"))
        {dir=await dayDir(root,day);if(dir)where=day.replace(/-/g,"/")}
      if(!dir){
        const prev=await kv.get("backupDir");
        const picked=await window.showDirectoryPicker({id:"shahm-backup",mode:"readwrite",startIn:root||prev||"desktop"});
        if(await picked.queryPermission({mode:"readwrite"})!=="granted"&&await picked.requestPermission({mode:"readwrite"})!=="granted"){toast("لازم توافق حتى البرنامج يحفظ بالمجلد.");return}
        if(await isTree(picked)){
          await kv.set("backupRoot",picked);dir=await dayDir(picked,day);
          if(!dir){toast(`ما لكيت مجلد يوم ${day.replace(/-/g,"/")} داخل \u2066${picked.name}\u2069. نزّل المجلدات الجاهزة للسنة على الفلاش، أو اختار مجلد اليوم.`,{ms:12000});return}
          where=day.replace(/-/g,"/");
        }else{dir=picked;await kv.set("backupDir",picked)}
      }
    }catch(e){if(e&&e.name==="AbortError")return;console.warn(e);dir=null}
  }
  toast("جارِ تجهيز النسخة والتقرير اليومي…");
  const bk=await backupJson(day);
  const pdf=await dayPdf(day,{blob:true});
  if(!pdf)return;
  if(dir){
    try{
      // Some file systems refuse Arabic file names; then the same file is written under a plain English name.
      const put1=async(names,blob)=>{for(const n of names){try{const w=await (await dir.getFileHandle(n,{create:true})).createWritable();await w.write(blob);await w.close();return}catch(e){if(n===names[names.length-1])throw e}}};
      await put1([bk.name,`backup-${day}.json`],new Blob([bk.data],{type:"application/json"}));await put1([pdf.fname,`report-${day}.pdf`],pdf.blob);
      backupDone((day===shopDay()?"حفظ نسخة اليوم":"حفظ نسخة يوم "+day)+" بالمجلد");
      toast(`✓ انحفظ الملفين بمجلد \u2066${where||dir.name}\u2069`,{ms:7000});render();return;
    }catch(e){console.warn(e);
      toast(e&&e.name==="NotFoundError"?"ما لكيت المجلد. ركّب الفلاش وحاول مرة ثانية.":"تعذّر الحفظ بالمجلد.",{label:"حاول مرة ثانية",onClick:()=>dailyBackup(day),ms:12000});return}
  }
  openModal(`<h3>${day===shopDay()?"نسخة اليوم جاهزة":"نسخة يوم "+day.split("-").reverse().join("/")+" جاهزة"}</h3><p class="hint">الملفين جاهزين: النسخة الاحتياطية والتقرير اليومي الشامل. اضغط حفظ حتى ينزلون سوا.</p>
    <div class="foot"><button class="btn primary" type="button" id="bkBoth">${I.save}حفظ الملفين</button><button class="btn" type="button" data-close>إلغاء</button></div>`,
    m=>m.querySelector("#bkBoth").addEventListener("click",async()=>{
      try{if(await saveFiles([{name:bk.name,blob:new Blob([bk.data],{type:"application/json"})},{name:pdf.fname,blob:pdf.blob}])){backupDone(day===shopDay()?"حفظ نسخة اليوم":"حفظ نسخة يوم "+day);closeModal();toast("تم حفظ الملفين")}}
      catch(e){console.warn(e);toast("تعذّر حفظ الملفات.")}}));
}
// Several files in one go: the Android app and phones share them together; a laptop downloads them one after the other.
async function saveFiles(list){
  if(NATIVE){
    const uris=[];for(const f of list)uris.push((await plugin("Filesystem").writeFile({path:f.name,data:await blobToB64(f.blob),directory:"CACHE"})).uri);
    try{await plugin("Share").share({title:list[0].name,files:uris})}catch(e){if(/cancel/i.test(String(e&&e.message)))return false;throw e}
    return true;
  }
  const files=list.map(f=>new File([f.blob],f.name,{type:f.blob.type}));
  if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files})){
    try{await navigator.share({files,title:list[0].name});return true}catch(e){if(e&&e.name==="AbortError")return false}
  }
  for(const f of list){const a=document.createElement("a");a.href=URL.createObjectURL(f.blob);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);await new Promise(r=>setTimeout(r,400))}
  return true;
}

const isoOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return isoOf(d)};
const ymEnd=ym=>{const [y,m]=ym.split("-").map(Number);return ym+"-"+String(new Date(y,m,0).getDate()).padStart(2,"0")};

/* Every account's transactions in date order, built in one pass (the reports and the warning board read it many times). */
function txnsByCust(){
  const m=new Map();
  for(const t of S.txns.values()){if(!t.date||!S.customers.has(t.customerId))continue;let a=m.get(t.customerId);if(!a)m.set(t.customerId,a=[]);a.push(t)}

/* What is still unpaid of each debt: every payment goes to the oldest debt first. A payment bigger than the balance
   is kept as credit and covers the next debts. Returns the open pieces, oldest first: {date,left}. */
function openDebts(rows){
  const q=[];let credit=0;
  for(const t of rows){
    if(t.type==="debt"){let a=t.amount;if(credit>0){const u=Math.min(credit,a);credit-=u;a-=u}if(a>0)q.push({date:t.date,left:a})}
    else{let p=t.amount;while(p>0&&q.length){const h=q[0],u=Math.min(h.left,p);h.left-=u;p-=u;if(!h.left)q.shift()}credit+=p}
  }
  return q;
}

function dataPrint(){

  for(const c of cs)mix(c.id+"|"+(c.name||"")+"|"+kindOf(c)+"\n");
  let debt=0,pay=0;const bal=new Map();
  for(const t of ts){mix(t.id+"|"+t.customerId+"|"+t.type+"|"+Number(t.amount)+"|"+(t.date||"")+"\n");

    else if(VHUN.has(w)){cur=cur>0&&cur<10?cur*100:cur+100;prevUnit=false}

      if(s.dual&&!cur)total+=2*s.v;else total+=(cur||1)*s.v;cur=0;last=s.v;prevUnit=false}

function voiceMatches(name,text){
  const strip=w=>w.replace(/^ال/,"");

  const said0=(name+" "+text).split(/\s+/).filter(w=>!/^(على|الى|إلى)$/.test(w)).join(" ");
  for(const w of foldAr(said0).split(" ")){if(!w)continue;said.add(strip(w));const p=w.replace(/^(لل|ل|ب|و)/,"");if(p.length>1)said.add(strip(p))}

    let best=0,full=false;
    for(const nm of [c.name,...(c.aliases||[])]){const ws=foldAr(nm).split(" ").filter(Boolean).map(strip);if(!ws.length)continue;
      const m=ws.filter(w=>said.has(w)).length;if(!m)continue;
      const sc=m*10+(m===ws.length?6:0)-(ws.length-m)*2;if(sc>best){best=sc;full=m===ws.length}}

function repRange(){
  const R=S.rep,t=todayISO(),d=new Date(t+"T12:00:00");
  let from,to,prevFrom,label,prevLabel;
  if(R.per==="day"){from=to=t;prevFrom=addDays(t,-1);label="اليوم";prevLabel="أمس"}
  else if(R.per==="week"){from=addDays(t,-((d.getDay()+1)%7));to=addDays(from,6);prevFrom=addDays(from,-7);label="هذا الأسبوع (من السبت)";prevLabel="الأسبوع اللي قبله"}
  else if(R.per==="year"){const y=Number(t.slice(0,4));from=y+"-01-01";to=y+"-12-31";prevFrom=(y-1)+"-01-01";label="سنة "+y;prevLabel="سنة "+(y-1)}
  else if(R.per==="custom"){from=R.from||t;to=R.to||t;if(from>to)[from,to]=[to,from];prevFrom=addDays(from,-(daysBetween(from,to)+1));label=shortDate(from)+" - "+shortDate(to);prevLabel="نفس المدة اللي قبلها"}
  else{const m=t.slice(0,7);from=m+"-01";to=ymEnd(m);prevFrom=ymShift(m,-1)+"-01";label=ymLabel(m);prevLabel=ymLabel(ymShift(m,-1))}
  // A period still running is compared with the same number of days of the one before, not the whole of it.
  const end=to>t?t:to,prevTo=addDays(prevFrom,daysBetween(from,end));
  return {from,to,end,prevFrom,prevTo,label,prevLabel,partial:to>t};
}
function periodSums(from,to){
  const r={debt:0,pay:0,nDebt:0,nPay:0,supInv:0,supPay:0,nSupInv:0,nSupPay:0,newCust:0};
  for(const t of S.txns.values()){if(!t.date||t.date<from||t.date>to)continue;const c=S.customers.get(t.customerId);if(!c)continue;
    if(isSup(c)){if(t.type==="debt"){r.supInv+=t.amount;r.nSupInv++}else{r.supPay+=t.amount;r.nSupPay++}}
    else if(t.type==="debt"){r.debt+=t.amount;r.nDebt++}else{r.pay+=t.amount;r.nPay++}}
  for(const c of S.customers.values())if(!isSup(c)&&c.createdAt){const d=isoOf(new Date(c.createdAt));if(d>=from&&d<=to)r.newCust++}
  return r;
}
const AGE_BUCKETS=[[0,7,"أقل من أسبوع"],[8,30,"8 - 30 يوم"],[31,60,"31 - 60 يوم"],[61,90,"61 - 90 يوم"],[91,Infinity,"أكثر من 90 يوم"]];
function repData(){
  const R=repRange(),today=todayISO(),groups=txnsByCust();
  const cur=periodSums(R.from,R.end),prev=periodSums(R.prevFrom,R.prevTo);
  // Balances now, the biggest accounts, and how old the unpaid part of each debt is.
  let owed=0,owing=0,credit=0,supOwed=0;const top=[],ages=AGE_BUCKETS.map(()=>({amt:0,n:0}));
  for(const c of S.customers.values()){const rows=groups.get(c.id)||[];let b=0;for(const t of rows)b+=t.type==="debt"?t.amount:-t.amount;
    if(isSup(c)){if(b>0)supOwed+=b;continue}
    if(b<0)credit-=b;if(b<=0)continue;owed+=b;owing++;top.push({c,b});
    const seen=new Set();
    for(const p of openDebts(rows)){const a=daysBetween(p.date,today),k=AGE_BUCKETS.findIndex(([lo,hi])=>a>=lo&&a<=hi);if(k<0)continue;ages[k].amt+=p.left;if(!seen.has(k)){seen.add(k);ages[k].n++}}}
  top.sort((a,b)=>b.b-a.b);
  // The trend: per day, week or month across the period (today: the last 14 days), with what was owed at the end of each.
  let tf=R.from,tt=R.end;if(R.per==="day")tf=addDays(today,-13);
  const n=daysBetween(tf,tt)+1,gran=n<=31?"day":n<=190?"week":"month",buckets=[];
  if(gran==="month"){let ym=tf.slice(0,7);while(ym<=tt.slice(0,7)){buckets.push({from:ym+"-01"<tf?tf:ym+"-01",to:ymEnd(ym)>tt?tt:ymEnd(ym),label:AR_MONTHS[Number(ym.slice(5))-1]+(tf.slice(0,4)!==tt.slice(0,4)?" "+ym.slice(2,4):"")});ym=ymShift(ym,1)}}
  else{const step=gran==="day"?1:7;for(let d=tf;d<=tt;d=addDays(d,step)){const e=addDays(d,step-1)>tt?tt:addDays(d,step-1);
    buckets.push({from:d,to:e,label:gran==="day"?String(Number(d.slice(8)))+(d.slice(8)==="01"||d===tf?" "+AR_MONTHS[Number(d.slice(5,7))-1]:""):Number(d.slice(8))+" "+AR_MONTHS[Number(d.slice(5,7))-1]})}}
  const tx=[];for(const [id,rows] of groups){const c=S.customers.get(id);if(c&&!isSup(c))for(const t of rows)tx.push(t)}
  tx.sort(byDate);
  const bal=new Map();let pos=0,i=0;
  for(const b of buckets){b.debt=0;b.pay=0;
    while(i<tx.length&&tx[i].date<=b.to){const t=tx[i++],o=bal.get(t.customerId)||0,nb=o+(t.type==="debt"?t.amount:-t.amount);bal.set(t.customerId,nb);pos+=Math.max(nb,0)-Math.max(o,0);
      if(t.date>=b.from){if(t.type==="debt")b.debt+=t.amount;else b.pay+=t.amount}}
    b.owed=pos}
  return {R,cur,prev,owed,owing,credit,supOwed,top,ages,buckets,gran,trendFrom:tf};
}
function repInsights(d){
  const out=[],{cur,prev,R}=d,pc=(a,b)=>pctChange(a,b);
  const p1=pc(cur.debt,prev.debt);if(p1!==null&&(cur.debt||prev.debt))out.push(`الديون الجديدة ${p1>=0?"زادت":"نقصت"} <b class="num">${Math.abs(p1)}%</b> عن ${esc(R.prevLabel)}${R.partial?" (لنفس عدد الأيام)":""}.`);
  const p2=pc(cur.pay,prev.pay);if(p2!==null&&(cur.pay||prev.pay))out.push(`التحصيل ${p2>=0?"زاد":"نقص"} <b class="num">${Math.abs(p2)}%</b> عن ${esc(R.prevLabel)}.`);
  if(cur.debt>0){const r=Math.round(cur.pay/cur.debt*100);out.push(r>=100?`المحصّل (${fmt(cur.pay)}) أكثر من الديون الجديدة (${fmt(cur.debt)})، فمجموع الدين نزل.`:`التحصيل غطّى <b class="num">${r}%</b> من الديون الجديدة، فمجموع الدين زاد <b class="num">${fmt(cur.debt-cur.pay)}</b> ${CUR}.`)}
  else if(cur.pay>0)out.push(`ما انضاف دين جديد، وانحصّل <b class="num">${fmt(cur.pay)}</b> ${CUR}.`);
  if(d.owed>0&&d.top.length>=5){const s=d.top.slice(0,5).reduce((a,x)=>a+x.b,0);out.push(`أكبر 5 حسابات عليهم <b class="num">${Math.round(s/d.owed*100)}%</b> من مجموع الديون.`)}
  if(d.owed>0){const old=d.ages[3].amt+d.ages[4].amt;if(old>0)out.push(`<b class="num">${Math.round(old/d.owed*100)}%</b> من الديون (${fmt(old)} ${CUR}) عمرها أكثر من 60 يوم.`)}
  if(!cur.nDebt&&!cur.nPay)out.push("ماكو حركات بهالفترة.");
  return out;
}

/* ---------- early warning: who needs a call today, and why (read only, except the follow-up note the shop writes) ---------- */
const ALERT_DEF={t1:30,t2:60,t3:90,noPay:30,grow:30};
const alertCfg=()=>{const a=S.settings.alerts||{},o={};for(const k in ALERT_DEF){const n=Math.round(Number(a[k]));o[k]=n>0&&n<1000?n:ALERT_DEF[k]}if(!(o.t1<o.t2&&o.t2<o.t3)){o.t1=ALERT_DEF.t1;o.t2=ALERT_DEF.t2;o.t3=ALERT_DEF.t3}return o};
const FSTAT={called:"اتصلت بيه",msg:"دزيتله رسالة",visit:"زرته",promised:"وعد يدفع",nores:"ما رد",later:"أجّلته"};
const PRIO=["","منخفض","متوسط","عالي"];
function warnList(){
  const A=alertCfg(),today=todayISO(),groups=txnsByCust(),out=[];
  for(const c of S.customers.values()){if(isSup(c))continue;const rows=groups.get(c.id)||[];
    let bal=0,lastPay=null,firstDebt=null,crossed=null,balThen=0;const then=addDays(today,-A.grow);
    for(const t of rows){const was=bal;bal+=t.type==="debt"?t.amount:-t.amount;
      if(t.type==="pay"){if(!lastPay||t.date>lastPay)lastPay=t.date}else if(!firstDebt)firstDebt=t.date;
      if(c.limit>0){if(was<=c.limit&&bal>c.limit)crossed=t.date;else if(bal<=c.limit)crossed=null}
      if(t.date<=then)balThen=bal}
    if(bal<=0)continue;
    const open=openDebts(rows),oldest=open[0],age=oldest?daysBetween(oldest.date,today):0,why=[];
    const over={};for(const k of [7,A.t1,A.t2,A.t3]){over[k]=0;for(const p of open)if(daysBetween(p.date,today)>k)over[k]+=p.left}
    if(oldest){
      if(age>A.t3)why.push({lv:3,k:"age",text:`جزء من دينه عمره <b class="num">${age}</b> يوم، أكثر من ${A.t3} (${fmt(over[A.t3])} ${CUR})`,since:addDays(oldest.date,A.t3+1)});
      else if(age>A.t2)why.push({lv:2,k:"age",text:`جزء من دينه عمره <b class="num">${age}</b> يوم، أكثر من ${A.t2} (${fmt(over[A.t2])} ${CUR})`,since:addDays(oldest.date,A.t2+1)});
      else if(age>A.t1)why.push({lv:1,k:"age",text:`جزء من دينه عمره <b class="num">${age}</b> يوم، أكثر من ${A.t1} (${fmt(over[A.t1])} ${CUR})`,since:addDays(oldest.date,A.t1+1)})}
    const ref=lastPay||firstDebt,since=ref?daysBetween(ref,today):0;
    if(ref&&since>=A.noPay)why.push({lv:since>=2*A.noPay?3:2,k:"nopay",text:lastPay?`ما سدد من <b class="num">${since}</b> يوم (آخر تسديد ${esc(shortDate(lastPay))})`:`ما سدد ولا مرة، وأول دين من <b class="num">${since}</b> يوم`,since:addDays(ref,A.noPay)});
    if(c.limit>0&&bal>c.limit)why.push({lv:3,k:"limit",text:`تجاوز حد الدين ${fmt(c.limit)} بـ <b class="num">${fmt(bal-c.limit)}</b>`,since:crossed||today});
    if(c.promise&&c.promise.date&&promiseLeft(c)<0)why.push({lv:3,k:"promise",text:`وعد يدفع ${esc(dayName(c.promise.date))}${c.promise.amount?" ("+fmt(c.promise.amount)+")":""} وفات الموعد`,since:addDays(c.promise.date,1)});
    if(balThen>0&&bal>=balThen*1.25&&bal-balThen>=5000)why.push({lv:1,k:"grow",text:`رصيده زاد من ${fmt(balThen)} إلى <b class="num">${fmt(bal)}</b> خلال ${A.grow} يوم`,since:then});
    if(!why.length)continue;
    const level=Math.max(...why.map(w=>w.lv)),f=c.follow||null;
    out.push({c,bal,age,why:why.sort((a,b)=>b.lv-a.lv),level,over,lastPay,f,snoozed:!!(f&&f.next&&f.next>today)});
  }
  return out.sort((a,b)=>b.level-a.level||b.age-a.age||b.bal-a.bal);
}
function nextStep(x){
  const c=x.c,ph=!!waNumber(c.phone);
  if(x.f&&x.f.next)return x.f.next>todayISO()?`متابعة يوم ${esc(dayName(x.f.next))}`:`موعد المتابعة ${x.f.next===todayISO()?"اليوم":"فات"}: تابعه هسه`;
  if(x.why.some(w=>w.k==="promise"))return ph?"اتصل بيه اليوم واسأله عن الوعد":"اسأله عن الوعد أول ما يجي";
  if(x.level===3)return ph?"اتصل بيه اليوم، وإذا ما رد دزله تذكير":"كلّمه أول ما يجي، وأضف رقمه";
  if(x.level===2)return ph?"دزله تذكير واتساب":"أضف رقمه حتى تذكّره";
  return "راقبه";
}

/* Only the follow-up note is written (on the account, merged): balances and transactions are never touched here. */
async function patchCustomer(id,patch){
  const c=S.customers.get(id);if(!c)return false;
  S.customers.set(id,{...c,...patch});render();
  try{db.collection(P("customers")).doc(id).set(patch,{merge:true}).catch(writeFail);return true}catch(e){writeFail(e);return false}
}

   starts the voice search on the search box on screen. Typing in a field keeps its normal keys. */
let lastAdd=null;
function undoLast(){
  const tb=[...document.querySelectorAll(".toast .toast-btn")].find(b=>b.textContent==="تراجع");if(tb){tb.click();return}
  const x=lastAdd&&S.txns.get(lastAdd.id);

  const c=S.customers.get(x.customerId),sup=c&&isSup(c);
  const what=sup?(x.type==="debt"?"فاتورة الشراء":"الدفعة للمورد"):(x.type==="debt"?"الدين":"التسديد");
  confirmBox("تراجع عن آخر حركة",`حذف ${what} ${fmt(x.amount)} ${CUR}${c?" ("+c.name+")":""} اللي سجلته قبل شوية؟`,"حذف",()=>{
    del("txns",x.id);dropPhotos(x.photos);lastAdd=null;
    log("delete",x.type==="debt"?"debt":"pay",{customerName:c?c.name:"",amount:x.amount,detail:"تراجع (Ctrl+Z)",...(sup?{sup:true}:{})});toast("تم التراجع")},true);
}
document.addEventListener("keydown",e=>{
  if(!S.me||e.defaultPrevented)return;
  const t=e.target,typing=!!(t&&t.matches&&t.matches("input:not([type=checkbox]),textarea,select,[contenteditable]"));
  if(((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&(e.key==="Enter"||e.code==="NumpadEnter"))||(!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.code==="Backslash")){
    const root=$("#modalRoot").innerHTML?$("#modalRoot"):document,mic=root.querySelector("[data-vsearch]");
    if(mic){e.preventDefault();voiceSearch(mic)}return}
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&e.code==="KeyZ"){if(typing)return;e.preventDefault();if(!$("#modalRoot").innerHTML)undoLast();return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey||$("#modalRoot").innerHTML)return;
  const act=e.key==="+"||e.code==="NumpadAdd"?"debt":e.key==="-"||e.code==="NumpadSubtract"?"pay":"";
  if(act){const b=document.querySelector(`.actions [data-act="${act}"]`);if(b){e.preventDefault();b.click()}return}
  if(e.code==="Slash"||e.key==="/"){const s=$("#hq")||$("#q");if(s){e.preventDefault();s.focus();s.select()}}
});

  if(!a)return;
  if(act==="approve-editor"||act==="approve-viewer"){const role=act==="approve-viewer"?"viewer":"editor";put("accounts",{...a,status:"active",role});log("edit","account",{detail:`فعّل حساب ${a.name} (${ROLE_LABEL[role]})`});toast("تم تفعيل "+a.name)}
  else if(act==="disable"){put("accounts",{...a,status:"disabled"});log("edit","account",{detail:`أوقف حساب ${a.name}`});toast("تم إيقاف الحساب")}
  else if(act==="enable"){put("accounts",{...a,status:"active"});log("edit","account",{detail:`أعاد تفعيل حساب ${a.name}`});toast("تم تفعيل الحساب")}
  else if(act==="delete")confirmBox(a.status==="pending"?"رفض الطلب":"حذف الحساب",`سيُحذف حساب ${a.name} (@${a.username}) ويفقد الوصول للبرنامج. إذا سجّل دخول مرة ثانية يظهر طلبه هنا من جديد.`,"حذف",()=>{del("accounts",a.id);log("delete","account",{detail:`حذف حساب ${a.name}`});toast("تم الحذف")});
}

/* ---------- native app (Android) ---------- */
if(NATIVE){
  // Links (WhatsApp, APK) open in the right app instead of inside the app window.
  document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest('a[href^="http"]');if(!a)return;e.preventDefault();plugin("AppLauncher").openUrl({url:a.href}).catch(()=>{location.href=a.href})},true);
  plugin("App").addListener("backButton",()=>{
    if($("#modalRoot").innerHTML){closeModal();return}
    if(S.me&&S.view==="customers"&&S.selected){S.selected=null;render();return}
    if(S.me&&S.view==="settings"&&S.setPage){S.setPage=null;render();return}
    if(S.me&&S.view!=="home"){go("home");return}
    plugin("App").exitApp();
  });
}else{
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(S.view==="settings")render()});
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
}

/* ---------- updates ----------
   A new version reaches an open app without closing it or reinstalling: when the app comes back to the screen (and every
   30 minutes while it stays open) it reads the version name in sw.js (CACHE, raised with every change) and, when it
   changed, reloads the page at a quiet moment: no open window, nothing typed in a field. The Android app opens
   the live site, so it updates the same way. A page that started offline (maybe an old copy) reloads once when back online. */
const UPD={ver:null,at:0,ready:false};
function updBusy(){const a=document.activeElement;return !!$("#modalRoot").innerHTML||!!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.value)}
function updTry(){
  if(document.visibilityState==="visible"&&updBusy()){setTimeout(updTry,15000);return}
  try{sessionStorage.setItem("shahm-updated","1")}catch(e){}
  location.reload();
}
function updCheck(force){
  if(UPD.ready||!navigator.onLine||(!force&&Date.now()-UPD.at<120000))return;
  UPD.at=Date.now();
  fetch("sw.js",{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{
    const v=(t.match(/const CACHE = "([^"]+)"/)||[])[1];if(!v)return;
    if(!UPD.ver)UPD.ver=v;else if(v!==UPD.ver){UPD.ready=true;updTry()}
  },()=>{});
}
if(!navigator.onLine)UPD.ver="offline";
updCheck(true);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")updCheck()});
document.addEventListener("resume",()=>updCheck());
window.addEventListener("online",()=>updCheck(true));
setInterval(()=>{if(document.visibilityState==="visible")updCheck(true)},30*60000);
try{if(sessionStorage.getItem("shahm-updated")){sessionStorage.removeItem("shahm-updated");setTimeout(()=>toast("انحدّث البرنامج لآخر نسخة"),1500)}}catch(e){}

/* ---------- boot ---------- */
(async()=>{
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase){showError("تعذّر تحميل ملفات البرنامج.");return}
  if(!cfg||!cfg.apiKey||/^PUT/.test(cfg.apiKey)){showError("لم يتم ربط قاعدة البيانات (Firebase) بعد.");return}
  firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();
  try{db.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  if(window.FIREBASE_EMULATOR){auth.useEmulator("http://127.0.0.1:9099",{disableWarnings:true});db.useEmulator("127.0.0.1",8080)}
  try{await db.enablePersistence({synchronizeTabs:true})}catch(e){console.warn("offline cache off",e&&e.code)}
  // Ask the browser to keep the login and offline copy when space runs low.
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
  let profUnsub=null;
  let authSeq=0;
  const spin=sub=>gateCard({sub,body:`<div class="spinner" aria-hidden="true"></div>`});
  // Which shop this account belongs to (memberOf), or null for this shop's own accounts. Offline: what this device saw last.
  async function shopOf(u){
    let cached=null;try{const c=JSON.parse(localStorage.getItem(SHOP_KEY)||"null");if(c&&c.uid===u.uid)cached=c.shop}catch(e){}
    try{
      const s=await db.doc("memberOf/"+u.uid).get();
      if(s.exists){const sh=s.data().shop;try{localStorage.setItem(SHOP_KEY,JSON.stringify({uid:u.uid,shop:sh}))}catch(e){}return sh}
      if(!s.metadata.fromCache){try{localStorage.removeItem(SHOP_KEY)}catch(e){}return null}
    }catch(e){if(e&&e.code==="permission-denied")return null}
    return cached;
  }
  // Opens a shop's notebook once its owner (the root owner) has activated it; its owner is the account whose uid is the shop id.
  function enterShop(u,uname){
    const own=SHOP===u.uid;let profOff=null;
    const close=()=>{stopData();S.me=null};
    const shopOff=db.doc("shops/"+SHOP).onSnapshot({includeMetadataChanges:true},s=>{
      if(!s.exists){if(s.metadata.fromCache)return;close();showWaiting(own?"طلب محلك انرفض أو انحذف. تواصل ويا صاحب البرنامج.":"هذا المحل انحذف. راجع صاحب المحل.","bad");return}
      S.shop={...s.data(),id:s.id};
      if(S.shop.status==="pending"){close();showWaiting(own?`تم تسجيل «${S.shop.name}» ✅ بانتظار التفعيل من صاحب البرنامج. أول ما يتفعّل يفتح دفترك تلقائياً.`:"المحل بعده ما متفعّل. راجع صاحب المحل.","warn");return}
      if(S.shop.status!=="active"){close();showWaiting(own?"اشتراك محلك موقوف. تواصل ويا صاحب البرنامج حتى يرجع يشتغل، وبياناتك محفوظة.":"المحل موقوف. راجع صاحب المحل.","bad");return}
      if(own){
        const first=!S.me;S.isOwner=true;
        S.me={id:u.uid,name:S.settings.ownerName||S.shop.ownerName||"المدير",role:"owner",username:S.shop.username||uname};
        rememberLogin(S.me.username,u.email);
        startData();if(first||$("#app").hidden)showApp();else render();
        return;
      }
      if(!profOff)profOff=watchProfile(u,uname);
    },e=>{console.warn(e);
      if(S.me&&!$("#app").hidden){toast(readErrMsg(e));return}
      if(e&&e.code==="permission-denied"&&!own){showWaiting("حسابك مو مضاف لهذا المحل. راجع صاحب المحل.","bad");return}
      showWaiting(readErrMsg(e),"bad",true)});
    profUnsub=()=>{shopOff();if(profOff)profOff()};
  }
  // A signed-in account with no shop and no place in this shop: register its shop (the sign-up form, or this form after it).
  function showShopSetup(u,pre,errMsg){
    pre=pre||{};
    gateCard({sub:"خطوة أخيرة: معلومات محلك",body:`
      ${errMsg?`<div class="banner bad">${esc(errMsg)}</div>`:""}
      <form id="nsf" class="field" style="gap:12px" novalidate>
        <div class="field"><label for="nsShop">اسم المحل</label><input id="nsShop" maxlength="60" value="${esc(pre.shop||"")}" placeholder="مثال: ماركت النور"></div>
        <div class="field"><label for="nsName">اسمك</label><input id="nsName" maxlength="40" value="${esc(pre.name||"")}"></div>
        <div class="field"><label for="nsPhone">رقم الهاتف</label><input id="nsPhone" inputmode="tel" maxlength="20" value="${esc(pre.phone||"")}" style="direction:ltr;text-align:right" placeholder="07xx xxx xxxx"></div>
        <p class="err" id="nsErr"></p>
        <button class="btn primary block" type="submit">تسجيل المحل</button>
      </form>
      <p class="ro-note">عامل بمحل؟ لا تسجّل محل: صاحب المحل يسويلك حساب من الإعدادات ← المستخدمين.</p>
      <button class="btn block" type="button" id="nsOut">تسجيل الخروج</button>`,
    mount:g=>{
      g.querySelector("#nsOut").onclick=()=>signOut();
      g.querySelector("#nsf").addEventListener("submit",e=>{e.preventDefault();
        const info={shop:$("#nsShop").value.trim(),name:$("#nsName").value.trim(),phone:normDigits($("#nsPhone").value).trim(),username:pre.username||""};
        if(!info.shop||!info.name){$("#nsErr").textContent="اكتب اسم المحل واسمك.";return}
        registerShop(u,info);
      });
    }});
  }
  async function registerShop(u,info){
    spin("جارِ تسجيل المحل…");
    const at=Date.now();
    try{
      const b=db.batch();
      b.set(db.doc("shops/"+u.uid),{id:u.uid,owner:u.uid,name:info.shop.slice(0,60),ownerName:info.name.slice(0,40),phone:(info.phone||"").slice(0,20),username:info.username||"",status:"pending",createdAt:at});
      b.set(db.doc("memberOf/"+u.uid),{shop:u.uid,at});
      await b.commit();
    }catch(e){console.warn(e);if(auth.currentUser===u)showShopSetup(u,info,e&&e.code==="permission-denied"?"تسجيل المحلات بعده ما مفتوح. تواصل ويا صاحب البرنامج.":"تعذّر التسجيل. تحقق من الإنترنت وحاول مرة ثانية.");return}
    if(auth.currentUser!==u)return;
    try{localStorage.setItem(SHOP_KEY,JSON.stringify({uid:u.uid,shop:u.uid}))}catch(e){}
    if(profUnsub){profUnsub();profUnsub=null}
    SHOP=u.uid;enterShop(u,info.username||"");
  }
  // The account's profile in its shop (users/{uid} at the root, or inside the shop): pending, stopped, or its role.
  function watchProfile(u,uname){
    return db.collection(P("users")).doc(u.uid).onSnapshot({includeMetadataChanges:true},s=>{
      if(!s.exists){
        if(s.metadata.fromCache)return; // wait for the server before deciding the profile is missing
        const un=uname||(u.email||"").split("@")[0].toLowerCase().replace(/[^a-z0-9_.]/g,"").slice(0,30)||"user"; // a deleted account that had linked its e-mail asks again
        if(MULTI&&!SHOP){const r=REG;REG=null;showShopSetup(u,{username:un,name:r&&r.name,shop:r&&r.shop&&r.shop.shop,phone:r&&r.shop&&r.shop.phone});return}
        const name=(REG&&REG.username===un&&REG.name)||un;REG=null;
        db.collection(P("users")).doc(u.uid).set({id:u.uid,name,username:un,role:"viewer",status:"pending",createdAt:Date.now()})
          .catch(()=>showWaiting("تعذّر إرسال طلبك. تحقق من الإنترنت وسجّل دخول مرة ثانية.","bad"));
        return;
      }
      const p=s.data();
      if(p.status==="pending"&&MULTI&&!SHOP){stopData();S.me=null;
        // An old copy of the app may have sent a shop's sign-up here as a request to join this shop: let it register its shop.
        gateCard({sub:"",body:`<div class="banner warn">طلبك وصل لـ«${esc(shopName())}» بانتظار موافقة المدير. إذا انت صاحب محل وتريد دفتر لمحلك، سجّل محلك.</div>
          <button class="btn primary block" type="button" id="wShop">صاحب محل؟ سجّل محلك</button><button class="btn block" type="button" id="wOut">تسجيل الخروج</button>`,
          mount:g=>{g.querySelector("#wOut").onclick=()=>signOut();g.querySelector("#wShop").onclick=()=>showShopSetup(u,{username:p.username||uname,name:p.name})}});
        return}
      if(p.status==="pending"){stopData();S.me=null;showWaiting("تم استلام طلبك ✅ بانتظار موافقة المدير. أول ما يفعّل حسابك يفتح البرنامج تلقائياً.","warn");return}
      if(p.status==="disabled"){stopData();S.me=null;showWaiting("تم إيقاف هذا الحساب. راجع المدير.","bad");return}
      const first=!S.me;
      S.me={id:u.uid,name:p.name||uname,role:p.role==="editor"?"editor":"viewer",username:p.username||uname};
      rememberLogin(S.me.username,u.email);
      startData();if(first||$("#app").hidden)showApp();else render();
    },e=>{console.warn(e);
      // Already open from the device's copy: keep working and say why it isn't updating, rather than locking people out.
      if(S.me&&!$("#app").hidden){toast(readErrMsg(e));return}
      showWaiting(readErrMsg(e),"bad",true)});
  }
  auth.onAuthStateChanged(async u=>{
    if(profUnsub){profUnsub();profUnsub=null}
    const seq=++authSeq;
    SHOP=null;S.shop=null;S.superOwner=false;
    if(!u){stopData();S.me=null;S.isOwner=false;const f=flash;flash=null;showLogin(f&&f.msg,f&&f.kind);return}
    const fake=isFakeEmail(u.email),uname=fake?u.email.split("@")[0]:"";
    if(MULTI){
      spin("جارِ التحقق من الحساب…");
      const sh=await shopOf(u);
      if(seq!==authSeq)return;
      if(sh){SHOP=sh;S.isOwner=false;enterShop(u,uname);return}
      if(REG&&REG.shop&&REG.username===uname){const r=REG;REG=null;registerShop(u,{shop:r.shop.shop,name:r.name,phone:r.shop.phone,username:r.username});return}
    }
    if(fake&&uname===OWNER_USER||!fake)gateCard({sub:"جارِ التحقق من الحساب…",body:`<div class="spinner" aria-hidden="true"></div>`});
    const oc=fake&&uname!==OWNER_USER?{owner:false,known:false}:await ownerCheck(u);
    if(seq!==authSeq)return;
    S.isOwner=oc.owner;S.superOwner=MULTI&&oc.owner;
    if(S.isOwner){
      rememberLogin(OWNER_USER,u.email);
      // Record which account is the owner, so the made-up admin@ login stops counting once the owner moves to a real e-mail.
      if(!oc.known)db.doc("settings/owner").set({uid:u.uid,at:Date.now()}).then(()=>{try{localStorage.setItem(OWNER_KEY,u.uid)}catch(e){}}).catch(e=>console.warn("owner record",e));
      S.me={id:u.uid,name:S.settings.ownerName||(REG&&REG.name)||"المدير",role:"owner",username:OWNER_USER};
      if(REG){const n=REG.name;REG=null;setTimeout(()=>{if(!S.settings.ownerName)saveSettings({ownerName:n})},2500)}
      startData();showApp();return;
    }
    spin("جارِ التحقق من الحساب…");
    profUnsub=watchProfile(u,uname);
  });
// The site moved from GitHub Pages to shahm-debts.app (the old address stops once the code repository goes private).
// Whoever still opens the old address, or an app installed before the move, is told where to go.
if(/\.github\.io$/.test(location.hostname)){
  const mv=document.createElement("div");mv.className="banner warn";mv.setAttribute("role","alert");
  mv.style.cssText="position:fixed;top:8px;inset-inline:8px;z-index:9999;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow-fab)";
  mv.innerHTML=NATIVE?`<span style="flex:1;min-width:180px">البرنامج انتقل لعنوان جديد وهذا التطبيق راح يوقف. احذفه وثبّت النسخة الجديدة، وبعدها سجّل دخول.</span><button class="btn sm" type="button" data-moved="${APK_URL}">تحميل التطبيق الجديد</button>`
    :`<span style="flex:1;min-width:180px">البرنامج انتقل لعنوان جديد وهذا العنوان راح يوقف: <b dir="ltr">shahm-debts.app</b>. افتحه من هناك وثبّته من جديد.</span><a class="btn sm" href="${WEB_URL}">فتح العنوان الجديد</a>`;
  mv.addEventListener("click",e=>{const x=e.target.closest("[data-moved]");if(x)openExternal(x.dataset.moved)});
  document.body.appendChild(mv);
}
})();
})();
</script>
