<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر ديون ماركت الشهم</title>
<meta name="description" content="دفتر ديون ماركت الشهم: ديون الزبائن والموردين، كشوف حساب PDF، وتذكير واتساب.">
<meta name="theme-color" content="#0e5a3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ديون الشهم">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
/* Layout: shop debt app. Gate (login) -> app with Home / Customers / Settings. Wide: top tabs, list + account side by side. Narrow: bottom nav, one pane. Colors and fonts follow BRAND.md: brand green chrome, red = owed, green = paid. */
:root{
  /* Al-Shahm Market brand tokens (brand spec §2). paper = surface, line = border, ink = text, accent = primary, debt = danger, paid = success. */
  --bg:#f4f2ec; --paper:#ffffff; --paper-2:#f8f6f1; --line:#e3ded3; --ink:#1c2421; --muted:#5e6660;
  --accent:#0e5a3a; --accent-ink:#fff7e8; --accent-soft:#dceee3; --debt:#c2301e; --debt-soft:#fce9e5; --paid:#4a7f12; --paid-soft:#edf5e0; --warn:#a55f00; --warn-soft:#fdf0dc;
  --shadow:0 1px 2px rgba(28,36,33,.06),0 8px 24px rgba(28,36,33,.07); --shadow-fab:0 6px 18px rgba(14,90,58,.35);
  --brand-orange:#f39a1e; --brand-tomato:#e2412b; --brand-leaf:#7bc043; --brand-cream:#fff7e8; --brand-deep:#083b26;
  --f-brand:"Lalezar","Tajawal",sans-serif;
  --f-display:"Tajawal","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Tajawal",Tahoma,"Segoe UI",sans-serif;
  --r:14px; --r-ctl:10px; --r-modal:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --paper:#172019; --paper-2:#1e2921; --line:#2c3830; --ink:#ecf1ec; --muted:#9aa59d;
  --accent:#5fc48c; --accent-ink:#06200f; --accent-soft:#1b3527; --debt:#ff8a78; --debt-soft:#3a1f1b; --paid:#a6d86a; --paid-soft:#243319; --warn:#f5b654; --warn-soft:#3a2c14;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); --shadow-fab:0 6px 18px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --paper:#172019; --paper-2:#1e2921; --line:#2c3830; --ink:#ecf1ec; --muted:#9aa59d;
  --accent:#5fc48c; --accent-ink:#06200f; --accent-soft:#1b3527; --debt:#ff8a78; --debt-soft:#3a1f1b; --paid:#a6d86a; --paid-soft:#243319; --warn:#f5b654; --warn-soft:#3a2c14;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); --shadow-fab:0 6px 18px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl}
button,input,textarea,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance}

/* ---------- gate ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding-inline:16px;padding-block:24px}
.gate-card{width:100%;max-width:420px;background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.gate-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.logo{width:64px;height:64px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.logo svg{width:74%;height:74%;display:block}
.gate-head h1{margin:6px 0 0;font-family:var(--f-brand);font-weight:400;font-size:26px;color:var(--accent)}
.gate-head p{margin:0;color:var(--muted)}
.banner{border-radius:12px;padding:10px 14px;font-size:14px}
.banner.bad{background:var(--debt-soft);color:var(--debt)}
.banner.ok{background:var(--paid-soft);color:var(--paid)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.pw{position:relative}
.pw input{padding-left:70px!important}
.pw button{position:absolute;left:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;padding:6px 8px;font-size:13px}
.linkish{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:4px}
.gate-foot{text-align:center;color:var(--muted);font-size:14px}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);margin:8px auto}
@media (prefers-reduced-motion:no-preference){.spinner{animation:spin 0.9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}

/* ---------- app shell ---------- */
.app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:12px 100px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .logo{width:42px;height:42px;border-radius:12px}
.brand h1{margin:0;font-family:var(--f-brand);font-weight:400;font-size:21px;line-height:1.3;color:var(--accent)}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.me{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;border:1px solid var(--line);border-radius:99px;background:var(--paper);font-size:13.5px}
.me .avatar{width:30px;height:30px;font-size:13px}
.role{font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.tabs button svg{width:18px;height:18px}
.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.bottom-nav{display:none}

.pane{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 0}
.section-title h2{margin:0;font-family:var(--f-display);font-size:17px}

/* stats */
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .k svg{width:16px;height:16px}
.stat .v{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.stat .v small{font-size:12px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.stat.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.main .k,.stat.main .v small{color:inherit;opacity:.85}
.v.debt{color:var(--debt)} .v.paid{color:var(--paid)}
@media (max-width:760px){.stat .v{font-size:19px}}
/* home summary: total debt first and largest, month figures, then the quick actions in the same card */
.summary{overflow:hidden}
.sum-hero{background:var(--accent);color:var(--accent-ink);border-bottom:4px solid var(--brand-orange);padding:18px 18px 16px;display:flex;flex-direction:column;gap:2px}
.sum-hero .k{font-size:14px;display:flex;align-items:center;gap:6px;opacity:.9}
.sum-hero .k svg{width:18px;height:18px}
.sum-hero .v{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1.15;overflow-wrap:anywhere}
.sum-hero .v small{font-size:16px;font-weight:500;opacity:.85;margin-inline-start:6px}
.sum-hero .s{font-size:13.5px;opacity:.85}
.sum-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.sum-mini>div{padding:12px 14px;min-width:0}
.sum-mini>div+div{border-inline-start:1px solid var(--line)}
.sum-mini .k{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sum-mini .k svg{width:15px;height:15px;flex:none}
.sum-mini .v{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.sum-actions{display:flex;gap:8px;flex-wrap:wrap;padding:14px}
.home-alerts{display:flex;flex-direction:column;gap:8px}
.home-alerts:not(:has(.banner)){display:none}
@media (max-width:760px){.sum-hero{padding:16px 16px 14px}.sum-hero .v{font-size:38px}
  .sum-mini>div{padding:10px 8px}.sum-mini .k{font-size:11.5px;white-space:nowrap}.sum-mini .k svg{display:none}.sum-mini .v{font-size:16px}
  .sum-actions{display:grid;grid-template-columns:1fr 1fr;padding:12px}.sum-actions .btn{justify-content:center;white-space:nowrap;padding-inline:8px;font-size:14px}
  .sum-actions .btn svg{width:16px;height:16px}.sum-actions .btn.debt,.sum-actions .btn.paid{font-size:16px}}

.home-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.home-grid{grid-template-columns:minmax(0,1fr)}}
.card-pad{padding:16px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--paper-2);border-radius:99px;padding:5px 13px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:600}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.act-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.act{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--paper-2)}
.act .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.act .ic svg{width:18px;height:18px}
.ic.add{background:var(--paid-soft);color:var(--paid)} .ic.edit{background:var(--warn-soft);color:var(--warn)} .ic.delete{background:var(--debt-soft);color:var(--debt)}
.act .body{flex:1;min-width:0}
.act .t{font-weight:600;overflow-wrap:anywhere}
.act .s{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.top-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.top-list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.top-list li:last-child{border-bottom:0}
.top-list button{border:0;background:none;cursor:pointer;flex:1;text-align:right;font-weight:600;padding:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* customers */
.layout{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:14px;align-items:start}
.list-pane{display:flex;flex-direction:column;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 40px)}
.list-tools{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:100%;padding:10px 38px 10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2)}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.row-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--paper-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.row-tools .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.row-tools .seg::-webkit-scrollbar{display:none}.row-tools .seg button{white-space:nowrap;flex:none}
select.sort{border:1px solid var(--line);background:var(--paper-2);border-radius:9px;padding:5px 8px;font-size:13px;margin-inline-start:auto}
.cust-list{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
.cust{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent;width:100%;background:none;text-align:right}
.cust:hover{background:var(--paper-2)}
.cust[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent-soft)}
.avatar{width:38px;height:38px;flex:none;border-radius:50%;background:var(--paper-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);color:var(--accent)}
.cust .meta{flex:1;min-width:0}
.cust .name,.cust .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cust .name{font-weight:600}
.cust .sub{font-size:12.5px;color:var(--muted)}
.chip{font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip.debt{background:var(--debt-soft);color:var(--debt)}
.chip.paid{background:var(--paid-soft);color:var(--paid)}
.chip.zero{background:var(--paper-2);color:var(--muted)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.cust-row{display:flex;align-items:center;gap:4px}
.cust-row .cust{flex:1;min-width:0}
.row-q{display:flex;gap:4px;flex:none}
.row-q button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;display:grid;place-items:center}
.row-q button svg{width:18px;height:18px}
.row-q .q-debt{color:var(--debt)} .row-q .q-pay{color:var(--paid)}
.row-q .q-debt:hover{background:var(--debt-soft)} .row-q .q-pay:hover{background:var(--paid-soft)}
.kind-seg{width:100%}.kind-seg button{flex:1;padding:7px 10px;font-size:14px}
.btn.zero{background:var(--warn);border-color:var(--warn);color:var(--paper)}
.limit-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.period{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-bottom:8px}
.period h3{margin:0}
.period select{border:1px solid var(--line);background:var(--paper-2);border-radius:9px;padding:6px 10px;font-size:13px}
tr.edge td{background:var(--paper-2);color:var(--muted);font-size:13px}
.rem-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.rem-row .meta{flex:1;min-width:140px}.rem-row .meta b{display:block}.rem-row .meta span{display:block;font-size:12.5px;color:var(--muted)}.rem-row .meta span.late{color:var(--debt);font-weight:600}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.btn{border:1px solid var(--line);background:var(--paper);padding:9px 14px;border-radius:var(--r-ctl);cursor:pointer;font-family:var(--f-display);font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--paper-2)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.debt{background:var(--debt);border-color:var(--debt);color:var(--paper)}
.btn.paid{background:var(--paid);border-color:var(--paid);color:var(--paper)}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger-text{color:var(--debt)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:var(--r-ctl)}
.btn.block{width:100%;padding:12px}
.btn svg{width:18px;height:18px}

.detail{padding:18px;display:flex;flex-direction:column;gap:16px}
.detail-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.detail-head .who{flex:1;min-width:0}
.detail-head h2{margin:0;font-family:var(--f-display);font-size:22px;line-height:1.3;overflow-wrap:anywhere}
.detail-head .phone{color:var(--muted);font-size:13.5px}
.back{display:none}
.balance-card{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--paper-2)}
.balance-card .lbl{font-size:13px;color:var(--muted)}
.balance-card .amt{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1.2}
.balance-card .amt small{font-size:15px;font-weight:500;color:var(--muted);margin-inline-start:6px}
.balance-card.owes .amt{color:var(--debt)} .balance-card.credit .amt{color:var(--paid)}
.balance-card .actions{display:flex;gap:8px;margin-inline-start:auto;flex-wrap:wrap}
.balance-card .actions .btn{padding:11px 18px;font-size:15px}
.mini-sums{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.mini-sums b{color:var(--ink);font-weight:600}
.ledger h3{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:600}
.ledger-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:360px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--paper-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.amt-d{color:var(--debt);font-weight:600;white-space:nowrap}
td.amt-p{color:var(--paid);font-weight:600;white-space:nowrap}
td.run{white-space:nowrap}
td.desc{min-width:110px;overflow-wrap:anywhere}
td.desc .d{display:block;color:var(--muted);font-size:12px}
td.x{width:64px;white-space:nowrap}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;display:inline-grid;place-items:center}
.icon-btn:hover{color:var(--accent);background:var(--accent-soft)}
.icon-btn.del:hover{color:var(--debt);background:var(--debt-soft)}
.icon-btn svg{width:16px;height:16px}
@media (max-width:480px){th,td{padding:8px 6px}table{font-size:13.5px;min-width:0}td.x{width:30px}td.x .icon-btn{display:grid}td.desc{min-width:90px}}
.tools-row{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.placeholder{padding:48px 20px;text-align:center;color:var(--muted)}
.placeholder svg{width:56px;height:56px;color:var(--line);margin-bottom:8px}
.placeholder b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px;font-family:var(--f-display)}

/* settings */
.settings{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.set-menu{padding:8px;display:flex;flex-direction:column;gap:2px}
.set-menu button{border:0;background:none;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:right;font-weight:600;width:100%}
.set-menu button:hover{background:var(--paper-2)}
.set-menu button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.set-menu svg{width:20px;height:20px;flex:none}
.set-menu .badge{margin-inline-start:auto;background:var(--debt);color:var(--paper);border-radius:99px;font-size:11.5px;padding:0 7px}
.set-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.biz-wrap{max-width:560px}.biz-wrap canvas{display:block;width:100%;height:auto;border-radius:16px;box-shadow:var(--shadow)}
.biz-ops{display:flex;gap:8px;flex-wrap:wrap}
.set-body h2{margin:0;font-family:var(--f-display);font-size:19px}
.set-body .lead{margin:-8px 0 0;color:var(--muted);font-size:14px}
.set-back{display:none}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:600px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.user-row{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.user-row .meta{flex:1;min-width:140px}
.user-row .meta b{display:block}
.user-row .meta span{font-size:12.5px;color:var(--muted)}

function calcEval(s){
  const t=normDigits(s).replace(/[,،\s]/g,"").replace(/[×xX]/g,"*").replace(/÷/g,"/").replace(/[−–]/g,"-");
  if(!t||!/^[\d.+\-*/]+$/.test(t))return NaN;
  const k=t.match(/\d*\.\d+|\d+\.?|[+\-*/]/g);if(!k||k.join("")!==t)return NaN;
  let i=0;
  const num=()=>{let sg=1;while(k[i]==="-"||k[i]==="+"){if(k[i]==="-")sg=-sg;i++}const v=Number(k[i++]);return sg*v};
  const term=()=>{let v=num();while(k[i]==="*"||k[i]==="/"){const op=k[i++],r=num();v=op==="*"?v*r:v/r}return v};
  let v=term();while(k[i]==="+"||k[i]==="-"){const op=k[i++],r=term();v=op==="+"?v+r:v-r}
  return i===k.length&&isFinite(v)?v:NaN;
}

    if(t.type==="pay"){if(!lastPay.has(id)||t.date>lastPay.get(id))lastPay.set(id,t.date)}

function gateCard(inner){$("#gate").hidden=false;$("#app").hidden=true;$("#bottomNav").hidden=true;

function showError(msg){gateCard({sub:"",body:`<div class="banner bad">${esc(msg)}</div>`})}
function authMsg(e){const c=(e&&e.code)||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return "اسم المستخدم أو كلمة المرور غير صحيحة.";
  if(c==="auth/email-already-in-use")return "اسم المستخدم مأخوذ، اختر اسماً آخر.";
  if(c==="auth/too-many-requests")return "محاولات كثيرة. انتظر قليلاً وحاول مرة ثانية.";
  if(c==="auth/network-request-failed")return "لا يوجد اتصال بالإنترنت.";
  if(c==="auth/weak-password")return "كلمة المرور 6 أحرف على الأقل.";
  if(c==="auth/operation-not-allowed")return "تسجيل الدخول غير مفعّل في Firebase (Email/Password).";
  return "صار خطأ: "+(c||(e&&e.message)||"غير معروف");
}
function showLogin(msg,kind){
  gateCard({sub:"سجّل الدخول للمتابعة",body:`
    ${msg?`<div class="banner ${kind||"bad"}">${esc(msg)}</div>`:""}
    <form id="lf" class="field" style="gap:12px" novalidate>
      <div class="field"><label for="lUser">اسم المستخدم</label><input id="lUser" autocomplete="username" autocapitalize="none" spellcheck="false" style="direction:ltr;text-align:right"></div>
      <div class="field"><label for="lPw">كلمة المرور</label><div class="pw"><input id="lPw" type="password" autocomplete="current-password"><button type="button" data-showpw="lPw">إظهار</button></div></div>
      <p class="err" id="lErr"></p>
      <button class="btn primary block" type="submit" id="lGo">دخول</button>
    </form>
    <div class="gate-foot">ليس لديك حساب؟ <button class="linkish" type="button" id="toReg">إنشاء حساب</button></div>`,
  mount:g=>{
    wirePw(g);g.querySelector("#toReg").onclick=()=>showRegister();
    g.querySelector("#lf").addEventListener("submit",async e=>{
      e.preventDefault();const u=normDigits($("#lUser").value).trim().toLowerCase(),p=$("#lPw").value;const err=$("#lErr"),btn=$("#lGo");

      btn.disabled=true;btn.textContent="جارِ الدخول…";
      try{await auth.signInWithEmailAndPassword(emailOf(u),p)}catch(x){err.textContent=authMsg(x);btn.disabled=false;btn.textContent="دخول"}
    });

  }});

function showRegister(){
  gateCard({sub:"أنشئ حسابك، وبعدها المدير يفعّله",body:`
    <form id="rf" class="field" style="gap:12px" novalidate>
      <div class="field"><label for="rName">اسمك</label><input id="rName" maxlength="40" placeholder="مثال: علي"></div>
      <div class="field"><label for="rUser">اسم المستخدم</label><input id="rUser" maxlength="30" autocomplete="username" autocapitalize="none" spellcheck="false" style="direction:ltr;text-align:right" placeholder="ali"><span class="help">أحرف إنجليزية أو أرقام، بدون فراغات.</span></div>
      <div class="field"><label for="rPw">كلمة المرور</label><div class="pw"><input id="rPw" type="password" autocomplete="new-password"><button type="button" data-showpw="rPw">إظهار</button></div><span class="help">6 أحرف على الأقل.</span></div>
      <p class="err" id="rErr"></p>
      <button class="btn primary block" type="submit" id="rGo">إنشاء الحساب</button>
    </form>
    <div class="gate-foot">عندك حساب؟ <button class="linkish" type="button" id="toLogin">تسجيل الدخول</button></div>`,
  mount:g=>{
    wirePw(g);g.querySelector("#toLogin").onclick=()=>showLogin();
    g.querySelector("#rf").addEventListener("submit",async e=>{
      e.preventDefault();const err=$("#rErr"),btn=$("#rGo");
      const r=validateAccount($("#rName").value,$("#rUser").value,$("#rPw").value,null);
      if(r.error){err.textContent=r.error;return}
      btn.disabled=true;btn.textContent="جارِ الإنشاء…";REG={name:r.name,username:r.username};
      try{await auth.createUserWithEmailAndPassword(emailOf(r.username),r.pw)}catch(x){REG=null;err.textContent=authMsg(x);btn.disabled=false;btn.textContent="إنشاء الحساب"}
    });
  }});
}
function showWaiting(msg,kind){
  gateCard({sub:"",body:`<div class="banner ${kind||"warn"}">${esc(msg)}</div>
    <button class="btn block" type="button" id="wOut">تسجيل الخروج</button>`,
    mount:g=>{g.querySelector("#wOut").onclick=()=>signOut()}});
}
function validateAccount(name,username,pw,selfId){
  name=String(name||"").trim();username=normDigits(username).trim().toLowerCase();
  if(!name)return {error:"اكتب الاسم."};
  if(!/^[a-z0-9_.]{3,30}$/.test(username))return {error:"اسم المستخدم من 3 إلى 30 حرفاً إنجليزياً أو رقماً."};
  if([...S.accounts.values()].some(a=>a.username===username&&a.id!==selfId))return {error:"اسم المستخدم مأخوذ، اختر اسماً آخر."};
  if(pw!==null&&String(pw).length<6)return {error:"كلمة المرور 6 أحرف على الأقل."};
  return {name,username,pw};
}
function wirePw(root){root.querySelectorAll("[data-showpw]").forEach(b=>b.addEventListener("click",()=>{const i=document.getElementById(b.dataset.showpw);const s=i.type==="password";i.type=s?"text":"password";b.textContent=s?"إخفاء":"إظهار"}))}

function stopData(){

  unsubs.push(db.collection("customers").onSnapshot(s=>{S.customers=new Map(s.docs.map(d=>[d.id,d.data()]));S.ready.c=true;render()},fail));
  unsubs.push(db.collection("txns").onSnapshot(s=>{S.txns=new Map(s.docs.map(d=>[d.id,d.data()]));S.ready.t=true;render()},fail));
  unsubs.push(db.collection("activity").orderBy("at","desc").limit(200).onSnapshot(s=>{S.activity=s.docs.map(d=>d.data());render()},fail));
  unsubs.push(db.doc("settings/main").onSnapshot(s=>{S.settings=s.exists?{...s.data()}:{};if(S.me&&S.me.role==="owner")S.me.name=S.settings.ownerName||"المدير";S.ready.s=true;render()},fail));
  if(S.isOwner){
    unsubs.push(db.collection("users").onSnapshot(s=>{S.accounts=new Map(s.docs.map(d=>[d.id,{...d.data(),id:d.id}]));S.ready.a=true;render()},fail));
    setTimeout(async()=>{try{const old=await db.collection("activity").where("at","<",Date.now()-120*864e5).limit(100).get();for(const d of old.docs)d.ref.delete().catch(()=>{})}catch(e){}},8000);

}

  const dueMap=new Map();if(S.kind==="supplier")for(const x of supplierAlerts().due){const p=dueMap.get(x.c.id);if(!p||x.left<p)dueMap.set(x.c.id,x.left)}
  const dueIds=new Set(dueMap.keys());if(S.filter==="due"&&S.kind!=="supplier")S.filter="all";
  let arr=[...S.customers.values()].filter(c=>{
    if(kindOf(c)!==S.kind)return false;
    const p=per.get(c.id);
    if(S.filter==="owe"&&!(p.bal>0))return false;
    if(S.filter==="clear"&&p.bal>0)return false;
    if(S.filter==="nophone"&&normDigits(c.phone).replace(/\D/g,""))return false;
    if(S.filter==="due"&&!dueIds.has(c.id))return false;
    if(!q)return true;
    return custScore(c,q)>0;
  });
  if(S.sort==="bal")arr.sort((a,b)=>per.get(b.id).bal-per.get(a.id).bal);
  else if(S.sort==="recent")arr.sort((a,b)=>per.get(b.id).last-per.get(a.id).last);
  else arr.sort((a,b)=>(a.name||"").localeCompare(b.name||"","ar"));
  const total=[...S.customers.values()].filter(c=>kindOf(c)===S.kind).length;
  if(!total){ul.innerHTML=`<li class="empty"><b>${S.kind==="supplier"?"لا يوجد موردين بعد":"لا يوجد زبائن بعد"}</b>${canWrite()?(S.kind==="supplier"?"اضغط «إضافة مورد» لتسجيل ما عليك للموردين.":"اضغط «إضافة زبون» لإضافة أول زبون."):""}</li>`;return}
  if(!arr.length){ul.innerHTML='<li class="empty"><b>لا توجد نتائج</b>جرّب اسماً آخر أو غيّر التصفية.</li>';return}
  ul.innerHTML=arr.map(c=>{
    const p=per.get(c.id);const cls=p.bal>0?"debt":p.bal<0?"paid":"zero";
    const label=p.bal>0?fmt(p.bal):p.bal<0?"له "+fmt(-p.bal):"مسدد";
    const sub=[c.phone,p.count?p.count+" حركة":"بدون حركات"].filter(Boolean).join(" · ");
    const over=c.limit>0&&p.bal>c.limit;
    return `<li class="cust-row"><button class="cust" type="button" data-open="${esc(c.id)}" aria-current="${S.selected===c.id}">
      <span class="avatar" aria-hidden="true">${initial(c.name)}</span>
      <span class="meta"><span class="name">${esc(c.name)}${over?' <span class="chip warn" style="font-size:11px;padding:0 6px">تجاوز الحد</span>':""}</span><span class="sub">${esc(sub)}${dueMap.has(c.id)?` <span class="chip ${dueMap.get(c.id)<0?"debt":"warn"}" style="font-size:11px;padding:0 6px">${dueText(dueMap.get(c.id))}</span>`:""}</span></span>
      <span class="chip ${cls}"><span class="num">${esc(label)}</span></span></button>
      ${canWrite()?`<span class="row-q"><button type="button" class="q-pay" data-qpay="${esc(c.id)}" aria-label="دفعة من ${esc(c.name)}" title="دفعة">${I.minus}</button><button type="button" class="q-debt" data-qdebt="${esc(c.id)}" aria-label="دين على ${esc(c.name)}" title="دين">${I.plus}</button></span>`:""}</li>`;
  }).join("");
  ul.insertAdjacentHTML("afterbegin",`<li class="ro-note" style="padding:2px 10px 6px">${arr.length} ${S.kind==="supplier"?"مورد":"حساب"}</li>`);
  if(S.kind==="supplier"){const m=monthISO();let owe=0,buy=0,paid=0;
    for(const c of S.customers.values())if(isSup(c)){const b=per.get(c.id).bal;if(b>0)owe+=b}
    for(const t of S.txns.values()){const c=S.customers.get(t.customerId);if(c&&isSup(c)&&(t.date||"").startsWith(m))t.type==="debt"?buy+=t.amount:paid+=t.amount}
    ul.insertAdjacentHTML("afterbegin",`<li class="sup-sum" style="padding:4px 10px 8px"><span class="chip debt">علينا <span class="num">${fmt(owe)}</span></span><span class="chip zero">مشتريات الشهر <span class="num">${fmt(buy)}</span></span><span class="chip paid">دفعنا الشهر <span class="num">${fmt(paid)}</span></span></li>`)}
}
function periodStart(c){
  const rows=txnsOf(c.id);
  if(S.period==="month")return monthISO()+"-01";
  if(S.period==="30"){const d=new Date(Date.now()-30*864e5);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  if(S.period==="sincepay"){const pays=rows.filter(t=>t.type==="pay");return pays.length?pays[pays.length-1].date:""}
  return "";
}
function ledgerFor(c){
  const rows=txnsOf(c.id);const from=periodStart(c);let open=0,run=0;const list=[];
  for(const t of rows){const d=t.type==="debt"?t.amount:-t.amount;if(from&&t.date<from){open+=d;run+=d;continue}run+=d;list.push({t,run})}
  let dSum=0,pSum=0;for(const x of list){x.t.type==="debt"?dSum+=x.t.amount:pSum+=x.t.amount}
  return {from,open,close:run,list,dSum,pSum};
}

/* ---------- PDF reports (drawn on canvas so Arabic renders correctly) ---------- */
// Printed palette = light brand tokens; reports open with a 14px green bar over a 5px orange line.
const PDFC={green:"#0e5a3a",orange:"#f39a1e",ink:"#1c2421",muted:"#5e6660",line:"#e3ded3",head:"#f4f2ec",shade:"#f8f6f1",rule:"#ece8df",debt:"#c2301e",paid:"#4a7f12"};
const PDF_BRAND="'Lalezar','Tajawal',sans-serif";
async function pdfFonts(){try{await Promise.all(["400 40px Lalezar","700 28px Tajawal","400 22px 'IBM Plex Sans Arabic'","700 22px 'IBM Plex Sans Arabic'"].map(f=>document.fonts.load(f)));await document.fonts.ready}catch(e){}}
const pdfBar=ctx=>{ctx.fillStyle=PDFC.green;ctx.fillRect(0,0,1240,14);ctx.fillStyle=PDFC.orange;ctx.fillRect(0,14,1240,5)};
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)){res();return}const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function buildPdf(spec,filename,opt){
  if(!(opt&&opt.blob))toast("جارِ تجهيز التقرير…");
  try{await loadScript("vendor/jspdf.umd.min.js")}catch(e){toast("تعذّر تحميل أداة PDF. تحقق من الإنترنت.");return null}
  await pdfFonts();
  const W=1240,H=1754,M=80,F="'IBM Plex Sans Arabic',Tahoma,sans-serif";
  const pages=[];let ctx,y;
  const newPage=()=>{const cv=document.createElement("canvas");cv.width=W;cv.height=H;ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.direction="rtl";pages.push(cv);y=M;
    pdfBar(ctx);
    ctx.fillStyle=PDFC.green;ctx.textAlign="right";ctx.font=`400 46px ${PDF_BRAND}`;ctx.fillText(spec.shop,W-M,y+40);
    ctx.font=`500 24px ${F}`;ctx.fillStyle=PDFC.muted;ctx.fillText(spec.title,W-M,y+80);
    ctx.textAlign="left";ctx.direction="ltr";ctx.fillText(todayISO(),M,y+40);ctx.direction="rtl";
    y+=110;ctx.strokeStyle=PDFC.line;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(M,y);ctx.lineTo(W-M,y);ctx.stroke();y+=30;};
  newPage();
  ctx.textAlign="right";
  for(const [k,v] of spec.info){ctx.font=`500 24px ${F}`;ctx.fillStyle=PDFC.muted;ctx.fillText(k,W-M,y+24);ctx.font=`700 26px ${F}`;ctx.fillStyle=v.color||PDFC.ink;ctx.fillText(v.text,W-M-260,y+24);y+=42}
  y+=16;
  const cols=spec.columns;const tw=W-2*M;let x0;
  const header=()=>{ctx.fillStyle=PDFC.head;ctx.fillRect(M,y,tw,48);ctx.fillStyle=PDFC.muted;ctx.font=`600 22px ${F}`;x0=W-M;for(const c of cols){const cw=c.w*tw;ctx.textAlign="right";ctx.fillText(c.label,x0-14,y+32);x0-=cw}y+=48};
  header();
  for(const r of spec.rows){
    if(y>H-M-120){newPage();header()}
    x0=W-M;ctx.font=`${r.bold?"700":"400"} 22px ${F}`;
    if(r.shade){ctx.fillStyle=PDFC.shade;ctx.fillRect(M,y,tw,46)}
    cols.forEach((c,i)=>{const cw=c.w*tw;const val=r.cells[i]??"";ctx.fillStyle=(r.colors&&r.colors[i])||PDFC.ink;
      if(c.num){ctx.direction="ltr";ctx.textAlign="right";ctx.fillText(val,x0-14,y+31);ctx.direction="rtl"}
      else{ctx.textAlign="right";let s=String(val);while(s.length>2&&ctx.measureText(s).width>cw-24)s=s.slice(0,-2);if(s!==String(val))s+="…";ctx.fillText(s,x0-14,y+31)}
      x0-=cw});
    y+=46;ctx.strokeStyle=PDFC.rule;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(M,y);ctx.lineTo(W-M,y);ctx.stroke();
  }

/* Saves a file: the Android app writes it and opens the share sheet (WhatsApp, Drive, Files); phones' browsers share it; laptops download it. Returns false if the person cancelled. */
async function saveFile(filename,data,mime,text){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||"application/octet-stream"});
  if(NATIVE){
    const r=await plugin("Filesystem").writeFile({path:filename,data:await blobToB64(blob),directory:"CACHE"});
    try{await plugin("Share").share({title:filename,files:[r.uri],...(text?{text}:{})})}catch(e){if(/cancel/i.test(String(e&&e.message)))return false;throw e}
    return true;
  }
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(mobile&&navigator.canShare){
    const file=new File([blob],filename,{type:blob.type});
    if(navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:filename,...(text?{text}:{})});return true}catch(e){if(e&&e.name==="AbortError")return false}}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);return true;
}

async function drawBizCard(cv,b){
  const tk=cv._tk=(cv._tk||0)+1;
  try{await loadScript("vendor/qrcode.js");if(!window.qrcode)await new Promise(r=>setTimeout(r,400))}catch(e){}
  try{await Promise.all(["400 60px Lalezar","500 30px 'IBM Plex Sans Arabic'","600 32px 'IBM Plex Sans Arabic'"].map(f=>document.fonts.load(f)))}catch(e){}
  const W=1200,H=700,P=BIZ_STYLES[b.style]||BIZ_STYLES.shahm,F="'IBM Plex Sans Arabic',Tahoma,sans-serif",FD="'Lalezar','Tajawal',sans-serif";
  const P0=BIZ_STYLES[b.style]||BIZ_STYLES.shahm;
  const mark=await new Promise(res=>{const svg=BRAND_MARK.replace(/currentColor/g,P0.tx).replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" width="212" height="212" ');
    const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)});
  if(cv._tk!==tk)return cv; // a newer draw started while fonts or the QR library were loading
  cv.width=W;cv.height=H;const x=cv.getContext("2d");x.clearRect(0,0,W,H);
  const rr=(X,Y,w,h,r)=>{x.beginPath();if(x.roundRect){x.roundRect(X,Y,w,h,r);return}
    x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()};
  const icon=(name,X,Y,s,color,stroke)=>{x.save();x.translate(X,Y);x.scale(s/24,s/24);const p=new Path2D(BIZ_IC[name]);
    if(stroke){x.strokeStyle=color;x.lineWidth=2.2;x.lineCap="round";x.stroke(p)}else{x.fillStyle=color;x.fill(p,"evenodd")}x.restore()};
  const fit=(t,font,size,max)=>{let s=size;x.font=`${font.replace("%",s)}`;while(s>16&&x.measureText(t).width>max){s-=2;x.font=font.replace("%",s)}return s};
  // background + soft decorations
  rr(0,0,W,H,46);x.fillStyle=P.bg;x.fill();x.save();rr(0,0,W,H,46);x.clip();
  x.strokeStyle=P.bg2;x.lineWidth=70;x.beginPath();x.arc(W-60,180,250,0,Math.PI*2);x.stroke();
  x.fillStyle=P.bg2;[[10,210],[170,210],[10,370],[170,370]].forEach(([a,c])=>{rr(a,c,130,130,28);x.fill()});x.restore();
  x.direction="rtl";x.textAlign="right";
  // header: icon box + name + description
  rr(W-190,60,130,130,26);x.fillStyle=P.bg;x.fill();x.lineWidth=3;x.strokeStyle=P.acc;x.stroke();
  if(mark)x.drawImage(mark,W-172,72,106,106);else{icon("bag",W-160,90,70,P.acc);x.fillStyle=P.bg;x.fillRect(W-160+70/24*3,90+70/24*12.6,70/24*18,5)}
  const hx=W-230;
  fit(b.name,`400 %px ${FD}`,68,hx-120);x.fillStyle=P.tx;x.fillText(b.name,hx,b.desc?120:142);
  if(b.desc){fit(b.desc,`500 %px ${F}`,30,hx-120);x.fillStyle=P.mu;x.fillText(b.desc,hx,172)}
  x.strokeStyle=P.ln;x.lineWidth=2;x.beginPath();x.moveTo(90,262);x.lineTo(W-90,262);x.stroke();
  // contact rows on the right, QR on the left
  const rows=[["user",b.manager],["phone",b.phone,true],["pin",b.address],["link",b.social]].filter(r=>r[1]);
  const vc=b.phone&&window.qrcode?bizVcard(b):"";
  const top=rows.length>3?300:318,gap=rows.length>3?56:66;
  rows.forEach(([ic,t,ltr],i)=>{const y=top+i*gap;icon(ic,W-128,y,38,P.ic,ic==="link");
    const s=fit(t,`600 %px ${F}`,34,vc?W-450:W-240);x.fillStyle=P.tx;
    if(ltr||!/[\u0600-\u06FF]/.test(t)){x.direction="ltr";x.textAlign="right";x.fillText(t,W-150,y+30);x.direction="rtl"}else x.fillText(t,W-150,y+30)});
  if(vc){try{qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"];const q=qrcode(0,"L");q.addData(vc,"Byte");q.make();
    const n=q.getModuleCount(),box=210,X=90,Y=290;rr(X,Y,box,box,24);x.fillStyle="#fff";x.fill();if(P.bg==="#ffffff"){x.strokeStyle=P.ln;x.lineWidth=3;x.stroke()}const cs=(box-28)/n;x.fillStyle="#000";
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect(X+14+c*cs,Y+14+r*cs,Math.ceil(cs),Math.ceil(cs))}catch(e){}}
  // footer
  x.strokeStyle=P.ft;x.beginPath();x.moveTo(0,575);x.lineTo(W,575);x.stroke();
  const ft=vc?"امسح الرمز وينحفظ رقمنا بجهات الاتصال":(b.phone?"اتصل بينا أو راسلنا واتساب":b.name);
  x.font=`500 28px ${F}`;const fw=x.measureText(ft).width;const cx=W/2+fw/2+26;
  x.fillStyle=P.acc;x.beginPath();x.arc(cx,637,17,0,Math.PI*2);x.fill();

  x.fillStyle=P.mu;x.fillText(ft,cx-30,647);
  return cv;
}

function openModal(html,onMount){
  const root=$("#modalRoot");root.innerHTML=`<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim=$("#scrim");scrim.addEventListener("click",e=>{if(e.target===scrim)closeModal()});
  root.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeModal));
  wirePw(root);onMount&&onMount(root.querySelector(".modal"));
  const f=root.querySelector("input:not([type=hidden]),textarea");if(f)f.focus();
}

      ${existing||isSup(c)?"":c.phone?`<label class="wa-auto"><input type="checkbox" id="tWa" ${(()=>{try{return localStorage.getItem(WA_AUTO_KEY)==="0"?"":"checked"}catch(e){return "checked"}})()}>فتح واتساب بعد الحفظ والرسالة جاهزة</label>`:`<span class="wa-auto off">الزبون بدون رقم، أضف رقمه حتى ترسل له واتساب.</span>`}

    </form>`,m=>{

    // writeBack=false while the person types in the amount field itself, so the field keeps what they typed.
    const showCalc=(writeBack=true)=>{const v=calcEval(expr.replace(/[+\-*/.]+$/,""));cExp.textContent=expr?pretty(expr).trim()+(/[+\-*/]/.test(expr.slice(1))&&isFinite(v)?"  = "+fmt(v):""):"";if(expr&&writeBack)a.value=isFinite(v)?fmt(v):a.value};
    const setCalc=(open,remember=true)=>{calc.hidden=!open;cT.setAttribute("aria-expanded",String(open));if(remember)try{localStorage.setItem(CALC_KEY,open?"1":"")}catch(e){}if(open){expr=a.value?String(parseAmt(a.value)||""):"";showCalc()}};
    cT.addEventListener("click",()=>setCalc(calc.hidden));
    try{if(localStorage.getItem(CALC_KEY))setCalc(true)}catch(e){}
    const press=k=>{

      else if(k==="."){const last=expr.split(/[+\-*/]/).pop();if(!last.includes("."))expr+=last?".":"0."}

    // Clicking a calculator key keeps the cursor in the amount field, so the laptop keyboard keeps working after a click.
    calc.addEventListener("mousedown",e=>{if(e.target.closest("[data-k]"))e.preventDefault()});
    calc.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b)press(b.dataset.k)});
    const syncFromField=()=>{expr=normDigits(a.value).replace(/[,،\s]/g,"").replace(/[×xX]/g,"*").replace(/÷/g,"/");showCalc(false)};

/* ---------- ledger photo: read the paper notebook with AI, review, save ---------- */
async function shrinkImage(file,max=1568,q=.85,cap=900000){
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}
  catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("bad image"));i.src=URL.createObjectURL(file)})}
  const w=src.width,h=src.height,k=Math.min(1,max/Math.max(w,h));
  const cv=document.createElement("canvas");cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  cv.getContext("2d").drawImage(src,0,0,cv.width,cv.height);
  let url=cv.toDataURL("image/jpeg",q);
  // Invoice photos live in Firestore documents (1 MB cap), so step the quality down until it fits comfortably. The sheet reader passes a bigger cap: handwriting needs the detail.
  for(let qq=q-.1;url.length>cap&&qq>.3;qq-=.1)url=cv.toDataURL("image/jpeg",qq);
  return {url,data:url.slice(url.indexOf(",")+1),media_type:"image/jpeg"};
}

function scanReview(rows,pics){
  const custs=[...S.customers.values()].filter(c=>!isSup(c)).sort((a,b)=>a.name.localeCompare(b.name,"ar"));
  // Names the shop linked by hand on earlier sheets are remembered on the customer (aliases); use them before trusting a weak AI match.
  const known=new Map();for(const c of custs){known.set(foldAr(c.name),c.id);for(const a of c.aliases||[])known.set(foldAr(a),c.id)}
  for(const r of rows){const k=known.get(foldAr(r.written_name));if(k&&(r.match!=="sure"||!r.customer_id)){r.customer_id=k;r.match="sure";r.remembered=true}}
  const R=rows.map(r=>({...r,cust:r.customer_id||"",amount:r.amount>0?r.amount:0,gone:false}));
  // Arabic-tolerant search: ignore hamza forms, ة/ه, ى/ي, diacritics and spaces ("عبدالله" finds "عبد الله").
  const fold=x=>normDigits(x).toLowerCase().replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[\u064B-\u0652\u0640]/g,"").replace(/\s+/g," ").trim();
  const F=custs.map(c=>{const f=fold(c.name);return {c,f,n:f.replace(/ /g,"")}});

    q=fold(q);
    if(q){const toks=q.split(" "),nq=q.replace(/ /g,"");return F.filter(x=>x.n.includes(nq)||toks.every(t=>x.f.includes(t))).slice(0,50).map(x=>x.c)}
    // Empty search: suggest customers sharing a word with the written name, then everyone.
    const wt=fold(written).split(" ").filter(t=>t.length>1&&!["ابو","ام","حجي","بيت"].includes(t));
    const sc=F.map(x=>({c:x.c,s:wt.filter(t=>x.f.includes(t)).length})).filter(x=>x.s).sort((a,b)=>b.s-a.s).slice(0,15).map(x=>x.c);
    return sc.length?sc:custs.slice(0,50)};

    return `${r.written_name.trim()?`<li><button type="button" class="new" data-pk="new">+ زبون جديد: ${esc(r.written_name.trim())}</button></li>`:""}${arr.map(c=>`<li><button type="button" data-pk="${esc(c.id)}"><span>${esc(c.name)}</span>${c.id===r.cust?"✓":""}</button></li>`).join("")||`<li class="empty">لا يوجد زبون بهذا الاسم</li>`}`};
  const card=(r,i)=>{const warn=r.match!=="sure"||r.amount_unsure||!r.amount;
    return `<div class="sr ${warn?"warn":""}" data-i="${i}">
      <div class="sr-top"><span>${r.row?`سطر <b class="num">${r.row}</b> · `:""}مكتوب: <b>${esc(r.written_name)||"؟"}</b>${r.amount_written?` <bdi class="num">${esc(r.amount_written)}</bdi>`:""}${r.remembered?" · من الذاكرة":r.match==="unsure"?" · تأكد من الاسم":r.match==="none"?" · ما لكيته بالزبائن":""}${r.amount_unsure?" · تأكد من المبلغ":""}</span><button class="icon-btn del" type="button" aria-label="حذف السطر" data-srdel>${I.trash}</button></div>
      ${custBtn(r)}
      <div class="sr-row"><div class="seg" role="group" aria-label="نوع الحركة"><button type="button" data-t="debt" aria-pressed="${r.type==="debt"}">دين</button><button type="button" data-t="pay" aria-pressed="${r.type==="pay"}">تسديد</button></div><input data-f="amt" inputmode="numeric" aria-label="المبلغ" value="${r.amount?fmt(r.amount):""}" placeholder="المبلغ"></div>
      <input data-f="note" maxlength="140" aria-label="ملاحظة" value="${esc(r.note)}" placeholder="ملاحظة (اختياري)">
      <div class="sr-dup" hidden>⚠️ هذي الحركة مسجّلة قبل لنفس الزبون بنفس التاريخ والمبلغ</div>
    </div>`};
  // Same customer, type, amount and date already in the book: most likely the same sheet photographed twice.
  const isDup=(r,date)=>!!r.cust&&r.cust!=="new"&&r.amount>0&&[...S.txns.values()].some(t=>t.customerId===r.cust&&t.type===r.type&&t.amount===r.amount&&t.date===date);
  openModal(`<h3>راجع الحركات قبل الحفظ</h3>

const backupDone=detail=>{saveSettings({lastBackupAt:Date.now()});log("add","import",{detail})};
// Small key/value store in this browser's IndexedDB: keeps the chosen backup folder (a folder handle can't go in localStorage).
const kv=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open("shahm-local",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const run=(mode,fn)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction("kv",mode),q=fn(t.objectStore("kv"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
  return {get:k=>run("readonly",s=>s.get(k)).catch(()=>null),set:(k,v)=>run("readwrite",s=>s.put(v,k)).catch(()=>{})}})();
const FOLDER_OK=!NATIVE&&typeof window.showDirectoryPicker==="function";
/* Daily backup in one tap: the backup file and the customers' debt PDF together. On a laptop (Chrome/Edge) the owner picks the
   flash drive's backup folder once; after that every tap writes both files to <folder>/YYYY-MM/YYYY-MM-DD/ with no dialog.
   Elsewhere both files are saved/shared together. The folder is asked for first, while the tap still counts as a user action. */
// The chosen folder can be the backup root (Shahm-Backups), a month folder (2026-10) or the day's own folder (2026-10-08);
// the files go into the day's folder under it, and an existing month/day folder is reused, never made twice.
const DAY_RE=/^\d{4}-\d{2}-\d{2}$/,MON_RE=/^\d{4}-\d{2}$/;
const backupPath=(name,day)=>DAY_RE.test(name)?name:MON_RE.test(name)?name+"\\"+day:name+"\\"+day.slice(0,7)+"\\"+day;
async function dailyBackup(choose){
  const day=todayISO(),mon=day.slice(0,7);let dir=null;
  // A day or month folder only fits that day or month; picking another one would put today's files in the wrong place.
  const wrong=h=>(DAY_RE.test(h.name)&&h.name!==day)||(MON_RE.test(h.name)&&h.name!==mon);
  if(FOLDER_OK){
    try{
      const prev=await kv.get("backupDir");
      dir=choose||(prev&&wrong(prev))?null:prev;
      if(!dir){
        dir=await window.showDirectoryPicker({id:"shahm-backup",mode:"readwrite",startIn:prev||"desktop"});
        if(wrong(dir)){toast(`هذا مجلد ${DAY_RE.test(dir.name)?"يوم":"شهر"} ثاني (${dir.name}). اختار مجلد اليوم ${day} أو مجلد Shahm-Backups.`,{label:"اختيار المجلد",onClick:()=>dailyBackup(true),ms:14000});return}
        await kv.set("backupDir",dir);
      }
      if(await dir.queryPermission({mode:"readwrite"})!=="granted"&&await dir.requestPermission({mode:"readwrite"})!=="granted"){toast("لازم توافق حتى البرنامج يحفظ بالمجلد.");return}
    }catch(e){if(e&&e.name==="AbortError")return;console.warn(e);dir=null}
  }
  toast("جارِ تجهيز النسخة وملف الديون…");
  const bk=await backupJson();
  const pdf=await listPdf("customer",{blob:true});
  if(!pdf)return;
  if(dir){
    try{
      const dd=DAY_RE.test(dir.name)?dir:MON_RE.test(dir.name)?await dir.getDirectoryHandle(day,{create:true}):await (await dir.getDirectoryHandle(mon,{create:true})).getDirectoryHandle(day,{create:true});
      // Some file systems refuse Arabic file names; then the same file is written under a plain English name.
      const put1=async(names,blob)=>{for(const n of names){try{const w=await (await dd.getFileHandle(n,{create:true})).createWritable();await w.write(blob);await w.close();return}catch(e){if(n===names[names.length-1])throw e}}};
      await put1([bk.name,`backup-${day}.json`],new Blob([bk.data],{type:"application/json"}));await put1([pdf.fname,`debts-${day}.pdf`],pdf.blob);
      backupDone("حفظ نسخة اليوم بالمجلد");try{localStorage.setItem("shahm-backup-dir",dir.name)}catch(e){}
      toast(`✓ انحفظ الملفين بـ \u2066${backupPath(dir.name,day)}\u2069`,{label:"تغيير المجلد",onClick:()=>dailyBackup(true),ms:9000});render();return;
    }catch(e){console.warn(e);
      toast(e&&e.name==="NotFoundError"?"ما لكيت المجلد. ركّب الفلاش وحاول مرة ثانية، أو اختار المجلد من جديد.":"تعذّر الحفظ بالمجلد.",{label:"اختيار المجلد",onClick:()=>dailyBackup(true),ms:12000});return}
  }
  openModal(`<h3>نسخة اليوم جاهزة</h3><p class="hint">الملفين جاهزين: النسخة الاحتياطية وتقرير ديون الزبائن. اضغط حفظ حتى ينزلون سوا.</p>
    <div class="foot"><button class="btn primary" type="button" id="bkBoth">${I.save}حفظ الملفين</button><button class="btn" type="button" data-close>إلغاء</button></div>`,
    m=>m.querySelector("#bkBoth").addEventListener("click",async()=>{
      try{if(await saveFiles([{name:bk.name,blob:new Blob([bk.data],{type:"application/json"})},{name:pdf.fname,blob:pdf.blob}])){backupDone("حفظ نسخة اليوم");closeModal();toast("تم حفظ الملفين")}}
      catch(e){console.warn(e);toast("تعذّر حفظ الملفات.")}}));
}
// Several files in one go: the Android app and phones share them together; a laptop downloads them one after the other.
async function saveFiles(list){
  if(NATIVE){
    const uris=[];for(const f of list)uris.push((await plugin("Filesystem").writeFile({path:f.name,data:await blobToB64(f.blob),directory:"CACHE"})).uri);
    try{await plugin("Share").share({title:list[0].name,files:uris})}catch(e){if(/cancel/i.test(String(e&&e.message)))return false;throw e}
    return true;
  }
  const files=list.map(f=>new File([f.blob],f.name,{type:f.blob.type}));
  if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files})){
    try{await navigator.share({files,title:list[0].name});return true}catch(e){if(e&&e.name==="AbortError")return false}
  }
  for(const f of list){const a=document.createElement("a");a.href=URL.createObjectURL(f.blob);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);await new Promise(r=>setTimeout(r,400))}
  return true;
}

      <label style="display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink)"><input type="radio" name="rmode" value="merge" checked style="width:auto;margin-top:5px"> <span><b>دمج</b>: يرجّع كل ما في النسخة ويبقي الإضافات الجديدة الموجودة الآن. (مستحسن)</span></label>
      <label style="display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink)"><input type="radio" name="rmode" value="replace" style="width:auto;margin-top:5px"> <span><b>استبدال كامل</b>: يحذف البيانات الحالية ويضع النسخة مكانها.</span></label></div>
    <div class="field" id="repWrap" hidden><label for="repTxt">للتأكيد اكتب كلمة: استبدال</label><input id="repTxt" autocomplete="off"></div>
    <p class="err" id="rErr2"></p>
    <div class="foot"><button class="btn primary" type="button" id="rGo">استعادة</button><button class="btn" type="button" data-close>إلغاء</button></div>`,m=>{
    m.querySelectorAll("input[name=rmode]").forEach(r=>r.addEventListener("change",()=>{m.querySelector("#repWrap").hidden=m.querySelector("input[name=rmode]:checked").value!=="replace"}));
    m.querySelector("#rGo").addEventListener("click",async()=>{
      const mode=m.querySelector("input[name=rmode]:checked").value;
      if(mode==="replace"&&m.querySelector("#repTxt").value.trim()!=="استبدال"){m.querySelector("#rErr2").textContent="اكتب كلمة «استبدال» للتأكيد.";return}
      const btn=m.querySelector("#rGo");btn.disabled=true;
      if(!navigator.onLine){m.querySelector("#rErr2").textContent="الاستعادة تحتاج إنترنت. اتصل وحاول مرة ثانية.";btn.disabled=false;return}
      const ops=[];
      if(mode==="replace"){
        const keepC=new Set(cs.map(c=>c.id)),keepT=new Set(ts.map(t=>t.id));
        for(const id of S.txns.keys())if(!keepT.has(id))ops.push(["del","txns",id]);
        for(const id of S.customers.keys())if(!keepC.has(id))ops.push(["del","customers",id]);
      }
      for(const c of cs)ops.push(["set","customers",c.id,c]);
      for(const t of ts)ops.push(["set","txns",t.id,{...t,amount:Number(t.amount)}]);
      for(const a of acts)ops.push(["set","activity",a.id,a]);
      if(d.settings&&typeof d.settings==="object")ops.push(["set","settings","main",{...S.settings,...d.settings,lastBackupAt:S.settings.lastBackupAt||d.settings.lastBackupAt||null}]);
      try{
        for(let i=0;i<ops.length;i+=400){
          const b=db.batch();
          for(const o of ops.slice(i,i+400)){const ref=db.collection(o[1]).doc(o[2]);if(o[0]==="del")b.delete(ref);else b.set(ref,o[3])}
          await b.commit();btn.textContent=`جارِ الاستعادة… ${Math.min(100,Math.round((i+400)/ops.length*100))}%`;
        }
      }catch(e){console.warn(e);btn.disabled=false;btn.textContent="استعادة";m.querySelector("#rErr2").textContent="انقطعت الاستعادة. تحقق من الإنترنت واضغط استعادة مرة ثانية، ما يتكرر شي.";return}
      closeModal();log("add","import",{detail:`استعاد نسخة احتياطية (${cs.length} حساب، ${ts.length} حركة)`});toast("تمت استعادة النسخة");
    });
  });
}

  if(!S.me)return;

  const rm=t.closest("[data-remind]");if(rm){const rc=S.customers.get(rm.dataset.remind);if(rc){log("remind","remind",{customerName:rc.name,customerId:rc.id,amount:balanceOf(rc.id)});rm.classList.remove("wa");rm.textContent="✓ أُرسل"}return}
  const af=t.closest("[data-actf]");if(af){S.actFilter=af.dataset.actf;render();return}

  const bs=t.closest("[data-bizstyle]");if(bs){S.bizDraft={...(S.bizDraft||{}),style:bs.dataset.bizstyle};bs.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===bs));bizRedraw();return}
  const sp=t.closest("[data-set]");if(sp){S.setPage=sp.dataset.set||null;render();window.scrollTo(0,0);return}
  const th=t.closest("[data-theme-set]");if(th){const v=th.dataset.themeSet;try{localStorage.setItem(THEME_KEY,v)}catch(x){}applyTheme(v);render();return}
  const ph=t.closest("[data-ph]");if(ph){const ta=document.getElementById(ph.dataset.for);const s=ta.selectionStart??ta.value.length;ta.value=ta.value.slice(0,s)+"{"+ph.dataset.ph+"}"+ta.value.slice(ta.selectionEnd??s);ta.focus();return}
  const tr=t.closest("[data-tplreset]");if(tr){document.getElementById("tpl-"+tr.dataset.tplreset).value=DEFAULT_TPL[tr.dataset.tplreset];return}
  const ua=t.closest("[data-uact]");if(ua&&isAdmin()){userAction(ua.dataset.uact,ua.dataset.id);return}
  const b=t.closest("[data-act]");if(!b)return;
  const c=S.customers.get(S.selected);
  switch(b.dataset.act){
    case "back":S.selected=null;render();break;
    case "viewpics":{const x=S.txns.get(b.dataset.id);if(x)viewPhotos(x);break}
    case "newcustq":{const nm=($("#hq")||{}).value||"";S.kind="customer";customerForm(null,id=>openCustomer(id));setTimeout(()=>{const i=$("#cName");if(i&&!i.value)i.value=nm.trim()},0);break}
    case "monthrep":monthReport();break;
    case "bizshare":bizExport(true);break;
    case "bizsave":bizExport(false);break;
    case "promise":if(canWrite()&&c)promiseForm(c);break;
    case "gosup":S.view="customers";S.kind="supplier";S.filter="due";S.selected=null;render();window.scrollTo(0,0);break;
    case "quick":if(canWrite())pickCustomer("debt");break;
    case "quickpay":if(canWrite())pickCustomer("pay");break;
    case "scan":if(canWrite())scanStart();break;
    case "newcust":if(canWrite())customerForm(null);break;
    case "debt":if(canWrite())txnForm("debt");break;
    case "pay":if(canWrite())txnForm("pay");break;
    case "editcust":if(canWrite())customerForm(c);break;
    case "statement":showStatement();break;
    case "zero":if(canWrite()&&c){const b0=balanceOf(c.id);if(b0)confirmBox("تصفير الحساب",`سيُسجّل ${b0>0?"دفعة":"دين"} بمبلغ ${fmt(Math.abs(b0))} ${CUR} حتى يصبح رصيد ${c.name} صفراً.`,"تصفير",async()=>{
      const t0={id:uid(),customerId:c.id,type:b0>0?"pay":"debt",amount:Math.abs(b0),note:"تصفير الحساب",date:todayISO(),createdAt:Date.now(),by:S.me.name};await put("txns",t0);log("add",t0.type,{customerName:c.name,amount:t0.amount});toast("تم تصفير الحساب")})}break;
    case "setlimit":if(canWrite())customerForm(c);break;
    case "custpdf":if(c)custPdf(c);break;
    case "listpdf":listPdf();break;
    case "daybackup":if(isAdmin())dailyBackup(false);break;
    case "daybackupdir":if(isAdmin())dailyBackup(true);break;
    case "pastebackup":if(isAdmin())pasteBackup();break;
    case "gobackup":S.view="settings";S.setPage="backup";render();window.scrollTo(0,0);break;
    case "addphone":if(canWrite()&&c)phoneForm(c);break;
    case "logout":signOut("تم تسجيل الخروج.","ok");break;
    case "pwainstall":if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}break;
    case "copylinks":copyText(b.dataset.txt,document.createElement("textarea"));break;
    case "savecats":if(isAdmin()){const list=[...new Set($("#catsTa").value.split("\n").map(x=>x.trim().slice(0,30)).filter(Boolean))].slice(0,60);saveSettings({categories:list}).then(ok=>ok&&toast("تم حفظ الأصناف"))}break;
    case "resetcats":if(isAdmin())$("#catsTa").value=DEFAULT_CATS.join("\n");break;
    case "savetpl":if(isAdmin()){const tp={};for(const k of Object.keys(DEFAULT_TPL))tp[k]=document.getElementById("tpl-"+k).value;saveSettings({templates:tp}).then(ok=>ok&&toast("تم حفظ القوالب"))}break;
    case "edittx":{const x=S.txns.get(b.dataset.id);if(x&&canWrite())txnForm(null,x);break}
    case "deltx":{const x=S.txns.get(b.dataset.id);if(x&&canWrite())confirmBox("حذف الحركة",`حذف ${c&&isSup(c)?(x.type==="debt"?"فاتورة":"دفعة"):(x.type==="debt"?"دين":"تسديد")} بمبلغ ${fmt(x.amount)} ${CUR} بتاريخ ${x.date}؟`,"حذف",()=>{del("txns",x.id);log("delete",x.type==="debt"?"debt":"pay",{customerName:c?c.name:"",amount:x.amount,...(c&&isSup(c)?{sup:true}:{})});
      // Photos are removed only after the undo window closes.
      let undone=false;const tm=setTimeout(()=>{if(!undone)dropPhotos(x.photos)},9000);
      toast("حُذفت الحركة",{label:"تراجع",ms:8000,onClick:()=>{undone=true;clearTimeout(tm);put("txns",x);log("add",x.type==="debt"?"debt":"pay",{customerName:c?c.name:"",amount:x.amount,detail:"تراجع عن الحذف",...(c&&isSup(c)?{sup:true}:{})});toast("رجعت الحركة")}})});break}
    case "delcust":if(canWrite()&&c)confirmBox("حذف الزبون",`سيُحذف ${c.name} وكل حركاته نهائياً. صدّر نسخة احتياطية أولاً إذا كنت تحتاج السجل.`,"حذف نهائي",()=>{
      const gone=txnsOf(c.id),cc={...c};for(const x of gone)del("txns",x.id);del("customers",c.id);log("delete","customer",{customerName:c.name});S.selected=null;render();
      let undone=false;const tm=setTimeout(()=>{if(!undone)for(const x of gone)dropPhotos(x.photos)},9000);
      toast("حُذف الحساب",{label:"تراجع",ms:8000,onClick:()=>{undone=true;clearTimeout(tm);put("customers",cc);for(const x of gone)put("txns",x);log("add","customer",{customerName:cc.name,detail:"تراجع عن الحذف"});openCustomer(cc.id);toast("رجع الحساب وكل حركاته")}})});break;
  }
});
document.addEventListener("input",e=>{if(e.target.dataset&&e.target.dataset.biz){S.bizDraft={...(S.bizDraft||{}),[e.target.dataset.biz]:e.target.value};bizRedraw()}if(e.target.id==="q"){S.q=e.target.value;renderList()}if(e.target.id==="hq"){S.hq=e.target.value;homeSearch(S.hq)}});
/* Laptop shortcuts: Ctrl+Z undoes the last delete (while its «تراجع» is showing) or the last debt/payment saved here;
   + / − open a debt / payment on the open account; / jumps to the search box. Typing in a field keeps its normal keys. */
let lastAdd=null;
function undoLast(){
  const tb=[...document.querySelectorAll(".toast .toast-btn")].find(b=>b.textContent==="تراجع");if(tb){tb.click();return}
  const x=lastAdd&&S.txns.get(lastAdd.id);
  if(!x||Date.now()-lastAdd.at>10*60e3||!canWrite()){toast("ماكو شي تتراجع عنه.");return}
  const c=S.customers.get(x.customerId),sup=c&&isSup(c);
  const what=sup?(x.type==="debt"?"فاتورة الشراء":"الدفعة للمورد"):(x.type==="debt"?"الدين":"التسديد");
  confirmBox("تراجع عن آخر حركة",`حذف ${what} ${fmt(x.amount)} ${CUR}${c?" ("+c.name+")":""} اللي سجلته قبل شوية؟`,"حذف",()=>{
    del("txns",x.id);dropPhotos(x.photos);lastAdd=null;
    log("delete",x.type==="debt"?"debt":"pay",{customerName:c?c.name:"",amount:x.amount,detail:"تراجع (Ctrl+Z)",...(sup?{sup:true}:{})});toast("تم التراجع")},true);
}
document.addEventListener("keydown",e=>{
  if(!S.me||e.defaultPrevented)return;
  const t=e.target,typing=!!(t&&t.matches&&t.matches("input:not([type=checkbox]),textarea,select,[contenteditable]"));
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&e.code==="KeyZ"){if(typing)return;e.preventDefault();if(!$("#modalRoot").innerHTML)undoLast();return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey||$("#modalRoot").innerHTML)return;
  const act=e.key==="+"||e.code==="NumpadAdd"?"debt":e.key==="-"||e.code==="NumpadSubtract"?"pay":"";
  if(act){const b=document.querySelector(`.actions [data-act="${act}"]`);if(b){e.preventDefault();b.click()}return}
  if(e.code==="Slash"||e.key==="/"){const s=$("#hq")||$("#q");if(s){e.preventDefault();s.focus();s.select()}}
});
document.addEventListener("keydown",e=>{if(e.target.id==="hq"&&e.key==="Enter"){const f=document.querySelector("#hsList [data-open]");if(f){e.preventDefault();openCustomer(f.dataset.open)}}});
function homeSearch(q){
  const ul=$("#hsList");if(!ul)return;
  if(!foldAr(q)){ul.hidden=true;ul.innerHTML="";return}
  const per=stats();
  const arr=[...S.customers.values()].map(c=>({c,s:custScore(c,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||per.get(b.c.id).last-per.get(a.c.id).last).slice(0,8);
  ul.hidden=false;
  ul.innerHTML=arr.length?arr.map(({c})=>{const b=per.get(c.id).bal,sup=isSup(c);
    return `<li class="cust-row"><button class="cust" type="button" data-open="${esc(c.id)}"><span class="avatar" aria-hidden="true">${initial(c.name)}</span>
      <span class="meta"><span class="name">${esc(c.name)}</span><span class="sub">${sup?"مورد":"زبون"}${c.phone?" · "+esc(c.phone):""}</span></span>
      <span class="chip ${b>0?"debt":b<0?"paid":"zero"}"><span class="num">${b>0?fmt(b):b<0?"له "+fmt(-b):"مسدد"}</span></span></button>
      ${canWrite()?`<span class="row-q"><button type="button" class="q-pay" data-qpay="${esc(c.id)}" aria-label="${sup?"دفعة للمورد":"تسديد"} ${esc(c.name)}" title="${sup?"دفعة":"تسديد"}">${I.minus}</button><button type="button" class="q-debt" data-qdebt="${esc(c.id)}" aria-label="${sup?"فاتورة":"دين"} ${esc(c.name)}" title="${sup?"فاتورة":"دين"}">${I.plus}</button></span>`:""}</li>`}).join("")
    :`<li class="empty"><b>ما لكيت "${esc(q.trim())}"</b>${canWrite()?`<button class="btn sm primary" type="button" data-act="newcustq" style="margin-top:8px">${I.plus}إضافة زبون بهذا الاسم</button>`:""}</li>`;
}

function userAction(act,id){
  const a=S.accounts.get(id);
  if(act==="create"){accountForm();return}
  if(!a)return;
  if(act==="approve-editor"||act==="approve-viewer"){const role=act==="approve-viewer"?"viewer":"editor";put("accounts",{...a,status:"active",role});log("edit","account",{detail:`فعّل حساب ${a.name} (${ROLE_LABEL[role]})`});toast("تم تفعيل "+a.name)}
  else if(act==="disable"){put("accounts",{...a,status:"disabled"});log("edit","account",{detail:`أوقف حساب ${a.name}`});toast("تم إيقاف الحساب")}
  else if(act==="enable"){put("accounts",{...a,status:"active"});log("edit","account",{detail:`أعاد تفعيل حساب ${a.name}`});toast("تم تفعيل الحساب")}
  else if(act==="delete")confirmBox(a.status==="pending"?"رفض الطلب":"حذف الحساب",`سيُحذف حساب ${a.name} (@${a.username}) ويفقد الوصول للبرنامج. إذا سجّل دخول مرة ثانية يظهر طلبه هنا من جديد.`,"حذف",()=>{del("accounts",a.id);log("delete","account",{detail:`حذف حساب ${a.name}`});toast("تم الحذف")});
}

/* ---------- boot ---------- */
(async()=>{
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase){showError("تعذّر تحميل ملفات البرنامج.");return}
  if(!cfg||!cfg.apiKey||/^PUT/.test(cfg.apiKey)){showError("لم يتم ربط قاعدة البيانات (Firebase) بعد.");return}
  firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();
  try{db.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  if(window.FIREBASE_EMULATOR){auth.useEmulator("http://127.0.0.1:9099",{disableWarnings:true});db.useEmulator("127.0.0.1",8080)}
  try{await db.enablePersistence({synchronizeTabs:true})}catch(e){console.warn("offline cache off",e&&e.code)}
  let profUnsub=null;
  auth.onAuthStateChanged(u=>{
    if(profUnsub){profUnsub();profUnsub=null}
    if(!u){stopData();S.me=null;S.isOwner=false;const f=flash;flash=null;showLogin(f&&f.msg,f&&f.kind);return}
    const uname=(u.email||"").split("@")[0];
    S.isOwner=uname===OWNER_USER&&(u.email||"").endsWith("@"+DOMAIN);
    if(S.isOwner){
      S.me={id:u.uid,name:S.settings.ownerName||(REG&&REG.name)||"المدير",role:"owner",username:OWNER_USER};
      if(REG){const n=REG.name;REG=null;setTimeout(()=>{if(!S.settings.ownerName)saveSettings({ownerName:n})},2500)}
      startData();showApp();return;
    }
    gateCard({sub:"جارِ التحقق من الحساب…",body:`<div class="spinner" aria-hidden="true"></div>`});
    profUnsub=db.collection("users").doc(u.uid).onSnapshot({includeMetadataChanges:true},s=>{
      if(!s.exists){
        if(s.metadata.fromCache)return; // wait for the server before deciding the profile is missing
        const name=(REG&&REG.username===uname&&REG.name)||uname;REG=null;
        db.collection("users").doc(u.uid).set({id:u.uid,name,username:uname,role:"viewer",status:"pending",createdAt:Date.now()})
          .catch(()=>showWaiting("تعذّر إرسال طلبك. تحقق من الإنترنت وسجّل دخول مرة ثانية.","bad"));
        return;
      }
      const p=s.data();
      if(p.status==="pending"){stopData();S.me=null;showWaiting("تم استلام طلبك ✅ بانتظار موافقة المدير. أول ما يفعّل حسابك يفتح البرنامج تلقائياً.","warn");return}
      if(p.status==="disabled"){stopData();S.me=null;showWaiting("تم إيقاف هذا الحساب. راجع المدير.","bad");return}
      const first=!S.me;
      S.me={id:u.uid,name:p.name||uname,role:p.role==="editor"?"editor":"viewer",username:uname};
      startData();if(first||$("#app").hidden)showApp();else render();
    },e=>{console.warn(e);showWaiting("تعذّر قراءة حسابك. تحقق من الإنترنت.","bad")});
  });
})();
