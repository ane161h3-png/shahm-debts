function xlApply(plan,fname){
  const now=Date.now(),FV=firebase.firestore.FieldValue,meta={updatedAt:now,updatedBy:S.me.name},writes=[];
  for(const a of plan.adds){const obj={id:uid(),createdAt:now,by:S.me.name,...a,...meta};S.products.set(obj.id,obj);writes.push(b=>b.set(db.collection("products").doc(obj.id),obj))}
  for(const u of plan.updates){const {__stock,...fields}=u.patch,patch={...fields,...meta};
    // Stock from the file is applied as a difference, so a sale made meanwhile still counts.
    if(__stock!==undefined){if(tracked(u.p))patch.stock=FV.increment(round3(__stock-stockOf(u.p)));else{patch.stock=__stock;patch.track=true}}
    if("price" in fields&&u.p.est){patch.est=FV.delete();fields.est=false}
    S.products.set(u.p.id,{...u.p,...fields,...(__stock!==undefined?{stock:__stock,track:true}:{})});writes.push(b=>b.update(db.collection("products").doc(u.p.id),patch))}
  const a=activityDoc("add","product",{detail:`استيراد Excel (${fname}): ${plan.adds.length} مادة جديدة، ${plan.updates.length} تحدّثت`});
  writes.push(b=>b.set(db.collection("activity").doc(a.id),a));
  for(let i=0;i<writes.length;i+=450){const b=db.batch();writes.slice(i,i+450).forEach(w=>w(b));b.commit().catch(writeFail)}
  closeModal();S.pcat="all";S.pq="";render();
  toast(`انضافت ${plan.adds.length} مادة وتحدّثت ${plan.updates.length}`,3500);
}

/* ---------- clearing items without a barcode ----------
   The owner enters the shop's items by hand, so the ones still without a barcode can go in one step. Items sold by weight stay
   (and the bag items from the weighed list). The deleted items are kept on this device (TRASH_KEY) for three days, so the last
   clear-out can be undone from the items tab. */
const TRASH_KEY="shahm-pos-trash";
const delAble=p=>noCode(p)&&!inWeigh(p);
function trashOf(){try{const t=JSON.parse(localStorage.getItem(TRASH_KEY)||"null");return t&&Array.isArray(t.items)&&t.items.length&&Date.now()-t.at<3*864e5?t:null}catch(e){return null}}
function delNoCode(){
  if(!canItems())return;
  const list=[...S.products.values()].filter(delAble);if(!list.length)return;
  if(!confirm(`تنحذف ${list.length} مادة ما عليها باركود (مواد الوزن تبقى). الفواتير القديمة تبقى مثل ما هي.\n\nمتأكد؟`))return;
  try{localStorage.setItem(TRASH_KEY,JSON.stringify({at:Date.now(),items:list.map(p=>({...p,pic:null}))}))}catch(e){}
  const writes=list.map(p=>b=>b.delete(db.collection("products").doc(p.id)));
  list.filter(p=>p.pic).forEach(p=>writes.push(b=>b.delete(db.collection("itemPhotos").doc(p.id))));
  const a=activityDoc("delete","product",{detail:`حذف ${list.length} مادة بلا باركود`});writes.push(b=>b.set(db.collection("activity").doc(a.id),a));
  for(let i=0;i<writes.length;i+=450){const b=db.batch();writes.slice(i,i+450).forEach(w=>w(b));b.commit().catch(writeFail)}
  list.forEach(p=>S.products.delete(p.id));
  S.pcat="all";render();toast(`انحذفت ${list.length} مادة. إذا غلطت تكدر تسترجعها من فوك القائمة.`,5000);
}
function undoNoCode(){
  const t=trashOf();if(!canItems()||!t)return;
  if(!confirm(`ترجع ${t.items.length} مادة اللي انحذفت؟`))return;
  const back=t.items.filter(p=>!S.products.has(p.id)).map(p=>{const o={...p};delete o.pic;return o});
  const writes=back.map(o=>b=>b.set(db.collection("products").doc(o.id),o));
  const a=activityDoc("add","product",{detail:`رجّع ${back.length} مادة محذوفة`});writes.push(b=>b.set(db.collection("activity").doc(a.id),a));
  for(let i=0;i<writes.length;i+=450){const b=db.batch();writes.slice(i,i+450).forEach(w=>w(b));b.commit().catch(writeFail)}
  back.forEach(o=>S.products.set(o.id,o));
  try{localStorage.removeItem(TRASH_KEY)}catch(e){}
  render();toast(`رجعت ${back.length} مادة`,3000);
}

/* ---------- the shop's items sold by weight ----------
   The owner's own list of what he weighs out (sweets, nuts and seeds, rice, flour, sugar, cheese…), each under its category.
   He types the price per kilo (or per bag for the bag items) and only the rows with a price are added; the others can be added
   later from the same window. They show on the selling screen under «⚖ مواد الوزن». */
const WEIGH_LIST=[
  ["حلويات شرقية",["بقلاوة","زنود الست","برمة","كنافة"]],
  ["كيك وكرواسون",["بخسم (كيك وزن)"]],
  ["شيبس وسناكات",["جبس بطاطا (وزن)","جبس سجى (وزن)","جبس للقلي (غير جاهز)","بوشار"]],
  ["مكسرات وكرزات",["حب شمس","حب مصري","حب كرع أصفر","حب كرع أبيض","حب ركي","فستق عبيد","فستق مقرمش","فستق بيراني","كشمش","زبيب (كشمش أسود)","قيسي","حمص مملح","جوز نركيلا"]],
  ["بهارات وتوابل",["سمسم",["سمسم كيس",1000],"ليمون دزي",["ورق غار كيس",1000]]],
  ["شاي وقهوة",["جاي"]],
  ["رز وطحين وسكر",["تمن","طحين","شكر","نشاء"]],
  ["زيوت وسمن",["دهن بلبل"]],
  ["بقوليات وحبوب",["باقلاء"]],
  ["أجبان وألبان",["حليب (وزن)","لور","كيمر عرب","كيمر بقر"]],
  ["حلويات وشوكولاتة",["جكليت"]],
  ["صلصات ومربيات",["دبس"]]];
function weighListForm(){
  if(!canItems())return;
  const have=new Map([...S.products.values()].map(p=>[foldAr(p.name),p]));
  const rows=WEIGH_LIST.flatMap(([c,xs])=>xs.map(x=>{const [n,bag]=Array.isArray(x)?x:[x,0];return {n,c,bag,p:have.get(foldAr(n))||null}}));
  const fresh=rows.filter(r=>!r.p).length;
  openModal(`<h3>مواد الوزن</h3><p class="hint">اكتب سعر الكيلو لكل مادة تبيعها بالوزن (وسعر الكيس لمواد الكيس). اللي تكتب سعرها بس تنضاف، والباقي تكدر ترجع تضيفها بعدين من هنا. تطلع بشاشة البيع تحت «⚖ مواد الوزن».</p>
    <div id="wlL">${WEIGH_LIST.map(([c])=>`<div class="tile-head">${esc(c)}</div>`+rows.filter(r=>r.c===c).map((r,i)=>`<div class="wl-row"><span><b>${esc(r.n)}</b><small>${r.p?`موجودة · <span class="num">${fmt(r.p.price)}</span> ${isWeighed(r.p)?"للكيلو":""}`:r.bag?"بالكيس":"بالوزن (كيلو)"}</small></span>
      ${r.p?`<span class="chip paid" style="justify-self:start">موجودة</span>`:`<input data-wl="${esc(r.n)}" inputmode="numeric" placeholder="${r.bag?"سعر الكيس":"سعر الكيلو"}" value="${r.bag?fmt(r.bag):""}" aria-label="سعر ${esc(r.n)}">`}</div>`).join("")).join("")}</div>
    <p class="err" id="wlErr"></p>
    <div class="foot"><button class="btn primary" type="button" id="wlGo" disabled>اكتب سعر مادة</button><button class="btn" type="button" data-close>رجوع</button></div>`,m=>{
    const picked=()=>[...m.querySelectorAll("[data-wl]")].map(i=>({r:rows.find(x=>x.n===i.dataset.wl),v:Math.round(parseAmt(i.value))||0})).filter(x=>x.v>0);
    const sync=()=>{const n=picked().length,b=m.querySelector("#wlGo");b.disabled=!n;b.textContent=n?`إضافة ${n} مادة`:"اكتب سعر مادة"};
    m.querySelector("#wlL").addEventListener("input",sync);sync();
    m.querySelector("#wlGo").onclick=()=>{
      const now=Date.now(),meta={updatedAt:now,updatedBy:S.me.name};
      const objs=picked().map(({r,v})=>({id:uid(),createdAt:now,by:S.me.name,name:r.n,price:v,category:r.c,barcode:"",unit:r.bag?"كيس":"كغم",weighed:!r.bag,plu:"",
        wprice:0,cost:0,packs:[],track:false,min:0,expiry:"",offer:null,active:true,src:"weigh",...meta}));
      const writes=objs.map(o=>b=>b.set(db.collection("products").doc(o.id),o));
      const a=activityDoc("add","product",{detail:`أضاف ${objs.length} مادة وزن`});writes.push(b=>b.set(db.collection("activity").doc(a.id),a));
      for(let i=0;i<writes.length;i+=450){const b=db.batch();writes.slice(i,i+450).forEach(w=>w(b));b.commit().catch(writeFail)}
      objs.forEach(o=>S.products.set(o.id,o));
      closeModal();render();toast(`انضافت ${objs.length} مادة${fresh-objs.length>0?`، وباقي ${fresh-objs.length} بدون سعر`:""}`,4000);
    };
  },"wide");
}

/* ---------- ready-made item list ----------
   catalog.json: groups of the items an Iraqi neighbourhood market sells, with estimated prices and no barcodes.
   Added items carry est:true (chip «سعر تقديري») until the owner saves them or imports a price; the owner then scans each item
   once and picks its name (linkCodeForm). An item already on the list (same name) is skipped. */
let CATALOG=null;
async function catalogForm(){
  if(!canItems())return;
  if(!CATALOG){toast("جارِ تحميل القائمة…",1500);try{const r=await fetch("catalog.json",{cache:"no-cache"});if(!r.ok)throw new Error(r.status);CATALOG=await r.json()}catch(e){console.warn(e);toast("تعذّر تحميل القائمة. تحقق من الإنترنت.");return}}
  const have=new Set([...S.products.values()].map(p=>foldAr(p.name)));
  const groups=CATALOG.map((g,i)=>({i,g:g.g,items:g.items,fresh:g.items.filter(x=>!have.has(foldAr(x.n)))}));
  const sel=new Set(groups.filter(g=>g.fresh.length).map(g=>g.i));
  openModal(`<h3>قائمة مواد جاهزة</h3><p class="hint">مواد ماركت عراقي بأسعار تقديرية وبدون باركود. اختار الأقسام اللي تريدها. بعدين امسح باركود كل مادة مرة وحدة واختار اسمها، والأسعار تطلع عليها «سعر تقديري» لحد ما تراجعها.</p>
    <div class="tool-row"><button class="btn sm" type="button" id="ctAll">اختيار الكل</button><button class="btn sm" type="button" id="ctNone">إلغاء الكل</button></div>
    <ul class="ct-list" id="ctL">${groups.map(g=>`<li><label class="check"><input type="checkbox" data-ct="${g.i}"${sel.has(g.i)?" checked":""}${g.fresh.length?"":" disabled"}>
      <span><b>${esc(g.g)}</b> · <span class="num">${g.fresh.length}</span> مادة${g.fresh.length<g.items.length?` (<span class="num">${g.items.length-g.fresh.length}</span> موجودة)`:""}<small>${esc(g.items.slice(0,4).map(x=>x.n).join("، "))}…</small></span></label></li>`).join("")}</ul>
    <div class="foot"><button class="btn primary" type="button" id="ctGo"></button><button class="btn" type="button" data-close>رجوع</button></div>`,m=>{
    const sync=()=>{const n=groups.filter(g=>sel.has(g.i)).reduce((a,g)=>a+g.fresh.length,0),b=m.querySelector("#ctGo");b.textContent=n?`إضافة ${fmt(n)} مادة`:"اختار قسم";b.disabled=!n};
    const all=v=>{m.querySelectorAll("[data-ct]").forEach(c=>{if(c.disabled)return;c.checked=v;if(v)sel.add(Number(c.dataset.ct));else sel.delete(Number(c.dataset.ct))});sync()};
    m.querySelector("#ctL").addEventListener("change",e=>{const c=e.target.closest("[data-ct]");if(!c)return;if(c.checked)sel.add(Number(c.dataset.ct));else sel.delete(Number(c.dataset.ct));sync()});
    m.querySelector("#ctAll").onclick=()=>all(true);m.querySelector("#ctNone").onclick=()=>all(false);
    m.querySelector("#ctGo").onclick=()=>catalogApply(groups.filter(g=>sel.has(g.i)).flatMap(g=>g.fresh));
    sync();
  },"wide");
}
function catalogApply(items){
  if(!canItems()||!items.length)return;
  const now=Date.now(),meta={updatedAt:now,updatedBy:S.me.name},seen=new Set(),objs=[];
  for(const x of items){const k=foldAr(x.n);if(seen.has(k)||!(x.p>=0))continue;seen.add(k);
    objs.push({id:uid(),createdAt:now,by:S.me.name,name:x.n,price:Math.round(x.p),category:x.c||"مشكل",barcode:"",unit:x.w?"كغم":x.u||"حبة",weighed:!!x.w,plu:"",wprice:0,cost:0,
      packs:x.k&&x.k.q>0?[{name:x.k.n||"كارتون",n:x.k.q,price:Math.round(x.k.p)||0,wprice:0,barcode:""}]:[],track:false,min:0,expiry:"",offer:null,active:true,est:true,src:"catalog",...meta})}
  const writes=objs.map(o=>b=>b.set(db.collection("products").doc(o.id),o));
  const a=activityDoc("add","product",{detail:`أضاف ${objs.length} مادة من القائمة الجاهزة`});
  writes.push(b=>b.set(db.collection("activity").doc(a.id),a));
  for(let i=0;i<writes.length;i+=450){const b=db.batch();writes.slice(i,i+450).forEach(w=>w(b));b.commit().catch(writeFail)}
  objs.forEach(o=>S.products.set(o.id,o));
  closeModal();S.pcat="all";S.pq="";render();
  toast(`انضافت ${fmt(objs.length)} مادة. امسح باركود أي مادة واختار اسمها حتى ينربط.`,5000);
}

/* ---------- items from a photo (owner) ----------
   The owner photographs a supplier invoice or a list of goods; the AI service (window.AI_URL, kind "items") reads the items.
   The owner ticks the ones to add, then goes through them one at a time: scan the barcode, type the sale price, save.
   An item the shop already has (the AI's match, the same name, or the scanned barcode) is updated instead of added again.
   The list stays on this device (PLIST_KEY) until it is finished, so closing the window or the app loses nothing. */
const PLIST_KEY="shahm-pos-plist";
let PL=null;
function loadPl(){try{const d=JSON.parse(localStorage.getItem(PLIST_KEY)||"null");PL=d&&Array.isArray(d.items)&&d.items.length?d:null}catch(e){PL=null}}
function savePl(){try{if(PL)localStorage.setItem(PLIST_KEY,JSON.stringify(PL));else localStorage.removeItem(PLIST_KEY)}catch(e){}}
const plLeft=()=>PL?PL.items.filter(x=>x.on&&!x.done&&!x.skip).length:0;
const plBtn=()=>`${I.camera}قائمة من صورة${plLeft()?` <span class="chip warn">باقي <span class="num">${plLeft()}</span></span>`:""}`;
const plPer=x=>x.pack_n>1?x.pack_n:1;
const plCost=x=>x.cost>0?Math.round(x.cost/plPer(x)*100)/100:0;
const plAdd=x=>x.qty>0?round3(x.qty*plPer(x)):0;
const plTarget=x=>x.pid?S.products.get(x.pid)||null:null;
async function shrinkImage(file,max=1568,q=.85){
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}
  catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("bad image"));i.src=URL.createObjectURL(file)})}
  const w=src.width,h=src.height,k=Math.min(1,max/Math.max(w,h));
  const cv=document.createElement("canvas");cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  cv.getContext("2d").drawImage(src,0,0,cv.width,cv.height);
  let url=cv.toDataURL("image/jpeg",q);
  for(let qq=q-.1;url.length>900000&&qq>.3;qq-=.1)url=cv.toDataURL("image/jpeg",qq);
  return {url,data:url.slice(url.indexOf(",")+1),media_type:"image/jpeg"};
}
// The items button: carries on with a list in progress, or reads a new photo.
function plOpen(){
  if(!canItems())return;
  if(!plLeft()){PL=null;savePl();plStart();return}
  openModal(`<h3>قائمة من صورة</h3><p class="hint">عندك قائمة باقي بيها <b class="num">${plLeft()}</b> مادة ما خلصتها.</p>
    <div class="foot"><button class="btn primary" type="button" id="plGo">كمّل القائمة</button><button class="btn" type="button" id="plNew">${I.camera}صورة جديدة</button><button class="btn" type="button" data-close>رجوع</button></div>`,m=>{
    m.querySelector("#plGo").onclick=plReview;
    m.querySelector("#plNew").onclick=()=>{if(!confirm(`تنمسح القائمة الحالية (باقي بيها ${plLeft()} مادة). المواد اللي حفظتها تبقى.`))return;PL=null;savePl();renderProducts();plStart()};
  });
}
function plStart(){
  if(!window.AI_URL){openModal(`<h3>قائمة من صورة</h3><p class="hint">هذي الخاصية بعدها ما مفعّلة. تحتاج ربط خدمة الذكاء الاصطناعي أول مرة.</p><div class="foot"><button class="btn" type="button" data-close>تمام</button></div>`);return}
  openModal(`<h3>قائمة من صورة</h3>
    <p class="hint">صوّر فاتورة المورّد أو ورقة مواد أو حتى الرف. البرنامج يقرا أسماء المواد وكمياتها وسعر شرائها، وبعدين تمر عليها وحدة وحدة: تمسح الباركود وتكتب سعر البيع بس.</p>
    <div id="plBody"><div class="scan-pick">
      <label class="btn primary block">${I.camera}تصوير القائمة<input type="file" accept="image/*" capture="environment" hidden id="plCam"></label>
      <label class="btn block">اختيار صور من المعرض (لحد 4)<input type="file" accept="image/*" multiple hidden id="plGal"></label>
    </div></div>
    <p class="err" id="plErr"></p>
    <div class="foot"><button class="btn" type="button" data-close>إلغاء</button></div>`,m=>{
    const go=async files=>{
      files=[...files].slice(0,4);if(!files.length)return;
      const err=m.querySelector("#plErr");err.textContent="";
      m.querySelector("#plBody").innerHTML=`<div class="scan-wait"><div class="spinner"></div><b>جاري قراءة القائمة…</b><span>ممكن تاخذ لحد دقيقة، لا تسد البرنامج.</span></div>`;
      try{
        const images=[];for(const f of files)images.push(await shrinkImage(f));
        const products=[...S.products.values()].map(p=>({id:p.id,name:p.name}));
        const token=await auth.currentUser.getIdToken();
        const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),150000);
        let r,j;
        try{r=await fetch(window.AI_URL,{method:"POST",signal:ctl.signal,headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({kind:"items",images,products,cats:cats()})});j=await r.json().catch(()=>({}))}
        finally{clearTimeout(tm)}
        if(!r.ok)throw new Error(j.error||"تعذّرت قراءة القائمة.");
        if(!Array.isArray(j.items)||!j.items.length)throw new Error("ما لكيت مواد بالصورة. تأكد إن الصورة واضحة وكاملة.");
        plLoad(j.items);if($("#plBody"))plReview();
      }catch(e){
        console.warn(e);if(!$("#plBody"))return;
        err.textContent=e.name==="AbortError"?"طوّلت القراءة كلش. تأكد من الإنترنت وحاول مرة ثانية.":navigator.onLine===false?"لازم إنترنت حتى تنقرا الصورة.":(e.message||"تعذّرت قراءة القائمة.");
        $("#plBody").innerHTML=`<div class="scan-pick"><button class="btn primary block" type="button" id="plAgain">حاول مرة ثانية</button></div>`;
        $("#plAgain").onclick=()=>{closeModal();plStart()};
      }
    };
    m.querySelector("#plCam").addEventListener("change",e=>go(e.target.files));
    m.querySelector("#plGal").addEventListener("change",e=>go(e.target.files));
  });
}
// Keeps what the service read, matched to the shop's own items: the AI's match first, then the same name.
function plLoad(rows){
  const byName=new Map([...S.products.values()].map(p=>[foldAr(p.name),p.id])),cl=cats(),seen=new Set(),items=[];
  for(const r of rows){const name=String(r.name||"").trim().slice(0,80);if(!name||seen.has(foldAr(name)))continue;seen.add(foldAr(name));
    const pid=r.product_id&&S.products.has(r.product_id)?r.product_id:byName.get(foldAr(name))||"";
    items.push({name,pid,category:cl.includes(r.category)?r.category:"مشكل",qty:Math.max(0,Number(r.qty)||0),pack_n:Math.max(0,Math.round(Number(r.pack_n)||0)),
      cost:Math.max(0,Math.round(Number(r.cost)||0)),weighed:!!r.weighed,unsure:!!r.unsure,on:true,done:false,skip:false})}
  PL={at:Date.now(),items};savePl();renderProducts();
}
function plQtyText(x){
  if(!(x.qty>0))return "";
  const u=x.weighed?"كغم":"حبة";
  return x.pack_n>1?`${qtyText(x.qty)} كارتون × ${x.pack_n} = ${qtyText(plAdd(x))} ${u}`:`${qtyText(x.qty)} ${u}`;
}
function plCostText(x){
  if(!(x.cost>0))return "";
  return x.pack_n>1?`شراء ${fmt(x.cost)} للكارتون (${fmt(plCost(x))} ${x.weighed?"للكيلو":"للحبة"})`:`شراء ${fmt(x.cost)} ${x.weighed?"للكيلو":"للحبة"}`;
}
function plReview(){
  if(!PL)return;
  const st=x=>x.done?`<span class="chip paid">${I.check}انحفظت</span>`:x.skip?`<span class="chip zero">تخطيتها</span>`:"";
  openModal(`<h3>المواد اللي بالصورة</h3><p class="hint">شيل الصح من المادة اللي ما تريدها. بعدين تمر عليها وحدة وحدة: امسح الباركود واكتب سعر البيع.</p>
    <ul class="ct-list" id="plL">${PL.items.map((x,i)=>{const t=plTarget(x);return `<li><label class="check"><input type="checkbox" data-pl="${i}"${x.on&&!x.skip?" checked":""}${x.done?" disabled":""}>
      <span><b>${esc(x.name)}</b> ${st(x)}${t&&!x.made?` <span class="chip warn">موجودة: ${esc(t.name)}</span>`:""}${x.unsure?` <span class="chip warn">غير واضحة</span>`:""}
      <small>${esc([x.category,plQtyText(x),plCostText(x)].filter(Boolean).join(" · "))}</small></span></label></li>`}).join("")}</ul>
    <div class="foot"><button class="btn primary" type="button" id="plGo"></button><button class="btn ghost danger-text" type="button" id="plDrop">${I.trash}مسح القائمة</button><button class="btn" type="button" data-close>رجوع</button></div>`,m=>{
    const sync=()=>{const n=plLeft(),b=m.querySelector("#plGo");b.textContent=n?`ابدأ (${n} مادة)`:"ماكو مواد باقية";b.disabled=!n};
    m.querySelector("#plL").addEventListener("change",e=>{const c=e.target.closest("[data-pl]");if(!c)return;const x=PL.items[Number(c.dataset.pl)];x.on=c.checked;x.skip=false;savePl();sync()});
    m.querySelector("#plGo").onclick=()=>plStep(plNext(-1));
    m.querySelector("#plDrop").onclick=()=>{if(!confirm("تمسح هاي القائمة؟ المواد اللي حفظتها تبقى."))return;PL=null;savePl();closeModal();renderProducts()};
    sync();
  },"wide");
}
const plNext=from=>{if(!PL)return -1;const n=PL.items.length;for(let k=1;k<=n;k++){const i=(from+k+n)%n,x=PL.items[i];if(x.on&&!x.done&&!x.skip)return i}return -1};
// A scanned code that already belongs to another item means it is that item: the step switches to updating it.
function plUseCode(x,code){
  const f=findCode(code);
  if(f&&f.p.id!==x.pid){x.pid=f.p.id;toast(`هذا الباركود على «${f.p.name}»، راح تتحدث هي.`,3500)}
}
function plStep(i){
  if(i<0||!PL||!PL.items[i]){plFinish();return}
  const x=PL.items[i],t=plTarget(x),d=x.draft||{},done=PL.items.filter(y=>y.on&&(y.done||y.skip)).length+1,total=PL.items.filter(y=>y.on).length;
  const weighed=t?isWeighed(t):x.weighed,unit=weighed?"كغم":t?baseUnit(t):"حبة",add=plAdd(x),cl=cats();
  const price=d.price!=null?d.price:t&&t.price>0&&!t.est?fmt(t.price):"";
  openModal(`<h3>مادة <span class="num">${done}</span> من <span class="num">${total}</span></h3>
    ${t?`<p class="banner info">موجودة بالبرنامج: <b>${esc(t.name)}</b>${t.price>0?` بسعر <span class="num">${fmt(t.price)}</span>`:""}${t.barcode?` · باركودها <span class="num">${esc(t.barcode)}</span>`:""}. راح يتحدث سعرها${add?" وكميتها":""}. <a href="#" id="plNotSame">مو هي؟</a></p>`:""}
    <form id="plf" class="field" style="gap:12px" novalidate>
      ${t?"":`<div class="row2"><div class="field"><label for="plName">اسم المادة</label><input id="plName" maxlength="80" value="${esc(d.name!=null?d.name:x.name)}"></div>
        <div class="field"><label for="plCat">الصنف</label><select id="plCat">${(cl.includes(x.category)?cl:[x.category,...cl]).map(c=>`<option${c===(d.cat||x.category)?" selected":""}>${esc(c)}</option>`).join("")}</select></div></div>`}
      ${x.unsure?`<p class="hint">الاسم أو الأرقام ما كانت واضحة بالصورة، تأكد منها.</p>`:""}
      <div class="field"><label for="plCode">الباركود</label><div class="tool-row"><input id="plCode" data-code inputmode="numeric" style="direction:ltr;text-align:right" value="${esc(d.code||"")}" placeholder="${weighed?"ما يحتاج للمواد اللي تنباع بالوزن":"امسحه بالسكانر أو الكاميرا"}" autofocus>${canScan()?`<button class="icon-btn" type="button" id="plScan" aria-label="مسح بالكاميرا">${I.scan}</button>`:""}</div></div>
      <div class="field"><label for="plPrice">${weighed?"سعر بيع الكيلو":"سعر البيع للمفرد"} (${CUR})</label><input id="plPrice" class="big" inputmode="numeric" value="${esc(price)}" placeholder="0">
        <span class="help" id="plHelp"></span></div>
      ${add?`<label class="check"><input type="checkbox" id="plStock"${d.stock===false?"":" checked"}> أضف <span class="num">${qtyText(add)}</span> ${esc(unit)} للمخزن${x.pack_n>1&&!t?` (والكارتون بيه <span class="num">${x.pack_n}</span>)`:""}</label>`:""}
      <p class="err" id="plErr"></p>
      <div class="foot"><button class="btn primary" type="submit">${I.check}حفظ والتالي</button><button class="btn" type="button" id="plSkip">تخطي</button><button class="btn" type="button" id="plList">القائمة</button></div>
    </form>`,m=>{
    const code=m.querySelector("#plCode"),pr=m.querySelector("#plPrice"),help=m.querySelector("#plHelp"),err=m.querySelector("#plErr");
    const cost=plCost(x)||(t&&t.cost>0?Number(t.cost):0);
    const upd=()=>{const v=numVal(pr.value);help.textContent=!cost?"":!(v>0)?`سعر الشراء ${fmt(cost)}`:v<cost?`أقل من سعر الشراء (${fmt(cost)})!`:`الربح ${fmt(v-cost)} (${Math.round((v-cost)/cost*100)}%)`};
    pr.addEventListener("input",upd);upd();
    const draft=()=>{const g=id=>{const e=m.querySelector("#"+id);return e?e.value:undefined},s=m.querySelector("#plStock");
      x.draft={name:g("plName"),cat:g("plCat"),code:normDigits(code.value).trim(),price:pr.value,stock:s?s.checked:undefined}};
    // A USB scanner types the code and presses Enter: take the code and move on to the price.
    code.addEventListener("keydown",e=>{if(e.key!=="Enter")return;e.preventDefault();const v=normDigits(code.value).trim();
      if(v){const before=x.pid;plUseCode(x,v);if(x.pid!==before){draft();plStep(i);return}}pr.focus();pr.select()});
    const sc=m.querySelector("#plScan");
    if(sc)sc.onclick=()=>{draft();savePl();scanBarcode(c=>{x.draft.code=c;plUseCode(x,c);savePl();plStep(i)})};
    const ns=m.querySelector("#plNotSame");
    if(ns)ns.onclick=e=>{e.preventDefault();draft();x.pid="";x.draft.code=t.barcode&&x.draft.code===t.barcode?"":x.draft.code;savePl();plStep(i)};
    m.querySelector("#plSkip").onclick=()=>{x.skip=true;delete x.draft;savePl();plStep(plNext(i))};
    m.querySelector("#plList").onclick=()=>{draft();savePl();plReview()};
    m.querySelector("#plf").addEventListener("submit",e=>{e.preventDefault();err.textContent="";
      const c=normDigits(code.value).trim(),p=Math.round(numVal(pr.value)),s=m.querySelector("#plStock"),addNow=s&&s.checked?add:0;
      if(c){const before=x.pid;plUseCode(x,c);if(x.pid!==before){draft();savePl();plStep(i);return}}
      if(!(p>0)){err.textContent="اكتب سعر البيع.";pr.focus();return}
      let r;
      if(t)r=plUpdate(t,x,c,p,addNow);
      else{const name=m.querySelector("#plName").value.trim(),cat=m.querySelector("#plCat").value;
        if(!name){err.textContent="اكتب اسم المادة.";return}
        const same=[...S.products.values()].find(y=>foldAr(y.name)===foldAr(name));
        if(same){draft();x.pid=same.id;savePl();toast(`أكو مادة بنفس الاسم «${same.name}»، راح تتحدث هي.`,3500);plStep(i);return}
        r=plCreate(x,name,cat,c,p,addNow)}
      if(r&&r.err){err.textContent=r.err;return}
      x.done=true;x.code=c;x.price=p;delete x.draft;savePl();
      toast(t?`تحدثت «${t.name}»`:"انحفظت المادة",1500);plStep(plNext(i));
    });
  });
}
function plCreate(x,name,category,code,price,add){
  const now=Date.now(),cost=plCost(x),weighed=x.weighed,unit=weighed?"كغم":"حبة";
  const packs=!weighed&&x.pack_n>1?[{name:"كارتون",n:x.pack_n,price:price*x.pack_n,wprice:0,barcode:""}]:[];
  const obj={id:uid(),createdAt:now,by:S.me.name,name,price,category,barcode:code,unit,weighed,plu:"",wprice:0,cost,packs,track:add>0,...(add>0?{stock:add}:{}),
    min:0,expiry:"",offer:null,active:true,src:"photo",updatedAt:now,updatedBy:S.me.name};
  S.products.set(obj.id,obj);try{db.collection("products").doc(obj.id).set(obj).catch(writeFail)}catch(e){writeFail(e)}
  x.pid=obj.id;x.made=true;
  log("add","product",{detail:`أضاف المادة ${name} بسعر ${fmt(price)} من صورة قائمة${add>0?`، الكمية ${qtyText(add)}`:""}`});
}
function plUpdate(p,x,code,price,add){
  if(code&&p.barcode&&p.barcode!==code&&!packsOf(p).some(k=>k.barcode===code)&&!confirm(`«${p.name}» عليها باركود ${p.barcode}. تبدله بـ ${code}؟`))return {err:"ما تبدّل الباركود. امسحه من الخانة إذا ما تريد تبدله."};
  const now=Date.now(),patch={price,updatedAt:now,updatedBy:S.me.name},local={price,updatedAt:now,updatedBy:S.me.name,est:false},ch=[];
  if(Number(p.price)!==price)ch.push(`السعر من ${fmt(p.price)} إلى ${fmt(price)}`);
  if(code&&p.barcode!==code&&!packsOf(p).some(k=>k.barcode===code)){patch.barcode=local.barcode=code;ch.push(`الباركود ${code}`)}
  const cost=plCost(x);if(cost>0&&cost!==Number(p.cost)){patch.cost=local.cost=cost;ch.push(`سعر الشراء ${fmt(cost)}`)}
  if(p.est)patch.est=firebase.firestore.FieldValue.delete();
  if(add>0){patch.track=local.track=true;patch.stock=tracked(p)?firebase.firestore.FieldValue.increment(add):add;local.stock=round3((tracked(p)?stockOf(p):0)+add);ch.push(`استلم ${qtyText(add)}`)}
  S.products.set(p.id,{...p,...local});try{db.collection("products").doc(p.id).set(patch,{merge:true}).catch(writeFail)}catch(e){writeFail(e)}
  log("edit","product",{detail:`عدّل ${p.name} من صورة قائمة: ${ch.join("، ")||"بدون تغيير"}`});
}
function plFinish(){
  const its=PL?PL.items.filter(x=>x.on):[],made=its.filter(x=>x.done&&x.made).length,upd=its.filter(x=>x.done&&!x.made).length,sk=its.filter(x=>x.skip).length;
  PL=null;savePl();closeModal();renderProducts();renderHeader();
  toast(`خلصت القائمة: ${[made?`انضافت ${made}`:"",upd?`تحدثت ${upd}`:"",sk?`تخطيت ${sk}`:""].filter(Boolean).join("، ")||"ما تغير شي"}.`,4500);
}

/* «يدير المواد»: the owner picks which editors (accounts approved in the debt book) may manage the items and prices.
   It is saved on the account (users/{uid}.items); the rules let only the owner set it, and only for an editor does it count. */
function itemsPermForm(){
  if(!isAdmin())return;
  openModal(`<h3>صلاحية المواد</h3><p class="hint">المستخدم اللي تشغّله يشوف تبويب «المواد»: يضيف مواد ويعدل الأسعار والصور، ويسوي استلام المواد والجرد. إلغاء الفواتير والخصم والإعدادات تبقى إلك بس، وكل تغيير بالسعر ينسجل باسمه.</p>
    <ul class="rows" id="ipList"><li class="empty"><div class="spinner" aria-hidden="true"></div></li></ul>
    <div class="foot"><button class="btn" type="button" data-close autofocus>إغلاق</button></div>`,m=>{
    const el=m.querySelector("#ipList");let users=[];
    const draw=()=>{const list=users.filter(u=>u.status==="active").sort((a,b)=>(a.role==="editor"?0:1)-(b.role==="editor"?0:1)||(a.name||"").localeCompare(b.name||"","ar"));
      el.innerHTML=list.length?list.map(u=>{const ed=u.role==="editor",on=ed&&u.items===true;
        return `<li class="ip-row"><span class="avatar">${initial(u.name||u.username||"?")}</span><div class="m"><b>${esc(u.name||u.username||"")}</b><small>${ed?(on?"يدير المواد":"بيع بس"):"مشاهد: غيّره لمحرر من دفتر الديون أول"}</small></div>
          ${ed?`<button class="btn sm${on?" primary":""}" type="button" data-ip="${esc(u.id)}" aria-pressed="${on}">${on?"شغّالة":"مطفية"}</button>`:""}</li>`}).join("")
        :`<li class="empty"><b>ماكو مستخدمين بعد</b>الحسابات تنسجل وتنقبل من دفتر الديون.</li>`};
    db.collection("users").get().then(s=>{users=s.docs.map(d=>({...d.data(),id:d.id}));draw()}).catch(e=>{console.warn(e);el.innerHTML=`<li class="empty">تعذّر قراءة المستخدمين. تحقق من الإنترنت.</li>`});
    el.addEventListener("click",e=>{const b=e.target.closest("[data-ip]");if(!b)return;const u=users.find(x=>x.id===b.dataset.ip);if(!u)return;
      const v=!(u.items===true);u.items=v;draw();
      try{db.collection("users").doc(u.id).set({items:v},{merge:true}).catch(writeFail)}catch(x){writeFail(x)}
      log("edit","account",{detail:`${v?"شغّل":"طفّى"} صلاحية المواد لـ ${u.name||u.username}`});toast(v?`${u.name||""} يكدر هسه يدير المواد`:`انشالت صلاحية المواد من ${u.name||""}`)});
  });
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  const g=t.closest("[data-go]");if(g){e.preventDefault();go(g.dataset.go);return}
  if(t.closest("#meBox")){accountMenu();return}
  const add=t.closest("[data-add]");if(add){const p=S.products.get(add.dataset.add);if(p)sellItem(p);return}
  const inc=t.closest("[data-inc]");if(inc){const l=S.cart.find(x=>x.key===inc.dataset.inc);if(l)setQty(l.key,l.qty+1);return}
  const dec=t.closest("[data-dec]");if(dec){const l=S.cart.find(x=>x.key===dec.dataset.dec);if(l)setQty(l.key,l.qty>1?l.qty-1:0);return}
  const ln=t.closest("[data-line]");if(ln){editLine(ln.dataset.line);return}
  const iv=t.closest("[data-inv]");if(iv){switchInvoice(+iv.dataset.inv);return}
  const c=t.closest("[data-cat]");if(c){S.cat=c.dataset.cat;renderChips();renderTiles();return}
  const pc=t.closest("[data-pcat]");if(pc){S.pcat=pc.dataset.pcat;renderProducts();return}
  const pr=t.closest("[data-prod]");if(pr){const p=S.products.get(pr.dataset.prod);if(p)(S.pcat==="todo"&&listTodo(p)?priceForm:productForm)(p);return}
  const sl=t.closest("[data-sale]");if(sl){saleDetail(sl.dataset.sale);return}
  const dy=t.closest("[data-day]");if(dy&&!dy.disabled){S.repDay=dy.dataset.day;renderSales();return}
  const rm=t.closest("[data-rmode]");if(rm){S.repMode=rm.dataset.rmode;renderSales();return}
  const mo=t.closest("[data-month]");if(mo&&!mo.disabled){S.repMonth=mo.dataset.month;renderSales();return}
  const hd=t.closest("[data-hday]");if(hd){S.repMode="day";S.repDay=hd.dataset.hday;go("sales");return}
  if(t.closest('[data-act="homeRefresh"]')){fetchAllStats(true);toast("جارِ تحديث الأرقام…",1500);return}
  const od=t.closest("[data-openday]");if(od){S.repMode="day";S.repDay=od.dataset.openday;renderSales();window.scrollTo(0,0);return}
  const ap=t.closest("[data-apv]");if(ap){decideApproval(ap.dataset.apv,ap.dataset.ok==="1");return}
  const shl=t.closest("[data-shift]");if(shl){const x=(S.shiftLog||[]).find(z=>z.id===shl.dataset.shift);if(x)zModal(x);return}
  const ra=t.closest("[data-rvadd]");if(ra){const p=S.products.get(ra.dataset.rvadd);if(p)recvAdd(p,"",0);return}
  const rd=t.closest("[data-rvdel]");if(rd&&S.rv){const l=rvLine(rd.dataset.rvdel);if(l){S.rv.lines.splice(S.rv.lines.indexOf(l),1);saveRecv();renderRecv()}return}
  const ul=t.closest("[data-rvulink]");if(ul){rvLinkForm(Number(ul.dataset.rvulink));return}
  const un=t.closest("[data-rvunew]");if(un){rvUnkNew(Number(un.dataset.rvunew));return}
  const ud=t.closest("[data-rvudel]");if(ud&&S.rv&&S.rv.unk){S.rv.unk.splice(Number(ud.dataset.rvudel),1);saveRecv();renderRecv();return}
  const rc=t.closest("[data-recv]");if(rc){const x=(S.recvs||[]).find(z=>z.id===rc.dataset.recv);if(x)recvModal(x);return}
  const rs=t.closest("[data-restock]");if(rs){const p=S.products.get(rs.dataset.restock);if(p)restockForm(p);return}

    case "weighlist":weighListForm();break;
    case "delnocode":delNoCode();break;
    case "undonocode":undoNoCode();break;
    case "linkscan":scanBarcode(codeOnItems);break;
    case "plist":plOpen();break;
    case "pricescan":scanBarcode(codeOnItems);break;
    case "hw":hwForm();break;
    case "keys":keysHelp();break;
    case "drawer":openDrawerNoSale();break;
  }
});
// Tapping the dark area above the cart sheet closes it (the ::after overlay sits on body).
document.addEventListener("click",e=>{if(document.body.classList.contains("show-cart")&&e.target===document.body)document.body.classList.remove("show-cart")});
document.addEventListener("submit",e=>{if(e.target.id==="shf"){e.preventDefault();openShift(e.target)}});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){S.q=e.target.value;renderTiles()}
  else if(e.target.id==="pq"){S.pq=e.target.value;renderProducts()}
  else if(e.target.id==="cq"){S.cq=e.target.value;renderCountList()}
  else if(e.target.dataset&&e.target.dataset.count)countInput(e.target);
  else if(e.target.id==="rq"){S.rq=e.target.value;renderRecvSug()}
  else if(e.target.dataset&&(e.target.dataset.rvq||e.target.dataset.rvc))rvInput(e.target);
});
document.addEventListener("change",e=>{
  if(e.target.id==="repDay"&&e.target.value){S.repDay=e.target.value>todayISO()?todayISO():e.target.value;renderSales()}
  else if(e.target.id==="repMonth"&&e.target.value){const ym=monthOf(todayISO());S.repMonth=e.target.value>ym?ym:e.target.value;renderSales()}
  else if(e.target.id==="cAny"){S.cany=e.target.checked;renderCountList()}
  else if(e.target.dataset&&e.target.dataset.rvu)rvUnitChange(e.target);
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  if(e.target.dataset&&e.target.dataset.count){e.preventDefault();const all=[...document.querySelectorAll("[data-count]")],i=all.indexOf(e.target);
    if(all[i+1]){all[i+1].focus();all[i+1].select()}else{const q=$("#cq");if(q)q.focus()}return}
  if(e.target.id!=="cq")return;e.preventDefault();
  const t=normDigits(e.target.value).trim();if(!t)return;
  if(findCode(t)||(scaleCode(t)||{}).p){countCode(t);setTimeout(()=>{const q=$("#cq");if(q)q.focus()},20);return}
  const list=countList();if(list.length===1){const i=$(`[data-count="${CSS.escape(list[0].id)}"]`);if(i){i.focus();i.select()}}
  else if(/^\d{6,}$/.test(t))toast("هذا الباركود مو مسجل على أي مادة.",3000);
});
// Receiving: Enter in the box scans or picks the one match; in a count it moves to the price, and from the price back to the box.
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||S.view!=="recv"||modalOpen())return;
  const d=e.target.dataset||{};
  if(d.rvq){e.preventDefault();const c=$(`[data-rvc="${CSS.escape(d.rvq)}"]`);if(c){c.focus();c.select()}return}
  if(d.rvc){e.preventDefault();const q=$("#rq");if(q)q.focus();return}
  if(e.target.id!=="rq")return;e.preventDefault();
  const t=normDigits(e.target.value).trim();if(!t)return;
  if(/^\d{4,}$/.test(t)){recvCode(t);return}
  const b=document.querySelectorAll("#rvsug [data-rvadd]");if(b.length===1)b[0].click();
});
document.addEventListener("keydown",e=>{
  if(e.target.id!=="pq"||e.key!=="Enter")return;
  const t=normDigits(e.target.value).trim();if(!/^\d{6,}$/.test(t))return;
  e.preventDefault();S.pq="";e.target.value="";renderProducts();codeOnItems(t);
});
document.addEventListener("keydown",e=>{
  if(e.target.id!=="q"||e.key!=="Enter")return;e.preventDefault();
  const v=e.target.value.trim();if(!v)return;
  const t=normDigits(v);const byCode=findCode(t);
  if(byCode){if(sellItem(byCode.p,byCode.pack))toast("انضافت: "+byCode.p.name+(byCode.pack?" ("+byCode.pack.name+")":""),1500)}
  else if(/^\d{6,}$/.test(t)){if(!sellCode(t))return}
  else{const list=filteredProducts(v,S.cat);if(list.length===1)sellItem(list[0]);else return}
  S.q="";e.target.value="";renderTiles();
});

if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ---------- boot ---------- */
(async()=>{
  loadCart();loadCount();loadRecv();loadHw();loadPl();
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase){showError("تعذّر تحميل ملفات البرنامج.");return}
  if(!cfg||!cfg.apiKey||/^PUT/.test(cfg.apiKey)){showError("لم يتم ربط قاعدة البيانات (Firebase) بعد.");return}
  firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();
  try{db.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  if(window.FIREBASE_EMULATOR){auth.useEmulator("http://127.0.0.1:9099",{disableWarnings:true});db.useEmulator("127.0.0.1",8080)}
  try{await db.enablePersistence({synchronizeTabs:true})}catch(e){console.warn("offline cache off",e&&e.code)}
  let profUnsub=null;
  auth.onAuthStateChanged(u=>{
    if(profUnsub){profUnsub();profUnsub=null}
    if(!u){stopData();S.me=null;S.isOwner=false;showLogin();return}
    const uname=(u.email||"").split("@")[0];
    S.isOwner=uname===OWNER_USER&&(u.email||"").endsWith("@"+DOMAIN);
    if(S.isOwner){S.me={id:u.uid,name:S.settings.ownerName||"المدير",role:"owner",username:OWNER_USER};if(!S.homeSeen){S.homeSeen=true;S.view="home"}startData();showApp();return}
    gateCard({sub:"جارِ التحقق من الحساب…",body:`<div class="spinner" aria-hidden="true"></div>`});
    profUnsub=db.collection("users").doc(u.uid).onSnapshot({includeMetadataChanges:true},s=>{
      if(!s.exists){if(s.metadata.fromCache)return;showWaiting("هذا الحساب ما مسجل. سجّل من دفتر الديون أول.","bad");return}
      const p=s.data();
      if(p.status==="pending"){stopData();S.me=null;showWaiting("حسابك بانتظار موافقة المدير.","warn");return}
      if(p.status==="disabled"){stopData();S.me=null;showWaiting("تم إيقاف هذا الحساب. راجع المدير.","bad");return}
      const first=!S.me;
      S.me={id:u.uid,name:p.name||uname,role:p.role==="editor"?"editor":"viewer",username:uname,items:p.role==="editor"&&p.items===true};
      startData();if(first||$("#app").hidden)showApp();else render();
    },e=>{console.warn(e);showWaiting("تعذّر قراءة حسابك. تحقق من الإنترنت.","bad")});
  });
})();
})();
</script>
