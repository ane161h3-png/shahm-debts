# Deploys worker/ (reads ledger photos with AI) to Cloudflare Workers.
# Secrets: CLOUDFLARE_API_TOKEN, and GEMINI_API_KEY (free) or ANTHROPIC_API_KEY (Claude; wins if set).
# Optional DISPATCH_TOKEN: a GitHub token with Actions read/write on this repo, so the worker's cron can start the periodic (5-hour) Telegram report.
# Optional WA_TOKEN + WA_PHONE_ID: Meta WhatsApp Cloud API, for automatic customer messages (README.md, "واتساب التلقائي").
name: AI worker
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/ai-worker.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      WA_TOKEN: ${{ secrets.WA_TOKEN }}
      WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Missing secret CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$GEMINI_API_KEY$ANTHROPIC_API_KEY" ] || { echo "::error::Add GEMINI_API_KEY or ANTHROPIC_API_KEY"; exit 1; }
      - name: Check the Gemini model is available
        if: env.GEMINI_API_KEY != '' && env.ANTHROPIC_API_KEY == ''
        run: |
          GEMINI_API_KEY=$(printf '%s' "$GEMINI_API_KEY" | tr -d '[:space:]"'"'"'')
          echo "Gemini key: ${#GEMINI_API_KEY} characters, starts with ${GEMINI_API_KEY:0:3}"
          curl -s -H "x-goog-api-key: $GEMINI_API_KEY" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" \
            | jq -r 'if .error then "Gemini error: \(.error.status) \(.error.message)" else (.models[].name | select(test("flash"))) end'
      - run: npm ci
      - name: Storage for the shops' cloud backups (made once)
        # Workers KV namespace "shahm-backups", bound as BK. If the Cloudflare token can't manage KV, the worker deploys
        # without it and the app keeps cloud backups off (it says so in Settings), so nothing else breaks.
        run: |
          id=$(npx wrangler kv namespace list 2>/dev/null | jq -r '.[] | select(.title | endswith("shahm-backups")) | .id' | head -n1) || id=""
          if [ -z "$id" ]; then
            npx wrangler kv namespace create shahm-backups >/dev/null 2>&1 || true
            id=$(npx wrangler kv namespace list 2>/dev/null | jq -r '.[] | select(.title | endswith("shahm-backups")) | .id' | head -n1) || id=""
          fi
          if [ -n "$id" ]; then printf '\n[[kv_namespaces]]\nbinding = "BK"\nid = "%s"\n' "$id" >> wrangler.toml; echo "Backups storage: $id"
          else echo "::warning::Could not make the Workers KV storage for cloud backups (the Cloudflare token may need the «Workers KV Storage: Edit» permission). Cloud backups stay off."; fi
      - name: Deploy
        run: npx wrangler deploy
      - name: Store the AI key on the worker
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then printf '%s' "$GEMINI_API_KEY" | tr -d '[:space:]"'"'"'' | npx wrangler secret put GEMINI_API_KEY; fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          else yes | npx wrangler secret delete ANTHROPIC_API_KEY >/dev/null 2>&1 || true; fi
      - name: Make the key for phone notifications (once)
        # The same key must stay for good: a new one would cut off every phone already subscribed. So it is made only if missing.
        run: |
          list=$(npx wrangler secret list --format json) || { echo "::warning::Could not list the worker's secrets, so the notification key was left alone."; exit 0; }
          if printf '%s' "$list" | grep -q '"VAPID_JWK"'; then echo "VAPID_JWK already set"; else
            node -e 'const {generateKeyPairSync}=require("crypto");const k=generateKeyPairSync("ec",{namedCurve:"P-256"}).privateKey.export({format:"jwk"});process.stdout.write(JSON.stringify(k))' | npx wrangler secret put VAPID_JWK
          fi
      - name: Make the key for cloud backups (once)
        # Seals every shop's cloud copy. It must stay for good: a new one would make the older copies unreadable.
        run: |
          list=$(npx wrangler secret list --format json) || { echo "::warning::Could not list the worker's secrets, so the backup key was left alone."; exit 0; }
          if printf '%s' "$list" | grep -q '"BK_SECRET"'; then echo "BK_SECRET already set"; else
            node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("base64"))' | npx wrangler secret put BK_SECRET
          fi
      - name: Store the GitHub token for the periodic report
        run: |
          if [ -n "$DISPATCH_TOKEN" ]; then printf '%s' "$DISPATCH_TOKEN" | tr -d '[:space:]' | npx wrangler secret put GH_DISPATCH_TOKEN
          else echo "::warning::DISPATCH_TOKEN is not set, so the periodic Telegram report will not start."; fi
      - name: Store the WhatsApp keys for automatic messages
        run: |
          if [ -n "$WA_TOKEN" ] && [ -n "$WA_PHONE_ID" ]; then
            printf '%s' "$WA_TOKEN" | tr -d '[:space:]"'"'"'' | npx wrangler secret put WA_TOKEN
            printf '%s' "$WA_PHONE_ID" | tr -dc '0-9' | npx wrangler secret put WA_PHONE_ID
          else echo "::warning::WA_TOKEN / WA_PHONE_ID are not set, so automatic WhatsApp messages stay off (the app falls back to opening WhatsApp)."; fi
