# Builds the two Android apps (Capacitor wrapping web/) as separate APKs with their own package, name and icon:
# - debt book: release app-latest, file shahm-debts.apk
# - cashier (web/pos/): release pos-latest, file shahm-pos.apk
# The website workflow then copies both onto the site: https://shahm-debts.app/dl/shahm-debts.apk and /dl/shahm-pos.apk
# (release files of a private repository can't be downloaded without a GitHub login).
name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: debts
            apk: shahm-debts.apk
            tag: app-latest
            title: ديون الشهم
            assets: assets
          - app: pos
            apk: shahm-pos.apk
            tag: pos-latest
            title: كاشير الشهم
            assets: assets-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Both apps open the live website (server.url), so every update to main reaches the phones without a new APK,
      # exactly like the laptop. The site's service worker keeps the last copy for working offline; if the site cannot
      # be reached and nothing is cached yet, the copy of web/ inside the APK opens instead (server.errorPath).
      # The cashier is its own app: another package id (so both install side by side), name and start page.
      - name: Cashier app settings
        if: matrix.app == 'pos'
        run: |
          echo '{"appId":"com.shahm.pos","appName":"كاشير الشهم","webDir":"web","server":{"url":"https://shahm-debts.app/pos/","errorPath":"pos/index.html"},"android":{"adjustMarginsForEdgeToEdge":"force"}}' > capacitor.config.json
          cat capacitor.config.json
      - name: Create Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --assetPath ${{ matrix.assets }} \
            --iconBackgroundColor '#0e5a3a' --iconBackgroundColorDark '#0e5a3a' \
            --splashBackgroundColor '#f4f2ec' --splashBackgroundColorDark '#0f1512'
          npx cap sync android
      - name: Permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          # Contact picker for customer phone numbers (Android shows one "Contacts" permission prompt). The cashier needs it
          # too: its «فتح دفتر الديون» opens the debt book inside the same app.
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <uses-permission android:name="android.permission.WRITE_CONTACTS" />#' $M
          grep -c CONTACTS $M
          if [ "${{ matrix.app }}" = pos ]; then
            # Camera for scanning barcodes.
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />#' $M
            grep -c CAMERA $M
          fi
      - name: Set version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      # Release build signed with the shop's own key, kept only in the repo secrets (ANDROID_KEYSTORE = the .p12 file in
      # base64, ANDROID_KEYSTORE_PASSWORD). Same key on every build, so a new APK installs over the old one; nobody else
      # can make an APK that installs over it. A copy of the key is on the owner's flash (MAINTENANCE.md, section on keys).
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::Secret ANDROID_KEYSTORE is missing (see MAINTENANCE.md)"; exit 1; fi
          printf %s "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/shahm.p12"
      - name: Build APK
        working-directory: android
        env:
          KEY_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/shahm.p12" -Pandroid.injected.signing.store.password="$KEY_PW" \
            -Pandroid.injected.signing.key.alias=shahm -Pandroid.injected.signing.key.password="$KEY_PW"
      # The same build as an App Bundle (.aab) for Google Play, signed with the same key (Play uses it as the upload key).
      # versionCode is the run number, so every new bundle is accepted as newer.
      - name: Build AAB (Google Play)
        working-directory: android
        env:
          KEY_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/shahm.p12" -Pandroid.injected.signing.store.password="$KEY_PW" \
            -Pandroid.injected.signing.key.alias=shahm -Pandroid.injected.signing.key.password="$KEY_PW"
          cp app/build/outputs/bundle/release/app-release.aab ../${{ matrix.app == 'debts' && 'shahm-debts' || 'shahm-pos' }}.aab
          grep -E "targetSdkVersion|compileSdkVersion" variables.gradle
      - name: Check signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | grep -i "SHA-256"
          cp "$APK" ${{ matrix.apk }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ${{ matrix.tag }} --yes --cleanup-tag || true
          # Only the debt book is marked "latest", so its releases/latest/download link keeps working.
          gh release create ${{ matrix.tag }} ${{ matrix.apk }} ${{ matrix.app == 'debts' && 'shahm-debts' || 'shahm-pos' }}.aab --target "${{ github.sha }}" \
            ${{ matrix.app == 'debts' && '--latest' || '--latest=false' }} \
            --title "${{ matrix.title }} 1.0.${{ github.run_number }}" \
            --notes "ملف .aab للرفع على Google Play. حمّل ${{ matrix.apk }} وثبّته على موبايل الأندرويد. للتحديث ثبّته فوق النسخة القديمة. إذا رفض التنصيب (التطبيق المنصّب من قبل 12 تشرين الأول 2026 موقّع بمفتاح قديم): احذف القديم أولاً ثم ثبّت هذا وسجّل دخول."
      # Put the new APK on the website (its /dl/ folder).
      - name: Publish on the website
        if: matrix.app == 'debts'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both apps build side by side; wait for the cashier's release so one website run carries both files.
          for i in $(seq 1 40); do
            [ "$(gh release view pos-latest --json targetCommitish -q .targetCommitish 2>/dev/null)" = "${{ github.sha }}" ] && break
            sleep 30
          done
          gh workflow run pages.yml --ref main
