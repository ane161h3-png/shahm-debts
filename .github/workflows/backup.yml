# Telegram reports for the debt book:
# - every 2 hours (7 minutes past even UTC hours, started by the Cloudflare worker's cron because GitHub kept skipping its own schedule): what happened in the last 2 hours, what is still pending, plus a backup and a PDF of those transactions if anything changed.
# - every day at 2am Baghdad time (23:00 UTC): full backup, end-of-day summary, and a PDF with all of the previous day's transactions.
# Secrets (Settings > Secrets and variables > Actions): BACKUP_PASSWORD, TELEGRAM_TOKEN, TELEGRAM_CHAT_ID.
name: Daily backup
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "periodic = تقرير الساعتين، daily = النسخة اليومية وملف حركات اليوم"
        type: choice
        options: [daily, periodic]
        default: daily
      scheduled:
        description: "Set by the Cloudflare cron: report the last full 2-hour slot"
        type: boolean
        default: false
concurrency:
  group: telegram-backup
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send backup to Telegram
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode || 'daily' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && !inputs.scheduled }}
        run: node scripts/backup.mjs
      # GitHub pauses scheduled workflows after 60 days without repo activity; re-enabling keeps it running.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/backup.yml/enable" || true
