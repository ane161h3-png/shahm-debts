<style>
/* The owner's panel: the shops that subscribe and the support chat with their owners. Same brand tokens as web/index.html (BRAND.md). */
:root{
  --bg:#f4f2ec; --paper:#ffffff; --paper-2:#f8f6f1; --line:#e3ded3; --ink:#1c2421; --muted:#5e6660;
  --accent:#0e5a3a; --accent-ink:#fff7e8; --accent-soft:#dceee3; --debt:#c2301e; --debt-soft:#fce9e5; --paid:#4a7f12; --paid-soft:#edf5e0; --warn:#a55f00; --warn-soft:#fdf0dc;
  --shadow:0 1px 2px rgba(28,36,33,.06),0 8px 24px rgba(28,36,33,.07); --shadow-fab:0 6px 18px rgba(14,90,58,.35);
  --brand-orange:#f39a1e; --brand-tomato:#e2412b; --brand-leaf:#7bc043; --brand-cream:#fff7e8; --brand-deep:#083b26;
  --f-brand:"Lalezar","Tajawal",sans-serif;
  --f-display:"Tajawal","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Tajawal",Tahoma,"Segoe UI",sans-serif;
  --r:14px; --r-ctl:10px; --r-modal:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --paper:#172019; --paper-2:#1e2921; --line:#2c3830; --ink:#ecf1ec; --muted:#9aa59d;
  --accent:#5fc48c; --accent-ink:#06200f; --accent-soft:#1b3527; --debt:#ff8a78; --debt-soft:#3a1f1b; --paid:#a6d86a; --paid-soft:#243319; --warn:#f5b654; --warn-soft:#3a2c14;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); --shadow-fab:0 6px 18px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --paper:#172019; --paper-2:#1e2921; --line:#2c3830; --ink:#ecf1ec; --muted:#9aa59d;
  --accent:#5fc48c; --accent-ink:#06200f; --accent-soft:#1b3527; --debt:#ff8a78; --debt-soft:#3a1f1b; --paid:#a6d86a; --paid-soft:#243319; --warn:#f5b654; --warn-soft:#3a2c14;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); --shadow-fab:0 6px 18px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl}
button,input,textarea,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance}
.logo{width:44px;height:44px;border-radius:13px;background:var(--brand-cream);color:var(--brand-deep);display:grid;place-items:center;flex:none}
.logo svg{width:74%;height:74%;display:block}
.btn{border:1px solid var(--line);background:var(--paper);padding:9px 14px;border-radius:var(--r-ctl);cursor:pointer;font-family:var(--f-display);font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.sm{padding:6px 11px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.paid{background:var(--paid);border-color:var(--paid);color:var(--paper)}
.btn.debt{background:var(--debt);border-color:var(--debt);color:var(--paper)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger-text{color:var(--debt)}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px}
.chip{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;font-family:var(--f-display);display:inline-flex;align-items:center;gap:4px}
.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.paid{background:var(--paid-soft);color:var(--paid)}
.chip.debt{background:var(--debt-soft);color:var(--debt)}.chip.info{background:var(--accent-soft);color:var(--accent)}.chip.mute{background:var(--paper-2);color:var(--muted);border:1px solid var(--line)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--debt);color:var(--paper);font:700 12px/20px var(--f-display);text-align:center;display:inline-block}
.banner{border-radius:12px;padding:10px 14px;font-size:14px}
.banner.bad{background:var(--debt-soft);color:var(--debt)}.banner.info{background:var(--accent-soft);color:var(--accent)}.banner.warn{background:var(--warn-soft);color:var(--warn)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field input,.field select,.field textarea,.search{border:1px solid var(--line);border-radius:var(--r-ctl);padding:10px 12px;background:var(--paper);min-height:44px}
.field input:focus,.field select:focus,.field textarea:focus,.search:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.help,.ro-note{color:var(--muted);font-size:13px}
.err{color:var(--debt);font-size:14px;margin:0;min-height:1em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 12px;cursor:pointer;font:600 14px var(--f-display);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gate-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.hero{display:flex;align-items:center;gap:14px;padding:18px;border-radius:22px;color:var(--brand-cream);background:linear-gradient(110deg,color-mix(in srgb,var(--brand-orange) 28%,var(--brand-deep)),var(--brand-deep) 70%);box-shadow:var(--shadow)}
.hero .logo{width:56px;height:56px;border-radius:16px}
.hero b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800}
.hero span{font-size:14px;opacity:.85}
.box{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}

/* app */
.top{position:sticky;top:0;z-index:20;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.top-in{max-width:1240px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.top h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.2}
.top small{display:block;opacity:.8;font-size:12.5px}
.top .grow{flex:1;min-width:0}
.ib{border:0;background:transparent;color:inherit;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer;position:relative}
.ib:hover{background:rgba(255,255,255,.12)}.ib svg{width:22px;height:22px}
.ib .badge{position:absolute;top:2px;inset-inline-end:0}
.tabs{max-width:1240px;margin:auto;display:flex;gap:4px;padding:0 12px}
.tabs button{border:0;background:none;color:inherit;opacity:.78;padding:10px 14px;font:700 15px var(--f-display);cursor:pointer;border-bottom:3px solid transparent;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-current="page"]{opacity:1;border-bottom-color:var(--brand-orange)}
main{max-width:1240px;margin:auto;padding:16px 16px 40px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);border-inline-start:4px solid var(--c,var(--accent))}
.stat:hover{border-color:var(--c,var(--accent))}
.stat[aria-pressed="true"]{outline:2px solid var(--c,var(--accent));outline-offset:-1px}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.1;color:var(--c,var(--ink))}
.stat .l{color:var(--muted);font-size:13.5px;font-weight:600}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools .search{flex:1 1 240px;min-width:0}
.tools select{border:1px solid var(--line);border-radius:var(--r-ctl);padding:9px 10px;background:var(--paper);min-height:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;animation:cin .25s ease both}
@keyframes cin{from{opacity:0;transform:translateY(6px)}}
.card.st-pending{border-top:4px solid var(--warn)}.card.st-active{border-top:4px solid var(--paid)}.card.st-trial{border-top:4px solid var(--brand-orange)}
.card.st-expired,.card.st-disabled{border-top:4px solid var(--debt)}
.card-h{display:flex;gap:10px;align-items:flex-start}
.av{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:400 22px var(--f-brand);flex:none}
.card-h .nm{flex:1;min-width:0}
.card-h b{display:block;font-family:var(--f-display);font-size:17px;font-weight:800;overflow-wrap:anywhere;line-height:1.3}
.card-h .who{color:var(--muted);font-size:13.5px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:13.5px}
.facts div{display:flex;flex-direction:column;min-width:0}
.facts span{color:var(--muted);font-size:12px}
.facts b{font-weight:600;overflow-wrap:anywhere}
.left{font-family:var(--f-display);font-weight:800}
.left.soon{color:var(--warn)}.left.end{color:var(--debt)}.left.ok{color:var(--paid)}
.bar{height:6px;background:var(--paper-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--paid);border-radius:99px;transition:width .4s}
.bar i.soon{background:var(--warn)}.bar i.end{background:var(--debt)}
.acts{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.cb{position:relative;width:38px;height:38px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.cb:hover{border-color:var(--accent)}.cb svg{width:20px;height:20px}.cb .badge{position:absolute;top:-8px;inset-inline-start:-8px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:var(--paper);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;margin-bottom:4px}
.threads{display:flex;flex-direction:column;gap:8px;max-width:780px}
.thr{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:start;width:100%}
.thr:hover{border-color:var(--accent)}
.thr .grow{flex:1;min-width:0}.thr b{font-family:var(--f-display);font-size:16px}
.thr .last{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thr.unread .last{color:var(--ink);font-weight:600}
.thr time{font-size:12px;color:var(--muted);white-space:nowrap}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;max-width:780px;margin-bottom:12px}
.panel h2{margin:0;font-family:var(--f-display);font-size:18px}
.panel p{margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:10px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--paper);border-radius:var(--r-modal);width:100%;max-width:480px;box-shadow:0 20px 50px rgba(0,0,0,.3);padding:18px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 20px);overflow:auto;animation:pop .2s ease}
.modal.wide{max-width:680px}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.modal h3{margin:0;font-family:var(--f-display);font-size:19px}
.modal .hint{margin:-4px 0 0;color:var(--muted);font-size:13.5px}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.hist{width:100%;border-collapse:collapse;font-size:13.5px}
.hist th,.hist td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.hist th{color:var(--muted);font-weight:600;font-size:12.5px}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.dl div{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.dl span{color:var(--muted);font-size:12px}.dl b{font-weight:700;overflow-wrap:anywhere}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:99;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);animation:fade .2s}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--brand-leaf);display:inline-block;margin-inline-end:4px;box-shadow:0 0 0 3px rgba(123,192,67,.25)}
.live-dot.off{background:var(--muted);box-shadow:none}
@media (max-width:760px){
  .stats{grid-template-columns:1fr 1fr}
  .stat .v{font-size:24px}
  .grid{grid-template-columns:1fr}
  .tabs button{padding:10px 10px;font-size:14px}
  .top h1{font-size:17px}
  .chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}.chips.scroll button{flex:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
"use strict";
/* The owner's panel. It opens only for the uid in settings/owner (as firestore.rules decide); anyone else is signed out.
   The real guard is the rules: only that owner can list shops/ or change a shop's state, and nobody here can read a shop's
   own book (its customers, debts or sales), which the rules keep closed to this owner too.
   Reads: one live listener on shops/ (one read per shop, then only what changes), meta/trial and settings/main.
   The support chat is in Cloudflare D1 through the worker (../support.js), so it costs no Firestore reads. */
const DOMAIN="shahm-debts.app",OWNER_USER="admin";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round(Number(n)||0).toLocaleString("en-US");
const normDigits=s=>String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
const parseAmt=s=>{const n=Number(normDigits(s).replace(/[,،\s]/g,""));return isFinite(n)?n:NaN};
const dmy=ms=>{const d=new Date(ms);return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`};
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const ago=ms=>{if(!ms)return "";const s=(Date.now()-ms)/1000;if(s<60)return "هسه";if(s<3600)return `قبل ${Math.floor(s/60)} دقيقة`;if(s<86400)return `قبل ${Math.floor(s/3600)} ساعة`;
  const d=Math.floor(s/86400);return d===1?"البارحة":d<30?`قبل ${d} يوم`:dmy(ms)};
const clock=ms=>new Date(ms).toLocaleTimeString("ar-IQ",{hour:"numeric",minute:"2-digit",numberingSystem:"latn"});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const markLetter=n=>{const w=String(n||"").trim().split(/\s+/).filter(x=>x&&!/^(ماركت|سوبرماركت|محل|محلات|أسواق|اسواق|مخزن|مول|بقالة|متجر)$/.test(x));
  return (w[0]||"م").replace(/^ال(?=..)/,"").charAt(0)||"م"};
const phoneId=v=>{let d=normDigits(v).replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(/^964\d{10}$/.test(d))d="0"+d.slice(3);if(/^7\d{9}$/.test(d))d="0"+d;return d};

function gate(msg,bad){

    <div class="hero"><div class="logo" aria-hidden="true">${MARK}</div><div><b>لوحة المالك</b><span>إدارة المحلات المشتركة والدعم الفني</span></div></div>

  $("#lf").addEventListener("submit",async e=>{e.preventDefault();const id=$("#lUser").value.trim(),pw=$("#lPw").value,er=$("#lErr"),b=$("#lGo");
    if(!id||!pw){er.textContent="اكتب اسم المستخدم وكلمة المرور.";return}

}
async function aliasOf(id){try{const s=await db.doc("logins/"+id).get();return s.exists&&s.data().email||""}catch(e){return ""}}
async function signInAny(id,pw){
  if(id.includes("@"))return auth.signInWithEmailAndPassword(id,pw);
  if(looksPhone(id))id=phoneId(id);
  const moved=/^\d{10,15}$/.test(id)?await aliasOf(id):"";
  if(moved){try{return await auth.signInWithEmailAndPassword(moved,pw)}catch(e){if(!/invalid-credential|user-not-found|wrong-password|invalid-login/.test(e.code||""))throw e}}
  return auth.signInWithEmailAndPassword(id+"@"+DOMAIN,pw);
}
/* Who may open the panel (isAdmin in firestore.rules): the panel's own account (settings/owner.admin) once the owner made
   one in the debt book (Settings > لوحة المالك); until then the owner (settings/owner.uid, or the original admin@ login).
   "moved": the owner's own account after the panel got its own. */
async function isOwner(u){
  try{const s=await db.doc("settings/owner").get({source:"server"}),o=s.exists?s.data():{};
    if(o.admin){S.root=false;return o.admin===u.uid?true:o.uid===u.uid?"moved":false}
    S.root=true;
    if(o.uid)return o.uid===u.uid;
    return u.email===OWNER_USER+"@"+DOMAIN}
  catch(e){if(e&&e.code==="permission-denied")return false;throw e}
}

function start(){

  unsubs.push(db.collection("shops").onSnapshot(s=>{S.shops=new Map(s.docs.map(d=>[d.id,{...d.data(),id:d.id}]));render();tick()},fail));
  unsubs.push(db.doc("meta/trial").onSnapshot(s=>{S.trialDays=s.exists?Number(s.data().days)||0:0;if(S.tab==="settings")render()},()=>{}));
  if(S.root)db.doc("settings/main").get().then(s=>{S.settings=s.exists?s.data():{};if(!Object.keys(S.prices).length)S.prices=S.settings.subPrices||{}},()=>{});
  db.doc("meta/prices").get().then(s=>{if(s.exists&&s.data().p)S.prices=s.data().p},()=>{});
  ShahmSupport.init({base:window.AI_URL,token:()=>auth.currentUser.getIdToken(),side:"admin",push:true});
  loadThreads();
  stopLive=ShahmSupport.liveAll(ev=>{
    if(ev.t==="open"){S.liveOn=true;if(stopLive)loadThreads();drawBell();return}
    if(ev.thread){const was=S.threads.get(ev.shop);S.threads.set(ev.shop,ev.thread);
      if(ev.msg&&ev.msg.side==="shop"&&!(ShahmSupport.isOpen()&&openChatId===ev.shop)){const x=S.shops.get(ev.shop);toast(`💬 رسالة من ${(x&&x.name)||ev.thread.name||"محل"}`);ding()}
      if(!was||was.ua!==ev.thread.ua||was.status!==ev.thread.status||ev.msg)render()}
  });
  drawBell();
}

function denied(){stop();auth.signOut().catch(()=>{});gate("ما عندك صلاحية تفتح لوحة المالك. سجّلنا خروجك.",true)}
function stop(){while(unsubs.length)try{unsubs.pop()()}catch(e){}if(stopLive){stopLive();stopLive=null}ShahmSupport.isOpen&&ShahmSupport.close();S.shops=new Map();S.threads=new Map()}
// A subscription ending moves its card without a reload.
function tick(){clearTimeout(tick.t);const next=[...S.shops.values()].map(x=>x.status==="active"&&x.until||0).filter(u=>u>Date.now()).sort((a,b)=>a-b)[0];
  if(next&&next-Date.now()<20*864e5)tick.t=setTimeout(()=>{render();tick()},next-Date.now()+1000)}

    return `<button type="button" class="thr ${u?"unread":""}" data-chat="${esc(t.shop)}"><span class="av" aria-hidden="true">${esc(markLetter(x.name||t.name))}</span>
      <div class="grow"><b>${esc(x.name||t.name||"محل")}</b> ${t.status==="solved"?`<span class="chip paid">محلولة</span>`:""}<div class="last">${t.last_from==="admin"?"أنت: ":""}${esc(t.last_text||"")}</div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><time>${esc(ago(t.last_at))}</time>${u?`<span class="badge num">${u}</span>`:""}</div></button>`}).join("")}</div>`;
}
function settingsView(){
  const td=S.trialDays||0,opts=[0,7,15,30];
  return `<section class="panel"><h2>الفترة التجريبية المجانية</h2>
      <p class="ro-note">المحل الجديد ينفتح وحده بعد ما يسجّل، لهذي المدة، وبنهايتها ينقفل لحد ما يدفع. «بدون» = ينتظر موافقتك.</p>
      <div class="chips" role="group" aria-label="أيام التجربة">${opts.map(n=>`<button type="button" data-trial="${n}" aria-pressed="${td===n}">${n?n+" يوم":"بدون"}</button>`).join("")}</div>
      <form class="row" id="trialF" novalidate><div class="field" style="flex:0 1 160px"><label for="trialN">عدد أيام آخر</label><input id="trialN" inputmode="numeric" maxlength="2" placeholder="0 - 90" value="${opts.includes(td)?"":td}"></div>
        <button class="btn" type="submit" style="align-self:flex-end">حفظ</button></form>
      <p class="ro-note">هسه: <b>${td?td+" يوم تجربة":"بدون تجربة"}</b>.</p></section>
    <section class="panel"><h2>إشعارات الرسائل</h2>
      <p class="ro-note">لما يكتب صاحب محل، توصلك رسالة على بوت Telegram (نفس بوت النسخ الاحتياطي)، وإشعار على هذا الجهاز إذا فعّلته.</p>
      <div class="row">${ShahmSupport.pushOk()?(ShahmSupport.pushIsOn()?`<span class="chip paid">مفعّل على هذا الجهاز</span><button class="btn sm" type="button" data-push="off">إيقاف</button>`:`<button class="btn primary sm" type="button" data-push="on">${I.bell} تفعيل على هذا الجهاز</button>`):`<span class="ro-note">هذا المتصفح ما يدعم الإشعارات.</span>`}</div></section>
    <section class="panel"><h2>الحساب</h2>
      <p class="ro-note">${S.root?"اللوحة تفتح بحسابك الرئيسي (نفس حساب دفتر الشهم). تگدر تسوّيلها حساب منفصل برقم ورمز خاصين من تطبيق الديون › الإعدادات › «لوحة المالك».":"اللوحة تفتح بحسابها المنفصل. الحساب يتغير من تطبيق الديون › الإعدادات › «لوحة المالك» (حساب لوحة جديد)."}</p>
      <form id="pwF" class="row" novalidate style="align-items:flex-end">
        <div class="field" style="flex:1 1 170px"><label for="pwCur">الرمز الحالي</label><input id="pwCur" type="password" autocomplete="current-password"></div>
        <div class="field" style="flex:1 1 170px"><label for="pwNew">الرمز الجديد</label><input id="pwNew" type="password" autocomplete="new-password" placeholder="8 أحرف على الأقل"></div>
        <button class="btn" type="submit">تغيير الرمز</button></form><p class="err" id="pwErr"></p></section>
    <section class="panel"><h2>تثبيت اللوحة</h2><p class="ro-note">من Chrome: القائمة ⋮ › «إضافة إلى الشاشة الرئيسية». ومن iPhone: زر المشاركة › «إضافة إلى الشاشة الرئيسية». تنفتح كتطبيق مستقل عن الدفتر والكاشير.</p></section>
    <section class="panel"><h2>الخصوصية</h2><p class="ro-note">هذي اللوحة تشوف حالة المحل واشتراكه ورسائل الدعم بس. ديون المحلات ومبيعاتهم ما تنقرا من هنا، وقواعد قاعدة البيانات تمنعها.</p></section>`;
}
function drawBell(){const on=ShahmSupport.pushIsOn();$("#bellBtn").innerHTML=on?I.bell:I.bellOff;$("#bellBtn").title=on?"الإشعارات مفعّلة على هذا الجهاز":"فعّل إشعارات الرسائل";}

/* ---------- actions ---------- */
let openChatId=null;
function openChat(id){
  const x=S.shops.get(id)||{},t=S.threads.get(id);openChatId=id;
  ShahmSupport.open(id,{title:x.name||(t&&t.name)||"محل",sub:x.ownerName||"",onThread:th=>{S.threads.set(id,th);render()},onClose:()=>{openChatId=null;if(location.hash)history.replaceState(null,"",location.pathname)}});
}
function setShop(id,patch,done,detail){db.doc("shops/"+id).update(patch).then(()=>{if(done)toast(done);if(detail)log(detail)},writeFail)}
function act(a,id){
  const x=S.shops.get(id);if(!x)return;
  if(a==="chat")return openChat(id);
  if(a==="info")return info(id);
  if(a==="sub")return subForm(id);
  if(a==="reject")return confirmBox("رفض المحل",`ينحذف طلب «${x.name}». إذا صاحبه دخل بعدين يگدر يسجّل من جديد. ما كو بيانات تنحذف غير الطلب.`,"رفض",()=>db.doc("shops/"+id).delete().then(()=>{toast("انرفض الطلب");log(`رفض طلب محل ${x.name}`)},writeFail));
  if(a==="disable")return confirmBox("إيقاف المحل",`محل «${x.name}» وعماله ما يگدرون يفتحون الدفتر${x.pos?" والكاشير":""} لحد ما ترجّعه. بياناتهم ما تنحذف.`,"إيقاف",()=>setShop(id,{status:"disabled"},"انوقف المحل",`أوقف محل ${x.name}`));
  if(a==="enable"){const end=x.until&&x.until<=Date.now();
    return confirmBox("إرجاع المحل",end?`اشتراك «${x.name}» منتهي من ${dmy(x.until)}. يرجع شغّال بس يبقى مقفول لحد ما تجدّد له.`:`محل «${x.name}» يرجع يفتح دفتره${x.until?` لحد ${dmy(x.until)}`:""}.`,"إرجاع",()=>setShop(id,{status:"active",activatedAt:x.activatedAt||Date.now()},"رجع المحل شغّال",`رجّع محل ${x.name}`),"paid")}
  if(a==="pos"){
    if(x.pos)return confirmBox("إطفاء الكاشير",`كاشير «${x.name}» ينقفل ودفتر ديونه يبقى شغّال. مواده ومبيعاته ما تنحذف.`,"إطفاء",()=>setShop(id,{pos:false},"انطفى الكاشير",`أوقف كاشير محل ${x.name}`));
    return setShop(id,{pos:true},`انفتح الكاشير لـ ${x.name}`,`شغّل كاشير محل ${x.name}`);
  }
}
function subForm(id){
  const x=S.shops.get(id);if(!x)return;
  const prices=S.prices||{},s=state(x),tDays=S.trialDays||15;
  const base=Math.max(Date.now(),x.until&&x.status==="active"&&!x.trial?x.until:0);
  openModal(`<h3>${s==="pending"?"موافقة وتفعيل":"تجديد الاشتراك"}: ${esc(x.name)}</h3>
    <p class="hint">${s==="pending"?"اختار المدة اللي دفع عليها، وينفتح دفتره هسه.":x.trial&&x.status==="active"?`بالتجربة لحد ${dmy(x.until)}. الاشتراك المدفوع يبدأ من اليوم.`:x.until&&x.status==="active"&&!expired(x)?`ينتهي حالياً ${dmy(x.until)}. التمديد يبدأ من نهايته.`:"يبدأ من اليوم."}</p>
    <form id="subF" class="field" style="gap:12px" novalidate>
      <div class="chips" role="group" aria-label="المدة">${PLANS.map(([k,l])=>`<button type="button" data-plan="${k}" aria-pressed="${k==="1"}">${k==="trial"?`تجربة ${tDays} يوم`:l}</button>`).join("")}</div>
      <div class="field" id="dF" hidden><label for="dV">ينتهي بتاريخ</label><input id="dV" type="date" min="${todayISO()}"></div>
      <div class="field" id="aF"><label for="aV">المبلغ المدفوع (اختياري)</label><input id="aV" inputmode="numeric" dir="ltr" style="text-align:right" placeholder="مثال: 25,000" value="${prices["1"]?fmt(prices["1"]):""}"></div>
      <div class="field"><label for="nV">ملاحظة (اختياري)</label><input id="nV" maxlength="200" placeholder="مثال: دفع كاش، خصم أول شهر…"></div>
      <p id="toV" class="banner info" style="margin:0"></p><p class="err" id="sErr"></p>
      <div class="foot"><button class="btn primary" type="submit">${s==="pending"?"موافقة وتفعيل":"حفظ التجديد"}</button><button class="btn" type="button" data-close>إلغاء</button></div>
    </form>`,m=>{
    let plan="1";
    const to=()=>{if(plan==="none")return null;if(plan==="trial")return Math.max(Date.now(),x.until||0)+tDays*864e5;
      if(plan==="date"){const v=m.querySelector("#dV").value;if(!v)return undefined;const [y,mo,d]=v.split("-").map(Number);return new Date(y,mo-1,d,23,59,59).getTime()}
      return addMonths(base,PLANS.find(p=>p[0]===plan)[2])};
    const show=()=>{const t=to();m.querySelector("#toV").innerHTML=t===null?"تفعيل دائمي بدون تاريخ انتهاء.":t?`ينفتح لحد <b class="num">${dmy(t)}</b> (<span class="num">${Math.ceil((t-Date.now())/864e5)}</span> يوم).`:"اختار التاريخ."};
    m.querySelectorAll("[data-plan]").forEach(b=>b.addEventListener("click",()=>{plan=b.dataset.plan;m.querySelectorAll("[data-plan]").forEach(o=>o.setAttribute("aria-pressed",o===b));
      m.querySelector("#dF").hidden=plan!=="date";m.querySelector("#aF").hidden=plan==="trial";const pr=prices[plan];m.querySelector("#aV").value=pr?fmt(pr):"";show()}));
    m.querySelector("#dV").addEventListener("input",show);show();
    m.querySelector("#subF").addEventListener("submit",e=>{e.preventDefault();const t=to(),err=m.querySelector("#sErr");
      if(t===undefined){err.textContent="اختار تاريخ الانتهاء.";return}if(t&&t<=Date.now()){err.textContent="التاريخ لازم يكون بعد اليوم.";return}
      const av=m.querySelector("#aV").value.trim(),amount=plan==="trial"||!av?0:parseAmt(av);if(av&&plan!=="trial"&&!(amount>0)){err.textContent="المبلغ لازم يكون رقم.";return}
      const note=m.querySelector("#nV").value.trim().slice(0,200);
      const label=plan==="trial"?`تجربة ${tDays} يوم`:PLANS.find(p=>p[0]===plan)[1];
      const entry={at:Date.now(),plan,label,from:t?(plan==="trial"?Math.max(Date.now(),x.until||0):base):Date.now(),to:t,amount:Math.round(amount||0),by:ownerName(),...(note?{note}:{})};
      db.doc("shops/"+id).update({status:"active",activatedAt:x.activatedAt||Date.now(),until:t,trial:plan==="trial",subs:firebase.firestore.FieldValue.arrayUnion(entry)})
        .then(()=>{toast(t?`انفعّل ${x.name} لحد ${dmy(t)}`:`انفعّل ${x.name} تفعيل دائمي`);log(`اشتراك محل ${x.name}: ${label}${t?" إلى "+dmy(t):""}${amount?" بمبلغ "+fmt(amount):""}${note?" ("+note+")":""}`)},writeFail);
      if(amount>0&&!["date","trial"].includes(plan)&&prices[plan]!==Math.round(amount)){S.prices={...prices,[plan]:Math.round(amount)};db.doc("meta/prices").set({p:S.prices,at:Date.now()}).catch(()=>{})}
      closeModal()});
  });
}
function info(id){
  const x=S.shops.get(id);if(!x)return;const s=state(x),[lbl,cls]=ST[s],subs=(x.subs||[]).slice().reverse(),paid=subs.reduce((a,v)=>a+(Number(v.amount)||0),0),t=S.threads.get(id),wa=waNum(x.phone||x.username);
  openModal(`<div class="row" style="justify-content:space-between"><h3>${esc(x.name)}</h3><span class="chip ${cls}">${lbl}</span></div>
    <div class="dl">
      <div><span>صاحب المحل</span><b>${esc(x.ownerName||"—")}</b></div>
      <div><span>الرقم</span><b class="num">${esc(x.phone||"—")}</b></div>
      <div><span>اسم الدخول</span><b class="num">${esc(x.username||"—")}</b></div>
      <div><span>تاريخ التسجيل</span><b class="num">${x.createdAt?dmy(x.createdAt):"—"}</b></div>
      <div><span>أول تفعيل</span><b class="num">${x.activatedAt?dmy(x.activatedAt):"—"}</b></div>
      <div><span>${x.trial?"التجربة":"الاشتراك"}</span>${s==="pending"?"<b>—</b>":x.until?`<b><span class="num">${dmy(x.until)}</span> · ${leftHtml(x)}</b>`:"<b>دائمي</b>"}</div>
      <div><span>الموظفين</span><b>${x.staff==null?`<span class="ro-note">يظهر بعد ما يفتح صاحب المحل دفتره</span>`:`<span class="num">${x.staff}</span> ${x.staff===1?"موظف":"موظفين"}`}</b></div>
      <div><span>الكاشير</span><b>${x.pos?"مفعّل":"مطفّى"}</b></div>
      <div><span>مجموع المدفوع</span><b class="num">${paid?fmt(paid):"—"}</b></div>
      <div><span>الدعم الفني</span><b>${t&&t.n?`<span class="num">${t.n}</span> رسالة · ${t.status==="solved"?"محلولة":"مفتوحة"}`:"ما كو رسائل"}</b></div>
    </div>
    <h3 style="font-size:16px;margin-top:4px">سجل التجديدات</h3>
    ${subs.length?`<div style="overflow-x:auto"><table class="hist"><thead><tr><th>متى</th><th>المدة</th><th>لحد</th><th>المبلغ</th><th>ملاحظة</th></tr></thead><tbody>
      ${subs.map(v=>`<tr><td><span class="num">${dmy(v.at)}</span></td><td>${esc(v.label||"")}</td><td>${v.to?`<span class="num">${dmy(v.to)}</span>`:"دائمي"}</td><td><span class="num">${v.amount?fmt(v.amount):"—"}</span></td><td>${esc(v.note||"")}</td></tr>`).join("")}</tbody></table></div>`:`<p class="ro-note" style="margin:0">ما كو تجديدات بعد.</p>`}
    <div class="foot" style="border-top:1px solid var(--line);padding-top:12px">
      ${actsHtml(x).replace(/data-a="info"[^>]*>[^<]*<\/button>/,'data-a="none" hidden></button>')}
      <button class="btn sm" type="button" data-a="chat">${I.chat}محادثة</button>
      ${wa?`<a class="btn sm" href="https://wa.me/${wa}" target="_blank" rel="noopener">${I.wa}واتساب</a>`:""}
      <button class="btn sm ghost" type="button" data-close>إغلاق</button></div>`,m=>{
    m.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>{const a=b.dataset.a;closeModal();act(a,id)}));
  },true);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  const tb=t.closest("[data-tab]");if(tb){S.tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
  const f=t.closest("[data-f]");if(f){S.f=S.f===f.dataset.f&&f.classList.contains("stat")?"all":f.dataset.f;S.tab="shops";render();return}
  const a=t.closest("#view [data-a]");if(a){act(a.dataset.a,a.closest("[data-id]").dataset.id);return}
  const c=t.closest("[data-chat]");if(c){openChat(c.dataset.chat);return}
  const tr=t.closest("[data-trial]");if(tr){setTrial(Number(tr.dataset.trial));return}
  const p=t.closest("[data-push]");if(p){(p.dataset.push==="on"?ShahmSupport.pushOn(false).then(()=>toast("✓ تفعّلت الإشعارات على هذا الجهاز")):ShahmSupport.pushOff().then(()=>toast("توقفت الإشعارات على هذا الجهاز"))).catch(x=>toast(x.message)).finally(()=>{drawBell();render()});return}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;render()}});
document.addEventListener("change",e=>{if(e.target.id==="sort"){S.sort=e.target.value;render()}});
document.addEventListener("submit",async e=>{
  if(e.target.id==="pwF"){e.preventDefault();const er=$("#pwErr"),cur=$("#pwCur").value,nw=$("#pwNew").value;er.textContent="";
    if(nw.length<8){er.textContent="الرمز الجديد 8 أحرف على الأقل.";return}
    try{const u=auth.currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,cur));await u.updatePassword(nw);$("#pwCur").value="";$("#pwNew").value="";toast("✓ تغيّر الرمز")}
    catch(x){er.textContent=/wrong-password|invalid-credential|invalid-login/.test(x&&x.code||"")?"الرمز الحالي غلط.":"ما تغيّر الرمز. حاول مرة ثانية."}return}
  if(e.target.id==="trialF"){e.preventDefault();const n=Number(normDigits($("#trialN").value));if(!Number.isInteger(n)||n<0||n>90){toast("اكتب رقم من 0 إلى 90.");return}setTrial(n)}});
function setTrial(n){db.doc("meta/trial").set({days:n,at:Date.now()}).then(()=>toast(n?`المحلات الجديدة تنفتح ${n} يوم تجربة`:"المحلات الجديدة تنتظر موافقتك"),writeFail)}
$("#outBtn").addEventListener("click",()=>confirmBox("تسجيل الخروج","تطلع من لوحة المالك على هذا الجهاز.","خروج",()=>{stop();auth.signOut()},"primary"));
$("#bellBtn").addEventListener("click",()=>{S.tab="settings";render()});
// A notification tapped while the panel is open, or a link such as #chat=<shop id> (the Telegram message carries one).
function fromHash(h){const m=/^#chat=([A-Za-z0-9]{10,40})$/.exec(h||"");if(m){S.tab="chat";render();openChat(m[1])}}
if("serviceWorker" in navigator){navigator.serviceWorker.addEventListener("message",e=>{const u=e.data&&e.data.open;if(u)fromHash(new URL(u,location.href).hash)});
  if(location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})}
window.addEventListener("hashchange",()=>{if(auth&&auth.currentUser&&!$("#app").hidden)fromHash(location.hash)});

/* ---------- start ---------- */
(async function boot(){
  try{const th=localStorage.getItem("shahm-theme");if(th==="light"||th==="dark")document.documentElement.dataset.theme=th}catch(e){}
  if(!window.FIREBASE_CONFIG||!window.firebase){gate("ما گدرت أحمّل البرنامج. تحقق من الإنترنت.",true);return}
  // Its own Firebase app name, so its sign-in is kept apart from the debt book's on the same browser: the panel's account
  // and the Shahm book's account stay signed in side by side.
  const app=firebase.initializeApp(window.FIREBASE_CONFIG,"admin");auth=app.auth();db=app.firestore();
  if(window.FIREBASE_EMULATOR){auth.useEmulator("http://127.0.0.1:9099",{disableWarnings:true});db.useEmulator("127.0.0.1",8080)}
  gate();
  auth.onAuthStateChanged(async u=>{
    stop();
    if(!u){if($("#gate").hidden||!$("#gate").innerHTML)gate();return}
    $("#gate").innerHTML=`<div class="box" style="max-width:320px;text-align:center">جاري التحقق…</div>`;
    let ok=false;try{ok=await isOwner(u)}catch(e){gate("تعذّر التحقق من الحساب. تحقق من الإنترنت.",true);return}
    if(ok==="moved"){await auth.signOut().catch(()=>{});gate("اللوحة صارت بحساب منفصل. ادخل برقم ورمز حساب اللوحة.",true);return}
    if(!ok){await auth.signOut().catch(()=>{});gate("ما عندك صلاحية تفتح لوحة المالك. سجّلنا خروجك.",true);return}
    $("#gate").hidden=true;$("#gate").innerHTML="";$("#app").hidden=false;
    $("#sub").textContent=u.email&&!u.email.endsWith("@"+DOMAIN)?u.email:"ديون الشهم";
    render();start();fromHash(location.hash);
  });
})();
})();
</script>
</body>
