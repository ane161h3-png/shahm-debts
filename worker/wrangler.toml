# Small server that reads photos of the paper ledger with Claude.
# It keeps the Anthropic API key off the public website: the app sends the photo here,
# this checks the person is a signed-in editor, then asks Claude. Deployed by .github/workflows/ai-worker.yml.
name = "shahm-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
account_id = "08cdcd54bf3baea5c7e88e21b4aa6743"

[vars]
FIREBASE_API_KEY = "AIzaSyA8ZcghTnu-k3iQ01JuBeXPl44Pj0pwDDg"
FIREBASE_PROJECT = "shahm-debts-a080e"
OWNER_EMAIL = "admin@shahm-debts.app"
ALLOWED_ORIGINS = "https://shahm-debts.app,https://ane161h3-png.github.io,https://localhost,capacitor://localhost"
GH_REPO = "ane161h3-png/shahm-debts"
# Books the app reads from D1 (src/db.js): "all", or book ids ("main", a shop's id) separated by commas. "" = Firestore only.
D1_READ = "all"

# Starts the periodic Telegram report every 5 hours of the working day: 7 AM, noon, 5 PM and 10 PM Baghdad
# (UTC+3), 7 minutes past. The 2 AM daily report covers the night. See dispatchReport() in src/index.js.
# Every 10 minutes: the self-check that alerts on Telegram when something is down (selfCheck() in src/health.js).
# At most 10 photo readings a minute per person (Cloudflare's free rate limiter, used in src/index.js), so a stolen or
# misused login can't burn the AI quota.
[[ratelimits]]
name = "AI_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# At most 60 phone notifications a minute per person (see src/push.js).
[[ratelimits]]
name = "PUSH_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# At most 20 cloud backup uploads a minute per person (see src/backup.js).
[[ratelimits]]
name = "BK_LIMIT"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

# At most 120 saves a minute per person to the new database (see src/db.js); a big save sends up to 400 records.
[[ratelimits]]
name = "DB_LIMIT"
namespace_id = "1004"
simple = { limit = 120, period = 60 }

# At most 30 statement-page opens a minute per address (see src/statement.js), so links can't be probed in bulk.
[[ratelimits]]
name = "ST_LIMIT"
namespace_id = "1005"
simple = { limit = 30, period = 60 }

# At most 10 support-chat messages a minute per person (see src/support.js), so nobody can flood the owner.
[[ratelimits]]
name = "SUP_LIMIT"
namespace_id = "1006"
simple = { limit = 10, period = 60 }

# At most 30 health checks a minute per address (see src/health.js), for uptime monitors.
[[ratelimits]]
name = "HEALTH_LIMIT"
namespace_id = "1007"
simple = { limit = 30, period = 60 }

# At most 20 device error reports a minute per address (see clientError in src/index.js).
[[ratelimits]]
name = "LOG_LIMIT"
namespace_id = "1008"
simple = { limit = 20, period = 60 }

# Keep the worker's logs (JSON lines from src/log.js) in Cloudflare: Workers & Pages > shahm-ai > Logs. Free plan: 200,000 a day, 3 days kept.
[observability]
enabled = true

# Live updates between a book's devices: one Durable Object per book (see Live in src/db.js).
[[durable_objects.bindings]]
name = "LIVE"
class_name = "Live"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Live"]

[triggers]
crons = ["7 4,9,14,19 * * *", "*/10 * * * *"]

# ---- Staging: a separate test server (shahm-ai-staging) for trying changes before they reach the shops. Deployed only by
# .github/workflows/staging.yml, which adds its own D1 (shahm-db-staging) and KV, and passes the test Firebase project's
# keys (STAGING_FIREBASE_* secrets). Nothing here touches the live server, its database or its secrets.
[env.staging]
name = "shahm-ai-staging"
workers_dev = true

[env.staging.vars]
FIREBASE_API_KEY = "set-by-staging-workflow"
FIREBASE_PROJECT = "set-by-staging-workflow"
OWNER_EMAIL = "admin@shahm-debts.app"
ALLOWED_ORIGINS = "https://staging.shahm-debts.pages.dev,https://localhost,capacitor://localhost"
GH_REPO = "ane161h3-png/shahm-debts"
D1_READ = "all"

# No Telegram reports from the test server; its self-check runs, but has no Telegram keys, so it only logs.
[env.staging.triggers]
crons = ["*/10 * * * *"]

[[env.staging.ratelimits]]
name = "AI_LIMIT"
namespace_id = "2001"
simple = { limit = 10, period = 60 }

[[env.staging.ratelimits]]
name = "PUSH_LIMIT"
namespace_id = "2002"
simple = { limit = 60, period = 60 }

[[env.staging.ratelimits]]
name = "BK_LIMIT"
namespace_id = "2003"
simple = { limit = 20, period = 60 }

# Higher than live, so a load test (loadtest/) measures the server rather than this limit.
[[env.staging.ratelimits]]
name = "DB_LIMIT"
namespace_id = "2004"
simple = { limit = 600, period = 60 }

[[env.staging.ratelimits]]
name = "ST_LIMIT"
namespace_id = "2005"
simple = { limit = 30, period = 60 }

[[env.staging.ratelimits]]
name = "SUP_LIMIT"
namespace_id = "2006"
simple = { limit = 10, period = 60 }

[[env.staging.ratelimits]]
name = "HEALTH_LIMIT"
namespace_id = "2007"
simple = { limit = 30, period = 60 }

[[env.staging.ratelimits]]
name = "LOG_LIMIT"
namespace_id = "2008"
simple = { limit = 20, period = 60 }

[[env.staging.durable_objects.bindings]]
name = "LIVE"
class_name = "Live"
