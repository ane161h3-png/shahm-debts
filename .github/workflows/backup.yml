# Telegram reports for the debt book:
# - every 5 hours (7 AM, noon, 5 PM, 10 PM Baghdad, started by the Cloudflare worker's cron because GitHub kept skipping its own schedule): what happened in the debts app in the last 5 hours, what is still pending, plus, if anything changed, a PDF of all of the day's transactions so far. It reads only today's data (the free Firestore plan allows 50,000 reads a day); the full backup file comes with the daily run.
# - every day at 2am Baghdad time (23:00 UTC): full backup, end-of-day summary, a PDF with all of the previous day's transactions, and Excel lists of who owes.
# Secrets (Settings > Secrets and variables > Actions): BACKUP_PASSWORD, TELEGRAM_TOKEN, TELEGRAM_CHAT_ID.
# DISPATCH_TOKEN (the worker's token) is read only to warn on Telegram two weeks before it expires.
name: Daily backup
# Each run says what it is, so the reports can tell whether today's backup ran (scripts/backup.mjs, startMissedBackup).
run-name: ${{ inputs.mode == 'periodic' && 'Periodic report' || 'Daily backup' }}
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "periodic = تقرير الـ5 ساعات، daily = النسخة اليومية وملف حركات اليوم"
        type: choice
        options: [daily, periodic]
        default: daily
      scheduled:
        description: "Set by the Cloudflare cron: report the last full 5-hour slot"
        type: boolean
        default: false
concurrency:
  group: telegram-backup
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send backup to Telegram
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode || 'daily' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && !inputs.scheduled }}
          # Health checks: warns before the 5-hour reports' token expires, and starts the 2 AM backup if GitHub skipped it.
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/backup.mjs
      # GitHub pauses scheduled workflows after 60 days without repo activity; re-enabling keeps it running.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/backup.yml/enable" || true
