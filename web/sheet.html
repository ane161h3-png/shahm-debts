<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورقة اليوميات - ماركت الشهم</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<!-- Printable A4 daily sheet. The AI worker's prompt describes this exact layout, so keep the two in sync. -->
<style>
/* Fills the page: 5 mm edges (the smallest margin home printers print reliably), rows stretch to the bottom. */
@page{size:A4;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#000}
body{font-family:"IBM Plex Sans Arabic",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;padding:5mm;display:flex;flex-direction:column;gap:2mm;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:4mm;border:.5mm solid #000;border-radius:2mm;padding:1.5mm 3mm}
header h1{margin:0;font-family:"Lalezar",sans-serif;font-size:20pt;font-weight:400;line-height:1.15}
header h1 small{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:10pt;font-weight:600;margin-inline-start:2mm;color:#333}
.fields{display:flex;gap:6mm;font-size:11.5pt;font-weight:700}
.field{display:flex;align-items:flex-end;gap:1.5mm;white-space:nowrap}
.line{display:inline-block;border-bottom:.35mm solid #000;height:6.5mm}
.field i{font-style:normal;font-size:13pt;color:#555}
.cols{flex:1;display:flex;gap:2.5mm;min-height:0}
table{flex:1;width:50%;height:100%;border-collapse:collapse;table-layout:fixed;border:.6mm solid #000}
th,td{border:.25mm solid #000}
thead th{background:#000;color:#fff;font-size:10.5pt;font-weight:700;height:8mm;padding:0 .5mm;line-height:1.1}
thead th small{display:block;font-size:6.5pt;font-weight:500;color:#ddd}
tbody td{padding:0}
tbody tr:nth-child(even) td{background:#efefef}
td.n{text-align:center;font-size:8pt;font-weight:600;color:#555}
td.amt{border-inline-start:.6mm solid #000}
col.c-n{width:6mm}
col.c-name{width:auto}
col.c-items{width:25mm}
col.c-amt{width:28mm}
header .hint{flex:1;white-space:nowrap;font-size:8pt;font-weight:500;color:#333;line-height:1.35;text-align:center}
.print{position:fixed;inset:auto 16px 16px auto;padding:10px 18px;font:600 15px "IBM Plex Sans Arabic",sans-serif;background:#0e5a3a;color:#fff7e8;border:0;border-radius:10px;cursor:pointer}
@media screen{body{background:#ddd}.page{margin:10px auto;background:#fff;box-shadow:0 2px 12px #0003}}
@media screen and (max-width:820px){.page{zoom:.45}}
@media print{.print{display:none}}
</style>
</head>
<body>
<button class="print" type="button" onclick="print()">طباعة</button>
<div class="page">
  <header>
    <h1>ماركت الشهم<small>ورقة اليوميات</small></h1>
    <div class="hint">التسديد: اكتب «واصل» جنب المبلغ<br>السطر الملغي: اشطبه بخط</div>
    <div class="fields">
      <div class="field">التاريخ: <span class="line" style="width:9mm"></span><i>/</i><span class="line" style="width:9mm"></span><i>/</i><span class="line" style="width:14mm"></span></div>
      <div class="field">ورقة رقم: <span class="line" style="width:11mm"></span></div>
    </div>
  </header>
  <div class="cols">
    <table id="t1"></table>
    <table id="t2"></table>
  </div>
</div>
<script>
// Two tables side by side: the right table holds rows 1-30, the left 31-60 (read right first).
const ROWS = 30;
const head = `<colgroup><col class="c-n"><col class="c-name"><col class="c-items"><col class="c-amt"></colgroup>
  <thead><tr><th>ت</th><th>اسم الزبون</th><th>المواد</th><th>المبلغ</th></tr></thead>`;
const body = start => "<tbody>" + Array.from({ length: ROWS }, (_, i) =>
  `<tr><td class="n">${start + i}</td><td></td><td></td><td class="amt"></td></tr>`).join("") + "</tbody>";
document.getElementById("t1").innerHTML = head + body(1);
document.getElementById("t2").innerHTML = head + body(ROWS + 1);
</script>
</body>
</html>
