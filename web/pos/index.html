// Reads the item form. Returns {obj} or {err}.
function readProductForm(m,p){
  const v=id=>m.querySelector("#"+id).value;
  const name=v("pName").trim(),price=Math.round(numVal(v("pPrice"))),category=v("pCat")==="__new"?v("pCatNew").trim().slice(0,30):v("pCat"),barcode=normDigits(v("pCode")).trim(),unit=v("pUnit").trim()||"حبة";
  const wp=v("pW").trim(),cp=v("pCost").trim(),wprice=wp?Math.round(numVal(wp)):0,cost=cp?numVal(cp):0;
  const weighed=m.querySelector("#pWeighed").checked,track=m.querySelector("#pTrack").checked,st=v("pStock").trim(),mn=v("pMin").trim(),expiry=v("pExp");
  if(!name)return {err:"اكتب اسم المادة."};
  if(!category)return {err:"اكتب اسم الصنف الجديد."};
  if(!(price>=0))return {err:"اكتب سعر المفرد."};
  if(!(wprice>=0))return {err:"سعر الجملة لازم يكون رقم."};
  if(!(cost>=0))return {err:"سعر الشراء لازم يكون رقم."};
  const stock=st?numVal(st):0,min=mn?numVal(mn):0;
  if(track&&!isFinite(stock))return {err:"الكمية لازم تكون رقم."};
  if(!(min>=0))return {err:"الحد الأدنى لازم يكون رقم."};
  const packs=[];
  for(const row of m.querySelectorAll("[data-pack]")){const g=k=>row.querySelector(`[data-k="${k}"]`).value.trim();
    const pk={name:g("name"),n:numVal(g("n")),price:Math.round(numVal(g("price"))),wprice:g("wprice")?Math.round(numVal(g("wprice"))):0,barcode:normDigits(g("barcode"))};
    if(!pk.name&&!g("n")&&!g("price"))continue;
    if(!pk.name)return {err:"اكتب اسم الوحدة الكبيرة (مثل كارتون)."};
    if(!(pk.n>0))return {err:`اكتب كم ${unit} بـ «${pk.name}».`};
    if(!(pk.price>=0))return {err:`اكتب سعر «${pk.name}».`};
    if(!(pk.wprice>=0))return {err:`سعر جملة «${pk.name}» لازم يكون رقم.`};
    packs.push(pk)}
  if(new Set(packs.map(k=>k.name)).size!==packs.length)return {err:"أكو وحدتين بنفس الاسم."};
  if([...S.products.values()].some(x=>x.id!==p.id&&foldAr(x.name)===foldAr(name)))return {err:"أكو مادة بنفس الاسم."};
  const codes=[barcode,...packs.map(k=>k.barcode)].filter(Boolean);
  if(new Set(codes).size!==codes.length)return {err:"نفس الباركود مكرر بهذي المادة."};
  for(const c of codes){const f=[...S.products.values()].find(x=>x.id!==p.id&&(x.barcode===c||packsOf(x).some(k=>k.barcode===c)));if(f)return {err:`الباركود ${c} مسجل على «${f.name}».`}}
  const ot=(m.querySelector('#ofT [aria-pressed="true"]')||{dataset:{}}).dataset.of||"";let offer=null;
  if(ot){const on=Math.round(numVal(v("ofN"))),op=Math.round(numVal(v("ofP"))),oto=v("ofTo");
    if(!(op>0))return {err:"اكتب سعر العرض."};
    if(ot==="price"&&!(op<price))return {err:"سعر العرض لازم يكون أقل من سعر المفرد."};
    if(ot==="qty"){if(weighed)return {err:"المادة اللي تنباع بالوزن عرضها «سعر خاص» للكيلو."};
      if(!(on>=2))return {err:"اكتب عدد العرض (2 أو أكثر)."};
      if(!(op<on*price))return {err:`سعر العرض لازم يكون أقل من ${fmt(on*price)} (سعر ${on} بدون عرض).`}}
    offer={type:ot,...(ot==="qty"?{n:on}:{}),price:op,...(oto?{to:oto}:{})}}
  const act=m.querySelector("#pActive");
  return {obj:{name,price,category,barcode,unit:weighed?"كغم":unit,weighed,wprice,cost,packs,track,min,expiry:expiry||"",offer,active:act?act.checked:true,...(track?{stock}:{})}};
}

/* ---------- stocktake (جرد), owner only ----------
   The owner counts what is on the shelves, by typing the number or scanning each piece. Every count remembers the stock
   the app showed at that moment, so sales made while counting are kept: saving adds (counted − shown) to the stock.
   The count in progress stays on this device until it is saved; the saved stocktake is kept as a record. */
function loadCount(){try{const d=JSON.parse(localStorage.getItem(COUNT_KEY)||"null");S.count=d&&d.items&&typeof d.items==="object"?d:null}catch(e){S.count=null}}
function saveCount(){try{if(S.count)localStorage.setItem(COUNT_KEY,JSON.stringify(S.count));else localStorage.removeItem(COUNT_KEY)}catch(e){}}
// Untracked items have no stock to compare with: counting one starts tracking it at the counted quantity.
const countDiff=(p,e)=>e&&e.tr?round3(e.q-e.sys):null;
function countRows(){
  if(!S.count)return [];
  return Object.entries(S.count.items).map(([id,e])=>{const p=S.products.get(id);return p?{p,e,diff:countDiff(p,e)}:null}).filter(Boolean);
}
function countTotals(){
  const rows=countRows(),val=f=>Math.round(rows.filter(f).reduce((a,r)=>a+Math.abs(r.diff)*(Number(r.p.cost)||0),0));
  return {rows,n:rows.length,same:rows.filter(r=>r.diff===0).length,short:rows.filter(r=>r.diff<0).length,extra:rows.filter(r=>r.diff>0).length,
    fresh:rows.filter(r=>r.diff===null).length,shortValue:val(r=>r.diff<0),extraValue:val(r=>r.diff>0)};
}
function setCount(p,q){
  if(!S.count)return;
  if(q===null)delete S.count.items[p.id];
  else S.count.items[p.id]={q:round3(q),sys:round3(stockOf(p)),tr:tracked(p),at:Date.now()};
  saveCount();
}
const countDiffHtml=d=>d===null?`<span class="chip zero">يبدأ يتابَع</span>`:d===0?`<span class="chip paid">مضبوط</span>`:`<span class="chip ${d<0?"debt":"warn"}"><span class="num">${d>0?"+":""}${qtyText(d)}</span></span>`;
function countList(){
  let list=[...S.products.values()].filter(p=>p.active!==false&&(tracked(p)||S.cany||S.count.items[p.id]));
  if(S.ccat!=="all")list=list.filter(p=>(p.category||"")===S.ccat);
  if(S.cshow==="todo")list=list.filter(p=>!S.count.items[p.id]);
  else if(S.cshow==="diff")list=list.filter(p=>{const d=countDiff(p,S.count.items[p.id]);return d!==null&&d!==0});
  const q=normDigits(S.cq).trim();
  if(!q)return list.sort((a,b)=>(a.category||"").localeCompare(b.category||"","ar")||a.name.localeCompare(b.name,"ar"));
  return list.map(p=>({p,s:p.barcode===q||packsOf(p).some(k=>k.barcode===q)?20:matchScore(p.name,q,p.category)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.p);
}
function countSumHtml(){

function saveStocktake(note){
  const t=countTotals(),now=Date.now(),id=uid(),FV=firebase.firestore.FieldValue;
  const items=t.rows.map(({p,e,diff})=>({pid:p.id,name:p.name,unit:baseUnit(p),sys:e.tr?e.sys:null,counted:e.q,diff,cost:Number(p.cost)>0?Number(p.cost):null}));
  const take={id,at:now,date:todayISO(),startedAt:S.count.startedAt||now,by:S.me.name,byId:S.me.id,n:t.n,same:t.same,short:t.short,extra:t.extra,fresh:t.fresh,
    shortValue:t.shortValue,extraValue:t.extraValue,note,items};
  // Counted items that differ get the difference added; items counted for the first time get the counted stock.
  const meta={updatedAt:now,updatedBy:S.me.name};
  const writes=t.rows.filter(r=>r.diff!==0||!tracked(r.p)).map(({p,e,diff})=>[db.collection("products").doc(p.id),diff!==null&&tracked(p)?{stock:FV.increment(diff),...meta}:{stock:e.q,track:true,...meta}]);
  const a=activityDoc("edit","stock",{detail:`جرد المخزن: ${t.n} مادة، ناقص ${t.short}${t.shortValue?` (${fmt(t.shortValue)})`:""}، زايد ${t.extra}${t.extraValue?` (${fmt(t.extraValue)})`:""}`});
  const chunks=[];for(let i=0;i<writes.length;i+=450)chunks.push(writes.slice(i,i+450));if(!chunks.length)chunks.push([]);
  chunks.forEach((ch,ci)=>{const b=db.batch();for(const [ref,patch] of ch)b.update(ref,patch);
    if(ci===chunks.length-1){b.set(db.collection("stocktakes").doc(id),take);b.set(db.collection("activity").doc(a.id),a)}
    b.commit().catch(writeFail)});
  S.count=null;saveCount();if(S.takes)S.takes.unshift(take);
  closeModal();renderCount();takeModal(take);toast("انحفظ الجرد وتعدّلت الكميات");
}

/* ---------- Excel files (.xlsx), with no library ----------
   An .xlsx is a zip of XML files. Reading inflates them with the browser's DecompressionStream; writing stores them
   uncompressed, which Excel, Google Sheets and LibreOffice all open. CSV files are read too. */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=~0;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (~c)>>>0}
function zipStore(files,type){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  for(const [name,text] of files){const nb=enc.encode(name),data=enc.encode(text),crc=crc32(data);

    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(h.buffer),nb,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+data.length}
  const size=central.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,size,true);e.setUint32(16,off,true);

}
async function unzip(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf),dec=new TextDecoder();let e=u.length-22;

  const files=new Map();let p=dv.getUint32(e+16,true);
  for(let i=0,n=dv.getUint16(e+10,true);i<n;i++){
    const nl=dv.getUint16(p+28,true);
    files.set(dec.decode(u.subarray(p+46,p+46+nl)),{method:dv.getUint16(p+10,true),size:dv.getUint32(p+20,true),at:dv.getUint32(p+42,true)});
    p+=46+nl+dv.getUint16(p+30,true)+dv.getUint16(p+32,true)}

    const s=f.at+30+dv.getUint16(f.at+26,true)+dv.getUint16(f.at+28,true),data=u.subarray(s,s+f.size);
    if(f.method===0)return dec.decode(data);
    if(f.method!==8||!("DecompressionStream" in window))throw new Error("inflate");
    return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text()};
}
const colIdx=ref=>{let n=0;for(const ch of ref.replace(/\d+$/,""))n=n*26+ch.charCodeAt(0)-64;return n-1};

async function readXlsx(buf){

  const shared=[];const sst=await read("xl/sharedStrings.xml");
  if(sst)for(const si of xml(sst).getElementsByTagName("si"))shared.push(text(si));

  if(wb&&rels){const first=xml(wb).getElementsByTagName("sheet")[0],rid=first&&first.getAttribute("r:id");
    const rel=[...xml(rels).getElementsByTagName("Relationship")].find(r=>r.getAttribute("Id")===rid);
    if(rel){const t=rel.getAttribute("Target");path=t.startsWith("/")?t.slice(1):"xl/"+t.replace(/^\.\//,"")}}

      const ref=c.getAttribute("r");if(ref)ci=colIdx(ref);
      const t=c.getAttribute("t"),v=c.getElementsByTagName("v")[0],raw=v?v.textContent:"";

function parseCsv(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/,1)[0],d=[",",";","\t"].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){row.push(f);f=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows;
}
async function readSheetFile(file){
  const buf=await file.arrayBuffer(),u=new Uint8Array(buf);
  if(u[0]===0x50&&u[1]===0x4b)return readXlsx(buf);
  if(u[0]===0xd0&&u[1]===0xcf)throw new Error("xls");
  // CSV: UTF-8 normally; an Arabic CSV saved by older Excel is Windows-1256.
  let text;try{text=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){text=new TextDecoder("windows-1256").decode(buf)}
  return parseCsv(text);
}

/* ---------- items from and to Excel (owner) ----------

   An existing item is found by its barcode, or else by its name, and only the columns that have a value change it. */

  ["name","اسم المادة",["اسم المادة","الاسم","المادة","اسم","اسم الصنف","البيان","name","item","product"],28],
  ["barcode","الباركود",["الباركود","باركود","الكود","كود","رمز","barcode","code"],18],
  ["category","الصنف",["الصنف","القسم","الفئة","النوع","المجموعة","category"],16],
  ["unit","الوحدة",["الوحدة","unit"],9],
  ["price","سعر المفرد",["سعر المفرد","سعر البيع","السعر","سعر","البيع","price"],12],
  ["wprice","سعر الجملة",["سعر الجملة","الجملة","wholesale"],12],
  ["cost","سعر الشراء",["سعر الشراء","الشراء","الكلفة","التكلفة","cost"],12],
  ["stock","الكمية",["الكمية","المخزن","المخزون","العدد","الرصيد","stock","qty","quantity"],10],
  ["min","الحد الأدنى",["الحد الأدنى","الحد","min"],11],
  ["expiry","تاريخ الانتهاء",["تاريخ الانتهاء","الانتهاء","الصلاحية","انتهاء الصلاحية","expiry"],14],
  ["weighed","بالوزن",["بالوزن","وزن","weighed"],8],
  ["packName","الوحدة الكبيرة",["الوحدة الكبيرة","وحدة كبيرة","الكارتون","اسم الكارتون"],14],
  ["packN","بيها كم",["بيها كم","كم بيها","العدد بالكارتون","عدد الكارتون","عدد القطع"],9],
  ["packPrice","سعر الوحدة الكبيرة",["سعر الوحدة الكبيرة","سعر الكارتون"],15],
  ["packW","جملة الوحدة الكبيرة",["جملة الوحدة الكبيرة","جملة الكارتون","سعر جملة الكارتون"],15],
  ["packCode","باركود الوحدة الكبيرة",["باركود الوحدة الكبيرة","باركود الكارتون"],20],

const xlHead=h=>foldAr(String(h)).replace(/[()\[\]:*_\-]/g," ").replace(/\s+/g," ").trim();
// Finds the heading row (the one naming the most known columns) and which column is which.
function xlMap(rows){
  let best=null;
  for(let r=0;r<Math.min(rows.length,10);r++){
    const heads=rows[r].map(xlHead),map={};
    for(const [key,,names] of XL_COLS){const i=heads.findIndex((h,ci)=>h&&names.some(n=>xlHead(n)===h)&&!Object.values(map).includes(ci));if(i>=0)map[key]=i}
    for(const [key,,names] of XL_COLS){if(key in map)continue;
      const i=heads.findIndex((h,ci)=>h&&!Object.values(map).includes(ci)&&names.some(n=>xlHead(n).length>=4&&h.includes(xlHead(n))));if(i>=0)map[key]=i}
    const n=Object.keys(map).length;
    if("name" in map&&n>=2&&(!best||n>best.n))best={row:r,map,n,unknown:rows[r].map((h,ci)=>String(h).trim()&&!Object.values(map).includes(ci)?String(h).trim():"").filter(Boolean)};

const xlText=v=>typeof v==="number"?(Number.isInteger(v)?v.toFixed(0):String(v)):normDigits(String(v??"")).trim();
const xlNum=v=>{if(typeof v==="number")return v;const t=xlText(v);return t?parseAmt(t):NaN};
function xlCode(v){
  if(typeof v==="number")return v.toFixed(0);
  const t=xlText(v).replace(/\s/g,"");
  return /^\d(\.\d+)?e\+\d+$/i.test(t)?Number(t).toFixed(0):t;
}
function xlDate(v){

  const t=xlText(v);let m;
  if((m=t.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/)))return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if((m=t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/)))return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;

const xlYes=v=>/^(نعم|اي|ايه|صح|1|yes|y|true|✓|✔)$/i.test(foldAr(xlText(v)));
// Works out what an import will do, without writing anything.
function xlPlan(rows,head,withStock){
  const M=head.map,cell=(r,k)=>k in M?r[M[k]]:"",has=(r,k)=>k in M&&xlText(r[M[k]])!=="";
  const byCode=new Map(),byName=new Map();
  for(const p of S.products.values()){if(p.barcode)byCode.set(p.barcode,p);for(const k of packsOf(p))if(k.barcode)byCode.set(k.barcode,p);byName.set(foldAr(p.name),p)}
  const adds=[],updates=[],skips=[],seen=new Set();let same=0;
  rows.slice(head.row+1).forEach((r,i)=>{
    const line=head.row+i+2,name=xlText(cell(r,"name")).slice(0,80);
    if(!r.some(v=>xlText(v)!==""))return;
    if(!name){skips.push({line,why:"بدون اسم"});return}
    const code=has(r,"barcode")?xlCode(cell(r,"barcode")):"";
    const key=code||foldAr(name);if(seen.has(key)){skips.push({line,name,why:"مكررة بالملف"});return}seen.add(key);
    const num=k=>has(r,k)?xlNum(cell(r,k)):null;
    const f={price:num("price"),wprice:num("wprice"),cost:num("cost"),stock:num("stock"),min:num("min"),packN:num("packN"),packPrice:num("packPrice"),packW:num("packW")};
    const bad=Object.entries(f).find(([,v])=>v!==null&&!(v>=0));
    if(bad){skips.push({line,name,why:`«${XL_COLS.find(c=>c[0]===bad[0])[1]}» مو رقم`});return}
    const exp=has(r,"expiry")?xlDate(cell(r,"expiry")):null;
    if(exp===null&&has(r,"expiry")){skips.push({line,name,why:"تاريخ الانتهاء مو مفهوم"});return}
    const weighed=has(r,"weighed")?xlYes(cell(r,"weighed")):null;
    const pk=has(r,"packName")&&f.packN>0?{name:xlText(cell(r,"packName")).slice(0,20),n:f.packN,price:Math.round(f.packPrice||0),wprice:Math.round(f.packW||0),barcode:has(r,"packCode")?xlCode(cell(r,"packCode")):""}:null;
    const p=(code&&byCode.get(code))||byName.get(foldAr(name));
    if(code&&p&&byCode.has(code)&&byCode.get(code)!==p){skips.push({line,name,why:`الباركود مسجل على «${byCode.get(code).name}»`});return}
    if(pk&&pk.barcode&&byCode.has(pk.barcode)&&byCode.get(pk.barcode)!==p){skips.push({line,name,why:`باركود الوحدة الكبيرة مسجل على «${byCode.get(pk.barcode).name}»`});return}
    if(!p){
      if(f.price===null){skips.push({line,name,why:"مادة جديدة بدون سعر"});return}
      const w=weighed===true||xlText(cell(r,"unit"))==="كغم",track=f.stock!==null;
      adds.push({name,price:Math.round(f.price),category:xlText(cell(r,"category")).slice(0,30),barcode:code,unit:w?"كغم":xlText(cell(r,"unit")).slice(0,15)||"حبة",weighed:w,
        wprice:Math.round(f.wprice||0),cost:f.cost||0,packs:pk&&pk.name?[pk]:[],track,min:f.min||0,expiry:exp||"",offer:null,active:true,...(track?{stock:round3(f.stock)}:{})});
      if(code)byCode.set(code,{name});return}
    const patch={},ch=[];
    const set=(k,v,label)=>{if(v===null||v===undefined)return;if((p[k]??"")===v||(typeof v==="number"&&Number(p[k]||0)===v))return;patch[k]=v;ch.push(label)};
    set("price",f.price===null?null:Math.round(f.price),`السعر ${fmt(f.price)}`);
    set("wprice",f.wprice===null?null:Math.round(f.wprice),`الجملة ${fmt(f.wprice)}`);
    set("cost",f.cost,`الشراء ${fmt(f.cost)}`);
    if(has(r,"category"))set("category",xlText(cell(r,"category")).slice(0,30),"الصنف");
    if(has(r,"unit")&&!isWeighed(p))set("unit",xlText(cell(r,"unit")).slice(0,15),"الوحدة");
    if(code&&!p.barcode)set("barcode",code,"الباركود");
    set("min",f.min,"الحد الأدنى");
    if(exp)set("expiry",exp,"الانتهاء");
    if(weighed!==null&&weighed!==isWeighed(p)){patch.weighed=weighed;if(weighed)patch.unit="كغم";ch.push(weighed?"بالوزن":"مو بالوزن")}
    if(pk&&pk.name){const old=packsOf(p).find(k=>k.name===pk.name);
      if(!old||old.n!==pk.n||old.price!==pk.price||(old.wprice||0)!==pk.wprice||(pk.barcode&&old.barcode!==pk.barcode)){
        patch.packs=[...packsOf(p).filter(k=>k.name!==pk.name),{...old,...pk,barcode:pk.barcode||(old&&old.barcode)||""}];ch.push(pk.name)}}
    if(withStock&&f.stock!==null&&(!tracked(p)||round3(f.stock)!==round3(stockOf(p)))){patch.__stock=round3(f.stock);ch.push(`الكمية ${qtyText(round3(f.stock))}`)}
    if(ch.length)updates.push({p,patch,ch});else same++;
  });
  return {adds,updates,skips,same,stockCol:"stock" in head.map};
}
function xlExport(){

    const k=packsOf(p)[0]||{};
    const v={name:p.name,barcode:p.barcode||"",category:p.category||"",unit:baseUnit(p),price:Number(p.price)||0,wprice:p.wprice>0?p.wprice:"",cost:p.cost>0?p.cost:"",
      stock:tracked(p)?round3(stockOf(p)):"",min:p.min>0?p.min:"",expiry:p.expiry||"",weighed:isWeighed(p)?"نعم":"",

        if(!head){err.textContent="ما لگيت عمود «اسم المادة» مع عمود ثاني مثل السعر أو الباركود بأول سطور الملف. نزّل النموذج وشوف العناوين.";return}
        xlPreview(file.name,rows,head)}
      catch(e){console.warn(e);err.textContent=e&&e.message==="xls"?"هذا ملف Excel قديم (.xls). افتحه بـ Excel واحفظه .xlsx وجرب مرة ثانية.":e&&e.message==="inflate"?"المتصفح ما يفتح هذا الملف. احفظه من Excel بصيغة CSV UTF-8 وجرب مرة ثانية.":"ما كدرت أقرا الملف. تأكد إنه .xlsx أو .csv."}};
    m.querySelector("#xlF").addEventListener("change",e=>take(e.target.files[0]));
    drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("over")});
    drop.addEventListener("dragleave",()=>drop.classList.remove("over"));
    drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("over");take(e.dataTransfer.files[0])});
    m.querySelector("#xlExp").onclick=xlExport;m.querySelector("#xlTpl").onclick=xlTemplate;
  },"wide");
}
function xlPreview(fname,rows,head){
  let withStock=false;
  const draw=()=>{
    const plan=xlPlan(rows,head,withStock);
    const known=XL_COLS.filter(c=>c[0] in head.map).map(c=>c[1]);
    openModal(`<h3>استيراد: ${esc(fname)}</h3>
      <p class="hint">الأعمدة اللي انعرفت: ${known.map(k=>`<span class="chip paid">${esc(k)}</span>`).join(" ")}${head.unknown.length?`<br>ما انعرفت وراح تنترك: ${head.unknown.map(k=>`<span class="chip zero">${esc(k)}</span>`).join(" ")}`:""}</p>
      <div class="stats"><div class="stat"><div class="k">مواد جديدة</div><div class="v paid num">${plan.adds.length}</div></div>
        <div class="stat"><div class="k">تتحدث</div><div class="v num">${plan.updates.length}</div></div>
        <div class="stat"><div class="k">بدون تغيير</div><div class="v num">${plan.same}</div></div>
        <div class="stat"><div class="k">متروكة</div><div class="v ${plan.skips.length?"debt":""} num">${plan.skips.length}</div></div></div>
      ${plan.stockCol?`<label class="check"><input type="checkbox" id="xlStock" ${withStock?"checked":""}> اكتب الكميات من الملف على المواد الموجودة (بدل الكمية اللي بالبرنامج)</label>`:""}
      ${plan.adds.length?`<b>جديدة</b><ul class="xl-list">${plan.adds.slice(0,200).map(a=>`<li><span>${esc(a.name)} <small>${esc(a.category||"")}</small></span><span class="num">${fmt(a.price)}</span></li>`).join("")}${plan.adds.length>200?`<li><small>… و ${plan.adds.length-200} غيرها</small></li>`:""}</ul>`:""}
      ${plan.updates.length?`<b>تتحدث</b><ul class="xl-list">${plan.updates.slice(0,200).map(u=>`<li><span>${esc(u.p.name)}</span><small>${esc(u.ch.join("، "))}</small></li>`).join("")}${plan.updates.length>200?`<li><small>… و ${plan.updates.length-200} غيرها</small></li>`:""}</ul>`:""}
      ${plan.skips.length?`<b>متروكة</b><ul class="xl-list">${plan.skips.slice(0,100).map(k=>`<li><span>سطر <span class="num">${k.line}</span>${k.name?" · "+esc(k.name):""}</span><small>${esc(k.why)}</small></li>`).join("")}</ul>`:""}
      <p class="err" id="xlpErr"></p>
      <div class="foot"><button class="btn primary" type="button" id="xlGo"${plan.adds.length||plan.updates.length?"":" disabled"}>${I.check}استيراد <span class="num">${plan.adds.length+plan.updates.length}</span> مادة</button><button class="btn" type="button" id="xlBack">ملف ثاني</button><button class="btn" type="button" data-close>إلغاء</button></div>`,m=>{
      const st=m.querySelector("#xlStock");if(st)st.onchange=()=>{withStock=st.checked;draw()};
      m.querySelector("#xlBack").onclick=excelForm;
      m.querySelector("#xlGo").onclick=()=>{m.querySelector("#xlGo").disabled=true;xlApply(plan,fname)};
    },"wide");
  };
  draw();
}
function xlApply(plan,fname){
  const now=Date.now(),FV=firebase.firestore.FieldValue,meta={updatedAt:now,updatedBy:S.me.name},writes=[];
  for(const a of plan.adds){const obj={id:uid(),createdAt:now,by:S.me.name,...a,...meta};S.products.set(obj.id,obj);writes.push(b=>b.set(db.collection("products").doc(obj.id),obj))}
  for(const u of plan.updates){const {__stock,...fields}=u.patch,patch={...fields,...meta};
    // Stock from the file is applied as a difference, so a sale made meanwhile still counts.
    if(__stock!==undefined){if(tracked(u.p))patch.stock=FV.increment(round3(__stock-stockOf(u.p)));else{patch.stock=__stock;patch.track=true}}
    S.products.set(u.p.id,{...u.p,...fields,...(__stock!==undefined?{stock:__stock,track:true}:{})});writes.push(b=>b.update(db.collection("products").doc(u.p.id),patch))}
  const a=activityDoc("add","product",{detail:`استيراد Excel (${fname}): ${plan.adds.length} مادة جديدة، ${plan.updates.length} تحدّثت`});
  writes.push(b=>b.set(db.collection("activity").doc(a.id),a));
  for(let i=0;i<writes.length;i+=450){const b=db.batch();writes.slice(i,i+450).forEach(w=>w(b));b.commit().catch(writeFail)}
  closeModal();S.pcat="all";S.pq="";render();
  toast(`انضافت ${plan.adds.length} مادة وتحدّثت ${plan.updates.length}`,3500);
}

/* ---------- dollar rate (owner) ---------- */
function rateForm(after){
  if(!isAdmin())return;
  const r=usdRate();
  openModal(`<h3>سعر الدولار</h3><p class="hint">اكتب سعر 100 دولار بالدينار مثل ما بالسوق. إذا الزبون دفع دولار الكاشير يحسبه بهذا السعر ويرجع الباقي بالدينار.</p>
    <form id="ratef" class="field" style="gap:12px" novalidate>
      <div class="field"><label for="rateV">100 دولار = (${CUR})</label><input id="rateV" class="big" inputmode="numeric" value="${r?fmt(r*100):""}" placeholder="150,000"></div>
      ${S.pos.usdAt?`<p class="hint">آخر تحديث: ${esc(S.pos.usdBy||"")} · <span class="num">${esc(isoOf(new Date(S.pos.usdAt)))}</span> ${esc(hm12(S.pos.usdAt))}</p>`:""}
      <p class="err" id="rateErr"></p>
      <div class="foot"><button class="btn primary" type="submit">حفظ</button><button class="btn" type="button" data-close>رجوع</button></div>
    </form>`,m=>{
    m.querySelector("#ratef").addEventListener("submit",e=>{e.preventDefault();
      const v=Math.round(parseAmt(m.querySelector("#rateV").value));
      if(!(v>=10000&&v<=10000000)){m.querySelector("#rateErr").textContent="اكتب سعر 100 دولار، مثلاً 150,000.";return}
      const upd={usdRate:v/100,usdAt:Date.now(),usdBy:S.me.name};S.pos={...S.pos,...upd};
      try{db.doc("settings/pos").set(upd,{merge:true}).catch(writeFail)}catch(x){writeFail(x)}
      if(v!==Math.round(r*100))log("edit","settings",{detail:`سعر الدولار: $100 = ${fmt(v)}`});
      closeModal();toast("انحفظ سعر الدولار");if(after)after()});
  });
}

/* ---------- account menu ---------- */

  let th="system";try{th=localStorage.getItem(THEME_KEY)||"system"}catch(e){}

    <div class="menu">
      <a class="btn" href="${DEBTS_URL}">${I.book}فتح دفتر الديون</a>

      <div class="seg" role="group" aria-label="المظهر">${[["system","تلقائي"],["light","فاتح"],["dark","ليلي"]].map(([k,l])=>`<button type="button" data-th="${k}" aria-pressed="${th===k}">${l}</button>`).join("")}</div>
      <button class="btn danger-text" type="button" id="mOut">${I.out}تسجيل الخروج</button>

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  const g=t.closest("[data-go]");if(g){e.preventDefault();go(g.dataset.go);return}
  if(t.closest("#meBox")){accountMenu();return}
  const add=t.closest("[data-add]");if(add){const p=S.products.get(add.dataset.add);if(p)sellItem(p);return}
  const inc=t.closest("[data-inc]");if(inc){const l=S.cart.find(x=>x.key===inc.dataset.inc);if(l)setQty(l.key,l.qty+1);return}
  const dec=t.closest("[data-dec]");if(dec){const l=S.cart.find(x=>x.key===dec.dataset.dec);if(l)setQty(l.key,l.qty>1?l.qty-1:0);return}
  const ln=t.closest("[data-line]");if(ln){editLine(ln.dataset.line);return}
  const c=t.closest("[data-cat]");if(c){S.cat=c.dataset.cat;renderChips();renderTiles();return}
  const pc=t.closest("[data-pcat]");if(pc){S.pcat=pc.dataset.pcat;renderProducts();return}
  const pr=t.closest("[data-prod]");if(pr){productForm(S.products.get(pr.dataset.prod));return}
  const sl=t.closest("[data-sale]");if(sl){saleDetail(sl.dataset.sale);return}
  const dy=t.closest("[data-day]");if(dy&&!dy.disabled){S.repDay=dy.dataset.day;renderSales();return}
  const rm=t.closest("[data-rmode]");if(rm){S.repMode=rm.dataset.rmode;renderSales();return}
  const mo=t.closest("[data-month]");if(mo&&!mo.disabled){S.repMonth=mo.dataset.month;renderSales();return}
  const od=t.closest("[data-openday]");if(od){S.repMode="day";S.repDay=od.dataset.openday;renderSales();window.scrollTo(0,0);return}
  const ap=t.closest("[data-apv]");if(ap){decideApproval(ap.dataset.apv,ap.dataset.ok==="1");return}
  const shl=t.closest("[data-shift]");if(shl){const x=(S.shiftLog||[]).find(z=>z.id===shl.dataset.shift);if(x)zModal(x);return}
  const rs=t.closest("[data-restock]");if(rs){const p=S.products.get(rs.dataset.restock);if(p)restockForm(p);return}
  const csh=t.closest("[data-cshow]");if(csh){S.cshow=csh.dataset.cshow;renderCount();return}
  const cc=t.closest("[data-ccat]");if(cc){S.ccat=cc.dataset.ccat;renderCountList();return}
  const tk=t.closest("[data-take]");if(tk){const x=(S.takes||[]).find(z=>z.id===tk.dataset.take);if(x)takeModal(x);return}
  const a=t.closest("[data-act]");if(!a||a.disabled)return;
  switch(a.dataset.act){
    case "scan":scanBarcode(sellCode);break;
    case "keypad":keypadForm();break;
    case "clear":if(confirm("تفريغ الفاتورة؟"))clearCart();break;
    case "discount":discountForm();break;
    case "checkout":checkout();break;
    case "showcart":document.body.classList.add("show-cart");break;
    case "hidecart":document.body.classList.remove("show-cart");break;
    case "newprod":productForm();break;
    case "reppdf":reportPdf();break;
    case "closeshift":closeShiftForm();break;
    case "whole":if(canSell())setWhole(!S.whole);break;
    case "countstart":S.count={startedAt:Date.now(),by:S.me.name,items:{}};saveCount();S.cshow="all";S.cq="";renderCount();setTimeout(()=>{const q=$("#cq");if(q)q.focus()},30);break;
    case "countsave":countSaveForm();break;
    case "countcancel":if(confirm("إلغاء الجرد؟ العد اللي سويته ينمسح وما تتغير أي كمية.")){S.count=null;saveCount();renderCount()}break;
    case "countscan":scanBarcode(countCode);break;
    case "excel":excelForm();break;
  }
});
// Tapping the dark area above the cart sheet closes it (the ::after overlay sits on body).
document.addEventListener("click",e=>{if(document.body.classList.contains("show-cart")&&e.target===document.body)document.body.classList.remove("show-cart")});
document.addEventListener("submit",e=>{if(e.target.id==="shf"){e.preventDefault();openShift(e.target)}});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){S.q=e.target.value;renderTiles()}
  else if(e.target.id==="pq"){S.pq=e.target.value;renderProducts()}
  else if(e.target.id==="cq"){S.cq=e.target.value;renderCountList()}
  else if(e.target.dataset&&e.target.dataset.count)countInput(e.target);
});
document.addEventListener("change",e=>{
  if(e.target.id==="repDay"&&e.target.value){S.repDay=e.target.value>todayISO()?todayISO():e.target.value;renderSales()}
  else if(e.target.id==="repMonth"&&e.target.value){const ym=monthOf(todayISO());S.repMonth=e.target.value>ym?ym:e.target.value;renderSales()}
  else if(e.target.id==="cAny"){S.cany=e.target.checked;renderCountList()}
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  if(e.target.dataset&&e.target.dataset.count){e.preventDefault();const all=[...document.querySelectorAll("[data-count]")],i=all.indexOf(e.target);
    if(all[i+1]){all[i+1].focus();all[i+1].select()}else{const q=$("#cq");if(q)q.focus()}return}
  if(e.target.id!=="cq")return;e.preventDefault();
  const t=normDigits(e.target.value).trim();if(!t)return;
  if(findCode(t)){countCode(t);setTimeout(()=>{const q=$("#cq");if(q)q.focus()},20);return}
  const list=countList();if(list.length===1){const i=$(`[data-count="${CSS.escape(list[0].id)}"]`);if(i){i.focus();i.select()}}
  else if(/^\d{6,}$/.test(t))toast("هذا الباركود مو مسجل على أي مادة.",3000);
});
document.addEventListener("keydown",e=>{
  if(e.target.id!=="q"||e.key!=="Enter")return;e.preventDefault();
  const v=e.target.value.trim();if(!v)return;
  const t=normDigits(v);const byCode=findCode(t);
  if(byCode){if(sellItem(byCode.p,byCode.pack))toast("انضافت: "+byCode.p.name+(byCode.pack?" ("+byCode.pack.name+")":""),1500)}
  else{const list=filteredProducts(v,S.cat);if(list.length===1)sellItem(list[0]);else{if(/^\d{6,}$/.test(t))sellCode(t);return}}
  S.q="";e.target.value="";renderTiles();
});

if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ---------- boot ---------- */
(async()=>{
  loadCart();loadCount();
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase){showError("تعذّر تحميل ملفات البرنامج.");return}
  if(!cfg||!cfg.apiKey||/^PUT/.test(cfg.apiKey)){showError("لم يتم ربط قاعدة البيانات (Firebase) بعد.");return}
  firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();
  try{db.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  if(window.FIREBASE_EMULATOR){auth.useEmulator("http://127.0.0.1:9099",{disableWarnings:true});db.useEmulator("127.0.0.1",8080)}
  try{await db.enablePersistence({synchronizeTabs:true})}catch(e){console.warn("offline cache off",e&&e.code)}
  let profUnsub=null;
  auth.onAuthStateChanged(u=>{
    if(profUnsub){profUnsub();profUnsub=null}
    if(!u){stopData();S.me=null;S.isOwner=false;showLogin();return}
    const uname=(u.email||"").split("@")[0];
    S.isOwner=uname===OWNER_USER&&(u.email||"").endsWith("@"+DOMAIN);
    if(S.isOwner){S.me={id:u.uid,name:S.settings.ownerName||"المدير",role:"owner",username:OWNER_USER};startData();showApp();return}
    gateCard({sub:"جارِ التحقق من الحساب…",body:`<div class="spinner" aria-hidden="true"></div>`});
    profUnsub=db.collection("users").doc(u.uid).onSnapshot({includeMetadataChanges:true},s=>{
      if(!s.exists){if(s.metadata.fromCache)return;showWaiting("هذا الحساب ما مسجل. سجّل من دفتر الديون أول.","bad");return}
      const p=s.data();
      if(p.status==="pending"){stopData();S.me=null;showWaiting("حسابك بانتظار موافقة المدير.","warn");return}
      if(p.status==="disabled"){stopData();S.me=null;showWaiting("تم إيقاف هذا الحساب. راجع المدير.","bad");return}
      const first=!S.me;
      S.me={id:u.uid,name:p.name||uname,role:p.role==="editor"?"editor":"viewer",username:uname};
      startData();if(first||$("#app").hidden)showApp();else render();
    },e=>{console.warn(e);showWaiting("تعذّر قراءة حسابك. تحقق من الإنترنت.","bad")});
  });
})();
})();
