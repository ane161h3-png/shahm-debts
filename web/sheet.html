<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورقة الديون اليومية - ماركت الشهم</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<!-- Printable A4 daily sheet. The AI worker's prompt describes this exact layout, so keep the two in sync. -->
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
:root{--primary:#0e5a3a;--on-primary:#fff7e8;--orange:#f39a1e;--text:#1c2421;--muted:#5e6660;--zebra:#f4f2ec;--ink:#1c2421}
html,body{margin:0;background:#fff;color:var(--text)}
body{font-family:"IBM Plex Sans Arabic",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{position:relative;width:210mm;height:297mm;padding:0 11mm 9mm;display:flex;flex-direction:column;overflow:hidden;background:#fff}
/* Corner marks: let the reader find and straighten the page in a skewed phone photo. */
.mk{position:absolute;width:6mm;height:6mm;background:#000}
.mk.tr{top:7mm;right:4mm}.mk.tl{top:7mm;left:4mm}.mk.br{bottom:4mm;right:4mm}.mk.bl{bottom:4mm;left:4mm}
.bar{height:3.7mm;background:var(--primary);margin:0 -11mm;border-bottom:1.3mm solid var(--orange)}
header{display:flex;align-items:center;justify-content:space-between;gap:6mm;padding:3.5mm 0 3mm;border-bottom:.6mm solid var(--primary)}
.brand{display:flex;align-items:center;gap:3mm}
.brand img{width:13mm;height:13mm;border-radius:3mm}
.brand h1{margin:0;font-family:"Lalezar",sans-serif;font-size:24pt;font-weight:400;line-height:1;color:var(--primary)}
.brand p{margin:1.2mm 0 0;font-family:"Tajawal",sans-serif;font-size:11pt;font-weight:700;color:var(--muted)}
.fields{display:flex;gap:6mm;font-family:"Tajawal",sans-serif;font-size:12pt;font-weight:700}
.field{display:flex;align-items:center;gap:2mm;white-space:nowrap}
/* Digit boxes: one digit per box, read left to right like any number. */
.digits{display:inline-flex;direction:ltr;align-items:flex-end;gap:1mm}
.grp{position:relative;display:inline-flex;gap:.6mm}
.grp::after{content:attr(data-l);position:absolute;top:100%;inset-inline:0;text-align:center;font-family:"IBM Plex Sans Arabic",sans-serif;font-size:6.5pt;font-weight:500;color:var(--muted);line-height:1.5}
.d{width:6.2mm;height:8mm;border:.35mm solid var(--ink);border-radius:1mm;background:#fff;display:inline-flex;align-items:center;justify-content:center;font:700 13pt "IBM Plex Sans Arabic",sans-serif;color:var(--muted)}
.sep{font-size:14pt;color:var(--muted);padding:0 .3mm 1mm}
.hint{display:flex;flex-wrap:wrap;gap:1.2mm 5mm;margin:2.6mm 0 2.4mm;font-size:9.5pt;color:var(--text)}
.hint b{font-weight:700}
.hint span::before{content:"";display:inline-block;width:1.6mm;height:1.6mm;border-radius:50%;background:var(--orange);margin-left:1.6mm;vertical-align:middle}
.cols{flex:1;display:flex;gap:5mm;min-height:0}
table{width:50%;border-collapse:collapse;table-layout:fixed}
th,td{border:.3mm solid var(--ink)}
thead th{background:var(--primary);color:var(--on-primary);font-family:"Tajawal",sans-serif;font-size:11.5pt;font-weight:700;height:9.5mm;padding:0 1mm;border-color:var(--primary)}
thead th small{display:block;font-family:"IBM Plex Sans Arabic",sans-serif;font-size:6.8pt;font-weight:500;line-height:1.15;opacity:.85}
tbody td{height:8.6mm;padding:0}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr:nth-child(5n) td{border-bottom-width:.6mm}
td.n{text-align:center;font-size:8.5pt;font-weight:700;color:var(--muted);background:#fff!important}
td.amt{border-right:.7mm solid var(--ink);border-left:.7mm solid var(--ink)}
col.c-n{width:7mm}
col.c-name{width:auto}
col.c-amt{width:24mm}
col.c-note{width:19mm}
footer{display:flex;justify-content:space-between;align-items:center;gap:6mm;margin-top:3.5mm;padding-top:3mm;border-top:.6mm solid var(--primary);font-family:"Tajawal",sans-serif;font-size:12pt;font-weight:700}
footer>div{display:flex;align-items:center;gap:2mm;white-space:nowrap}
.box{display:inline-block;height:9mm;border:.35mm solid var(--ink);border-radius:1.5mm;background:#fff}
footer .tag{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:7.5pt;font-weight:700;color:var(--primary);direction:ltr;letter-spacing:.3mm}
.print{position:fixed;inset:auto 16px 16px auto;padding:10px 18px;font:600 15px "IBM Plex Sans Arabic",sans-serif;background:#0e5a3a;color:#fff7e8;border:0;border-radius:10px;cursor:pointer}
@media screen{body{background:#ddd}.page{margin:10px auto;box-shadow:0 2px 12px #0003}}
@media screen and (max-width:820px){.page{zoom:.45}}
@media print{.print{display:none}}
</style>
</head>
<body>
<button class="print" type="button" onclick="print()">طباعة</button>
<div class="page">
  <i class="mk tr"></i><i class="mk tl"></i><i class="mk br"></i><i class="mk bl"></i>
  <div class="bar"></div>
  <header>
    <div class="brand">
      <img src="icons/icon-192.png" alt="">
      <div>
        <h1>ماركت الشهم</h1>
        <p>ورقة الديون اليومية</p>
      </div>
    </div>
    <div class="fields">
      <div class="field">التاريخ:
        <span class="digits">
          <span class="grp" data-l="يوم"><i class="d"></i><i class="d"></i></span><span class="sep">/</span>
          <span class="grp" data-l="شهر"><i class="d"></i><i class="d"></i></span><span class="sep">/</span>
          <span class="grp" data-l="سنة"><i class="d">2</i><i class="d">0</i><i class="d"></i><i class="d"></i></span>
        </span>
      </div>
      <div class="field">ورقة رقم:
        <span class="digits"><span class="grp"><i class="d"></i><i class="d"></i></span></span>
      </div>
    </div>
  </header>
  <div class="hint">
    <span><b>زبون واحد</b> بكل سطر، والاسم <b>واضح ومفصول</b></span>
    <span>المبلغ <b>كامل بالدينار</b>: اكتب <b>5000</b> مو 5</span>
    <span>المواد <b>بعمود المواد</b> مو جوه الاسم</span>
    <span>السطر الغلط: <b>اشطبه بخط واحد</b> واكتب بالسطر اللي بعده</span>
  </div>
  <div class="cols">
    <table id="t1"></table>
    <table id="t2"></table>
  </div>
  <footer>
    <div>عدد الزبائن: <span class="box" style="width:18mm"></span></div>
    <div>مجموع الديون: <span class="box" style="width:42mm"></span> <small style="font-size:9pt;color:var(--muted)">د.ع</small></div>
    <div class="tag">SHAHM DAILY SHEET v2</div>
  </footer>
</div>
<script>
// Two tables side by side to save paper: the right table holds rows 1-25, the left 26-50 (read right first).
const ROWS = 25;
const head = `<colgroup><col class="c-n"><col class="c-name"><col class="c-amt"><col class="c-note"></colgroup>
  <thead><tr><th>ت</th><th>اسم الزبون</th><th>المبلغ</th><th>المواد<small>اختياري</small></th></tr></thead>`;
const body = start => "<tbody>" + Array.from({ length: ROWS }, (_, i) =>
  `<tr><td class="n">${start + i}</td><td></td><td class="amt"></td><td></td></tr>`).join("") + "</tbody>";
document.getElementById("t1").innerHTML = head + body(1);
document.getElementById("t2").innerHTML = head + body(ROWS + 1);
</script>
</body>
</html>
