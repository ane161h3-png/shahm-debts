// Receipt number: the sale's number within its day (the date is printed next to it everywhere).
function saleNo(){return String(S.sales.size+1)}
const itemName=i=>i.name+(Number(i.n)>1&&i.unit?` (${i.unit})`:"");
const itemQty=i=>i.w?kgText(Number(i.qty)||0):qtyText(i.qty);
const itemOffer=i=>i.deal?`عرض ${i.deal.n} بـ ${fmt(i.deal.price)}`:i.was?`عرض بدل ${fmt(i.was)}`:"";
// What the offers took off an invoice: the usual price of every line minus what it came to.
const offerSaving=items=>items.reduce((a,i)=>a+(i.was||i.deal?Math.max(0,Math.round((Number(i.was)||Number(i.price)||0)*(Number(i.qty)||0))-(Number(i.total)||0)):0),0);
const usdPaidText=s=>`${usdFmt(s.usd)} (= ${fmt(s.usdIqd)} ${CUR})${s.topUp?` + ${fmt(s.topUp)} دينار`:""}`;
function itemsText(items,max){const s=items.map(i=>i.w?`${itemName(i)} ${itemQty(i)}`:`${itemName(i)} ×${qtyText(i.qty)}`).join("، ");return max&&s.length>max?s.slice(0,max-1)+"…":s}
/* One sale = one batch: the sale, and when part of it is on credit, the debt transaction on the customer's account
   (source "pos") plus its activity line, so it shows in the debt book, its activity log and the Telegram reports. */
function saveSale(pay){
  const t=totals(),now=Date.now(),id=uid(),no=saleNo();
  const items=S.cart.map(l=>({pid:l.pid||null,name:l.name,unit:l.unit||"",n:l.n||1,price:Math.round(l.price),qty:l.qty,total:lineTotal(l),cat:l.cat||"",...(l.w?{w:1}:{}),
    ...(l.deal?{deal:l.deal}:{}),...(l.was?{was:l.was}:{}),cost:l.cost>0?l.cost:null}));
  const sale={id,no,at:now,date:todayISO(),items,count:items.length,subtotal:t.sub,discount:t.disc,total:t.total,cash:pay.cash,debt:pay.debt,
    ...(S.whole?{wholesale:true}:{}),...(S.shift?{shiftId:S.shift.id}:{}),...(S.approval&&t.disc>0?{approvalId:S.approval.id}:{}),...(pay.received?{received:pay.received,change:pay.received-t.total}:{}),
    ...(pay.usd?{usd:pay.usd,rate:pay.rate,usdIqd:pay.usdIqd,...(pay.usdIqd>t.total?{change:pay.usdIqd-t.total}:{}),...(pay.usdIqd<t.total?{topUp:t.total-pay.usdIqd}:{})}:{}),by:S.me.name,byId:S.me.id,status:"done"};
  const b=db.batch();
  if(pay.debt>0){
    const c=pay.customer;
    const note=`فاتورة كاشير #${no}: ${itemsText(items,160)}${pay.cash>0?` (دفع ${fmt(pay.cash)} كاش من ${fmt(t.total)})`:""}${t.disc?` خصم ${fmt(t.disc)}`:""}`;
    const txn={id:uid(),customerId:c.id,type:"debt",amount:pay.debt,note,date:sale.date,createdAt:now,by:S.me.name,source:"pos",saleId:id};
    Object.assign(sale,{customerId:c.id,customerName:c.name,customerPhone:c.phone||"",txnId:txn.id});
    b.set(db.collection("txns").doc(txn.id),txn);
    const a=activityDoc("add","debt",{customerName:c.name,amount:pay.debt,detail:`فاتورة كاشير #${no}`});
    b.set(db.collection("activity").doc(a.id),a);
    S.txns.set(txn.id,txn);
  }
  // Stock: each tracked item goes down by what was sold, in base units (a carton of 24 = 24).
  for(const [pid,q] of stockMoves(items))b.update(db.collection("products").doc(pid),{stock:firebase.firestore.FieldValue.increment(-q)});
  if(sale.approvalId)b.update(db.collection("approvals").doc(sale.approvalId),{status:"used",saleId:id,usedAt:now});
  b.set(db.collection("sales").doc(id),sale);
  S.sales.set(id,sale);
  b.commit().catch(e=>{writeFail(e);S.sales.delete(id);if(sale.txnId)S.txns.delete(sale.txnId);refresh("sales")});
  S.cart=[];S.discount=0;S.whole=false;S.approval=null;saveCart();document.body.classList.remove("show-cart");refresh("cart");
  return sale;
}
function stockMoves(items){
  const m=new Map();
  for(const i of items){const p=i.pid&&S.products.get(i.pid);if(!tracked(p))continue;m.set(i.pid,round3((m.get(i.pid)||0)+Number(i.qty)*(Number(i.n)||1)))}
  return m;
}

/* ---------- receipts ---------- */
function receiptText(sale){
  const L=[`*${shopName()}*`,`فاتورة #${sale.no} · ${sale.date} ${hm12(sale.at)}`,""];
  for(const i of sale.items)L.push(`${itemName(i)} × ${itemQty(i)} = ${fmt(i.total)}${itemOffer(i)?` (${itemOffer(i)})`:""}`);
  L.push("");
  const saved=offerSaving(sale.items);if(saved)L.push(`وفّرت بالعروض: ${fmt(saved)}`);
  if(sale.discount)L.push(`المجموع: ${fmt(sale.subtotal)}`,`الخصم: ${fmt(sale.discount)}`);
  L.push(`*المطلوب: ${fmt(sale.total)} ${CUR}*`);
  if(sale.debt>0){if(sale.cash>0)L.push(`واصل كاش: ${fmt(sale.cash)}`);L.push(`على الحساب (دين): ${fmt(sale.debt)}`);
    if(sale.customerId&&S.customers.has(sale.customerId))L.push(`رصيدك الحالي: ${fmt(balanceOf(sale.customerId))} ${CUR}`)}
  else L.push(sale.usd?`الدفع: ${usdPaidText(sale)}`:"الدفع: كاش");
  if(sale.change>0)L.push(`الباقي: ${fmt(sale.change)} ${CUR}`);
  if(sale.status==="void")L.push("","(هذه الفاتورة ملغية)");
  L.push("",SLOGAN);
  return L.join("\n");
}

// Printed colors = light brand tokens (BRAND.md: green bar over an orange line, shop name in Lalezar).
const PDFC={green:"#0e5a3a",orange:"#f39a1e",ink:"#1c2421",muted:"#5e6660",line:"#e3ded3",head:"#f4f2ec",shade:"#f8f6f1",debt:"#c2301e",paid:"#4a7f12"};
const PDF_BRAND="'Lalezar','Tajawal',sans-serif",PDF_F="'IBM Plex Sans Arabic',Tahoma,sans-serif",PDF_D="'Tajawal','IBM Plex Sans Arabic',sans-serif";
async function pdfFonts(){try{await Promise.all(["400 40px Lalezar","700 28px Tajawal","800 28px Tajawal","400 22px 'IBM Plex Sans Arabic'","700 22px 'IBM Plex Sans Arabic'"].map(f=>document.fonts.load(f)));await document.fonts.ready}catch(e){}}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)){res();return}const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}

function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)})}
async function saveFile(filename,blob){
  if(NATIVE){
    const r=await plugin("Filesystem").writeFile({path:filename,data:await blobToB64(blob),directory:"CACHE"});
    try{await plugin("Share").share({title:filename,files:[r.uri]})}catch(e){if(/cancel/i.test(String(e&&e.message)))return false;throw e}
    return true;
  }
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(mobile&&navigator.canShare){const file=new File([blob],filename,{type:blob.type});
    if(navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:filename});return true}catch(e){if(e&&e.name==="AbortError")return false}}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);return true;

/* ---------- printed slips (receipt, Z report) ----------
   Each slip is drawn on a canvas (Arabic shapes correctly) 576px wide = 72mm of an 80mm roll at 203 dpi, the dots of a thermal head.
   The PDF uses the brand colours; a thermal printer gets plain black (MONO), since it prints dots, not shades.
   A 58mm roll is drawn narrower (448) and scaled to its 384 dots. */
const MONO={green:"#000",orange:"#000",ink:"#000",muted:"#222",line:"#000",head:"#fff",shade:"#fff",debt:"#000",paid:"#000"};
let logoImgs={};
// The brand mark (BRAND_MARK) as an image: the letter in the brand green with its three coloured fruits, or all black for thermal paper.
function logoImage(mono){
  if(logoImgs[mono?1:0])return logoImgs[mono?1:0];
  let svg=BRAND_MARK.replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" width="218" height="218" ').replace(/currentColor/g,mono?"#000":PDFC.green);
  if(mono)svg=svg.replace(/fill="#(F39A1E|E2412B|7BC043)"/gi,'fill="#000"');
  return logoImgs[mono?1:0]=new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)});
}
// Shared slip header: brand bar, logo, shop name, address. Returns the canvas, its context, palette and the next y.
async function slipStart(o,H){
  const W=o.w||576,C=o.mono?MONO:PDFC;
  const cv=document.createElement("canvas");cv.width=W;cv.height=Math.round(H);const x=cv.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,cv.height);
  if(o.mono){x.fillStyle="#000";x.fillRect(0,0,W,6)}else{x.fillStyle=PDFC.green;x.fillRect(0,0,W,12);x.fillStyle=PDFC.orange;x.fillRect(0,12,W,4)}
  x.direction="rtl";x.textAlign="center";let y=70;
  if(o.logo!==false){const im=await logoImage(!!o.mono);if(im){const s=96;x.drawImage(im,(W-s)/2,26,s,s);y=26+s+40}}
  x.fillStyle=C.green;x.font=`400 40px ${PDF_BRAND}`;x.fillText(shopName(),W/2,y);y+=34;
  return {cv,x,C,W,y};
}
function slipTrim(cv,y){const h=Math.min(cv.height,Math.round(y));const out=document.createElement("canvas");out.width=cv.width;out.height=h;out.getContext("2d").drawImage(cv,0,0);return out}
async function receiptCanvas(sale,o){
  o=o||{};

// A scale on a cable sends lines like "ST,GS,+  1.234kg"; the last complete reading wins (unstable "US" lines are skipped).

  finally{clearTimeout(stop);try{r.releaseLock()}catch(e){}}

/* ---------- sales reports: one day, or one month ---------- */
const monthOf=iso=>iso.slice(0,7);
const shiftMonth=(ym,n)=>{const d=new Date(ym+"-15T12:00:00");d.setMonth(d.getMonth()+n);return isoOf(d).slice(0,7)};
const monthName=ym=>{try{return new Date(ym+"-15T12:00:00").toLocaleDateString("ar-IQ",{month:"long",year:"numeric",numberingSystem:"latn"})}catch(e){return ym}};
// Reads one day (or one month) of sales once and keeps it; today's sales come from the live listener.
function fetchSales(key,query){
  if(S.repCache.has(key))return S.repCache.get(key);
  S.repCache.set(key,null);
  query.get().then(s=>{S.repCache.set(key,s.docs.map(d=>d.data()));if(S.view==="sales")renderSales();else if(S.view==="home")renderHome()})
    .catch(e=>{S.repCache.delete(key);readFail(e)});
  return null;
}
function daySalesSync(day){
  if(day===S.day)return S.ready.s?[...S.sales.values()]:null;
  return fetchSales(day,db.collection("sales").where("date","==",day));
}
function monthSalesSync(ym){
  const list=fetchSales("m:"+ym,db.collection("sales").where("date",">=",ym+"-01").where("date","<=",ym+"-31"));
  if(!list)return null;
  if(monthOf(S.day)!==ym)return list;
  if(!S.ready.s)return null;
  return [...list.filter(s=>s.date!==S.day),...S.sales.values()];
}
const repList=()=>S.repMode==="month"?monthSalesSync(S.repMonth||monthOf(todayISO())):daySalesSync(S.repDay||todayISO());
/* ---------- home (الرئيسية) ----------
   The shop at a glance: everything sold since the cashier started (count and total of all completed invoices, counted by
   Firestore itself with an aggregation query, so no invoice is downloaded for it), today live, this month and last month,
   and the last 14 days one row each (tap a day to open it in «المبيعات»). The all-time figures are kept on this device
   (ALL_KEY) so they show at once and offline, then refresh. Profit shows to the owner only, like in the reports. */
const ALL_KEY="shahm-pos-all";
let allBusy=false,allErr=false;
function allStats(){try{return JSON.parse(localStorage.getItem(ALL_KEY)||"null")}catch(e){return null}}
async function fetchAllStats(force){
  const c=allStats();if(allBusy||!auth||!auth.currentUser||(!force&&c&&Date.now()-c.at<60000))return;
  allBusy=true;
  try{
    const tok=await auth.currentUser.getIdToken(),pid=firebase.app().options.projectId;
    const host=window.FIREBASE_EMULATOR?"http://127.0.0.1:8080":"https://firestore.googleapis.com",base=`${host}/v1/projects/${pid}/databases/(default)/documents`;
    const post=(path,body)=>fetch(base+path,{method:"POST",headers:{"content-type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify(body)}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()});
    const num=v=>v?Number(v.integerValue??v.doubleValue??0):0;
    const done={fieldFilter:{field:{fieldPath:"status"},op:"EQUAL",value:{stringValue:"done"}}};
    const agg=await post(":runAggregationQuery",{structuredAggregationQuery:{structuredQuery:{from:[{collectionId:"sales"}],where:done},
      aggregations:[{alias:"n",count:{}},{alias:"t",sum:{field:{fieldPath:"total"}}},{alias:"c",sum:{field:{fieldPath:"cash"}}},{alias:"d",sum:{field:{fieldPath:"debt"}}}]}});
    const f=(agg[0]&&agg[0].result&&agg[0].result.aggregateFields)||{};
    let first=c&&c.first||"";
    if(!first){const q=await db.collection("sales").orderBy("at").limit(1).get();if(!q.empty)first=q.docs[0].data().date||""}
    const v={n:num(f.n),total:num(f.t),cash:num(f.c),debt:num(f.d),first,at:Date.now()};
    try{localStorage.setItem(ALL_KEY,JSON.stringify(v))}catch(e){}
    allErr=false;if(S.view==="home")renderHome();
  }catch(e){console.warn("all-time stats",e);if(!allErr){allErr=true;if(S.view==="home")renderHome()}}finally{allBusy=false}
}
const sumOk=list=>{const ok=(list||[]).filter(s=>s.status!=="void");return {n:ok.length,total:ok.reduce((a,s)=>a+(Number(s.total)||0),0)}};
function homeStat(k,v,sub,cls){return `<div class="stat${cls?" "+cls:""}"><div class="k">${k}</div><div class="v">${v}</div>${sub?`<div class="sub">${sub}</div>`:""}</div>`}
const money=v=>`<span class="num">${fmt(v)}</span><small>د.ع</small>`;

  const days=[];for(let i=0;i<14;i++){const d=new Date(today+"T12:00:00");d.setDate(d.getDate()-i);const iso=isoOf(d);days.push([iso,byDay.get(iso)||{n:0,total:0}])}

    <div class="stats">${homeStat("مجموع المبيعات",all?money(all.total):wait,"","main")}${homeStat("عدد الفواتير",all?`<span class="num">${fmt(all.n)}</span>`:wait)}

      ${homeStat("كاش",t?money(t.cash):wait)}${homeStat("دين",t?money(t.debt):wait)}${admin&&t?homeStat("ربح اليوم",money(t.profit),t.uncosted?"بدون المواد اللي ما إلها سعر شراء":""):""}</div>
  </section>

    <div class="stats">${homeStat(esc(monthName(ym)),mc?money(mc.total):wait,mc?`<span class="num">${fmt(mc.n)}</span> فاتورة`:"","main")}${homeStat(esc(monthName(prev)),mp?money(mp.total):wait,mp?`<span class="num">${fmt(mp.n)}</span> فاتورة`:"")}</div>
  </section>

    ${cur&&old?`<ul class="rows hd-list">${days.map(([d,x])=>`<li><button class="hd-row" type="button" data-hday="${d}" aria-label="${esc(dayName(d))}: ${x.n} فاتورة، ${fmt(x.total)} دينار">
      <span class="hd-d">${esc(dayName(d))}</span><span class="hd-bar" aria-hidden="true"><i style="width:${x.total?Math.max(2,Math.round(x.total/max*100)):0}%"></i></span>
      <span class="hd-n"><span class="num">${fmt(x.n)}</span> فاتورة</span><b class="num">${fmt(x.total)}</b></button></li>`).join("")}</ul>`:`<div class="empty"><div class="spinner" aria-hidden="true"></div></div>`}
  </section>`;
}
/* Totals of a list of sales. Profit = sale price − purchase price, only for items whose purchase price is known,
   minus discounts; sales of items without a purchase price are shown apart so the profit is never overstated silently. */
function summarize(list){
  const ok=list.filter(s=>s.status!=="void");
  const sum=k=>ok.reduce((a,s)=>a+(Number(s[k])||0),0);
  const items=new Map(),who=new Map(),byCat=new Map(),days=new Map();let cost=0,costed=0,uncosted=0;
  for(const s of ok){
    let sp=0;
    for(const i of s.items||[]){const k=i.pid||("c:"+i.name);const x=items.get(k)||{name:i.name,unit:baseUnitName(i),qty:0,total:0,profit:0,costed:true};
      const base=(Number(i.qty)||0)*(Number(i.n)||1);x.qty+=base;x.total+=Number(i.total)||0;
      if(i.cost>0){const c=i.cost*(Number(i.qty)||0);cost+=c;costed+=Number(i.total)||0;x.profit+=(Number(i.total)||0)-c;sp+=(Number(i.total)||0)-c}
      else{uncosted+=Number(i.total)||0;x.costed=false}
      items.set(k,x);byCat.set(i.cat||"بدون صنف",(byCat.get(i.cat||"بدون صنف")||0)+(Number(i.total)||0))}
    sp-=Number(s.discount)||0;
    const w=who.get(s.by||"؟")||{n:0,v:0};w.n++;w.v+=s.total;who.set(s.by||"؟",w);
    const d=days.get(s.date)||{n:0,v:0,profit:0};d.n++;d.v+=s.total;d.profit+=sp;days.set(s.date,d);
  }
  const disc=sum("discount");
  return {n:ok.length,voids:list.length-ok.length,total:sum("total"),cash:sum("cash"),debt:sum("debt"),disc,usd:Math.round(sum("usd")*100)/100,usdIqd:sum("usdIqd"),
    profit:costed-cost-disc,cost,uncosted,

/* A4 report pages drawn on canvases: the brand header on every page, key/value lines, and tables that continue on new pages.
   fill() draws the content with kv(), table() and gap(). */
async function a4Pdf(sub,stamp,fill,filename){
  const W=1240,H=1754,M=80;const pages=[];let x,y;
  const page=()=>{const cv=document.createElement("canvas");cv.width=W;cv.height=H;x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);pages.push(cv);
    x.fillStyle=PDFC.green;x.fillRect(0,0,W,14);x.fillStyle=PDFC.orange;x.fillRect(0,14,W,5);x.direction="rtl";y=M;
    x.fillStyle=PDFC.green;x.textAlign="right";x.font=`400 46px ${PDF_BRAND}`;x.fillText(shopName(),W-M,y+40);
    x.font=`500 24px ${PDF_F}`;x.fillStyle=PDFC.muted;x.fillText(sub,W-M,y+80);
    x.textAlign="left";x.direction="ltr";x.fillText(stamp,M,y+40);x.direction="rtl";
    y+=110;x.strokeStyle=PDFC.line;x.lineWidth=2;x.beginPath();x.moveTo(M,y);x.lineTo(W-M,y);x.stroke();y+=30};
  page();
  const kv=(k,v,c)=>{x.textAlign="right";x.font=`500 24px ${PDF_F}`;x.fillStyle=PDFC.muted;x.fillText(k,W-M,y+24);x.font=`700 26px ${PDF_F}`;x.fillStyle=c||PDFC.ink;x.fillText(v,W-M-300,y+24);y+=42};
  const table=(title,cols,rows)=>{
    if(y>H-M-200)page();
    x.textAlign="right";x.font=`700 26px ${PDF_D}`;x.fillStyle=PDFC.green;x.fillText(title,W-M,y+26);y+=44;
    const tw=W-2*M;const head=()=>{x.fillStyle=PDFC.head;x.fillRect(M,y,tw,46);x.fillStyle=PDFC.muted;x.font=`600 21px ${PDF_F}`;let x0=W-M;for(const c of cols){x.textAlign="right";x.fillText(c.label,x0-14,y+31);x0-=c.w*tw}y+=46};head();
    rows.forEach((row,ri)=>{if(y>H-M-80){page();head()}
      if(ri%2)x.fillStyle=PDFC.shade,x.fillRect(M,y,tw,44);let x0=W-M;
      cols.forEach((c,i)=>{const cw=c.w*tw;x.fillStyle=(row.colors&&row.colors[i])||PDFC.ink;x.font=`400 21px ${PDF_F}`;
        if(c.num){x.direction="ltr";x.textAlign="right";x.fillText(row.cells[i],x0-14,y+30);x.direction="rtl"}
        else{x.textAlign="right";let s=String(row.cells[i]);while(s.length>2&&x.measureText(s).width>cw-24)s=s.slice(0,-2);if(s!==String(row.cells[i]))s+="…";x.fillText(s,x0-14,y+30)}
        x0-=cw});y+=44});
    y+=30};
  fill({kv,table,gap:n=>{y+=n}});
  pages.forEach((cv,i)=>{const c=cv.getContext("2d");c.direction="ltr";c.textAlign="center";c.fillStyle=PDFC.green;c.font=`400 18px ${PDF_F}`;c.fillText(`${i+1} / ${pages.length}`,W/2,H-40)});
  const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"pt",format:"a4"});
  pages.forEach((cv,i)=>{if(i)pdf.addPage();pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",0,0,595.28,841.89)});
  try{if(await saveFile(filename,pdf.output("blob")))toast("تم حفظ التقرير")}catch(e){console.warn(e);toast("تعذّر حفظ الملف.")}
}

/* ---------- shift (وردية) and Z report ----------
   One shop-wide shift at a time: opened with the cash already in the drawer, closed by counting the drawer.
   Expected cash = opening cash + cash taken by sales since the shift opened; the difference is what is missing or extra.
   A closed shift keeps its own totals, so its Z report never changes afterwards. */
const repSeg=mode=>`<div class="seg" role="group" aria-label="الفترة" style="flex:none">${[["day","يومي"],["month","شهري"],["shift","الوردية"]].map(([k,l])=>`<button type="button" data-rmode="${k}" aria-pressed="${mode===k}">${l}</button>`).join("")}</div>`;
function shiftSales(sh){
  const from=Number(sh.openedAt)||0,od=isoOf(new Date(from));
  if(!S.ready.s)return null;
  let list=[...S.sales.values()];
  if(od<S.day){const old=fetchSales("sh:"+sh.id,db.collection("sales").where("date",">=",od));if(!old)return null;list=[...old.filter(s=>s.date!==S.day),...list]}
  return list.filter(s=>(Number(s.at)||0)>=from);
}
function zOf(sh,list){
  const r=summarize(list),fl=Number(sh.float)||0;
  // Dollars go in the drawer as dollars, so the dinars expected are the cash sales less what the dollars paid for.
  return {n:r.n,voids:r.voids,total:r.total,cash:r.cash,debt:r.debt,disc:r.disc,profit:r.profit,uncosted:r.uncosted,usd:r.usd,usdIqd:r.usdIqd,
    who:r.who.map(([k,w])=>({name:k,n:w.n,v:w.v})),float:fl,expected:fl+r.cash-r.usdIqd};
}
const diffText=d=>d===0?"مضبوط":d>0?`زايد ${fmt(d)}`:`ناقص ${fmt(-d)}`;
const diffCls=d=>d===0?"paid":d>0?"warn":"debt";
const usdDiffText=d=>d===0?"مضبوط":d>0?`زايد ${usdFmt(d)}`:`ناقص ${usdFmt(-d)}`;
const drawerHtml=z=>`بداية <span class="num">${fmt(z.float)}</span> + كاش <span class="num">${fmt(z.cash)}</span>${z.usdIqd?` − بالدولار <span class="num">${fmt(z.usdIqd)}</span>`:""}`;

  c.fillStyle=C.muted;c.font=`400 18px ${PDF_F}`;c.fillText(`${isoOf(new Date(x.openedAt))} · ${hm12(x.openedAt)} إلى ${hm12(x.closedAt)}`,W/2,y);y+=26;
  c.fillText(x.openedBy+(x.closedBy&&x.closedBy!==x.openedBy?" ← "+x.closedBy:""),W/2,y);y+=22;
  const rule=()=>{c.strokeStyle=C.line;c.lineWidth=2;c.setLineDash([6,6]);c.beginPath();c.moveTo(M,y);c.lineTo(W-M,y);c.stroke();c.setLineDash([])};
  const lr=(r,l,s)=>{s=s||{};c.font=`${s.w||400} ${s.s||20}px ${PDF_F}`;c.fillStyle=s.c||C.ink;c.textAlign="right";c.direction="rtl";c.fillText(r,W-M,y);
    c.textAlign="left";c.direction=s.rtl?"rtl":"ltr";if(s.rtl)c.textAlign="left";c.font=`${s.w||700} ${s.s||20}px ${s.rtl?PDF_F:PDF_D}`;c.fillText(l,M,y);c.direction="rtl";y+=s.gap||32};
  rule();y+=34;
  lr("كاش البداية",fmt(z.float));lr("مبيعات كاش",fmt(z.cash),{c:C.paid});if(z.usdIqd)lr("منها مدفوعة بالدولار","-"+fmt(z.usdIqd));
  lr("المفروض بالدرج",fmt(x.expected),{w:700});lr("المعدود",fmt(x.counted),{w:700});

  y-=8;rule();y+=34;
  lr("مجموع المبيعات",fmt(z.total)+" IQD",{w:700,c:C.green});lr("دين على الزبائن",fmt(z.debt),{c:C.debt});lr("الخصومات",fmt(z.disc));

/* ---------- discount approval ----------
   An editor's discount is applied only after the owner approves it from the cashier on their own device.
   The approval is tied to the invoice total it was asked for; changing the invoice drops it. The rules enforce the same. */
function requestApproval(amount,sub){
  const a={id:uid(),kind:"discount",amount,subtotal:sub,items:itemsText(S.cart,120),by:S.me.name,byId:S.me.id,at:Date.now(),status:"pending"};
  try{db.collection("approvals").doc(a.id).set(a).catch(writeFail)}catch(e){writeFail(e);return}
  openModal(`<h3>بانتظار موافقة المدير</h3><p class="hint">طلبت خصم <b class="num">${fmt(amount)}</b> على فاتورة <b class="num">${fmt(sub)}</b>. أول ما يوافق المدير من جهازه ينطبق الخصم هنا.</p>
    <div class="spinner" aria-hidden="true"></div>
    <div class="foot"><button class="btn" type="button" data-close>إلغاء الطلب</button></div>`,()=>{
    const ref=db.collection("approvals").doc(a.id);
    const un=ref.onSnapshot(s=>{const d=s.data();if(!d)return;
      if(d.status==="approved"){un();modalCleanup=null;closeModal();
        if(totals().sub!==sub){toast("الفاتورة تغيّرت. اطلب الخصم مرة ثانية.",3500);return}
        S.discount=Math.min(d.amount,sub);S.approval={id:a.id,amount:d.amount,subtotal:sub};saveCart();refresh("cart");toast("وافق المدير على الخصم",2500)}
      else if(d.status==="denied"){un();modalCleanup=null;closeModal();toast("المدير رفض الخصم.",3500)}
    },e=>console.warn(e));
    // Leaving the wait withdraws the request, so the owner never approves something nobody is waiting for.
    modalCleanup=()=>{un();ref.update({status:"cancelled"}).catch(()=>{})};
  });
}
function renderApprovals(){
  const el=$("#approvals");if(!el)return;
  const list=isAdmin()?[...S.approvals.values()].filter(a=>a.status==="pending").sort((a,b)=>a.at-b.at):[];

function readProductForm(m,p){

  const wp=v("pW").trim(),cp=v("pCost").trim(),wprice=wp?Math.round(numVal(wp)):0,cost=cp?numVal(cp):0;
  const weighed=m.querySelector("#pWeighed").checked,track=m.querySelector("#pTrack").checked,st=v("pStock").trim(),mn=v("pMin").trim(),expiry=v("pExp");
  if(!name)return {err:"اكتب اسم المادة."};

  if(!(wprice>=0))return {err:"سعر الجملة لازم يكون رقم."};
  if(!(cost>=0))return {err:"سعر الشراء لازم يكون رقم."};
  const stock=st?numVal(st):0,min=mn?numVal(mn):0;

  if(!(min>=0))return {err:"الحد الأدنى لازم يكون رقم."};
  const packs=[];
  for(const row of m.querySelectorAll("[data-pack]")){const g=k=>row.querySelector(`[data-k="${k}"]`).value.trim();
    const pk={name:g("name"),n:numVal(g("n")),price:Math.round(numVal(g("price"))),wprice:g("wprice")?Math.round(numVal(g("wprice"))):0,barcode:normDigits(g("barcode"))};
    if(!pk.name&&!g("n")&&!g("price"))continue;
    if(!pk.name)return {err:"اكتب اسم الوحدة الكبيرة (مثل كارتون)."};
    if(!(pk.n>0))return {err:`اكتب كم ${unit} بـ «${pk.name}».`};
    if(!(pk.price>=0))return {err:`اكتب سعر «${pk.name}».`};
    if(!(pk.wprice>=0))return {err:`سعر جملة «${pk.name}» لازم يكون رقم.`};
    packs.push(pk)}
  if(new Set(packs.map(k=>k.name)).size!==packs.length)return {err:"أكو وحدتين بنفس الاسم."};
  if([...S.products.values()].some(x=>x.id!==p.id&&foldAr(x.name)===foldAr(name)))return {err:"أكو مادة بنفس الاسم."};
  const codes=[barcode,...packs.map(k=>k.barcode)].filter(Boolean);

  for(const c of codes){const f=[...S.products.values()].find(x=>x.id!==p.id&&(x.barcode===c||packsOf(x).some(k=>k.barcode===c)));if(f)return {err:`الباركود ${c} مسجل على «${f.name}».`}}

  if(ot){const on=Math.round(numVal(v("ofN"))),op=Math.round(numVal(v("ofP"))),oto=v("ofTo");
    if(!(op>0))return {err:"اكتب سعر العرض."};
    if(ot==="price"&&!(op<price))return {err:"سعر العرض لازم يكون أقل من سعر المفرد."};
    if(ot==="qty"){if(weighed)return {err:"المادة اللي تنباع بالوزن عرضها «سعر خاص» للكيلو."};
      if(!(on>=2))return {err:"اكتب عدد العرض (2 أو أكثر)."};
      if(!(op<on*price))return {err:`سعر العرض لازم يكون أقل من ${fmt(on*price)} (سعر ${on} بدون عرض).`}}

  if(plu){const f=[...S.products.values()].find(x=>x.id!==p.id&&isWeighed(x)&&x.plu&&String(Number(x.plu))===plu);if(f)return {err:`رقم الميزان ${plu} مسجل على «${f.name}».`}}

        if((Number(p.cost)||0)!==o.cost)ch.push(`سعر الشراء إلى ${fmt(o.cost)}`);
        if(o.track&&"stock" in patch)ch.push(`الكمية إلى ${qtyText(o.stock)}`);
        if(p.name!==o.name)ch.push(`الاسم من ${p.name}`);
        if(pa!==undefined)ch.push(pa?"الصورة":"شال الصورة");
        const ofs=x=>x&&x.type?(x.type==="qty"?`عرض ${x.n} بـ ${fmt(x.price)}`:`سعر عرض ${fmt(x.price)}`)+(x.to?` لحد ${x.to}`:""):"";
        if(ofs(p.offer)!==ofs(o.offer))ch.push(o.offer?ofs(o.offer):"شال العرض");
        if(ch.length)log("edit","product",{detail:`عدّل ${o.name}: ${ch.join("، ")}`});
      }
      closeModal();renderProducts();renderHeader();toast(isNew?"انضافت المادة":"انحفظ التعديل");
      // Adding items one after another, except on the receiving list, where the new item goes back to its invoice line.
      if(isNew&&S.view!=="recv")setTimeout(()=>productForm(),50);
    });
  },"wide");
}
/* ---------- item photos ----------
   One small photo per item, so the cashier sees at a glance that the tapped or scanned item is the right one. Each photo is
   its own document in "itemPhotos" (id = the item's id), so the item list stays light; the item carries pic (the time its
   photo was saved), so the app knows which items have one and which copy is current. Photos load as they come into view. */
const PICS=new Map(),picWait=new Map();
const picKey=p=>p.id+":"+p.pic;
const picUrl=p=>p&&p.pic?PICS.get(picKey(p))||"":"";
function loadPic(p){
  const k=picKey(p);if(PICS.has(k))return Promise.resolve(PICS.get(k));if(picWait.has(k))return picWait.get(k);
  const ref=db.collection("itemPhotos").doc(p.id);
  const pr=ref.get({source:"cache"}).catch(()=>null).then(d=>d&&d.exists&&Number(d.data().at)===Number(p.pic)?d:ref.get())
    .then(d=>{const u=d.exists?d.data().data||"":"";PICS.set(k,u);return u}).finally(()=>picWait.delete(k));
  picWait.set(k,pr);return pr;
}
const picImg=(p,cls)=>{if(p&&p.pic)return `<img class="${cls}" data-pic="${esc(p.id)}" alt=""${picUrl(p)?` src="${picUrl(p)}"`:""}>`;
  const u=stockPic(p);return u?`<img class="${cls}" src="${u}" alt="" loading="lazy">`:""};
/* Ready-made fruit photos (img/fruit, from the Fruits-360 photo set; credits in img/fruit/CREDITS.md). A fruit item with no
   photo of its own shows the one that matches its name, so «تفاح أحمر» or «رمان» get a picture without the owner taking one.
   Only items under a fruit or vegetable category (or sold by weight) are matched, so «عصير برتقال» never gets an orange.
   The owner's own photo always wins, and removing the ready-made one in the item form keeps it off (noStock). */
const FRUIT_PICS=[["apple-green","تفاح اخضر"],["apple-yellow","تفاح اصفر|تفاح ذهبي|تفاح كولدن|تفاح جولدن"],["apple-red","تفاح"],
  ["grape-black","عنب اسود|عنب احمر|عنب ديس"],["grape-white","عنب"],["mandarin","لالنكي|يوسفي|مندرين|كلمنتين"],
  ["grapefruit","سندي|كريب فروت|جريب فروت|ليمون هندي"],["sweet-lime","نومي حلو|نومي"],["orange","برتقال"],["banana","موز"],
  ["pomegranate","رمان"],["peach","خوخ|دراق|نكتارين"],["apricot","مشمش"],["pear","عرموط|كمثري|اجاص"],["kiwi","كيوي"],
  ["strawberry","فراوله|شليك"],["cherry","كرز"],["fig","تين"],["plum","الوجه|عنجاص|برقوق"],["guava","جوافه|كوافه"],
  ["mango","منكا|منكه|مانجو|مانكو|منجا"],["avocado","افوكادو"],["dates","تمر"],["watermelon","رقي|بطيخ احمر|حبحب"],
  ["melon","بطيخ|شمام"],["quince","سفرجل"],["persimmon","كاكا|كاكي|خرما"],["pineapple","اناناس"],["coconut","جوز هند|نارجيل"]]
  .map(([s,ws])=>[s,new RegExp(`(^| )(ال|وال)?(${ws.split("|").map(w=>w.replace(/ /g," (ال)?")).join("|")})(ه|ات)?(?= |$)`)]);
const stockMemo=new Map();
function stockPic(p){
  if(!p||p.pic||p.noStock)return "";
  const k=p.name+"|"+(p.category||"")+"|"+isWeighed(p);if(stockMemo.has(k))return stockMemo.get(k);
  let u="";
  if(/فواك|خضر/.test(foldAr(p.category||""))||isWeighed(p)){
    const n=foldAr(p.name||"").replace(/[^\u0621-\u064a0-9]+/g," ").trim();
    const hit=FRUIT_PICS.find(([,re])=>re.test(n));if(hit)u="img/fruit/"+hit[0]+".webp"}
  stockMemo.set(k,u);return u;
}
const hasPic=p=>!!(p&&(p.pic||stockPic(p)));
let picIO=null;
function fillPic(img){const p=S.products.get(img.dataset.pic);if(!p||!p.pic){img.remove();return}
  loadPic(p).then(u=>{if(u)img.src=u;else img.remove()}).catch(()=>img.remove())}
function hydratePics(root){
  if(!root||!db)return;
  const imgs=root.querySelectorAll("img[data-pic]:not([src])");if(!imgs.length)return;
  if(!picIO&&"IntersectionObserver" in window)picIO=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){picIO.unobserve(e.target);fillPic(e.target)}},{rootMargin:"300px"});
  imgs.forEach(img=>{const u=picUrl(S.products.get(img.dataset.pic));if(u)img.src=u;else if(picIO)picIO.observe(img);else fillPic(img)});
}
// A scanned item's photo flashes at the top of the screen for a moment, so the cashier can check it against what is in hand.
let flashT=0;
function flashItem(p,pack){
  const sp=stockPic(p);if(!p||!p.pic&&!sp)return;
  (p.pic?loadPic(p):Promise.resolve(sp)).then(u=>{if(!u)return;let f=$("#flash");
    if(!f){f=document.createElement("div");f.id="flash";f.className="flash";f.setAttribute("aria-hidden","true");document.body.appendChild(f)}
    f.innerHTML=`<img src="${u}" alt=""><div><b>${esc(p.name)}${pack?` (${esc(pack.name)})`:""}</b><span class="num">${fmt(priceFor(p,pack||null,S.whole))}</span></div>`;
    f.hidden=false;clearTimeout(flashT);flashT=setTimeout(()=>{f.hidden=true},1800)}).catch(()=>{});
}
// The photo box in the item forms: take a photo, pick one, or remove it. The change is saved with the form (commitPic).
const picFieldHtml=x=>`<div class="pic-edit"><div class="pic-prev" id="${x}Prev"></div><div class="pic-btns">
  <label class="btn sm">${I.camera}تصوير المادة<input type="file" accept="image/*" capture="environment" hidden id="${x}Cam"></label>
  <label class="btn sm">من المعرض<input type="file" accept="image/*" hidden id="${x}Gal"></label>
  <button class="btn sm ghost danger-text" type="button" id="${x}Del">${I.trash}شيل الصورة</button></div></div>`;
function picField(m,x,p,init){
  const st=init||{url:"",changed:false},prev=m.querySelector("#"+x+"Prev"),del=m.querySelector("#"+x+"Del");
  if(!init&&p&&!p.pic&&stockPic(p)){st.url=stockPic(p);st.stock=true}
  const show=()=>{prev.innerHTML=st.url?`<img src="${st.url}" alt="صورة المادة">`:I.camera;prev.classList.toggle("empty",!st.url);del.hidden=!st.url;
    prev.title=st.stock?"صورة جاهزة، تكدر تصوّر المادة بدالها":""};
  const pick=async f=>{if(!f)return;try{const r=await shrinkImage(f,480,.8);st.url=r.url;st.changed=true;st.stock=false;show()}catch(e){console.warn(e);toast("تعذّر فتح الصورة.")}};
  m.querySelector("#"+x+"Cam").addEventListener("change",e=>pick(e.target.files[0]));
  m.querySelector("#"+x+"Gal").addEventListener("change",e=>pick(e.target.files[0]));
  del.onclick=()=>{if(st.stock){st.stock=false;st.noStock=true}st.url="";st.changed=true;show()};
  if(!init&&p&&p.pic)loadPic(p).then(u=>{if(!st.changed){st.url=u;show()}}).catch(()=>{});
  show();return st;
}
// Saves a changed photo. Returns the item's new pic: a time, null when the photo was removed, undefined when unchanged.
function commitPic(id,st){
  if(!st||!st.changed)return undefined;
  if(!st.url){try{db.collection("itemPhotos").doc(id).delete().catch(()=>{})}catch(e){}return null}
  const at=Date.now();PICS.set(id+":"+at,st.url);
  try{db.collection("itemPhotos").doc(id).set({id,data:st.url,at,by:S.me.name}).catch(writeFail)}catch(e){writeFail(e)}
  return at;
}
/* ---------- linking barcodes ----------
   Scan an item from the shelf, then pick its name: the code is saved on that item, or a new item is made with it.
   This is how the ready-made list (names and prices, no barcodes) gets its barcodes. */
function linkCodeForm(code,after){
  if(!canItems())return;

  openModal(`<h3>باركود جديد</h3><p class="hint">الباركود <b class="num">${esc(code)}</b> مو مسجل. اختار المادة اللي عليها وينحفظ عليها.</p>

    <ul class="rows lk-list" id="lkL"></ul>

    const draw=()=>{const t=normDigits(q).trim();let list=[...S.products.values()];
      list=t?list.map(p=>({p,s:matchScore(p.name,t,p.category)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||noCode(b.p)-noCode(a.p)||a.p.name.localeCompare(b.p.name,"ar")).map(x=>x.p)
        :list.filter(noCode).sort((a,b)=>listTodo(b)-listTodo(a)||a.name.localeCompare(b.name,"ar"));
      m.querySelector("#lkL").innerHTML=list.length?list.slice(0,40).map(p=>`<li><button class="r" type="button" data-lk="${esc(p.id)}"><div class="m"><b>${esc(p.name)}</b>
          <span>${esc(p.category||"")}${p.barcode?` · عليها <span class="num">${esc(p.barcode)}</span>`:""}</span></div><div class="a"><span class="num">${fmt(p.price)}</span></div></button></li>`).join("")
        :`<li class="empty">${t?"ماكو مادة بهذا الاسم. سوّيها «مادة جديدة».":"كل المواد عليها باركود. ابحث بالاسم."}</li>`};
    const inp=m.querySelector("#lkQ");inp.addEventListener("input",()=>{q=inp.value;draw()});draw();setTimeout(()=>inp.focus(),30);
    inp.addEventListener("keydown",e=>{if(e.key!=="Enter")return;e.preventDefault();const b=m.querySelector("[data-lk]");if(b&&m.querySelectorAll("[data-lk]").length===1)b.click()});

    m.querySelector("#lkNew").onclick=()=>productForm({name:q.trim(),price:"",category:cats()[0],barcode:code,active:true,unit:"حبة",packs:[],__new:true});
  },"wide");
}
function setCode(p,code){

// A code scanned on the items tab: opens its item, or links it.
function codeOnItems(code){
  const t=normDigits(code).trim();if(!t)return;
  const f=findCode(t);if(f){(f.p.est?priceForm:productForm)(f.p);return}

  linkCodeForm(t,p=>{if(p&&p.est)setTimeout(()=>priceForm(p),50)});
}
/* The short form for an item from the ready-made list: its barcode and real sale price (and the purchase price if known).
   Saving it clears «سعر تقديري», so the item leaves the «من القائمة الجاهزة» chip once it also has a barcode. */
function priceForm(p){
  if(!canItems()||!p)return;
  const wg=isWeighed(p),codeOk=!noCode(p)||!!p.barcode;
  openModal(`<h3>${esc(p.name)}</h3><p class="hint">${esc(p.category||"")}${p.est?` · السعر التقديري <span class="num">${fmt(p.price)}</span>، صحّحه لسعر بيعك`:""}</p>
    <form id="qf" class="field" style="gap:12px" novalidate>
      <div class="field"><label for="qCode">الباركود</label><div class="tool-row"><input id="qCode" data-code inputmode="numeric" style="direction:ltr;text-align:right" value="${esc(p.barcode||"")}" placeholder="${wg?"ما يحتاج للمواد اللي تنباع بالوزن":"امسحه بالسكانر أو الكاميرا"}"${codeOk?"":" autofocus"}>${canScan()?`<button class="icon-btn" type="button" id="qScan" aria-label="مسح بالكاميرا">${I.scan}</button>`:""}</div></div>
      <div class="row2"><div class="field"><label for="qPrice">${wg?"سعر بيع الكيلو":"سعر البيع للمفرد"} (${CUR})</label><input id="qPrice" class="big" inputmode="numeric" value="${p.price>0?fmt(p.price):""}" placeholder="0"${codeOk?" autofocus":""}></div>
        <div class="field"><label for="qCost">سعر الشراء</label><input id="qCost" class="big" inputmode="decimal" value="${p.cost>0?fmt(p.cost):""}" placeholder="اختياري"></div></div>
      <span class="help" id="qHelp"></span>
      ${picFieldHtml("qPic")}
      <p class="err" id="qErr"></p>
      <div class="foot"><button class="btn primary" type="submit">${I.check}حفظ</button>${canScan()?`<button class="btn" type="button" id="qNext">${I.scan}حفظ وامسح التالي</button>`:""}<button class="btn" type="button" id="qFull">${I.edit}كل التفاصيل</button><button class="btn" type="button" data-close>رجوع</button></div>
    </form>`,m=>{
    const code=m.querySelector("#qCode"),pr=m.querySelector("#qPrice"),co=m.querySelector("#qCost"),help=m.querySelector("#qHelp"),err=m.querySelector("#qErr");
    const upd=()=>{const v=numVal(pr.value),c=numVal(co.value);help.textContent=!(c>0)||!(v>0)?"":v<c?`أقل من سعر الشراء!`:`الربح ${fmt(v-c)} (${Math.round((v-c)/c*100)}%)`};
    pr.addEventListener("input",upd);co.addEventListener("input",upd);upd();
    if(document.activeElement===pr)pr.select();
    code.addEventListener("keydown",e=>{if(e.key!=="Enter")return;e.preventDefault();pr.focus();pr.select()});
    const pic=picField(m,"qPic",p,p.__picSt);
    const draft=()=>({...p,barcode:normDigits(code.value).trim(),price:numVal(pr.value)>=0?numVal(pr.value):p.price,cost:numVal(co.value)>=0?numVal(co.value):p.cost,__picSt:pic});
    const sc=m.querySelector("#qScan");if(sc)sc.onclick=()=>{const d=draft();scanBarcode(c=>priceForm({...d,barcode:c}))};
    m.querySelector("#qFull").onclick=()=>productForm(S.products.get(p.id)||p);
    const save=next=>{err.textContent="";
      const c=normDigits(code.value).trim(),v=Math.round(numVal(pr.value)),cs=co.value.trim(),cost=cs?numVal(cs):0;
      if(!(v>0)){err.textContent="اكتب سعر البيع.";pr.focus();return}
      if(!(cost>=0)){err.textContent="سعر الشراء لازم يكون رقم.";return}
      if(c){const f=findCode(c);if(f&&f.p.id!==p.id){err.textContent=`الباركود ${c} مسجل على «${f.p.name}».`;return}}
      const cur=S.products.get(p.id)||p,now=Date.now(),patch={price:v,barcode:c,cost,updatedAt:now,updatedBy:S.me.name},ch=[];
      if(Number(cur.price)!==v||cur.est)ch.push(`السعر ${fmt(v)}`);if((cur.barcode||"")!==c)ch.push(c?`الباركود ${c}`:"شال الباركود");if((Number(cur.cost)||0)!==cost)ch.push(`سعر الشراء ${fmt(cost)}`);
      if(cur.est)patch.est=firebase.firestore.FieldValue.delete();
      const pa=commitPic(p.id,pic);if(pa)patch.pic=pa;else if(pa===null)patch.pic=firebase.firestore.FieldValue.delete();if(pa!==undefined)ch.push(pa?"الصورة":"شال الصورة");if(pic.noStock)patch.noStock=true;
      S.products.set(p.id,{...cur,price:v,barcode:c,cost,updatedAt:now,updatedBy:S.me.name,est:false,...(pa!==undefined?{pic:pa||0}:{}),...(pic.noStock?{noStock:true}:{})});
      try{db.collection("products").doc(p.id).set(patch,{merge:true}).catch(writeFail)}catch(x){writeFail(x)}
      if(ch.length)log("edit","product",{detail:`عدّل ${cur.name}: ${ch.join("، ")}`});
      closeModal();renderProducts();toast(`انحفظت «${cur.name}»`,1500);
      if(next)scanBarcode(codeOnItems);
    };
    m.querySelector("#qf").addEventListener("submit",e=>{e.preventDefault();save(false)});
    const nx=m.querySelector("#qNext");if(nx)nx.onclick=()=>save(true);
  });
}
/* Receiving stock: add a quantity (in the base unit or a pack), optionally with the new purchase price and expiry date. */
function restockForm(p){
  const packs=packsOf(p);let unit=packs.find(k=>k.n>1)||null;
  openModal(`<h3>استلام كمية: ${esc(p.name)}</h3><p class="hint">${tracked(p)?`بالمخزن هسه <b>${stockHtml(p)}</b>.`:"هاي المادة ما متابَعة كميتها، تصير متابَعة من هسه."}</p>
    <form id="rf" class="field" style="gap:12px" novalidate>
      ${packs.length?`<div class="seg" role="group" aria-label="الوحدة">${[null,...packs].map(k=>`<button type="button" data-unit="${esc(k?k.name:"")}" aria-pressed="${(unit?unit.name:"")===(k?k.name:"")}">${esc(k?`${k.name} (${qtyText(k.n)})`:baseUnit(p))}</button>`).join("")}</div>`:""}
      <div class="row2"><div class="field"><label for="rQ">الكمية</label><input id="rQ" class="big" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label for="rC" id="rCl">سعر الشراء للوحدة (اختياري)</label><input id="rC" class="big" inputmode="decimal" placeholder="${p.cost>0?fmt(Math.round(p.cost*(unit?unit.n:1))):""}"></div></div>
      <div class="field"><label for="rE">تاريخ انتهاء هاي الكمية (اختياري)</label><input id="rE" type="date"></div>
      <p class="hint" id="rSum"></p><p class="err" id="rErr"></p>
      <div class="foot"><button class="btn primary" type="submit">إضافة للمخزن</button><button class="btn" type="button" data-close>رجوع</button></div>
    </form>`,m=>{
    const q=m.querySelector("#rQ"),sum=m.querySelector("#rSum"),n=()=>unit?unit.n:1;
    const upd=()=>{const v=numVal(q.value);sum.textContent=v>0?`ينضاف ${qtyText(round3(v*n()))} ${baseUnit(p)}، ويصير المخزن ${qtyText(round3((tracked(p)?stockOf(p):0)+v*n()))} ${baseUnit(p)}.`:""};
    q.addEventListener("input",upd);
    m.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{unit=packs.find(k=>k.name===b.dataset.unit)||null;m.querySelectorAll("[data-unit]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
      m.querySelector("#rC").placeholder=p.cost>0?fmt(Math.round(p.cost*n())):"";upd()});
    m.querySelector("#rf").addEventListener("submit",e=>{e.preventDefault();
      const v=numVal(q.value),cv=m.querySelector("#rC").value.trim(),c=cv?numVal(cv):0,exp=m.querySelector("#rE").value;
      if(!(v>0)){m.querySelector("#rErr").textContent="اكتب الكمية.";return}
      if(!(c>=0)){m.querySelector("#rErr").textContent="سعر الشراء لازم يكون رقم.";return}
      const add=round3(v*n()),patch={stock:firebase.firestore.FieldValue.increment(add),track:true,updatedAt:Date.now(),updatedBy:S.me.name};
      if(!tracked(p))patch.stock=add;

      // The nearest expiry date is the one that matters for the warning.
      if(exp&&(!p.expiry||exp<p.expiry||daysTo(p.expiry)<0))patch.expiry=exp;
      try{db.collection("products").doc(p.id).update(patch).catch(writeFail)}catch(x){writeFail(x)}
      log("add","product",{detail:`استلم ${qtyText(v)} ${unit?unit.name:baseUnit(p)} ${p.name}${c>0?` بسعر ${fmt(c)}`:""}`});
      closeModal();toast("انضافت الكمية للمخزن");
    });
  });
}

/* ---------- stocktake (جرد), owner only ----------
   The owner counts what is on the shelves, by typing the number or scanning each piece. Every count remembers the stock
   the app showed at that moment, so sales made while counting are kept: saving adds (counted − shown) to the stock.
   The count in progress stays on this device until it is saved; the saved stocktake is kept as a record. */
function loadCount(){try{const d=JSON.parse(localStorage.getItem(COUNT_KEY)||"null");S.count=d&&d.items&&typeof d.items==="object"?d:null}catch(e){S.count=null}}
function saveCount(){try{if(S.count)localStorage.setItem(COUNT_KEY,JSON.stringify(S.count));else localStorage.removeItem(COUNT_KEY)}catch(e){}}
// Untracked items have no stock to compare with: counting one starts tracking it at the counted quantity.
const countDiff=(p,e)=>e&&e.tr?round3(e.q-e.sys):null;
function countRows(){
  if(!S.count)return [];
  return Object.entries(S.count.items).map(([id,e])=>{const p=S.products.get(id);return p?{p,e,diff:countDiff(p,e)}:null}).filter(Boolean);
}
function countTotals(){

    fresh:rows.filter(r=>r.diff===null).length,shortValue:val(r=>r.diff<0),extraValue:val(r=>r.diff>0)};

function setCount(p,q){

/* ---------- price changes ----------
   Every change of an item's sale or wholesale price is kept in prices/{id}: the item, the old and new price, who changed it
   and when. The device that made the change writes the record: it sees its own unsaved write in the items listener, so every
   way of changing a price (the item form, the quick price form, Excel, a photo list) is caught in one place.
   Everyone else gets told: a toast when it happens, a note on the selling screen and a dot on the account button until they
   open the list, and «سعر جديد» on the item's tile for a day. */
const PRSEEN_KEY="shahm-pos-prseen",DEV_KEY="shahm-pos-dev";
const PW=new Map();let prSince=0;
function devId(){try{let d=localStorage.getItem(DEV_KEY);if(!d){d=uid();localStorage.setItem(DEV_KEY,d)}return d}catch(e){return "-"}}
function prSeen(){try{const v=Number(localStorage.getItem(PRSEEN_KEY));if(v>0)return v;const now=Date.now();localStorage.setItem(PRSEEN_KEY,String(now));return now}catch(e){return 0}}
const prOf=d=>({price:Math.round(Number(d.price)||0),wprice:Math.round(Number(d.wprice)||0),est:!!d.est});
function priceWatch(s){
  for(const ch of s.docChanges()){
    const id=ch.doc.id;if(ch.type==="removed"){PW.delete(id);continue}
    const d=ch.doc.data(),o=PW.get(id),n=prOf(d);
    // A ready-made item's estimated price getting its real price is setting it up, not a change.
    if(ch.type==="modified"&&o&&!o.est&&ch.doc.metadata.hasPendingWrites&&(n.price!==o.price||n.wprice!==o.wprice))logPrice(id,d,o,n);
    PW.set(id,n);
  }
}
function logPrice(pid,d,o,n){
  if(!S.me)return;
  const x={id:uid(),pid,name:String(d.name||"").slice(0,80),from:o.price,to:n.price,...(n.wprice!==o.wprice?{wfrom:o.wprice,wto:n.wprice}:{}),
    by:S.me.name,byId:S.me.id,byRole:S.me.role,dev:devId(),at:Date.now()};
  if(S.prices&&!S.prices.some(y=>y.id===x.id))S.prices.unshift(x);
  try{db.collection("prices").doc(x.id).set(x).catch(e=>{console.warn(e);if(e&&e.code==="permission-denied"&&!S.prDenied){S.prDenied=true;toast("سجل الأسعار ما انحفظ: لازم تنشر قواعد Firestore الجديدة.",6000)}})}catch(e){console.warn(e)}
}
function watchPrices(){
  prSince=Date.now();prSeen();  // a device's first start counts from now, not from old changes
  unsubs.push(db.collection("prices").orderBy("at","desc").limit(60).onSnapshot(s=>{
    const fresh=[];
    for(const ch of s.docChanges())if(ch.type==="added"){const x=ch.doc.data();if(x.at>=prSince-5000&&x.dev!==devId())fresh.push(x)}
    S.prices=s.docs.map(d=>d.data());
    if(fresh.length){const x=fresh[0];if(navigator.vibrate)navigator.vibrate([60,60,60]);
      toast(fresh.length>1?`تغيّر سعر ${fresh.length} مواد. شوفها من التنبيه بشاشة البيع.`:`تغيّر سعر «${x.name}»: ${priceMove(x)} (${x.by})`,6000)}
    refresh("prices");
  },e=>console.warn(e)));
}
const priceMove=x=>`من ${fmt(x.from)} إلى ${fmt(x.to)}`;
// Changes made on other devices since this device last opened the list.
const prNew=()=>(S.prices||[]).filter(x=>x.at>prSeen()&&x.dev!==devId());
const prRecent=pid=>(S.prices||[]).some(x=>x.pid===pid&&x.to!==x.from&&Date.now()-x.at<864e5);

// The item form shows its own price history.
function priceHist(pid,el){
  if(!el)return;
  db.collection("prices").where("pid","==",pid).limit(30).get().then(s=>{
    const list=s.docs.map(d=>d.data()).sort((a,b)=>b.at-a.at).slice(0,8);
    el.innerHTML=list.length?`<details class="pr-hist"><summary>آخر تغيير للسعر: ${priceMove(list[0])} · ${esc(list[0].by||"")} · ${esc(whenText(list[0].at))}</summary><ul class="rows">${list.map(x=>prRow(x,false)).join("")}</ul></details>`:"";
  }).catch(e=>console.warn(e));
}

/* ---------- receiving (استلام المواد), owner only ----------
   The day's delivery goes on one list: scan each item (a carton's barcode counts a carton) or pick it by name, type how many
   came and, if it changed, the purchase price. Saving adds every quantity to the stock in one go and keeps the list as a
   record with its supplier. The list in progress stays on this device until it is saved. */
const RECV_KEY="shahm-pos-recv";
function loadRecv(){try{const d=JSON.parse(localStorage.getItem(RECV_KEY)||"null");S.rv=d&&Array.isArray(d.lines)?d:null}catch(e){S.rv=null}}
function saveRecv(){try{if(S.rv&&(S.rv.lines.length||S.rv.supId||S.rv.guess||(S.rv.unk&&S.rv.unk.length)))localStorage.setItem(RECV_KEY,JSON.stringify(S.rv));else localStorage.removeItem(RECV_KEY)}catch(e){}}
const rvOpen=()=>!!(S.rv&&(S.rv.lines.length||(S.rv.unk&&S.rv.unk.length)));
const rvKey=l=>l.pid+"|"+(l.u||"");
// The line's unit: the item's own unit (n = 1) or one of its packs (n pieces), so the stock grows by q × n.
function rvUnit(p,u){const k=u?packsOf(p).find(x=>x.name===u):null;return k?{name:k.name,n:k.n}:{name:"",n:1}}
function rvRows(){
  return S.rv?S.rv.lines.map(l=>{const p=S.products.get(l.pid);if(!p)return null;const u=rvUnit(p,l.u);return {l,p,u,add:round3((Number(l.q)||0)*u.n)}}).filter(Boolean):[];
}
function rvTotals(){
  const all=rvRows(),rows=all.filter(r=>r.add>0);
  return {rows,n:rows.length,empty:all.length-rows.length,cost:Math.round(rows.reduce((a,r)=>a+(r.l.c>0?r.l.c*r.l.q:0),0)),priced:rows.filter(r=>r.l.c>0).length};
}
function rvStart(){if(!S.rv)S.rv={startedAt:Date.now(),by:S.me.name,supId:"",lines:[]};return S.rv}
// Adds q to the item's line (a new line has no count yet when q is 0, and its count box gets the cursor). The newest line goes on top.
function recvAdd(p,u,q){
  if(!p)return;rvStart();
  const k=p.id+"|"+(u||"");let l=S.rv.lines.find(x=>rvKey(x)===k);
  if(l){S.rv.lines.splice(S.rv.lines.indexOf(l),1);l.q=round3((Number(l.q)||0)+(q||0))}
  else l={pid:p.id,u:u||"",q:round3(q||0),c:0};
  S.rv.lines.unshift(l);S.rq="";saveRecv();renderRecv();
  const row=$(`[data-rvrow="${CSS.escape(k)}"]`);if(row){row.classList.add("hit");setTimeout(()=>row.classList.remove("hit"),900)}
  if(!q){const i=$(`[data-rvq="${CSS.escape(k)}"]`);if(i){i.focus();i.select()}}
  else{const r=$("#rq");if(r&&!matchMedia("(pointer:coarse)").matches)r.focus()}
}
function recvCode(code){
  const t=normDigits(code).trim();if(!t)return;S.rvPend=null;
  const f=findCode(t),sc=f?null:scaleCode(t);
  if(f){recvAdd(f.p,f.pack?f.pack.name:"",1);sound("add");if(navigator.vibrate)navigator.vibrate(40);
    const l=S.rv.lines[0];toast(`${f.p.name}: ${qtyText(l.q)} ${l.u||baseUnit(f.p)}`,1500);return}
  if(sc&&sc.p){const kg=sc.kg||(sc.p.price>0?round3(sc.amt/sc.p.price):0);if(kg>0){recvAdd(sc.p,"",kg);sound("add");return}}
  sound("err");
  if(sc){toast(`رقم الميزان ${sc.plu} مو مربوط بأي مادة.`,3000);return}
  // A code that is on no item yet: put it on its item, or make a new one, and the item joins the list.
  S.rvPend=t;linkCodeForm(t,p=>{if(p){S.rvPend=null;recvAdd(p,"",1)}});
}

  return `<b><span class="num">${t.n}</span> مادة${t.empty?` · <span class="num">${t.empty}</span> بدون عدد`:""}</b>
    <span>${t.cost?`مجموع الشراء <span class="num">${fmt(t.cost)}</span> ${CUR}${t.priced<t.n?` (<span class="num">${t.n-t.priced}</span> بدون سعر)`:""}`:"اكتب سعر الشراء إذا تريد تعرف المجموع"}${S.rv.invTotal?` · الفاتورة <span class="num">${fmt(S.rv.invTotal)}</span>${S.rv.invTotal!==t.cost?` <span class="chip warn">مو مطابق</span>`:` <span class="chip paid">مطابق</span>`}`:""}</span>`;
}

function renderRecvList(){
  const el=$("#rvlist");if(!el)return;
  // Keep the cursor where it was: live stock updates redraw the list while someone is typing a count.
  const f=document.activeElement,fa=f&&f.dataset?(f.dataset.rvq?"rvq":f.dataset.rvc?"rvc":""):"",fk=fa?f.dataset[fa]:"",sel=fa?[f.selectionStart,f.selectionEnd]:null;
  const rows=rvRows();
  el.innerHTML=rows.length?rows.map(rvRowHtml).join("")
    :`<li class="empty"><b>ما انضافت مواد بعد</b>امسح باركود كل مادة وصلت (باركود الكارتون يحسب كارتون)، أو اكتب اسمها واختارها، أو اختارها من «خلصت أو قربت تخلص»، أو صوّر الفاتورة.</li>`;
  if(fa){const i=el.querySelector(`[data-${fa}="${CSS.escape(fk)}"]`);if(i){i.focus();try{i.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}
function rvInfo(p,add){
  const after=round3((tracked(p)?stockOf(p):0)+add);
  return `${tracked(p)?`بالمخزن ${stockHtml(p)}`:`<span class="chip zero">تبدأ تتابَع</span>`}${add>0?` · يصير <span class="num rv-after">${qtyText(after)}</span> ${esc(baseUnit(p))}`:""}`;
}
function rvRowHtml({l,p,u,add}){
  const k=rvKey(l),packs=packsOf(p),cost=Number(p.cost)>0?Math.round(p.cost*u.n):0;
  return `<li class="crow rvrow${add>0?" done":""}" data-rvrow="${esc(k)}">
    <div class="m"><b>${esc(p.name)}</b><span class="rvi">${rvInfo(p,add)}</span></div>
    <div class="rv-in"><input data-rvq="${esc(k)}" inputmode="decimal" value="${l.q>0?qtyText(l.q):""}" placeholder="العدد" aria-label="العدد اللي وصل: ${esc(p.name)}">
      ${packs.length?`<select data-rvu="${esc(k)}" aria-label="الوحدة: ${esc(p.name)}">${[{name:"",n:1},...packs].map(x=>`<option value="${esc(x.name)}"${x.name===(l.u||"")?" selected":""}>${esc(x.name?`${x.name} (${qtyText(x.n)})`:baseUnit(p))}</option>`).join("")}</select>`:`<span class="rv-u">${esc(baseUnit(p))}</span>`}
      <input data-rvc="${esc(k)}" class="rv-c" inputmode="decimal" value="${l.c>0?fmt(l.c):""}" placeholder="${cost?`شراء ${fmt(cost)}`:"سعر الشراء"}" aria-label="سعر الشراء لل${esc(u.name||baseUnit(p))}: ${esc(p.name)}">
      <button class="icon-btn" type="button" data-rvdel="${esc(k)}" aria-label="شيل ${esc(p.name)} من القائمة">${I.close}</button></div></li>`;
}
function rvLine(k){return S.rv?S.rv.lines.find(l=>rvKey(l)===k):null}
function rvInput(inp){
  const isQ=!!inp.dataset.rvq,l=rvLine(inp.dataset.rvq||inp.dataset.rvc);if(!l)return;
  const raw=inp.value.trim(),v=parseAmt(raw);if(raw&&!(v>=0))return;
  if(isQ)l.q=raw?round3(v):0;else l.c=raw?v:0;saveRecv();
  const p=S.products.get(l.pid),row=inp.closest(".rvrow");
  if(p&&row){const add=round3((Number(l.q)||0)*rvUnit(p,l.u).n);row.classList.toggle("done",add>0);row.querySelector(".rvi").innerHTML=rvInfo(p,add)}
  $("#rvsum").innerHTML=rvSumHtml();const sv=$('[data-act="rvsave"]');if(sv)sv.disabled=!rvOpen();
}
// Changing a line's unit (pieces ↔ cartons) joins it with a line already in that unit.
function rvUnitChange(sel){
  const l=rvLine(sel.dataset.rvu);if(!l)return;
  const o=S.rv.lines.find(x=>x!==l&&x.pid===l.pid&&(x.u||"")===sel.value);
  if(o){o.q=round3((Number(o.q)||0)+(Number(l.q)||0));if(!(o.c>0))o.c=l.c;S.rv.lines.splice(S.rv.lines.indexOf(l),1)}
  else{l.u=sel.value;l.c=0}
  saveRecv();renderRecvList();$("#rvsum").innerHTML=rvSumHtml();
}
function renderRecvSug(){
  const el=$("#rvsug");if(!el)return;
  const q=normDigits(S.rq).trim();
  if(!q||/^\d+$/.test(q)){el.innerHTML="";return}
  const list=productList().map(p=>({p,s:matchScore(p.name,q,p.category)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,6).map(x=>x.p);
  el.innerHTML=list.length?list.map(p=>`<li><button class="r" type="button" data-rvadd="${esc(p.id)}"><div class="m"><b>${esc(p.name)}</b><span>${esc(p.category||"بدون صنف")} · ${tracked(p)?`بالمخزن ${stockHtml(p)}`:"ما متابَعة"}</span></div><div class="a">${I.plus}</div></button></li>`).join("")
    :`<li class="empty">ماكو مادة بهذا الاسم. إذا جديدة سوّيها من «المواد».</li>`;
}

  const low=$("#rvlow"),hist=$("#rvhist");
  if(low){
    const inList=new Set(S.rv?S.rv.lines.map(l=>l.pid):[]);
    const list=productList().filter(p=>!inList.has(p.id)).map(p=>({p,a:alertsOf(p)})).filter(x=>x.a.includes("out")||x.a.includes("low"))
      .sort((a,b)=>b.a.includes("out")-a.a.includes("out")||a.p.name.localeCompare(b.p.name,"ar")).slice(0,40);
    low.innerHTML=`<h2>خلصت أو قربت تخلص</h2>${list.length?`<ul class="rows">${list.map(({p,a})=>`<li><button class="r" type="button" data-rvadd="${esc(p.id)}"><div class="m"><b>${esc(p.name)}</b><span>بالمخزن ${stockHtml(p)}</span></div>
      <div class="a"><span class="chip ${a.includes("out")?"debt":"warn"}">${ALERT_TEXT[a.includes("out")?"out":"low"]}</span></div></button></li>`).join("")}</ul>`
      :`<div class="empty">ماكو مادة ناقصة. المواد تطلع هنا لمن تخلص، أو تنزل عن «نبهني إذا نزلت عن».</div>`}`;
  }
  if(hist)hist.innerHTML=`<h2>الاستلامات السابقة</h2>${S.recvs&&S.recvs.length?`<ul class="rows">${S.recvs.map(x=>`<li><button class="r" type="button" data-recv="${esc(x.id)}">
      <div class="m"><b>${esc(x.sup||"بدون مجهّز")}</b><span>${esc(dayName(x.date))} · ${esc(hm12(x.at))} · <span class="num">${x.n}</span> مادة</span></div>
      <div class="a">${x.cost?`<span class="num">${fmt(x.cost)}</span>`:"—"}</div></button></li>`).join("")}</ul>`
    :`<div class="empty">${S.recvs?"ماكو استلام محفوظ بعد.":"…"}</div>`}`;
}

    <div class="field"><label for="rvN">ملاحظة (اختياري)</label><input id="rvN" maxlength="120" value="${S.rv&&S.rv.inv?esc("فاتورة "+S.rv.inv):""}" placeholder="مثلاً: رقم الفاتورة، أو باقي له 50 ألف"></div>

function saveReceipt(note){
  const t=rvTotals();if(!t.n)return;
  const now=Date.now(),id=uid(),FV=firebase.firestore.FieldValue,meta={updatedAt:now,updatedBy:S.me.name},s=rvSup();
  // Lines of one item (pieces and cartons) make one write; a new purchase price is kept per piece.
  const per=new Map();
  for(const r of t.rows){const x=per.get(r.p.id)||{p:r.p,add:0,cost:0};x.add=round3(x.add+r.add);if(r.l.c>0)x.cost=Math.round(r.l.c/r.u.n*100)/100;per.set(r.p.id,x)}
  const writes=[...per.values()].map(({p,add,cost})=>[db.collection("products").doc(p.id),{...(tracked(p)?{stock:FV.increment(add)}:{stock:add,track:true}),...(cost>0?{cost}:{}),...meta}]);
  const rec={id,at:now,date:todayISO(),by:S.me.name,byId:S.me.id,supId:s?s.id:"",sup:s?s.name:"",supPhone:s?s.phone||"":"",note,n:t.n,cost:t.cost,
    ...(S.rv.inv?{inv:S.rv.inv}:{}),...(S.rv.invTotal?{invTotal:S.rv.invTotal}:{}),
    items:t.rows.map(r=>({pid:r.p.id,name:r.p.name,unit:r.u.name||baseUnit(r.p),n:r.u.n,q:r.l.q,add:r.add,base:baseUnit(r.p),c:r.l.c>0?r.l.c:null}))};
  const a=activityDoc("add","stock",{detail:`استلام ${t.n} مادة${s?` من ${s.name}`:""}${t.cost?` بشراء ${fmt(t.cost)}`:""}`});
  const chunks=[];for(let i=0;i<writes.length;i+=450)chunks.push(writes.slice(i,i+450));
  chunks.forEach((ch,ci)=>{const b=db.batch();for(const [ref,patch] of ch)b.update(ref,patch);
    if(ci===chunks.length-1)b.set(db.collection("activity").doc(a.id),a);b.commit().catch(writeFail)});
  // The record is written on its own, so the stock is never held back by it.
  try{db.collection("receipts").doc(id).set(rec).catch(e=>{console.warn(e);toast("الكميات انضافت للمخزن، بس سجل الاستلام ما انحفظ.",5000)})}catch(e){console.warn(e)}
  S.rv=null;saveRecv();
  if(S.recvs)S.recvs.unshift(rec);
  closeModal();renderRecv();recvModal(rec);toast("انحفظ الاستلام وانضافت الكميات للمخزن");
}
function fetchRecvs(){
  if(S.recvs)return;S.recvs=[];
  db.collection("receipts").orderBy("at","desc").limit(20).get()
    .then(s=>{S.recvs=s.docs.map(d=>d.data());if(S.view==="recv")renderRecvSide()})
    .catch(e=>{console.warn(e);if(S.view==="recv")renderRecvSide()});
}

/* ---------- Excel files (.xlsx), with no library ----------

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

const XL_COLS=[
  ["name","اسم المادة",["اسم المادة","الاسم","المادة","اسم","اسم الصنف","البيان","name","item","product"],28],
  ["barcode","الباركود",["الباركود","باركود","الكود","كود","رمز","barcode","code"],18],
  ["category","الصنف",["الصنف","القسم","الفئة","النوع","المجموعة","category"],16],

  ["price","سعر المفرد",["سعر المفرد","سعر البيع","السعر","سعر","البيع","price"],12],
  ["wprice","سعر الجملة",["سعر الجملة","الجملة","wholesale"],12],
  ["cost","سعر الشراء",["سعر الشراء","الشراء","الكلفة","التكلفة","cost"],12],
  ["stock","الكمية",["الكمية","المخزن","المخزون","العدد","الرصيد","stock","qty","quantity"],10],
  ["min","الحد الأدنى",["الحد الأدنى","الحد","min"],11],
  ["expiry","تاريخ الانتهاء",["تاريخ الانتهاء","الانتهاء","الصلاحية","انتهاء الصلاحية","expiry"],14],
  ["weighed","بالوزن",["بالوزن","وزن","weighed"],8],
  ["packName","الوحدة الكبيرة",["الوحدة الكبيرة","وحدة كبيرة","الكارتون","اسم الكارتون"],14],
  ["packN","بيها كم",["بيها كم","كم بيها","العدد بالكارتون","عدد الكارتون","عدد القطع"],9],
  ["packPrice","سعر الوحدة الكبيرة",["سعر الوحدة الكبيرة","سعر الكارتون"],15],
  ["packW","جملة الوحدة الكبيرة",["جملة الوحدة الكبيرة","جملة الكارتون","سعر جملة الكارتون"],15],
  ["packCode","باركود الوحدة الكبيرة",["باركود الوحدة الكبيرة","باركود الكارتون"],20],

const xlHead=h=>foldAr(String(h)).replace(/[()\[\]:*_\-]/g," ").replace(/\s+/g," ").trim();
// Finds the heading row (the one naming the most known columns) and which column is which.
function xlMap(rows){
  let best=null;
  for(let r=0;r<Math.min(rows.length,10);r++){
    const heads=rows[r].map(xlHead),map={};
    for(const [key,,names] of XL_COLS){const i=heads.findIndex((h,ci)=>h&&names.some(n=>xlHead(n)===h)&&!Object.values(map).includes(ci));if(i>=0)map[key]=i}
    for(const [key,,names] of XL_COLS){if(key in map)continue;
      const i=heads.findIndex((h,ci)=>h&&!Object.values(map).includes(ci)&&names.some(n=>xlHead(n).length>=4&&h.includes(xlHead(n))));if(i>=0)map[key]=i}
    const n=Object.keys(map).length;
    if("name" in map&&n>=2&&(!best||n>best.n))best={row:r,map,n,unknown:rows[r].map((h,ci)=>String(h).trim()&&!Object.values(map).includes(ci)?String(h).trim():"").filter(Boolean)};
  }

}
const xlText=v=>typeof v==="number"?(Number.isInteger(v)?v.toFixed(0):String(v)):normDigits(String(v??"")).trim();
const xlNum=v=>{if(typeof v==="number")return v;const t=xlText(v);return t?parseAmt(t):NaN};
function xlCode(v){
  if(typeof v==="number")return v.toFixed(0);
  const t=xlText(v).replace(/\s/g,"");
  return /^\d(\.\d+)?e\+\d+$/i.test(t)?Number(t).toFixed(0):t;
}
function xlDate(v){
  if(typeof v==="number"&&v>20000&&v<80000)return new Date(Date.UTC(1899,11,30)+v*864e5).toISOString().slice(0,10);
  const t=xlText(v);let m;
  if((m=t.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/)))return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if((m=t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/)))return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;

const xlYes=v=>/^(نعم|اي|ايه|صح|1|yes|y|true|✓|✔)$/i.test(foldAr(xlText(v)));
// Works out what an import will do, without writing anything.
function xlPlan(rows,head,withStock){
  const M=head.map,cell=(r,k)=>k in M?r[M[k]]:"",has=(r,k)=>k in M&&xlText(r[M[k]])!=="";
  const byCode=new Map(),byName=new Map();
  for(const p of S.products.values()){if(p.barcode)byCode.set(p.barcode,p);for(const k of packsOf(p))if(k.barcode)byCode.set(k.barcode,p);byName.set(foldAr(p.name),p)}
  const adds=[],updates=[],skips=[],seen=new Set();let same=0;
  rows.slice(head.row+1).forEach((r,i)=>{
    const line=head.row+i+2,name=xlText(cell(r,"name")).slice(0,80);
    if(!r.some(v=>xlText(v)!==""))return;
    if(!name){skips.push({line,why:"بدون اسم"});return}
    const code=has(r,"barcode")?xlCode(cell(r,"barcode")):"";
    const key=code||foldAr(name);if(seen.has(key)){skips.push({line,name,why:"مكررة بالملف"});return}seen.add(key);
    const num=k=>has(r,k)?xlNum(cell(r,k)):null;
    const f={price:num("price"),wprice:num("wprice"),cost:num("cost"),stock:num("stock"),min:num("min"),packN:num("packN"),packPrice:num("packPrice"),packW:num("packW")};
    const bad=Object.entries(f).find(([,v])=>v!==null&&!(v>=0));
    if(bad){skips.push({line,name,why:`«${XL_COLS.find(c=>c[0]===bad[0])[1]}» مو رقم`});return}
    const exp=has(r,"expiry")?xlDate(cell(r,"expiry")):null;
    if(exp===null&&has(r,"expiry")){skips.push({line,name,why:"تاريخ الانتهاء مو مفهوم"});return}
    const weighed=has(r,"weighed")?xlYes(cell(r,"weighed")):null;
    const pk=has(r,"packName")&&f.packN>0?{name:xlText(cell(r,"packName")).slice(0,20),n:f.packN,price:Math.round(f.packPrice||0),wprice:Math.round(f.packW||0),barcode:has(r,"packCode")?xlCode(cell(r,"packCode")):""}:null;
    const p=(code&&byCode.get(code))||byName.get(foldAr(name));
    if(code&&p&&byCode.has(code)&&byCode.get(code)!==p){skips.push({line,name,why:`الباركود مسجل على «${byCode.get(code).name}»`});return}
    if(pk&&pk.barcode&&byCode.has(pk.barcode)&&byCode.get(pk.barcode)!==p){skips.push({line,name,why:`باركود الوحدة الكبيرة مسجل على «${byCode.get(pk.barcode).name}»`});return}
    if(!p){
      if(f.price===null){skips.push({line,name,why:"مادة جديدة بدون سعر"});return}
      const w=weighed===true||xlText(cell(r,"unit"))==="كغم",track=f.stock!==null;
      adds.push({name,price:Math.round(f.price),category:xlText(cell(r,"category")).slice(0,30),barcode:code,unit:w?"كغم":xlText(cell(r,"unit")).slice(0,15)||"حبة",weighed:w,
        wprice:Math.round(f.wprice||0),cost:f.cost||0,packs:pk&&pk.name?[pk]:[],track,min:f.min||0,expiry:exp||"",offer:null,active:true,...(track?{stock:round3(f.stock)}:{})});
      if(code)byCode.set(code,{name});return}
    const patch={},ch=[];
    const set=(k,v,label)=>{if(v===null||v===undefined)return;if((p[k]??"")===v||(typeof v==="number"&&Number(p[k]||0)===v))return;patch[k]=v;ch.push(label)};
    set("price",f.price===null?null:Math.round(f.price),`السعر ${fmt(f.price)}`);
    set("wprice",f.wprice===null?null:Math.round(f.wprice),`الجملة ${fmt(f.wprice)}`);
    set("cost",f.cost,`الشراء ${fmt(f.cost)}`);
    if(has(r,"category"))set("category",xlText(cell(r,"category")).slice(0,30),"الصنف");
    if(has(r,"unit")&&!isWeighed(p))set("unit",xlText(cell(r,"unit")).slice(0,15),"الوحدة");
    if(code&&!p.barcode)set("barcode",code,"الباركود");
    set("min",f.min,"الحد الأدنى");
    if(exp)set("expiry",exp,"الانتهاء");
    if(weighed!==null&&weighed!==isWeighed(p)){patch.weighed=weighed;if(weighed)patch.unit="كغم";ch.push(weighed?"بالوزن":"مو بالوزن")}
    if(pk&&pk.name){const old=packsOf(p).find(k=>k.name===pk.name);
      if(!old||old.n!==pk.n||old.price!==pk.price||(old.wprice||0)!==pk.wprice||(pk.barcode&&old.barcode!==pk.barcode)){
        patch.packs=[...packsOf(p).filter(k=>k.name!==pk.name),{...old,...pk,barcode:pk.barcode||(old&&old.barcode)||""}];ch.push(pk.name)}}
    if(withStock&&f.stock!==null&&(!tracked(p)||round3(f.stock)!==round3(stockOf(p)))){patch.__stock=round3(f.stock);ch.push(`الكمية ${qtyText(round3(f.stock))}`)}
    if(ch.length)updates.push({p,patch,ch});else same++;
  });
  return {adds,updates,skips,same,stockCol:"stock" in head.map};
}
