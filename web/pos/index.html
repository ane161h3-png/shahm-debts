<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كاشير ماركت الشهم</title>
<meta name="description" content="كاشير ماركت الشهم: بيع كاش أو بالدين على حساب الزبون بدفتر الديون، وتقرير مبيعات يومي.">
<meta name="theme-color" content="#0e5a3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كاشير الشهم">
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
/* Cashier (POS) for Al-Shahm Market: a separate app next to the debt book, same Firebase project and accounts.
   Wide: catalog on the right, cart on the left. Narrow: catalog with a cart bar at the bottom that opens the cart as a sheet.
   Colors and fonts follow BRAND.md; the tokens below are the same as web/index.html. */
:root{
  --bg:#f4f2ec; --paper:#ffffff; --paper-2:#f8f6f1; --line:#e3ded3; --ink:#1c2421; --muted:#5e6660;
  --accent:#0e5a3a; --accent-ink:#fff7e8; --accent-soft:#dceee3; --debt:#c2301e; --debt-soft:#fce9e5; --paid:#4a7f12; --paid-soft:#edf5e0; --warn:#a55f00; --warn-soft:#fdf0dc;
  --shadow:0 1px 2px rgba(28,36,33,.06),0 8px 24px rgba(28,36,33,.07); --shadow-fab:0 6px 18px rgba(14,90,58,.35);
  --brand-orange:#f39a1e; --brand-tomato:#e2412b; --brand-leaf:#7bc043; --brand-cream:#fff7e8; --brand-deep:#083b26;
  --f-brand:"Lalezar","Tajawal",sans-serif;
  --f-display:"Tajawal","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Tajawal",Tahoma,"Segoe UI",sans-serif;
  --r:14px; --r-ctl:10px; --r-modal:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --paper:#172019; --paper-2:#1e2921; --line:#2c3830; --ink:#ecf1ec; --muted:#9aa59d;
  --accent:#5fc48c; --accent-ink:#06200f; --accent-soft:#1b3527; --debt:#ff8a78; --debt-soft:#3a1f1b; --paid:#a6d86a; --paid-soft:#243319; --warn:#f5b654; --warn-soft:#3a2c14;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); --shadow-fab:0 6px 18px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --paper:#172019; --paper-2:#1e2921; --line:#2c3830; --ink:#ecf1ec; --muted:#9aa59d;
  --accent:#5fc48c; --accent-ink:#06200f; --accent-soft:#1b3527; --debt:#ff8a78; --debt-soft:#3a1f1b; --paid:#a6d86a; --paid-soft:#243319; --warn:#f5b654; --warn-soft:#3a2c14;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); --shadow-fab:0 6px 18px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl}
button,input,textarea,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance}

/* ---------- gate ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding-inline:16px;padding-block:24px}
.gate-card{width:100%;max-width:420px;background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.gate-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.logo{width:64px;height:64px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;position:relative}
.logo svg{width:74%;height:74%;display:block}
.gate-head h1{margin:6px 0 0;font-family:var(--f-brand);font-weight:400;font-size:26px;color:var(--accent)}
.gate-head p{margin:0;color:var(--muted)}
.banner{border-radius:12px;padding:10px 14px;font-size:14px}
.banner.bad{background:var(--debt-soft);color:var(--debt)}
.banner.ok{background:var(--paid-soft);color:var(--paid)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner a{color:inherit;font-weight:700}
.pw{position:relative}
.pw input{padding-left:70px!important}
.pw button{position:absolute;left:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;padding:6px 8px;font-size:13px}
.gate-foot{text-align:center;color:var(--muted);font-size:14px}
.gate-foot a{color:var(--accent);font-weight:600}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);margin:8px auto}
@media (prefers-reduced-motion:no-preference){.spinner{animation:spin 0.9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}

/* ---------- shell ---------- */
.app{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:12px 24px;display:flex;flex-direction:column;gap:12px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .logo{width:42px;height:42px;border-radius:12px}
.brand .logo .tag{position:absolute;bottom:-4px;left:-4px;width:20px;height:20px;border-radius:50%;background:var(--brand-orange);color:var(--brand-deep);display:grid;place-items:center;border:2px solid var(--bg)}
.brand .logo .tag svg{width:12px;height:12px}
.brand h1{margin:0;font-family:var(--f-brand);font-weight:400;font-size:21px;line-height:1.3;color:var(--accent)}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.me{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 6px;border:1px solid var(--line);border-radius:99px;background:var(--paper);font-size:13.5px;cursor:pointer}
.me .nm{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:30px;height:30px;flex:none;border-radius:50%;background:var(--paper-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);color:var(--accent);font-size:13px}
.role{font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tabs button svg{width:18px;height:18px}
.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.pane{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
@media (max-width:760px){
  header.top{gap:10px}.tabs{order:3;width:100%}.tabs button{flex:1;justify-content:center;padding:8px 6px}
  .me .nm,.me .role{display:none}
}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line);background:var(--paper);padding:9px 14px;border-radius:var(--r-ctl);cursor:pointer;font-family:var(--f-display);font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--paper-2)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.debt{background:var(--debt);border-color:var(--debt);color:var(--paper)}
.btn.paid{background:var(--paid);border-color:var(--paid);color:var(--paper)}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger-text{color:var(--debt)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%;padding:12px}
.btn svg{width:18px;height:18px;flex:none}
.icon-btn{border:1px solid var(--line);background:var(--paper-2);border-radius:var(--r-ctl);width:42px;height:42px;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.icon-btn svg{width:20px;height:20px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--paper-2);border-radius:var(--r-ctl);padding:10px 12px;width:100%}
.field input:focus,.field select:focus,.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.field input.big{font-size:24px;font-family:var(--f-display);font-weight:700;text-align:left;direction:ltr}
.field .help{font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.row3{grid-template-columns:1fr 1fr}.row3>.field:last-child{grid-column:1/-1}}
fieldset.sec{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
fieldset.sec legend{padding:0 6px;font-family:var(--f-display);font-weight:700;font-size:14px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
input:disabled{opacity:.55}
.pack{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:end;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.pack .icon-btn{justify-self:end}
.modal.wide{max-width:620px}
.pack .field input{padding:8px 8px}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;padding:10px 38px 10px 12px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--paper-2);height:42px}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{border:1px solid var(--line);background:var(--paper-2);border-radius:99px;padding:5px 13px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;flex:none}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip.debt{background:var(--debt-soft);color:var(--debt)}
.chip.paid{background:var(--paid-soft);color:var(--paid)}
.chip.zero{background:var(--paper-2);color:var(--muted)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.seg{display:flex;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-ctl);padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:14px;cursor:pointer;color:var(--muted);font-weight:600;font-family:var(--f-display)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button[data-pm="debt"][aria-pressed="true"],.seg button[data-pm="part"][aria-pressed="true"]{color:var(--debt)}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.err{color:var(--debt);font-size:13px;min-height:1em;margin:0}
.hint{color:var(--muted);font-size:13px;margin:0}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--line);background:var(--paper-2);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.quick button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- sell ---------- */
.sell{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:12px;align-items:start}
.catalog{display:flex;flex-direction:column;min-height:calc(100vh - 110px)}
.cat-tools{padding:12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);border-radius:var(--r) var(--r) 0 0;z-index:2}
.tool-row{display:flex;gap:8px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;padding:12px}
.tile{position:relative;border:1px solid var(--line);background:var(--paper-2);border-radius:12px;padding:12px 10px 10px;cursor:pointer;text-align:right;display:flex;flex-direction:column;gap:6px;min-height:104px;touch-action:manipulation;border-top:3px solid var(--brand-orange)}
.tile:hover{border-color:var(--accent);border-top-color:var(--brand-orange)}
.tile:active{transform:scale(.98)}
.tile .nm{font-weight:600;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex:1}
.tile .pr{font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--accent)}
.tile .ct{font-size:11.5px;color:var(--muted)}
.tile .st{font-size:11.5px;color:var(--muted)}
.tile .st.warn{color:var(--warn);font-weight:700}
.tile .pr small{font-size:11px;font-weight:600;color:var(--warn)}
.tile .pr small.kg{color:var(--muted);margin-inline-start:2px}
.of{font-size:11.5px;font-weight:700;color:var(--debt);background:var(--debt-soft);border-radius:99px;padding:1px 8px;white-space:nowrap;align-self:flex-start;font-family:var(--f-body)}
s.was{color:var(--muted);font-weight:500;font-size:12px}
.wpill{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:5px 12px;font-family:var(--f-display);font-weight:700;cursor:pointer;white-space:nowrap}
.tile .q{position:absolute;top:-8px;left:-6px;min-width:26px;height:26px;padding:0 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;display:grid;place-items:center;font-family:var(--f-display)}
.tile.custom{border-style:dashed;border-top-style:dashed;border-top-color:var(--accent);background:var(--paper);align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-family:var(--f-display)}
.tile.custom svg{width:26px;height:26px}

.cart{display:flex;flex-direction:column;position:sticky;top:12px;height:calc(100vh - 96px);min-height:420px}
.cart-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cart .cart-head h2{margin:0;padding:0;border:0;font-family:var(--f-display);font-size:17px;display:flex;align-items:center;gap:6px}
.cart-lines{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:120px}
.cart-lines li{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.cart-lines .info{flex:1;min-width:0;cursor:pointer;border:0;background:none;text-align:right;padding:0}
.cart-lines .info b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart-lines .info span{font-size:12.5px;color:var(--muted)}
.cart-lines .lt{font-family:var(--f-display);font-weight:700;min-width:70px;text-align:left}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:99px;background:var(--paper-2)}
.stepper button{width:32px;height:32px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--accent);border-radius:50%;touch-action:manipulation}
.stepper button svg{width:16px;height:16px}
.stepper .num{min-width:26px;text-align:center;font-weight:700;font-family:var(--f-display)}
.cart-foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.tot-row{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.tot-row b{color:var(--ink)}
.tot-row.disc button{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0}
.grand{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grand span{font-family:var(--f-display);font-weight:700;font-size:16px}
.grand b{font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--accent)}
.charge{width:100%;padding:15px;font-size:19px;border-radius:12px;box-shadow:var(--shadow-fab)}
.cartbar{display:none}
.ro-note{margin:12px}

@media (max-width:900px){
  .sell{grid-template-columns:minmax(0,1fr)}
  .catalog{min-height:0;padding-bottom:84px;border-radius:var(--r)}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .tile{min-height:96px;padding:10px 8px 8px}
  .cart{position:fixed;inset:0;top:auto;height:auto;min-height:0;max-height:92vh;border-radius:18px 18px 0 0;z-index:15;transform:translateY(105%);transition:transform .2s ease;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  body.show-cart .cart{transform:none}
  body.show-cart::after{content:"";position:fixed;inset:0;background:rgba(8,20,14,.45);z-index:14}
  .cart-foot{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .cartbar{display:flex;position:fixed;inset-inline:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:10;gap:8px}
  .cartbar .open{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;border-radius:14px;padding:13px 16px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:16px;box-shadow:var(--shadow-fab);cursor:pointer}
  .cartbar .open b{font-size:19px;font-weight:800}
  .cartbar .open .cnt{background:var(--accent-ink);color:var(--accent);border-radius:99px;padding:0 9px;font-size:14px;margin-left:8px}
}
@media (min-width:901px){.cart .close-cart{display:none}}

/* ---------- reports ---------- */
.rep-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rep-tools input[type=date]{border:1px solid var(--line);background:var(--paper);border-radius:var(--r-ctl);padding:8px 10px;height:42px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rep-tools input[type=month]{border:1px solid var(--line);background:var(--paper);border-radius:var(--r-ctl);padding:8px 10px;height:42px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.stat .v small{font-size:12px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.stat.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);border-bottom:4px solid var(--brand-orange)}
.stat.main .k,.stat.main .v small{color:inherit;opacity:.85}
.v.debt{color:var(--debt)}.v.paid{color:var(--paid)}
.rep-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:start}
.rep-side{display:flex;flex-direction:column;gap:12px}
.pane h2{margin:0;padding:12px 14px;font-family:var(--f-display);font-size:16px;border-bottom:1px solid var(--line)}
.rows{list-style:none;margin:0;padding:0}
.rows li{border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0}
.rows .r{display:flex;align-items:center;gap:10px;padding:10px 14px;width:100%;border:0;background:none;text-align:right;cursor:pointer}
.rows .r:hover{background:var(--paper-2)}
.rows .r .m{flex:1;min-width:0}
.rows .r .m b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .r .m span{font-size:12.5px;color:var(--muted)}
.rows .r .a{font-family:var(--f-display);font-weight:700;text-align:left}
.rows .r .a small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.rows li.void .m b,.rows li.void .a>.num{text-decoration:line-through;color:var(--muted)}
.rows .r.static{cursor:default}.rows .r.static:hover{background:none}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats .stat.main{grid-column:1/-1}.rep-grid{grid-template-columns:minmax(0,1fr)}}

/* ---------- discount requests (owner) ---------- */
.apvs{display:flex;flex-direction:column;gap:8px}
.apv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--warn)}
.apv .m{flex:1;min-width:200px}
.apv .m span{display:block;font-size:12.5px;opacity:.85}

/* ---------- products ---------- */
.prod-tools{padding:12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:6px;padding-inline-end:10px}
.prow .r{flex:1;min-width:0}
.prow>.btn{flex:none}
.al{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tabs .badge{background:var(--warn);color:var(--paper);border-radius:99px;font-size:11.5px;padding:0 7px;line-height:18px;margin-inline-start:2px}

/* ---------- stocktake ---------- */
.count-bar{position:sticky;top:0;z-index:3;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--paper);border-radius:var(--r) var(--r) 0 0}
.count-bar .m{flex:1;min-width:200px}
.count-bar .m b{display:block;font-family:var(--f-display)}
.count-bar .m span{font-size:13px;color:var(--muted)}
.crow{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .m{flex:1;min-width:0}
.crow .m b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .m span{font-size:12.5px;color:var(--muted)}
.crow input{width:92px;flex:none;border:1px solid var(--line);background:var(--paper-2);border-radius:var(--r-ctl);padding:8px 10px;font-family:var(--f-display);font-weight:700;font-size:17px;text-align:left;direction:ltr}
.crow input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.crow.done input{border-color:var(--accent);background:var(--accent-soft)}
.crow .cd{min-width:78px;flex:none;text-align:left}
.crow.hit{background:var(--accent-soft)}
@media (max-width:560px){.crow{flex-wrap:wrap}.crow .m{flex-basis:100%}.crow input{flex:1}}

/* ---------- Excel import ---------- */
.xl-file{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:var(--r);padding:22px 14px;text-align:center;cursor:pointer;color:var(--muted)}
.xl-file:hover,.xl-file.over{border-color:var(--accent);color:var(--accent)}
.xl-file b{color:var(--ink);font-family:var(--f-display)}
.xl-file input{position:absolute;width:1px;height:1px;opacity:0}
.xl-list{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-ctl)}
.xl-list li{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.xl-list li:last-child{border-bottom:0}
.xl-list li>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.modal .stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.xl-list small{color:var(--muted)}

/* ---------- modal, sheet, toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,20,14,.5);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--paper);border-radius:var(--r-modal);width:100%;max-width:460px;box-shadow:0 20px 50px rgba(0,0,0,.3);padding:18px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 20px);overflow:auto}
.modal h3{margin:0;font-family:var(--f-display);font-size:18px}
.modal .hint{margin-top:-6px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.due{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.due .k{font-size:13px;color:var(--muted)}
.due .v{font-family:var(--f-display);font-size:34px;font-weight:800;color:var(--accent);line-height:1.2}
#coBody{display:flex;flex-direction:column;gap:10px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split>div{border-radius:10px;padding:8px 12px;font-size:13px}
.split .cash{background:var(--paid-soft);color:var(--paid)}
.split .dbt{background:var(--debt-soft);color:var(--debt)}
.split b{display:block;font-family:var(--f-display);font-size:19px}
.pick-list{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-ctl)}
.pick-list li button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px;cursor:pointer;text-align:right}
.pick-list li:last-child button{border-bottom:0}
.pick-list li button:hover,.pick-list li button[aria-pressed="true"]{background:var(--accent-soft)}
.pick-list li button.new{color:var(--accent);font-weight:600}
.picked{display:flex;align-items:center;gap:10px;border:2px solid var(--accent);border-radius:var(--r-ctl);padding:8px 12px}
.picked .m{flex:1;min-width:0}
.picked .m b{display:block}
.picked .m span{font-size:12.5px;color:var(--muted)}
.done-mark{width:64px;height:64px;border-radius:50%;background:var(--paid-soft);color:var(--paid);display:grid;place-items:center;margin:0 auto}
.done-mark svg{width:36px;height:36px}
.rcpt{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.rcpt .ln{display:flex;justify-content:space-between;gap:10px}
.rcpt .ln span:first-child{min-width:0}
.rcpt hr{border:0;border-top:1px dashed var(--line);margin:6px 0;width:100%}
.rcpt .big{font-family:var(--f-display);font-weight:800;font-size:18px}
.scan-video{width:100%;border-radius:12px;background:var(--ink);aspect-ratio:4/3;object-fit:cover}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{border:1px solid var(--line);background:var(--paper-2);border-radius:12px;padding:12px 0;font-size:22px;font-family:var(--f-display);font-weight:700;cursor:pointer;touch-action:manipulation}
.keypad button:active{transform:scale(.97)}
.keypad .fn{color:var(--muted);font-size:17px}
.menu{display:flex;flex-direction:column;gap:6px}
.menu .btn{justify-content:flex-start}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;z-index:30;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);display:flex;align-items:center;gap:10px}
</style>
</head>

<script>
(function(){
"use strict";
const CUR="د.ع";
const BRAND_MARK=document.querySelector("header.top .logo svg").outerHTML;
const THEME_KEY="shahm-theme",CART_KEY="shahm-pos-cart",COUNT_KEY="shahm-pos-count";
const ROLE_LABEL={owner:"المدير",editor:"محرر",viewer:"مشاهد"};
const DOMAIN="shahm-debts.app",OWNER_USER="admin";
const emailOf=u=>u+"@"+DOMAIN;
const DEBTS_URL="../";
const SLOGAN="كل احتياجات بيتك بشهامة";
// Same default item categories as the debt book (settings/main.categories overrides them).
const DEFAULT_CATS=["مشكل","مواد غذائية","خضروات","فواكه","أجبان وألبان","لحوم ودجاج","معلبات","حلويات","مشروبات","منظفات","خبز ومعجنات","سكائر","كارت رصيد","غاز"];
const S={products:new Map(),customers:new Map(),txns:new Map(),sales:new Map(),settings:{},me:null,isOwner:false,
  view:"sell",cat:"all",q:"",cart:[],discount:0,whole:false,day:"",repDay:"",repMode:"day",repMonth:"",repCache:new Map(),pq:"",pcat:"all",shift:null,shiftLog:null,approvals:new Map(),approval:null,ready:{p:false,s:false,sh:false},
  pos:{},count:null,cq:"",ccat:"all",cshow:"all",cany:false,takes:null};
let db=null,auth=null,unsubs=[],salesUnsub=null,dataOn=false,modalCleanup=null,deniedShown=false;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round(Number(n)||0).toLocaleString("en-US");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const isoOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayISO=()=>isoOf(new Date());
const shiftDay=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return isoOf(d)};
const normDigits=s=>String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
const parseAmt=s=>{const t=normDigits(s).replace(/[,،\s]/g,"");if(!t)return NaN;const n=Number(t);return isFinite(n)?n:NaN};
const dayName=iso=>{try{return new Date(iso+"T12:00:00").toLocaleDateString("ar-IQ",{weekday:"long",day:"numeric",month:"long",numberingSystem:"latn"})}catch(e){return iso}};
const hm12=ms=>{const d=new Date(ms);let h=d.getHours();const ap=h<12?"ص":"م";h=h%12||12;return h+":"+String(d.getMinutes()).padStart(2,"0")+" "+ap};
const shopName=()=>S.settings.shopName||"ماركت الشهم";
// Dollar rate set by the owner (dinars per dollar); 0 when not set.
const usdRate=()=>Number(S.pos.usdRate)>0?Number(S.pos.usdRate):0;
const usdFmt=n=>"$"+(Math.round((Number(n)||0)*100)/100).toLocaleString("en-US",{maximumFractionDigits:2});
// A supermarket's usual sections; shown after the debt book's own list, plus any section an item already uses.
const MARKET_CATS=["مواد غذائية","رز وطحين وسكر","زيوت وسمن","بقوليات وحبوب","معكرونة وشعيرية","معلبات","بهارات وتوابل","صلصات ومربيات","شاي وقهوة",
  "أجبان وألبان","بيض","لحوم ودجاج","مجمدات","أسماك","خضروات","فواكه","خبز ومعجنات","كيك وكرواسون","حلويات وشوكولاتة","بسكويت","مكسرات وكرزات",
  "شيبس وسناكات","آيس كريم","مشروبات","مياه","عصائر","مشروبات طاقة","أغذية وحليب أطفال","حفاضات","منظفات","مناديل وورقيات","عناية شخصية",
  "صابون وشامبو","أدوات منزلية","نايلون وبلاستيك","قرطاسية","بطاريات وكهربائيات","سكائر","معسل وفحم","كارت رصيد","غاز","أكل حيوانات","مشكل"];
const cats=()=>{const base=Array.isArray(S.settings.categories)&&S.settings.categories.length?S.settings.categories:DEFAULT_CATS;
  return [...new Set([...base,...MARKET_CATS,...[...S.products.values()].map(p=>p.category).filter(Boolean)])]};
const isAdmin=()=>S.me&&S.me.role==="owner";
const canSell=()=>S.me&&(S.me.role==="owner"||S.me.role==="editor");
const isSup=c=>c&&c.kind==="supplier";
const qtyText=q=>Number.isInteger(q)?String(q):String(Math.round(q*1000)/1000);
const waNumber=p=>{let d=normDigits(p).replace(/\D/g,"");if(!d)return "";if(d.startsWith("00"))d=d.slice(2);if(d.startsWith("0"))d="964"+d.slice(1);else if(d.length===10&&d.startsWith("7"))d="964"+d;return d};
const foldAr=x=>normDigits(x).toLowerCase().replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ً-ْـ]/g,"").replace(/\s+/g," ").trim();
// Flexible match like the debt book's search: ignores hamza forms, ة/ه, ى/ي, "ال"; every typed word may match anywhere.
function matchScore(text,q,extra){
  const fq=foldAr(q);if(!fq)return 1;
  const name=foldAr(text),strip=w=>w.replace(/^ال/,"");
  if(name===fq)return 10;if(name.startsWith(fq))return 8;if(name.replace(/ /g,"").includes(fq.replace(/ /g,"")))return 6;
  const words=foldAr(text+" "+(extra||"")).split(" ").map(strip);
  return fq.split(" ").map(strip).filter(Boolean).every(t=>words.some(w=>w.includes(t)))?4:0;
}
function custScore(c,q){
  const fq=foldAr(q),digits=fq.replace(/\D/g,"");
  if(digits.length>=3&&digits.length===fq.replace(/\s/g,"").length){const ph=normDigits(c.phone).replace(/\D/g,"");return ph.includes(digits)||ph.includes(digits.replace(/^0/,""))?3:0}
  return matchScore(c.name,q,(c.note||"")+" "+(c.aliases||[]).join(" "));
}
function balanceOf(id){let b=0;for(const t of S.txns.values())if(t.customerId===id)b+=t.type==="debt"?Number(t.amount)||0:-(Number(t.amount)||0);return b}
const I={
  cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.2L20 7H6.3"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m3 7 9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  scan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 8v8M11 8v8M14 8v8M17 8v8"/></svg>',
  keypad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  pdf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 1a4 4 0 0 1-2-2l1-1-1-2z"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z"/><path d="M4 19a2 2 0 0 1 2-2h13"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>',
  sheet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>'
};
function toast(msg,ms){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),ms||2800);
}
function initial(n){return esc((n||"؟").trim().charAt(0)||"؟")}

/* ---------- theme (shared with the debt book) ---------- */
function applyTheme(v){if(v==="dark"||v==="light")document.documentElement.setAttribute("data-theme",v);else document.documentElement.removeAttribute("data-theme")}
try{applyTheme(localStorage.getItem(THEME_KEY))}catch(e){}

/* ---------- modal ---------- */
function openModal(html,onMount,cls){
  closeModal();
  const root=$("#modalRoot");root.innerHTML=`<div class="scrim" id="scrim"><div class="modal ${cls||""}" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim=$("#scrim");scrim.addEventListener("click",e=>{if(e.target===scrim)closeModal()});
  root.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeModal));
  root.querySelectorAll("[data-showpw]").forEach(b=>b.addEventListener("click",()=>{const i=document.getElementById(b.dataset.showpw);const s=i.type==="password";i.type=s?"text":"password";b.textContent=s?"إخفاء":"إظهار"}));

/* ---------- items: units, prices, stock ---------- */
// An item sells in its base unit (حبة، كغم…) and optionally in bigger packs {name, n (base units), price, wprice, barcode}.
// The invoice is retail or wholesale; wholesale uses the wholesale price wherever the owner set one.
const baseUnit=p=>(p&&p.unit)||"حبة";
const packsOf=p=>Array.isArray(p&&p.packs)?p.packs.filter(k=>k&&k.name&&k.n>0):[];
const round3=n=>Math.round(n*1000)/1000;
function priceFor(p,pack,whole){const r=pack?pack.price:p.price,w=pack?pack.wprice:p.wprice;return Math.round(Number(whole&&w>0?w:r)||0)}
const costFor=(p,pack)=>Number(p.cost)>0?Math.round(Number(p.cost)*(pack?pack.n:1)):null;
const tracked=p=>!!(p&&p.track===true);
const isWeighed=p=>!!(p&&p.weighed===true);
const stockOf=p=>Number(p&&p.stock)||0;
const daysTo=iso=>Math.round((new Date(iso+"T12:00:00")-new Date(todayISO()+"T12:00:00"))/864e5);
const EXP_DAYS=30;
// Stock and expiry warnings for one item: out (none left), low (at or under its minimum), expired, expiring (within 30 days).
function alertsOf(p){
  const a=[];if(!p||p.active===false)return a;
  if(tracked(p)){const s=stockOf(p);if(s<=0)a.push("out");else if(Number(p.min)>0&&s<=Number(p.min))a.push("low")}
  if(p.expiry){const d=daysTo(p.expiry);if(d<0)a.push("expired");else if(d<=EXP_DAYS)a.push("expiring")}
  return a;
}
const ALERT_TEXT={out:"خلصت",low:"قربت تخلص",expired:"منتهية",expiring:"قرب انتهاؤها"};
const alertCount=()=>[...S.products.values()].filter(p=>alertsOf(p).length).length;
function findCode(code){
  for(const p of productList()){if(p.barcode&&p.barcode===code)return {p,pack:null};const k=packsOf(p).find(k=>k.barcode&&k.barcode===code);if(k)return {p,pack:k}}
  return null;
}
const stockHtml=p=>`<span class="num">${qtyText(round3(stockOf(p)))}</span> ${esc(baseUnit(p))}`;

/* ---------- offers ----------
   An item can carry one offer: a special price {type:"price",price}, or a quantity deal {type:"qty",n,price}
   (n pieces for price; "buy 2 get 1 free" is 3 for the price of 2), optionally until an end date.
   Offers apply to retail invoices in the item's base unit; the rest of a deal's pieces sell at the usual price. */
function offerOf(p){
  const o=p&&p.offer;if(!o||!(Number(o.price)>0))return null;
  if(o.to&&todayISO()>o.to)return null;
  if(o.type==="price")return {type:"price",price:Math.round(Number(o.price)),to:o.to||""};
  if(o.type==="qty"&&Number(o.n)>=2&&!isWeighed(p))return {type:"qty",n:Math.round(Number(o.n)),price:Math.round(Number(o.price)),to:o.to||""};
  return null;
}
// A quantity deal ({n, price}) reads "3 بـ 1,000"; a special price reads as the price.
const offerHtml=o=>o.n>=2?`<span class="num">${o.n}</span> بـ <span class="num">${fmt(o.price)}</span>`:`<span class="num">${fmt(o.price)}</span>`;
// Sets a line's price for retail or wholesale, with the item's current offer on a retail base-unit line.
function priceLine(l,p,pack,whole){
  l.price=priceFor(p,pack,whole);delete l.was;delete l.deal;
  const o=!pack&&!whole?offerOf(p):null;
  if(o&&o.type==="price"&&o.price<l.price){l.was=l.price;l.price=o.price}
  if(o&&o.type==="qty"&&o.price<o.n*l.price)l.deal={n:o.n,price:o.price};
  return l;
}
// A line's amount: whole deals at the deal price, the remainder at the unit price.
function lineTotal(l){
  const q=Number(l.qty)||0,full=Math.round((Number(l.price)||0)*q);
  if(!l.deal||!(l.deal.n>=2))return full;
  const k=Math.floor(q/l.deal.n+1e-9);
  return Math.min(full,Math.round(k*l.deal.price+(q-k*l.deal.n)*l.price));
}

/* ---------- cart (kept on this device so a power cut never loses a half-made sale) ---------- */
function saveCart(){
  // An approved discount belongs to the invoice it was asked for; any change to the invoice drops it.
  if(S.approval&&(S.cart.reduce((a,l)=>a+lineTotal(l),0)!==S.approval.subtotal||S.discount>S.approval.amount||!S.discount)){
    if(S.discount&&S.cart.length)toast("انشال الخصم لأن الفاتورة تغيّرت. اطلب موافقة جديدة.",3500);S.approval=null;S.discount=0}
  try{localStorage.setItem(CART_KEY,JSON.stringify({cart:S.cart,discount:S.discount,whole:S.whole,approval:S.approval}))}catch(e){}
}
function loadCart(){try{const d=JSON.parse(localStorage.getItem(CART_KEY)||"null");if(d&&Array.isArray(d.cart)){S.cart=d.cart.filter(l=>l&&l.name&&l.price>=0&&l.qty>0).map(l=>({n:1,...l,key:l.pid&&!String(l.key).includes("|")?l.pid+"|":l.key}));S.discount=Number(d.discount)||0;S.whole=!!d.whole;S.approval=d.approval&&d.approval.id?d.approval:null}}catch(e){}}
function totals(){
  const sub=S.cart.reduce((a,l)=>a+lineTotal(l),0);
  const disc=Math.max(0,Math.min(Math.round(S.discount)||0,sub));
  return {sub,disc,total:sub-disc,count:S.cart.reduce((a,l)=>a+l.qty,0)};
}
const lineKey=(p,pack)=>p.id+"|"+(pack?pack.name:"");
function lineFor(p,pack,qty){return priceLine({key:lineKey(p,pack),pid:p.id,unit:pack?pack.name:baseUnit(p),n:pack?pack.n:1,name:p.name,price:0,qty,cat:p.category||"",cost:costFor(p,pack),...(isWeighed(p)&&!pack?{w:1}:{})},p,pack,S.whole)}
// The line key is "<item id>|<pack name>" (empty pack name = the base unit).
function packOfLine(p,l){const nm=String(l.key||"").split("|")[1]||"";return nm?packsOf(p).find(k=>k.name===nm)||null:null}
function addToCart(p,qty,pack){
  if(!canSell())return;
  const l=S.cart.find(x=>x.key===lineKey(p,pack));
  if(l)l.qty=round3(l.qty+(qty||1));else S.cart.push(lineFor(p,pack||null,qty||1));
  saveCart();refresh("cart");
}
function setQty(key,q){
  const l=S.cart.find(x=>x.key===key);if(!l)return;
  if(!(q>0))S.cart=S.cart.filter(x=>x!==l);else l.qty=round3(q);
  if(!S.cart.length){S.discount=0;S.whole=false}saveCart();refresh("cart");
}
function clearCart(){S.cart=[];S.discount=0;S.whole=false;S.approval=null;saveCart();refresh("cart")}
// Switch the whole invoice between retail and wholesale prices.
function setWhole(v){
  S.whole=v;
  for(const l of S.cart){const p=l.pid&&S.products.get(l.pid);if(p)priceLine(l,p,packOfLine(p,l),v)}
  saveCart();refresh("cart");toast(v?"صارت الفاتورة بسعر الجملة":"رجعت الفاتورة لسعر المفرد",1800);
}

function renderCart(){

  el.innerHTML=`<div class="cart-head"><h2>الفاتورة ${S.cart.length?`<span class="chip zero num">${S.cart.length}</span>`:""}</h2>

/* line editing: quantity and unit for everyone, price only for the owner (the editor sells at the listed price) */
function editLine(key,raw){
  const l=S.cart.find(x=>x.key===key);if(!l)return;
  const p=l.pid&&S.products.get(l.pid),packs=p?packsOf(p):[];
  if(!raw&&l.w&&p){weightForm(p,l);return}
  const priceOk=isAdmin()||!l.pid;
  let unit=p?(packOfLine(p,l)||null):null;
  openModal(`<h3>${esc(l.name)}</h3>
    <form id="lnf" class="field" style="gap:12px" novalidate>
      ${packs.length?`<div class="field"><label>الوحدة</label><div class="seg" role="group" aria-label="الوحدة">${[null,...packs].map(k=>`<button type="button" data-unit="${esc(k?k.name:"")}" aria-pressed="${(unit?unit.name:"")===(k?k.name:"")}">${esc(k?`${k.name} (${qtyText(k.n)})`:baseUnit(p))}</button>`).join("")}</div></div>`:""}
      <div class="row2"><div class="field"><label for="lnQ">الكمية</label><input id="lnQ" class="big" inputmode="decimal" value="${qtyText(l.qty)}"><span class="help">للوزن اكتب كسر مثل 0.5</span></div>
      <div class="field"><label for="lnP">السعر</label><input id="lnP" class="big" inputmode="numeric" value="${fmt(l.price)}"${priceOk?"":" readonly"}>${priceOk?"":`<span class="help">السعر يغيره المدير بس.</span>`}</div></div>
      <p class="err" id="lnErr"></p>
      <div class="foot"><button class="btn primary" type="submit">تم</button><button class="btn ghost danger-text" type="button" id="lnDel">${I.trash}حذف من الفاتورة</button><button class="btn" type="button" data-close>رجوع</button></div>
    </form>`,m=>{
    const q=m.querySelector("#lnQ"),pr=m.querySelector("#lnP");q.select();
    m.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{unit=packs.find(k=>k.name===b.dataset.unit)||null;
      m.querySelectorAll("[data-unit]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));pr.value=fmt(priceLine({},p,unit,S.whole).price)});
    m.querySelector("#lnDel").onclick=()=>{setQty(key,0);closeModal()};
    m.querySelector("#lnf").addEventListener("submit",e=>{e.preventDefault();
      const qv=parseAmt(q.value),pv=Math.round(parseAmt(pr.value));
      if(!(qv>0)){m.querySelector("#lnErr").textContent="الكمية لازم تكون أكبر من صفر.";return}
      if(priceOk&&!(pv>=0)){m.querySelector("#lnErr").textContent="اكتب سعر صحيح.";return}
      if(p&&lineKey(p,unit)!==l.key){
        // Unit changed: becomes the line for that unit (merged if that unit is already on the invoice).
        // A price typed by the owner replaces the offer on that line.
        const nl=lineFor(p,unit,qv);if(priceOk&&pv!==nl.price){nl.price=pv;delete nl.was;delete nl.deal}
        const other=S.cart.find(x=>x.key===nl.key);
        if(other){other.qty=round3(other.qty+qv);S.cart=S.cart.filter(x=>x!==l)}else S.cart[S.cart.indexOf(l)]=nl;
        saveCart();refresh("cart");closeModal();return}
      if(priceOk&&pv!==l.price){l.price=pv;delete l.was;delete l.deal}setQty(key,qv);closeModal()});
  });
}

/* ---------- items sold by weight ----------

const WUNIT_KEY="shahm-pos-wunit";

const kgHtml=q=>q>0&&q<1?`<span class="num">${Math.round(q*1000)}</span> غرام`:`<span class="num">${qtyText(q)}</span> كغم`;

    <div class="seg" role="group" aria-label="طريقة البيع"><button type="button" data-wm="w">بالوزن</button><button type="button" data-wm="a">بالمبلغ</button></div>

    </form>`,m=>{
    const inp=m.querySelector("#wv"),wu=m.querySelector("#wu");

      m.querySelector("#wt").textContent=fmt(Math.round(price*q))};

      inp.setAttribute("aria-label",mode==="a"?"المبلغ":"الوزن");inp.placeholder=mode==="a"?"المبلغ":gram?"مثلاً 750":"مثلاً 0.75";
      const qs=mode==="a"?[250,500,1000,2000,5000].map(v=>[v,fmt(v)]):[[.25,"ربع كيلو"],[.5,"نص كيلو"],[.75,"ثلاث أرباع"],[1,"كيلو"],[2,"2 كيلو"]];
      m.querySelector("#wq").innerHTML=qs.map(([v,l])=>`<button type="button" data-wv="${v}">${l}</button>`).join("");
      show()};
    m.querySelectorAll("[data-wm]").forEach(b=>b.onclick=()=>{const q=kg();mode=b.dataset.wm;setFromKg(q);draw();inp.focus()});
    wu.querySelectorAll("[data-wu]").forEach(b=>b.onclick=()=>{const q=kg();gram=b.dataset.wu==="g";try{localStorage.setItem(WUNIT_KEY,gram?"g":"kg")}catch(e){}setFromKg(q);draw();inp.focus()});
    m.querySelector("#wq").addEventListener("click",e=>{const b=e.target.closest("[data-wv]");if(!b)return;const v=Number(b.dataset.wv);
      if(mode==="a")inp.value=fmt(v);else setFromKg(v);show();inp.focus()});

    if(line)setFromKg(line.qty);draw();setTimeout(()=>{inp.focus();inp.select()},20);

      if(q>500){m.querySelector("#wErr").textContent="الوزن كبير هواية. إذا كتبته بالغرام اختار «غرام».";return}
      closeModal();
      if(line)setQty(line.key,q);else{addToCart(p,q,null);toast(`انضاف ${kgText(q)} ${p.name}`,1500)}
    });

}
// Adds an item the usual way, or asks for the weight when it is sold by weight (and not as a ready pack).
function sellItem(p,pack){if(isWeighed(p)&&!pack){weightForm(p);return false}addToCart(p,1,pack||null);return true}

/* ---------- barcode: phone camera and USB scanners that type like a keyboard ----------
   The camera uses the browser's own BarcodeDetector where it exists (Chrome on Android) and the bundled ZXing reader
   everywhere else (iPhone, laptops), so the scan button works on any device with a camera. */
const canScan=()=>!!(window.isSecureContext&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
const SCAN_FORMATS=["ean_13","ean_8","upc_a","upc_e","code_128","code_39","code_93","itf","codabar","qr_code"];
async function nativeDetector(){
  if(!("BarcodeDetector" in window))return null;
  try{const fm=await BarcodeDetector.getSupportedFormats();const use=SCAN_FORMATS.filter(f=>fm.includes(f));if(!use.includes("ean_13"))return null;
    const det=new BarcodeDetector({formats:use});return async v=>{const r=await det.detect(v);return r&&r.length?r[0].rawValue:""}}catch(e){return null}
}
async function zxingDetector(){
  await loadScript("../vendor/zxing.min.js");const Z=window.ZXing;
  const F=Z.BarcodeFormat,hints=new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.CODE_93,F.ITF,F.CODABAR,F.QR_CODE]);
  hints.set(Z.DecodeHintType.TRY_HARDER,true);
  const reader=new Z.MultiFormatReader();reader.setHints(hints);
  // Each frame is copied to our own canvas (at most 960px wide) and decoded from there.
  const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
  return async v=>{
    const k=Math.min(1,960/(v.videoWidth||960));cv.width=Math.round((v.videoWidth||640)*k);cv.height=Math.round((v.videoHeight||480)*k);
    cx.drawImage(v,0,0,cv.width,cv.height);
    try{return reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv))),hints).getText()}catch(e){return ""}};
}
async function scanBarcode(onCode){
  openModal(`<h3>مسح الباركود</h3><p class="hint">وجّه الكاميرا على الباركود وقرّبها لحد ما يوضح.</p><video class="scan-video" id="scv" playsinline muted autoplay></video><p class="err" id="scErr"></p>
    <form id="scf" class="tool-row" novalidate><div class="field" style="flex:1"><input id="scMan" inputmode="numeric" style="direction:ltr;text-align:right" placeholder="أو اكتب الرقم اللي جوة الباركود" aria-label="رقم الباركود"></div><button class="btn" type="submit">تم</button></form>
    <div class="foot"><button class="btn" type="button" data-close>إلغاء</button></div>`,m=>{
    m.querySelector("#scf").addEventListener("submit",e=>{e.preventDefault();const v=normDigits(m.querySelector("#scMan").value).trim();if(v){closeModal();onCode(v)}});
  });
  $("#scMan").blur();
  let stream=null,stop=false,timer=null;
  modalCleanup=()=>{stop=true;clearTimeout(timer);if(stream)stream.getTracks().forEach(t=>t.stop())};
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(stop){stream.getTracks().forEach(t=>t.stop());return}
    const v=$("#scv");v.srcObject=stream;await v.play();
    const detect=(await nativeDetector())||(await zxingDetector());
    const tick=async()=>{if(stop)return;
      if(v.readyState>=2){let code="";try{code=(await detect(v)||"").trim()}catch(e){}
        if(code&&!stop){closeModal();if(navigator.vibrate)navigator.vibrate(60);onCode(normDigits(code));return}}
      timer=setTimeout(tick,150)};
    tick();
  }catch(e){console.warn(e);const er=$("#scErr");if(er)er.textContent=e&&e.name==="NotAllowedError"?"ما انطت صلاحية الكاميرا. فعّلها من إعدادات المتصفح للموقع، أو اكتب الرقم يدوي.":e&&e.name==="NotFoundError"?"ماكو كاميرا بهذا الجهاز. اكتب الرقم يدوي.":"تعذّر تشغيل الكاميرا. اكتب الرقم يدوي."}
}
function sellCode(code){
  const t=normDigits(code).trim();if(!t)return false;
  const f=findCode(t);
  if(f){if(sellItem(f.p,f.pack))toast("انضافت: "+f.p.name+(f.pack?" ("+f.pack.name+")":""),1500);return true}
  toast(isAdmin()?"هذا الباركود مو مسجل. أضفه من تبويب المواد.":"هذا الباركود مو مسجل على أي مادة.",3500);return false;
}
// A USB / Bluetooth scanner types the code fast and presses Enter. Catch it even when no field has focus.
let scanBuf="",scanAt=0;
document.addEventListener("keydown",e=>{
  if(!S.me||(S.view!=="sell"&&!(S.view==="count"&&S.count))||modalOpen())return;
  const tag=(e.target&&e.target.tagName)||"";if(/INPUT|TEXTAREA|SELECT/.test(tag))return;
  const now=Date.now();if(now-scanAt>80)scanBuf="";scanAt=now;
  if(e.key==="Enter"){if(scanBuf.length>=4){if(S.view==="count")countCode(scanBuf);else sellCode(scanBuf);e.preventDefault()}scanBuf="";return}
  if(e.key.length===1)scanBuf+=e.key;
});

/* ---------- checkout ---------- */
function checkout(resume){
  if(!S.cart.length||!canSell())return;
  // A discount without the owner's approval (e.g. from an older version of the app) is not sent.
  if(!isAdmin()&&S.discount>0&&!S.approval){S.discount=0;saveCart();refresh("cart");toast("انشال الخصم لأنه يحتاج موافقة المدير.",3500)}
  const t=totals();
  const st={mode:"cash",cust:null,cashPart:0,received:0,cur:"iqd",usd:0,q:"",...(resume||{})};
  openModal(`<h3>الدفع</h3>
    <div class="due"><span class="k">المطلوب</span><span class="v"><span class="num">${fmt(t.total)}</span> <small style="font-size:16px">${CUR}</small></span></div>
    <div class="seg" role="group" aria-label="طريقة الدفع"><button type="button" data-pm="cash" aria-pressed="false">كاش</button><button type="button" data-pm="debt" aria-pressed="false">دين</button><button type="button" data-pm="part" aria-pressed="false">كاش + دين</button></div>
    <div id="coBody"></div>
    <p class="err" id="coErr"></p>
    <div class="foot"><button class="btn primary" type="button" id="coGo" style="flex:1;padding:13px;font-size:17px">تأكيد البيع</button><button class="btn" type="button" data-close>رجوع</button></div>`,m=>{
    const body=m.querySelector("#coBody"),err=m.querySelector("#coErr");
    const draw=()=>{
      err.textContent="";
      m.querySelectorAll("[data-pm]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.pm===st.mode)));
      if(st.mode==="cash"){
        // Paid in dollars: counted at the owner's rate, and the change goes back in dinars.

          <div class="field"><label for="coRec">${usd?"استلمت دولار ($)":"استلمت من الزبون (اختياري)"}</label><input id="coRec" class="big" inputmode="${usd?"decimal":"numeric"}" placeholder="${usd?String(Math.ceil(need)):fmt(t.total)}" value="${usd?(st.usd||""):st.received?fmt(st.received):""}"></div>
          <div class="quick">${qs.map(v=>`<button type="button" data-rq="${v}">${usd?"$"+v:fmt(v)}</button>`).join("")}</div>

        const rec=body.querySelector("#coRec");
        const upd=()=>{const ch=body.querySelector("#coChange");
          if(usd){st.usd=Math.round((parseAmt(rec.value)||0)*100)/100;const iq=Math.round(st.usd*r);
            if(!(st.usd>0)){ch.hidden=true;return}
            ch.hidden=false;ch.className="banner "+(iq>=t.total?"info":"warn");
            ch.innerHTML=`<b class="num">${usdFmt(st.usd)}</b> = <span class="num">${fmt(iq)}</span> ${CUR}. `+(iq>=t.total?`الباقي للزبون: <b class="num">${fmt(iq-t.total)}</b> ${CUR}`:`ياخذ منه الباقي بالدينار: <b class="num">${fmt(t.total-iq)}</b> ${CUR}`);return}
          st.received=Math.round(parseAmt(rec.value))||0;
          if(st.received>0&&st.received>=t.total){ch.hidden=false;ch.className="banner info";ch.innerHTML=`الباقي للزبون: <b class="num">${fmt(st.received-t.total)}</b> ${CUR}`}
          else if(st.received>0){ch.hidden=false;ch.className="banner warn";ch.innerHTML=`ناقص <b class="num">${fmt(t.total-st.received)}</b> ${CUR}. إذا الباقي دين اختار «جزء كاش والباقي دين».`}
          else ch.hidden=true};
        rec.addEventListener("input",upd);body.querySelectorAll("[data-rq]").forEach(b=>b.onclick=()=>{rec.value=usd?b.dataset.rq:fmt(b.dataset.rq);upd()});upd();
        body.querySelectorAll("[data-cur]").forEach(b=>b.onclick=()=>{st.cur=b.dataset.cur;draw();setTimeout(()=>{const i=m.querySelector("#coRec");if(i)i.focus()},20)});

        refreshPicker=null;return;
      }
      body.innerHTML=`${st.mode==="part"?`<div class="field"><label for="coCash">الكاش اللي دفعه الآن</label><input id="coCash" class="big" inputmode="numeric" placeholder="0" value="${st.cashPart?fmt(st.cashPart):""}"></div>`:""}
        <div id="coSplit"></div>
        <div class="field"><label>الدين على حساب</label><div id="coCust"></div></div>`;
      const cash=body.querySelector("#coCash");
      const split=()=>{const debt=t.total-(st.mode==="part"?st.cashPart:0);
        body.querySelector("#coSplit").innerHTML=st.mode==="part"?`<div class="split"><div class="cash">كاش<b class="num">${fmt(st.cashPart)}</b></div><div class="dbt">دين<b class="num">${fmt(Math.max(0,debt))}</b></div></div>`:"";
        drawCust()};
      if(cash){cash.addEventListener("input",()=>{st.cashPart=Math.max(0,Math.round(parseAmt(cash.value))||0);split()});setTimeout(()=>cash.focus(),20)}
      const drawCust=()=>{
        const box=body.querySelector("#coCust");if(!box)return;
        if(st.cust){const c=S.customers.get(st.cust.id)||st.cust;const bal=balanceOf(c.id),debt=t.total-(st.mode==="part"?st.cashPart:0);
          const over=Number(c.limit)>0&&bal+debt>Number(c.limit);
          box.innerHTML=`<div class="picked"><span class="avatar">${initial(c.name)}</span><div class="m"><b>${esc(c.name)}</b><span>رصيده الحالي <span class="num">${fmt(bal)}</span> ← يصير <span class="num">${fmt(bal+Math.max(0,debt))}</span> ${CUR}</span></div><button class="btn sm" type="button" id="coChg">تغيير</button></div>
            ${over?`<div class="banner warn" style="margin-top:8px">ينتبه: يتجاوز سقف الدين (<span class="num">${fmt(c.limit)}</span> ${CUR}).</div>`:""}`;
          box.querySelector("#coChg").onclick=()=>{st.cust=null;drawCust()};return}
        box.innerHTML=`<label class="search">${I.search}<input id="coQ" type="search" placeholder="ابحث باسم الزبون أو رقمه" autocomplete="off" value="${esc(st.q)}"></label><ul class="pick-list" id="coList" style="margin-top:6px"></ul>`;
        const q=box.querySelector("#coQ"),list=box.querySelector("#coList");
        const fill=()=>{st.q=q.value;
          const arr=[...S.customers.values()].filter(c=>!isSup(c)).map(c=>({c,s:custScore(c,q.value)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||a.c.name.localeCompare(b.c.name,"ar")).slice(0,40);
          list.innerHTML=arr.map(({c})=>{const b=balanceOf(c.id);return `<li><button type="button" data-cid="${esc(c.id)}"><span>${esc(c.name)}</span><span class="chip ${b>0?"debt":"zero"} num">${fmt(b)}</span></button></li>`}).join("")
            +(q.value.trim()?`<li><button type="button" class="new" data-newc="1">+ زبون جديد: ${esc(q.value.trim())}</button></li>`:"")
            +(!arr.length&&!q.value.trim()?`<li class="empty">ماكو زبائن بعد. اكتب اسم الزبون حتى تضيفه.</li>`:"")};
        q.addEventListener("input",fill);fill();
        list.addEventListener("click",e=>{const b=e.target.closest("[data-cid]");if(b){st.cust=S.customers.get(b.dataset.cid);drawCust();return}
          if(e.target.closest("[data-newc]"))newCustomer(q.value.trim(),st)});
        if(!cash)setTimeout(()=>q.focus(),20);
        refreshPicker=()=>{if(document.body.contains(list))fill()};
      };
      split();
    };
    m.querySelectorAll("[data-pm]").forEach(b=>b.onclick=()=>{st.mode=b.dataset.pm;draw()});
    draw();
    m.querySelector("#coGo").onclick=()=>{
      let cash=t.total,debt=0;
      if(st.mode==="debt"){cash=0;debt=t.total}
      if(st.mode==="part"){cash=st.cashPart;debt=t.total-cash;
        if(!(cash>0)){err.textContent="اكتب الكاش اللي دفعه، أو اختار «دين» إذا كله دين.";return}
        if(debt<=0){err.textContent="الكاش يغطي المطلوب كله. اختار «كاش».";return}}
      if(debt>0&&!st.cust){err.textContent="اختار الزبون اللي ينكتب عليه الدين.";return}
      const r=usdRate(),usd=st.mode==="cash"&&st.cur==="usd"&&r>0;
      if(usd&&!(st.usd>0)){err.textContent="اكتب الدولار اللي استلمته.";return}
      if(!usd&&st.mode==="cash"&&st.received>0&&st.received<t.total){err.textContent="المبلغ المستلم أقل من المطلوب.";return}
      m.querySelector("#coGo").disabled=true;
      const sale=saveSale({cash,debt,customer:debt>0?(S.customers.get(st.cust.id)||st.cust):null,received:!usd&&st.mode==="cash"&&st.received>=t.total?st.received:0,
        ...(usd?{usd:st.usd,rate:r,usdIqd:Math.round(st.usd*r)}:{})});
      if(sale)saleDone(sale);
    };
  });
}

// Receipt number: the sale's number within its day (the date is printed next to it everywhere).
function saleNo(){return String(S.sales.size+1)}
const itemName=i=>i.name+(Number(i.n)>1&&i.unit?` (${i.unit})`:"");
const itemQty=i=>i.w?kgText(Number(i.qty)||0):qtyText(i.qty);
const itemOffer=i=>i.deal?`عرض ${i.deal.n} بـ ${fmt(i.deal.price)}`:i.was?`عرض بدل ${fmt(i.was)}`:"";
// What the offers took off an invoice: the usual price of every line minus what it came to.
const offerSaving=items=>items.reduce((a,i)=>a+Math.max(0,Math.round((Number(i.was)||Number(i.price)||0)*(Number(i.qty)||0))-(Number(i.total)||0)),0);
const usdPaidText=s=>`${usdFmt(s.usd)} (= ${fmt(s.usdIqd)} ${CUR})${s.topUp?` + ${fmt(s.topUp)} دينار`:""}`;
function itemsText(items,max){const s=items.map(i=>i.w?`${itemName(i)} ${itemQty(i)}`:`${itemName(i)} ×${qtyText(i.qty)}`).join("، ");return max&&s.length>max?s.slice(0,max-1)+"…":s}
/* One sale = one batch: the sale, and when part of it is on credit, the debt transaction on the customer's account
   (source "pos") plus its activity line, so it shows in the debt book, its activity log and the Telegram reports. */
function saveSale(pay){
  const t=totals(),now=Date.now(),id=uid(),no=saleNo();
  const items=S.cart.map(l=>({pid:l.pid||null,name:l.name,unit:l.unit||"",n:l.n||1,price:Math.round(l.price),qty:l.qty,total:lineTotal(l),cat:l.cat||"",...(l.w?{w:1}:{}),
    ...(l.deal?{deal:l.deal}:{}),...(l.was?{was:l.was}:{}),cost:l.cost>0?l.cost:null}));
  const sale={id,no,at:now,date:todayISO(),items,count:items.length,subtotal:t.sub,discount:t.disc,total:t.total,cash:pay.cash,debt:pay.debt,
    ...(S.whole?{wholesale:true}:{}),...(S.shift?{shiftId:S.shift.id}:{}),...(S.approval&&t.disc>0?{approvalId:S.approval.id}:{}),...(pay.received?{received:pay.received,change:pay.received-t.total}:{}),
    ...(pay.usd?{usd:pay.usd,rate:pay.rate,usdIqd:pay.usdIqd,...(pay.usdIqd>t.total?{change:pay.usdIqd-t.total}:{}),...(pay.usdIqd<t.total?{topUp:t.total-pay.usdIqd}:{})}:{}),by:S.me.name,byId:S.me.id,status:"done"};
  const b=db.batch();
  if(pay.debt>0){
    const c=pay.customer;
    const note=`فاتورة كاشير #${no}: ${itemsText(items,160)}${pay.cash>0?` (دفع ${fmt(pay.cash)} كاش من ${fmt(t.total)})`:""}${t.disc?` خصم ${fmt(t.disc)}`:""}`;
    const txn={id:uid(),customerId:c.id,type:"debt",amount:pay.debt,note,date:sale.date,createdAt:now,by:S.me.name,source:"pos",saleId:id};
    Object.assign(sale,{customerId:c.id,customerName:c.name,customerPhone:c.phone||"",txnId:txn.id});
    b.set(db.collection("txns").doc(txn.id),txn);
    const a=activityDoc("add","debt",{customerName:c.name,amount:pay.debt,detail:`فاتورة كاشير #${no}`});
    b.set(db.collection("activity").doc(a.id),a);
    S.txns.set(txn.id,txn);
  }
  // Stock: each tracked item goes down by what was sold, in base units (a carton of 24 = 24).
  for(const [pid,q] of stockMoves(items))b.update(db.collection("products").doc(pid),{stock:firebase.firestore.FieldValue.increment(-q)});
  if(sale.approvalId)b.update(db.collection("approvals").doc(sale.approvalId),{status:"used",saleId:id,usedAt:now});
  b.set(db.collection("sales").doc(id),sale);
  S.sales.set(id,sale);
  b.commit().catch(e=>{writeFail(e);S.sales.delete(id);if(sale.txnId)S.txns.delete(sale.txnId);refresh("sales")});
  S.cart=[];S.discount=0;S.whole=false;S.approval=null;saveCart();document.body.classList.remove("show-cart");refresh("cart");
  return sale;
}
function stockMoves(items){
  const m=new Map();
  for(const i of items){const p=i.pid&&S.products.get(i.pid);if(!tracked(p))continue;m.set(i.pid,round3((m.get(i.pid)||0)+Number(i.qty)*(Number(i.n)||1)))}
  return m;
}

/* ---------- receipts ---------- */
function receiptText(sale){
  const L=[`*${shopName()}*`,`فاتورة #${sale.no} · ${sale.date} ${hm12(sale.at)}`,""];
  for(const i of sale.items)L.push(`${itemName(i)} × ${itemQty(i)} = ${fmt(i.total)}${itemOffer(i)?` (${itemOffer(i)})`:""}`);
  L.push("");
  const saved=offerSaving(sale.items);if(saved)L.push(`وفّرت بالعروض: ${fmt(saved)}`);
  if(sale.discount)L.push(`المجموع: ${fmt(sale.subtotal)}`,`الخصم: ${fmt(sale.discount)}`);
  L.push(`*المطلوب: ${fmt(sale.total)} ${CUR}*`);
  if(sale.debt>0){if(sale.cash>0)L.push(`واصل كاش: ${fmt(sale.cash)}`);L.push(`على الحساب (دين): ${fmt(sale.debt)}`);
    if(sale.customerId&&S.customers.has(sale.customerId))L.push(`رصيدك الحالي: ${fmt(balanceOf(sale.customerId))} ${CUR}`)}
  else L.push(sale.usd?`الدفع: ${usdPaidText(sale)}`:"الدفع: كاش");
  if(sale.change>0)L.push(`الباقي: ${fmt(sale.change)} ${CUR}`);
  if(sale.status==="void")L.push("","(هذه الفاتورة ملغية)");
  L.push("",SLOGAN);
  return L.join("\n");
}

// Printed colors = light brand tokens (BRAND.md: green bar over an orange line, shop name in Lalezar).
const PDFC={green:"#0e5a3a",orange:"#f39a1e",ink:"#1c2421",muted:"#5e6660",line:"#e3ded3",head:"#f4f2ec",shade:"#f8f6f1",debt:"#c2301e",paid:"#4a7f12"};
const PDF_BRAND="'Lalezar','Tajawal',sans-serif",PDF_F="'IBM Plex Sans Arabic',Tahoma,sans-serif",PDF_D="'Tajawal','IBM Plex Sans Arabic',sans-serif";
async function pdfFonts(){try{await Promise.all(["400 40px Lalezar","700 28px Tajawal","800 28px Tajawal","400 22px 'IBM Plex Sans Arabic'","700 22px 'IBM Plex Sans Arabic'"].map(f=>document.fonts.load(f)));await document.fonts.ready}catch(e){}}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)){res();return}const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}

async function saveFile(filename,blob){
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(mobile&&navigator.canShare){const file=new File([blob],filename,{type:blob.type});
    if(navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:filename});return true}catch(e){if(e&&e.name==="AbortError")return false}}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);return true;
}
/* 80mm receipt drawn on a canvas (Arabic shapes correctly), one long page sized to its content. */
async function receiptPdf(sale){
  toast("جارِ تجهيز الوصل…");if(!await pdfReady())return;
  const W=576,M=28,rowH=34,c=S.customers.get(sale.customerId);

  const saved=offerSaving(sale.items);
  const H=330+lines*rowH*1.6+(sale.discount?60:0)+(saved?30:0)+(sale.debt>0?120:40)+(sale.usd?60:0)+(sale.change>0?34:0)+90;
  const cv=document.createElement("canvas");cv.width=W;cv.height=Math.round(H);const x=cv.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,cv.height);x.fillStyle=PDFC.green;x.fillRect(0,0,W,12);x.fillStyle=PDFC.orange;x.fillRect(0,12,W,4);
  x.direction="rtl";x.textAlign="center";let y=70;
  x.fillStyle=PDFC.green;x.font=`400 40px ${PDF_BRAND}`;x.fillText(shopName(),W/2,y);y+=34;
  x.fillStyle=PDFC.muted;x.font=`400 18px ${PDF_F}`;
  const sub=[S.settings.address,S.settings.phone].filter(Boolean).join(" · ");if(sub){x.fillText(sub,W/2,y);y+=28}
  x.fillStyle=PDFC.ink;x.font=`700 20px ${PDF_F}`;x.fillText(`فاتورة #${sale.no}`,W/2,y+6);y+=32;
  x.fillStyle=PDFC.muted;x.font=`400 18px ${PDF_F}`;x.fillText(`${sale.date} · ${hm12(sale.at)} · ${sale.by}`,W/2,y);y+=22;
  const rule=(dash)=>{x.strokeStyle=PDFC.line;x.lineWidth=2;x.setLineDash(dash?[6,6]:[]);x.beginPath();x.moveTo(M,y);x.lineTo(W-M,y);x.stroke();x.setLineDash([])};
  rule(true);y+=34;
  const lr=(r,l,o)=>{o=o||{};x.font=`${o.w||400} ${o.s||20}px ${o.f||PDF_F}`;x.fillStyle=o.c||PDFC.ink;x.textAlign="right";x.direction="rtl";
    let s=String(r);const maxW=W-2*M-170;while(s.length>2&&x.measureText(s).width>maxW)s=s.slice(0,-2);if(s!==String(r))s+="…";x.fillText(s,W-M,y);
    x.textAlign="left";x.direction="ltr";x.font=`${o.w2||o.w||700} ${o.s2||o.s||20}px ${o.f2||PDF_D}`;x.fillText(l,M,y);x.direction="rtl"};
  for(const i of sale.items){lr(itemName(i),fmt(i.total));y+=24;x.font=`400 16px ${PDF_F}`;x.fillStyle=PDFC.muted;x.textAlign="right";x.direction="rtl";
    x.fillText(`${itemQty(i)} × ${fmt(i.price)}${itemOffer(i)?" · "+itemOffer(i):""}`,W-M,y);y+=rowH*1.6-24}
  y-=14;rule(true);y+=34;
  if(saved){lr("وفّرت بالعروض",fmt(saved),{c:PDFC.debt,s:18});y+=30}

/* ---------- sales reports: one day, or one month ---------- */
const monthOf=iso=>iso.slice(0,7);
const shiftMonth=(ym,n)=>{const d=new Date(ym+"-15T12:00:00");d.setMonth(d.getMonth()+n);return isoOf(d).slice(0,7)};
const monthName=ym=>{try{return new Date(ym+"-15T12:00:00").toLocaleDateString("ar-IQ",{month:"long",year:"numeric",numberingSystem:"latn"})}catch(e){return ym}};
// Reads one day (or one month) of sales once and keeps it; today's sales come from the live listener.
function fetchSales(key,query){
  if(S.repCache.has(key))return S.repCache.get(key);
  S.repCache.set(key,null);
  query.get().then(s=>{S.repCache.set(key,s.docs.map(d=>d.data()));if(S.view==="sales")renderSales()})
    .catch(e=>{S.repCache.delete(key);readFail(e)});
  return null;
}
function daySalesSync(day){
  if(day===S.day)return S.ready.s?[...S.sales.values()]:null;
  return fetchSales(day,db.collection("sales").where("date","==",day));
}
function monthSalesSync(ym){
  const list=fetchSales("m:"+ym,db.collection("sales").where("date",">=",ym+"-01").where("date","<=",ym+"-31"));
  if(!list)return null;
  if(monthOf(S.day)!==ym)return list;
  if(!S.ready.s)return null;
  return [...list.filter(s=>s.date!==S.day),...S.sales.values()];
}
const repList=()=>S.repMode==="month"?monthSalesSync(S.repMonth||monthOf(todayISO())):daySalesSync(S.repDay||todayISO());
/* Totals of a list of sales. Profit = sale price − purchase price, only for items whose purchase price is known,
   minus discounts; sales of items without a purchase price are shown apart so the profit is never overstated silently. */
function summarize(list){
  const ok=list.filter(s=>s.status!=="void");
  const sum=k=>ok.reduce((a,s)=>a+(Number(s[k])||0),0);
  const items=new Map(),who=new Map(),byCat=new Map(),days=new Map();let cost=0,costed=0,uncosted=0;
  for(const s of ok){
    let sp=0;
    for(const i of s.items||[]){const k=i.pid||("c:"+i.name);const x=items.get(k)||{name:i.name,unit:baseUnitName(i),qty:0,total:0,profit:0,costed:true};
      const base=(Number(i.qty)||0)*(Number(i.n)||1);x.qty+=base;x.total+=Number(i.total)||0;
      if(i.cost>0){const c=i.cost*(Number(i.qty)||0);cost+=c;costed+=Number(i.total)||0;x.profit+=(Number(i.total)||0)-c;sp+=(Number(i.total)||0)-c}
      else{uncosted+=Number(i.total)||0;x.costed=false}
      items.set(k,x);byCat.set(i.cat||"بدون صنف",(byCat.get(i.cat||"بدون صنف")||0)+(Number(i.total)||0))}
    sp-=Number(s.discount)||0;
    const w=who.get(s.by||"؟")||{n:0,v:0};w.n++;w.v+=s.total;who.set(s.by||"؟",w);
    const d=days.get(s.date)||{n:0,v:0,profit:0};d.n++;d.v+=s.total;d.profit+=sp;days.set(s.date,d);
  }
  const disc=sum("discount");
  return {n:ok.length,voids:list.length-ok.length,total:sum("total"),cash:sum("cash"),debt:sum("debt"),disc,usd:Math.round(sum("usd")*100)/100,usdIqd:sum("usdIqd"),
    profit:costed-cost-disc,cost,uncosted,
    items:[...items.values()].map(x=>({...x,qty:round3(x.qty)})).sort((a,b)=>b.total-a.total),who:[...who].sort((a,b)=>b[1].v-a[1].v),
    cats:[...byCat].sort((a,b)=>b[1]-a[1]),days:[...days].sort((a,b)=>a[0]<b[0]?1:-1)};
}

function voidSale(sale){
  openModal(`<h3>إلغاء فاتورة #<span class="num">${esc(sale.no)}</span>؟</h3>
    <p class="hint">تبقى بالسجل بعلامة «ملغية» وما تنحسب بالمبيعات، وموادها ترجع للمخزن.${sale.debt>0?` والدين (<span class="num">${fmt(sale.debt)}</span>) ينشال من حساب ${esc(sale.customerName||"")}.`:""}</p>
    <div class="foot"><button class="btn debt" type="button" id="vGo">إلغاء الفاتورة</button><button class="btn" type="button" data-close>رجوع</button></div>`,m=>{
    m.querySelector("#vGo").onclick=()=>{
      const b=db.batch(),now=Date.now();
      const upd={status:"void",voidAt:now,voidBy:S.me.name};
      b.update(db.collection("sales").doc(sale.id),upd);
      if(sale.txnId){b.delete(db.collection("txns").doc(sale.txnId));
        const a=activityDoc("delete","debt",{customerName:sale.customerName||"",amount:sale.debt,detail:`إلغاء فاتورة كاشير #${sale.no}`});b.set(db.collection("activity").doc(a.id),a)}
      for(const [pid,q] of stockMoves(sale.items||[]))b.update(db.collection("products").doc(pid),{stock:firebase.firestore.FieldValue.increment(q)});

/* A4 report pages drawn on canvases: the brand header on every page, key/value lines, and tables that continue on new pages.
   fill() draws the content with kv(), table() and gap(). */
async function a4Pdf(sub,stamp,fill,filename){
  const W=1240,H=1754,M=80;const pages=[];let x,y;
  const page=()=>{const cv=document.createElement("canvas");cv.width=W;cv.height=H;x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);pages.push(cv);
    x.fillStyle=PDFC.green;x.fillRect(0,0,W,14);x.fillStyle=PDFC.orange;x.fillRect(0,14,W,5);x.direction="rtl";y=M;
    x.fillStyle=PDFC.green;x.textAlign="right";x.font=`400 46px ${PDF_BRAND}`;x.fillText(shopName(),W-M,y+40);
    x.font=`500 24px ${PDF_F}`;x.fillStyle=PDFC.muted;x.fillText(sub,W-M,y+80);
    x.textAlign="left";x.direction="ltr";x.fillText(stamp,M,y+40);x.direction="rtl";
    y+=110;x.strokeStyle=PDFC.line;x.lineWidth=2;x.beginPath();x.moveTo(M,y);x.lineTo(W-M,y);x.stroke();y+=30};
  page();
  const kv=(k,v,c)=>{x.textAlign="right";x.font=`500 24px ${PDF_F}`;x.fillStyle=PDFC.muted;x.fillText(k,W-M,y+24);x.font=`700 26px ${PDF_F}`;x.fillStyle=c||PDFC.ink;x.fillText(v,W-M-300,y+24);y+=42};
  const table=(title,cols,rows)=>{
    if(y>H-M-200)page();
    x.textAlign="right";x.font=`700 26px ${PDF_D}`;x.fillStyle=PDFC.green;x.fillText(title,W-M,y+26);y+=44;
    const tw=W-2*M;const head=()=>{x.fillStyle=PDFC.head;x.fillRect(M,y,tw,46);x.fillStyle=PDFC.muted;x.font=`600 21px ${PDF_F}`;let x0=W-M;for(const c of cols){x.textAlign="right";x.fillText(c.label,x0-14,y+31);x0-=c.w*tw}y+=46};head();
    rows.forEach((row,ri)=>{if(y>H-M-80){page();head()}
      if(ri%2)x.fillStyle=PDFC.shade,x.fillRect(M,y,tw,44);let x0=W-M;
      cols.forEach((c,i)=>{const cw=c.w*tw;x.fillStyle=(row.colors&&row.colors[i])||PDFC.ink;x.font=`400 21px ${PDF_F}`;
        if(c.num){x.direction="ltr";x.textAlign="right";x.fillText(row.cells[i],x0-14,y+30);x.direction="rtl"}
        else{x.textAlign="right";let s=String(row.cells[i]);while(s.length>2&&x.measureText(s).width>cw-24)s=s.slice(0,-2);if(s!==String(row.cells[i]))s+="…";x.fillText(s,x0-14,y+30)}
        x0-=cw});y+=44});
    y+=30};
  fill({kv,table,gap:n=>{y+=n}});
  pages.forEach((cv,i)=>{const c=cv.getContext("2d");c.direction="ltr";c.textAlign="center";c.fillStyle=PDFC.green;c.font=`400 18px ${PDF_F}`;c.fillText(`${i+1} / ${pages.length}`,W/2,H-40)});
  const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"pt",format:"a4"});
  pages.forEach((cv,i)=>{if(i)pdf.addPage();pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",0,0,595.28,841.89)});
  try{if(await saveFile(filename,pdf.output("blob")))toast("تم حفظ التقرير")}catch(e){console.warn(e);toast("تعذّر حفظ الملف.")}
}

/* ---------- shift (وردية) and Z report ----------

   A closed shift keeps its own totals, so its Z report never changes afterwards. */
const repSeg=mode=>`<div class="seg" role="group" aria-label="الفترة" style="flex:none">${[["day","يومي"],["month","شهري"],["shift","الوردية"]].map(([k,l])=>`<button type="button" data-rmode="${k}" aria-pressed="${mode===k}">${l}</button>`).join("")}</div>`;
function shiftSales(sh){
  const from=Number(sh.openedAt)||0,od=isoOf(new Date(from));
  if(!S.ready.s)return null;
  let list=[...S.sales.values()];
  if(od<S.day){const old=fetchSales("sh:"+sh.id,db.collection("sales").where("date",">=",od));if(!old)return null;list=[...old.filter(s=>s.date!==S.day),...list]}

}
function zOf(sh,list){

/* ---------- discount approval ----------
   An editor's discount is applied only after the owner approves it from the cashier on their own device.
   The approval is tied to the invoice total it was asked for; changing the invoice drops it. The rules enforce the same. */
function requestApproval(amount,sub){
  const a={id:uid(),kind:"discount",amount,subtotal:sub,items:itemsText(S.cart,120),by:S.me.name,byId:S.me.id,at:Date.now(),status:"pending"};
  try{db.collection("approvals").doc(a.id).set(a).catch(writeFail)}catch(e){writeFail(e);return}
  openModal(`<h3>بانتظار موافقة المدير</h3><p class="hint">طلبت خصم <b class="num">${fmt(amount)}</b> على فاتورة <b class="num">${fmt(sub)}</b>. أول ما يوافق المدير من جهازه ينطبق الخصم هنا.</p>
    <div class="spinner" aria-hidden="true"></div>
    <div class="foot"><button class="btn" type="button" data-close>إلغاء الطلب</button></div>`,()=>{
    const ref=db.collection("approvals").doc(a.id);
    const un=ref.onSnapshot(s=>{const d=s.data();if(!d)return;
      if(d.status==="approved"){un();modalCleanup=null;closeModal();
        if(totals().sub!==sub){toast("الفاتورة تغيّرت. اطلب الخصم مرة ثانية.",3500);return}
        S.discount=Math.min(d.amount,sub);S.approval={id:a.id,amount:d.amount,subtotal:sub};saveCart();refresh("cart");toast("وافق المدير على الخصم",2500)}
      else if(d.status==="denied"){un();modalCleanup=null;closeModal();toast("المدير رفض الخصم.",3500)}
    },e=>console.warn(e));
    // Leaving the wait withdraws the request, so the owner never approves something nobody is waiting for.
    modalCleanup=()=>{un();ref.update({status:"cancelled"}).catch(()=>{})};
  });
}
function renderApprovals(){
  const el=$("#approvals");if(!el)return;
