<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://shahm-ai.hydrzyd83.workers.dev; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e5a3a">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<!-- A customer's own statement, opened from the link or QR code the shop sends (worker/src/statement.js). Read only. -->
<style>
:root{--bg:#f4f2ec;--paper:#ffffff;--paper-2:#f8f6f1;--line:#e3ded3;--ink:#1c2421;--muted:#5e6660;--accent:#0e5a3a;--accent-ink:#fff7e8;--debt:#c2301e;--paid:#4a7f12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1512;--paper:#172019;--paper-2:#1e2921;--line:#2c3830;--ink:#ecf1ec;--muted:#9aa59d;--accent:#5fc48c;--accent-ink:#06200f;--debt:#ff8a78;--paid:#a6d86a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1512;--paper:#172019;--paper-2:#1e2921;--line:#2c3830;--ink:#ecf1ec;--muted:#9aa59d;--accent:#5fc48c;--accent-ink:#06200f;--debt:#ff8a78;--paid:#a6d86a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Tajawal",Tahoma,sans-serif;line-height:1.6;font-size:16px;min-height:100vh}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
header{background:var(--accent);color:var(--accent-ink);padding:20px 16px 56px;text-align:center}
header h1{margin:0;font-family:"Lalezar","Tajawal",sans-serif;font-weight:400;font-size:28px;line-height:1.3}
header p{margin:2px 0 0;opacity:.85;font-size:14px}
main{max-width:620px;margin:-40px auto 0;padding:0 16px 24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.who{font-family:"Tajawal",sans-serif;font-weight:700;font-size:20px;margin:0 0 10px}
.bal{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bal .lbl{color:var(--muted);font-size:14px}
.bal .amt{font-family:"Tajawal",sans-serif;font-weight:800;font-size:34px;line-height:1.1}
.bal .amt small{font-size:15px;font-weight:500;margin-inline-start:4px;color:var(--muted)}
.owes .amt{color:var(--debt)}.credit .amt,.clear .amt{color:var(--paid)}
.sums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.sums div{background:var(--paper-2);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.sums b{display:block;font-family:"Tajawal",sans-serif;font-size:17px;color:var(--ink)}
h2{font-family:"Tajawal",sans-serif;font-size:17px;margin:18px 4px 8px}
.list{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:600}.row .t.debt{color:var(--debt)}.row .t.pay{color:var(--paid)}
.row .a{font-family:"Tajawal",sans-serif;font-weight:700;font-size:17px;text-align:left}
.row .d,.row .r{color:var(--muted);font-size:13px}.row .r{text-align:left}
.row .n{grid-column:1/-1;font-size:14px;color:var(--ink);opacity:.85;overflow-wrap:anywhere}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--accent);font:inherit;font-weight:600;padding:12px;cursor:pointer}
.empty,.msg{text-align:center;color:var(--muted);padding:28px 16px}
.msg b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px;font-family:"Tajawal",sans-serif}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-weight:600;border-radius:10px;padding:8px 14px;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:13px;padding:6px 16px 28px}
.skel{height:14px;border-radius:7px;background:var(--paper-2);margin:10px 0}
</style>
<title>كشف حساب</title>
</head>
<body>
<header><h1 id="shop">كشف حساب</h1><p id="sub">كشف حسابك لدى المحل</p></header>
<main id="main"><div class="card"><div class="skel" style="width:40%"></div><div class="skel" style="width:70%;height:30px"></div><div class="skel"></div></div></main>
<footer id="foot"></footer>
<script src="config.js"></script>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt=n=>Math.round(Number(n)||0).toLocaleString("en-US"),CUR="د.ع";
  const hm=ms=>{if(!ms)return "";const d=new Date(ms);let h=d.getHours();const m=String(d.getMinutes()).padStart(2,"0"),p=h<12?"ص":"م";h=h%12||12;return h+":"+m+" "+p};
  const day=iso=>{const p=String(iso).split("-");return p.length===3?`${+p[2]}/${+p[1]}/${p[0]}`:iso};
  const key=(location.hash||"").replace(/^#/,"");
  const main=$("#main");
  const fail=(t,s)=>{main.innerHTML=`<div class="card msg"><b>${esc(t)}</b>${esc(s||"")}<p><button class="btn" type="button" id="again">حاول مرة ثانية</button></p></div>`;$("#again").onclick=load};
  let SHOW=50;
  async function load(){
    if(!/^[A-Za-z0-9_-]{22}$/.test(key))return fail("الرابط ناقص","افتح الرابط كامل مثل ما وصلك من المحل.");
    if(!window.AI_URL)return fail("الخدمة بعدها ما مفعّلة","");
    let r,j;
    try{r=await fetch(window.AI_URL.replace(/\/$/,"")+"/st?k="+encodeURIComponent(key),{cache:"no-store"});j=await r.json()}
    catch(e){return fail("تعذّر الاتصال","تأكد من الإنترنت وحاول.")}
    if(!r.ok)return fail(j&&j.error||"تعذّر فتح الكشف",r.status===404?"":"حاول بعد شوية.");
    draw(j);
  }
  function draw(j){
    const sup=j.sup,bal=j.bal;
    if(j.shop){$("#shop").textContent=j.shop;document.title="كشف حساب: "+j.shop}
    $("#sub").textContent="كشف حساب";
    const cls=bal>0?"owes":bal<0?"credit":"clear";
    const lbl=sup?(bal>0?"الباقي لك على المحل":bal<0?"رصيد المحل عندك":"الحساب مسدد"):(bal>0?"الباقي عليك":bal<0?"رصيدك عند المحل":"حسابك مسدد");
    let dSum=0,pSum=0;for(const x of j.rows){if(x[1]==="debt")dSum+=x[2];else pSum+=x[2]}
    let run=0;const rows=j.rows.map(x=>{run+=x[1]==="debt"?x[2]:-x[2];return {d:x[0],ty:x[1],a:x[2],n:x[3],at:x[4],run}}).reverse();
    const T=sup?{debt:"فاتورة",pay:"دفعة"}:{debt:"دين",pay:"تسديد"};
    const list=rows.slice(0,SHOW).map(x=>`<div class="row"><div class="t ${x.ty}">${T[x.ty]}</div><div class="a num">${fmt(x.a)}</div>
      <div class="d"><span class="num">${esc(day(x.d))}</span>${x.at?' · <span class="num">'+esc(hm(x.at))+"</span>":""}</div><div class="r">الرصيد <span class="num">${fmt(x.run)}</span></div>
      ${x.n?`<div class="n">${esc(x.n)}</div>`:""}</div>`).join("");
    main.innerHTML=`<div class="card ${cls}"><p class="who">${esc(j.name)}</p>
      <div class="bal"><div><div class="lbl">${lbl}</div><div class="amt"><span class="num">${fmt(Math.abs(bal))}</span><small>${CUR}</small></div></div>
      <button class="btn" type="button" id="re">تحديث</button></div>
      <div class="sums"><div>${sup?"مجموع الفواتير":"مجموع الديون"}<b class="num">${fmt(dSum)}</b></div><div>${sup?"مجموع الدفعات":"مجموع التسديدات"}<b class="num">${fmt(pSum)}</b></div></div></div>
      <h2>الحركات (${rows.length})</h2>
      <div class="list">${list||'<div class="empty">ماكو حركات على الحساب.</div>'}${rows.length>SHOW?`<button class="more" type="button" id="more">عرض الأقدم (${rows.length-SHOW})</button>`:""}</div>`;
    $("#re").onclick=()=>{$("#re").disabled=true;load()};
    const m=$("#more");if(m)m.onclick=()=>{SHOW+=100;draw(j)};
    const t=new Date(j.at);$("#foot").innerHTML=`هذا الكشف للعرض فقط ويتحدث تلقائياً من دفتر المحل.<br>آخر تحديث <span class="num">${t.getDate()}/${t.getMonth()+1}/${t.getFullYear()} ${esc(hm(j.at))}</span>`;
  }
  load();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&key)load()});
})();
</script>
</body>
</html>
